# 전달사항 휴대폰 알림(사용자 2026-10-31) — 제목·내용·열 주소로 한 번 보냄
name: push-notice
on:
  workflow_dispatch:
    inputs:
      title:
        description: '알림 제목'
        required: true
      msg:
        description: '알림 내용'
        required: true
      path:
        description: '누르면 열 주소(사이트 안 경로, 빈칸이면 메인)'
        required: false
        default: ''
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: send
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PUSH_TEST: ${{ github.event.inputs.msg }}
          PUSH_TITLE: ${{ github.event.inputs.title }}
          PUSH_PATH: ${{ github.event.inputs.path || 'index.html' }}
        run: python3 -I _tools/push_notify.py .
