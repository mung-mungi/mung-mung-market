name: kalshi-elect
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 3-15 4,5 11 *'
permissions:
  contents: write
concurrency: { group: kalshi-elect, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _tools/kalshi_probe.py || true
      - run: python3 _tools/kalshi_pull.py
      - run: |
          git config user.name mung-bot; git config user.email bot@users.noreply.github.com
          git add d/election/kalshi.json
          git diff --cached --quiet && exit 0
          git commit -m "칼시 확률 갱신"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 3; done
