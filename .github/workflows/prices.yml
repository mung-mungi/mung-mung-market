# 시세 갱신(사용자 2026-10-29 지시) — 장 시간(프리·장중·애프터·데이장·한국장)에만 받고, 나머지는 바로 끝남(_tools/live_update.py가 판단)
# 예약이 40~60분에 한 번만 와서, 한 번 켜지면 50분 동안 6분마다 스스로 다시 돎. 겹치면 하나만 대기(concurrency)
name: prices-5min
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '게시 횟수·Claude 우선 규칙 무시(장 시간 규칙은 유지)'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: prices-5min
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: refresh
        env:
          FORCE: ${{ github.event.inputs.force }}
          LOOP: '50'
          STEP: '6'
        run: python3 _tools/live_update.py
