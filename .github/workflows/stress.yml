# 공식 금융 스트레스 지수·투자 심리 묶음(사용자 2026-11-01) — 지금은 수동 실행, 확정되면 경고등 일정에 붙임. Claude 크레딧 없음
name: stress
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['d/stress/manual.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: python3 -I _tools/build_stress.py .
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add d/stress
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "스트레스 지수 묶음 갱신 $(TZ=Asia/Seoul date +%m.%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*7)); done; exit 1
