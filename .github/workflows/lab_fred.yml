name: lab-fred
on:
  push:
    branches: [lab/lights2]
    paths: [lab/req.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -m 30 -o /dev/null -w "api %{http_code}\n" "https://api.stlouisfed.org/fred/series/observations?series_id=BAMLH0A0HYM2&file_type=json" || echo api fail
          curl --http1.1 -sS -m 30 -o /tmp/a.csv -w "csv %{http_code}\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2&cosd=2026-10-01" || echo csv fail; head -3 /tmp/a.csv || true
          curl -sS -m 30 -o /dev/null -w "alfred %{http_code}\n" "https://alfred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2" || echo alfred fail
