name: lab-fred
on:
  push:
    branches: [lab/lights2]
    paths: [lab/req.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for s in $(cat lab/req.txt); do curl -sSL -m 60 -A Mozilla/5.0 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s&cosd=2015-01-01" -o lab/$s.csv || echo fail $s; done
          ls -la lab
          git config user.name mung-bot; git config user.email mung-bot@users.noreply.github.com
          git add lab/*.csv; git commit -m "lab fred" || true; git push
