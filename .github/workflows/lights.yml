# 시장 경고등 자동 갱신(사용자 2026-10-29) + CNN 공포·탐욕 지수·VIX 공식 종가(d/fng.json, 사용자 2026-11-01) — 미국 마감 직후(한국 화~토 06:17·07:17·08:17)와 저녁(22:17)에 공식 출처 마감 숫자로 불 10개 다시 계산
# 허브 동기화가 경고등 자료를 덮어쓰면(옛 값) 곧바로 다시 계산해 최신으로 되돌림. Claude 크레딧 없음
name: lights-6h
on:
  schedule:
    # 미국 마감 직후 몰아서(한국 화~토 06:17·07:17·08:17) — 새 마감 값이 올라오는 대로 바로 반영, 이미 받았으면 변화 없음으로 바로 끝
    - cron: '17 21,22,23 * * 1-5'
    # 하이일드(FRED)는 미국 아침에 하루 늦게 올라와 저녁 한 번 더(한국 월~금 22:17)
    - cron: '17 13 * * 1-5'
  push:
    branches: [main]
    paths: ['d/lights/**', 'd/bond/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lights-6h
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: python3 -I _tools/build_lights.py .
      - name: fng
        run: python3 -I _tools/build_fng.py . || true
      - name: stress
        run: python3 -I _tools/build_stress.py . || true
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add d/lights d/bond/yields_daily.json d/bond/hy_spread.json d/fng.json d/stress
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "시장 경고등 자동 갱신 $(TZ=Asia/Seoul date +%m.%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*7)); done; exit 1
