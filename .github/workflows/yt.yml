# 유튜브 새 영상 확인 → d/yt.json → 메인 배너(사용자 2026-11-02). 공개 RSS만 써서 키·크레딧 없음
name: yt
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: yt
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _tools/build_yt.py
            d/yt.json
          sparse-checkout-cone-mode: false
      - name: build
        run: python3 -I _tools/build_yt.py .
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add d/yt.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "유튜브 새 영상 $(TZ=Asia/Seoul date +%m.%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*7)); done; exit 1
