# VIX 선물 정산값 매일 받기(사용자 2026-11-02) — 옵션 온도계 기간구조. 크레딧 없음
name: vixfut
on:
  workflow_dispatch:
  schedule:
    - cron: '41 22 * * 1-5'   # 한국 화~토 07:41 (미국 마감·정산 뒤)
    - cron: '41 0 * * 2-6'    # 한국 화~토 09:41 (늦게 올라온 날 대비)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: python3 -I _tools/build_vixfut.py .
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add d/opt/vix_futures.json
          if git diff --cached --quiet; then echo '::notice::변화 없음'; exit 0; fi
          git commit -m "VIX 선물 정산 갱신 $(TZ=Asia/Seoul date +%m.%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && echo '::notice::VIX 선물 갱신 완료' && exit 0; sleep $((i*7)); done; exit 1
