# 아이디어 페이지(저평가 서치·고수 성적표) 자료 다시 계산(사용자 2026-10-29) — Claude 크레딧 없이 GitHub이 계산만 함
# 목표주가·시세·실적·공매도·내부자 자료가 올라오면 바로, 그리고 매일 아침 7:40(한국시간) 한 번 더
# + 실적 결과 페이지가 바뀌면 '새 실적' 목록(d/earn_feed.json)도 다시 만듦 → 메인 화면 '새 실적' 표시
name: ideas-daily
on:
  schedule:
    - cron: '40 22 * * *'
  push:
    branches: [main]
    paths: ['d/targets/**', 'd/qtr/**', 'd/short/**', 'd/insider/**', 'd/prices/**', 'p-earn.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ideas-daily
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: python3 -I _tools/build_ideas.py . && python3 -I _tools/build_earn_feed.py . && python3 -I _tools/build_gates.py .
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add d/ideas d/earn_feed.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "아이디어 자료 다시 계산 $(TZ=Asia/Seoul date +%m.%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*7)); done; exit 1
