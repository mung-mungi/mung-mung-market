\/span><span class=\"v\">15.1억$ · −3% · 순이익 3.3억$ −10%<\/span><\/div>\n    <div class=\"row\"><span>자동차<\/span><span class=\"v\">4.7억$ · +4%<\/span><\/div>\n    <div class=\"row\"><span>태양광(헴록 포함)<\/span><span class=\"v\">4.4억$ · +37% · 순손실 0.07억$<\/span><\/div>\n    <div class=\"row\"><span>생명과학·신사업<\/span><span class=\"v\">2.9억$ · +1% · 순손실 0.28억$<\/span><\/div>\n    <p class=\"na\">디스플레이와 특수소재(스마트폰 커버 유리)는 이번 분기부터 '유리' 한 부문으로 합쳐 따로 공개하지 않습니다.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">10.6억$<\/span><\/div>\n    <div class=\"row\"><span>조정 잉여현금흐름<\/span><span class=\"v\">6.6억$ (1~9월 22.7억$)<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">5억$ 이상<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 코어 매출<\/span><span class=\"v\">52~53억$ (예상 52.1억$) · 약 +19%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 코어 EPS<\/span><span class=\"v ok\">0.96~1.00$ (예상 0.93$) ✅ · 약 +36%<\/span><\/div>\n    <div class=\"row\"><span>스프링보드 계획<\/span><span class=\"v\">연 매출 속도 200억$ → 2030년 말 400억$<\/span><\/div>\n    <div class=\"row\"><span>태양광<\/span><span class=\"v\">30억$ 이상 매출원으로 키우는 중<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 방송 인터뷰<span class=\"call\">어닝콜 반영 · 한국시간 10.28 07:05<\/span><\/h4>\n    <p class=\"q\"><b>웬델 위크스(최고경영자) · 어닝콜<\/b> <mark>\"(새로 오는 문의 전화 중) AI 말고 다른 건 한 통도 없었습니다\"<\/mark>, 고객은 \"주로 대형 하이퍼스케일러\"이고 \"공급이 빠듯합니다\", 다만 \"증설 계획은 이미 잘 진행 중\"이라고 했습니다. → 데이터센터 광섬유 수요가 공급보다 앞서 있다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>웬델 위크스 · 어닝콜<\/b> 고객이 \"증설 자금을 선금으로 대고\", 약정 물량을 사 가면서 돌려받는 구조라고 설명했습니다. → 공장 투자 위험을 고객과 나눈다는 뜻입니다. 1~9월 고객 선수금은 <b>6.39억$<\/b>(최고재무책임자).<\/p>\n    <p class=\"q\"><b>웬델 위크스 · 어닝콜<\/b> \"지금의 스케일업(서버 안 GPU 연결)은 100% 구리\"이고, 광 스케일업은 \"2028년부터 빨라질 것\"으로 봤습니다. → 다음 성장 단계는 2028년 이후라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>에드 슐레진저(최고재무책임자) · 어닝콜<\/b> <mark>\"광통신 성장을 위해 약 20억$의 설비투자를 계획\"<\/mark>, 디스플레이 유리 가격 인상은 4분기부터 적용. → 시장은 이 설비투자 부담을 장중 약세 이유로 꼽았습니다.<\/p>\n    <p class=\"q\"><b>웬델 위크스(최고경영자) · CNBC 인터뷰<\/b> <mark>\"지금 네오클라우드 쪽 노출은 아주 적습니다\"<\/mark>, \"장기적으로 AI 수요를 꽤 낙관합니다.\" → 고객이 코어위브 같은 신생 GPU 클라우드보다 대형 빅테크·통신사 중심이라 돈 떼일 걱정이 적다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>에드 슐레진저(최고재무책임자)<\/b> \"증설 비용과 위험을 나눠 지는 장기 고객계약을 바탕으로 생산능력을 꾸준히 늘려 왔습니다.\" → 공장을 먼저 짓고 주문을 기다리는 방식이 아니라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>웬델 위크스(최고경영자)<\/b> \"뛰어난 3분기를 냈습니다.\" 생성형 AI 제품 매출이 전년의 두 배가 됐다고 했습니다.<\/p>\n    <p class=\"q\"><b>에드 슐레진저(최고재무책임자)<\/b> 스프링보드 계획으로 연 매출 속도를 두 배로 늘릴 길을 제시했고, 이익이 매출보다 빨리 늘 것이라고 했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/26 종가)<\/span><span class=\"v\">127.74$<\/span><\/div>\n    <div class=\"row\"><span>최근 흐름<\/span><span class=\"v\">3개월 −5.5% · 1년 +47.8%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 프리마켓 (뉴욕 7:21)<\/span><span class=\"v ok\">+3.2%<\/span><\/div>\n    <div class=\"row\"><span>장 시작 직전 (뉴욕 9:18)<\/span><span class=\"v ok\">+2%대<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v no\">126.30$ (−1.13%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/GLW\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">GLW ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트<\/span><\/h4><p>결국 시장이 문제 삼은 건 <mark>약 20억$ 설비투자 계획과 태양광 부문 적자 전환<\/mark>이었습니다. 프리마켓 +3%대로 출발했지만 장중 한때 −4%대까지 밀렸다가 종가 126.30$(−1.13%)로 마쳤습니다. 광통신 +44%·생성형 AI 제품 두 배라는 AI 수요 숫자 자체는 흔들리지 않았습니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 이번 주 빅테크 설비투자 계획, 그리고 다음 분기 고객 선수금·광통신 성장률이 유지되는지.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터 광 연결 수요가 더 빨라지고 있습니다<\/p><p>코닝 광통신 성장률이 +32% → +44%로 올라갔고 생성형 AI 제품은 두 배입니다. GPU 서버가 늘수록 서버를 잇는 광섬유 물량이 함께 늘어난다는 확인으로, 어제 셀레스티카의 2027년 전망과 같은 방향입니다.<\/p><p>신호는 광통신 성장 가속과 장기계약, 소음은 장 초반 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 오늘 어닝콜의 하이퍼스케일러 계약 규모, 이번 주 빅테크 설비투자 계획.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.financialcontent.com/article/bizwire-2026-10-27-corning-delivers-outstanding-third-quarter-results1\">회사 보도자료(비즈니스와이어)<\/a> · <a href=\"https://www.stocktitan.net/news/GLW/corning-delivers-outstanding-third-quarter-results-ijv492ou5imj.html\">스톡타이탄<\/a> · <a href=\"https://in.investing.com/news/earnings/corning-earnings-beat-by-003-revenue-topped-estimates-5656413\">인베스팅닷컴 · 컨센서스<\/a> · <a href=\"https://www.investing.com/news/earnings/corning-shares-rise-3-in-premarket-trade-after-q3-eps-revenue-beat-estimates-4975090\">인베스팅닷컴 · 프리마켓<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/glw-stock-gains-as-corning-tops-q3-earnings-estimates-company-targets-40-b-annualized-sales-run-rate-by-2030/cZUeJ5FRBCa\">스톡트윗츠 · CNBC 인터뷰 인용<\/a><\/p>\n<\/article>\n", "updated": "2026-10-27T22:08:00Z"}, {"id": "ibm-26q3", "date": "2026-10-21", "ts": "2026-10-21", "name": "IBM IBM", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"ibm-26q3\" data-date=\"2026-10-21\" data-layer=\"빅테크\" data-name=\"IBM IBM\" data-sum=\"매출✅ EPS✅ · 시간외 +4.4%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기<\/div>\n  <h3>IBM(IBM)<\/h3>\n  <p class=\"what\">기업용 소프트웨어(레드햇)·컨설팅·메인프레임 회사입니다. 기업들이 AI에 실제로 돈을 쓰는지 보여 주는 '쓰는 쪽' 지표. 밸류체인 빅테크 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 171억$(+5%, 예상 168.2억$)·영업 EPS 2.95$(예상 2.85~2.86$) <b>모두 상회<\/b>, 연간 잉여현금흐름 증가 전망 상향. 연간 매출 성장 전망(4~5%)은 유지했습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p><mark>소프트웨어 +8%<\/mark>(레드햇 +11%, 데이터 +19%)가 실적을 끌었습니다. 반면 최고경영자가 <mark>\"고객들이 일부 AI 지출이 수익 없이 통제 불능이라고 걱정한다\"<\/mark>고 말해, AI 투자 회의론에 불을 붙인 발언으로 회자됐습니다.<\/p><\/div>\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"고객들은 일부 AI 지출이 실제 수익 없이 완전히 통제 불능이 아닌지 걱정하고 있습니다\"<\/mark><cite>아르빈드 크리슈나 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 기업 고객 쪽에서 AI 투자 효율을 따지기 시작했다는 신호. 이번 주 빅테크 실적에서 '수익화' 질문이 커질 수 있습니다.<\/p>\n  <\/div>\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span>소프트웨어 +8%<small>레드햇 +11% · 데이터 +19%<\/small><\/span><\/li>\n      <li><span>잉여현금흐름 전망 상향<small>전년 대비 10억$ 이상 증가<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>메인프레임(IBM Z) −20%<small>신제품 주기 끝물<\/small><\/span><\/li>\n      <li><span>소프트웨어 일부는 2분기에서 밀린 계약<small>회사 설명<\/small><\/span><\/li>\n      <li><span>컨설팅 보합<small>53억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"\", \"items\": [{\"k\": \"매출\", \"a\": 171.0, \"e\": 168.2, \"u\": \"억$\"}, {\"k\": \"영업 EPS\", \"a\": 2.95, \"e\": 2.86, \"u\": \"$\"}]}'><\/div>\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">171억$ (168.2억$) <span class=\"ok\">✅<\/span> +5% (환율 제외 +6%)<\/span><\/div>\n    <div class=\"row\"><span>영업 EPS<\/span><span class=\"v\">2.95$ (2.85~2.86$) <span class=\"ok\">✅<\/span> +11%<\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">2.31$ (+26%, 낮은 세율 영향)<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">58.5% (회계 56.8%)<\/span><\/div>\n  <\/section>\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span>소프트웨어<\/span><span class=\"v\">78억$ · +8%<\/span><\/div>\n    <div class=\"row\"><span>　레드햇·하이브리드클라우드 / 데이터<\/span><span class=\"v\">+11% / +19%<\/span><\/div>\n    <div class=\"row\"><span>　거래처리 / 자동화<\/span><span class=\"v\">+9% / −3%<\/span><\/div>\n    <div class=\"row\"><span>컨설팅<\/span><span class=\"v\">53억$ · 보합<\/span><\/div>\n    <div class=\"row\"><span>인프라<\/span><span class=\"v\">37억$ · +4% (메인프레임 −20%, 분산형 +31%)<\/span><\/div>\n  <\/section>\n  <section><h4>현금 · 가이던스<\/h4>\n    <div class=\"row\"><span>3분기 잉여현금흐름<\/span><span class=\"v\">30억$ (+7억$)<\/span><\/div>\n    <div class=\"row\"><span>연간 매출 성장<\/span><span class=\"v\">환율 제외 4~5% (유지)<\/span><\/div>\n    <div class=\"row\"><span>연간 잉여현금흐름<\/span><span class=\"v\">전년 대비 10억$ 이상 증가 (상향)<\/span><\/div>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">약 +4.4% → 다음 날 장전 밀림<\/span><\/div>\n    <div class=\"row\"><span>다음 날<\/span><span class=\"na\">종가 % 확인 중<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·차트는 제목 옆 티커를 누르면 야후 파이낸스에서 볼 수 있습니다.<\/p>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p>숫자는 좋았지만 시장에서는 <mark>'AI 지출 통제 불능' 발언<\/mark>이 더 많이 회자됐습니다.<\/p><p>다음 확인: 10/29 서비스나우 — 기업용 AI 수익화가 실제 계약으로 이어지는지.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">\"AI에 쓴 돈이 돌아오나\"라는 질문이 커지고 있습니다<\/p><p>IBM 숫자 자체는 좋았지만, 최고경영자가 \"고객들이 AI 지출이 수익 없이 통제 불능이 아닌지 걱정한다\"고 말했습니다.<\/p><p>밸류체인의 돈줄은 빅테크 설비투자이고, 그 투자가 계속되려면 결국 기업 고객이 AI에 돈을 내야 합니다. IBM 발언은 그 고리의 맨 끝, 수익화 쪽이 아직 검증 중이라는 경고입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/29 서비스나우와 마이크로소프트 애저 성장률 — 기업들이 실제로 AI에 돈을 내고 있는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000051143/000005114326000093/ibm-20261021xex991.htm\">회사 보도자료(SEC 8-K)<\/a> · <a href=\"https://stock3.com/news/ibm-software-traegt-das-wachstum-ibm-z-bricht-ein-17344934\">스톡3 · 부문<\/a> · <a href=\"https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-22-dow-sp-500-nasdaq-tesla-meta-112217857.html\">야후파이낸스 · 10/22 시장<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "lrcx", "date": "2026-10-21", "ts": "2026-10-21", "name": "램리서치 LRCX", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"lrcx\" data-date=\"2026-10-21\" data-layer=\"장비\" data-name=\"램리서치 LRCX\" data-sum=\"매출✅ EPS✅ 가이던스✅ · 다음 날 −11.8%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · FY27 1분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>램리서치(LRCX)<\/h3>\n  <p class=\"what\">반도체 웨이퍼에 회로를 새기는 식각·증착 장비 세계 1위권 회사입니다. 고대역폭메모리(HBM)·최첨단 파운드리·첨단 패키징 공정에 장비가 들어갑니다. 밸류체인 장비 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출·EPS·다음 분기 가이던스 <b>모두 예상 상회<\/b>. 사상 최대 매출 82.2억$, 영업이익률 처음 40%대, 배당 27% 인상까지 — 숫자만 보면 좋은 실적입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>사상 최대 매출·첫 영업이익률 40%를 찍고 다음 분기 가이던스도 예상보다 높았는데 다음 날 −11.8%. ① 매출이 예상을 겨우 0.9억$ 넘었고 ② <mark>부품 공급이 막혀 12월 분기 출하 일부가 3월로 밀렸으며<\/mark> ③ <mark>12월 중국 매출이 '의미 있게' 줄어든다<\/mark>고 했습니다. 수요는 더 강해졌는데 다 못 파는 상황이 실망으로 읽혔습니다.<\/p><\/div>\n\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"단기 공급망 제약이 없었다면 이번 가이던스는 조금 더 높았을 것\"<\/mark><cite>더그 베팅어 · 최고재무책임자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 모자란 게 아니라 <b>부품이 모자라 다 못 판 것<\/b>. 수요는 오히려 더 강하다는 뜻입니다.<\/p>\n    <blockquote>\"2027년 업계 장비 투자는 2,000억$를 넘을 것\"<cite>팀 아처 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 2026년 약 1,550억$보다 한 해 만에 30%가량 큰 판. 내년 수요 그림은 더 커졌습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>공급 제약으로 12월 출하 이월<\/mark><small>\"제약이 없었다면 가이던스가 더 높았을 것\" — 애널리스트 추정 3~4억$<\/small><\/span><\/li>\n      <li><span><mark>12월 중국 매출 '의미 있게' 감소<\/mark><small>9월 분기 중국 비중 35%(전분기 26%)가 꺾이는 구간<\/small><\/span><\/li>\n      <li><span>예상을 넘은 폭이 작음<small>매출 +1.0% · EPS +1.4% · 가이던스 +0.7% — 기대가 높았던 만큼 '겨우 넘김'<\/small><\/span><\/li>\n      <li><span>세율 상승(약 16.5%)<small>같은 이익이어도 주당순이익이 덜 남음<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>2027년 업계 장비 투자 2,000억$ 이상<\/mark><small>2026년 약 1,550억$보다 한 해 만에 30%가량 큼<\/small><\/span><\/li>\n      <li><span>영업이익률 처음 40%대<small>40.2% · 다음 분기 40.5% 가이던스, 총마진 50% 중반까지 확대 여지<\/small><\/span><\/li>\n      <li><span>잉여현금 사상 최대·배당 27% 인상<small>잉여현금흐름 32.4억$ · 자사주 10.3억$<\/small><\/span><\/li>\n      <li><span>밀린 매출은 사라지지 않음<small>수요가 아닌 공급 문제 → 3월 분기로 이월<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"막대가 짧을수록 ’겨우 넘김’입니다. 전부 넘었지만 폭이 1% 안팎입니다.\", \"items\": [{\"k\": \"매출\", \"a\": 82.19, \"e\": 81.35, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 2.2, \"e\": 2.17, \"u\": \"$\"}, {\"k\": \"다음 분기 매출 가이던스\", \"a\": 86.0, \"e\": 85.4, \"u\": \"억$\"}, {\"k\": \"다음 분기 EPS 가이던스\", \"a\": 2.33, \"e\": 2.32, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"점선 막대 = 회사가 제시한 12월 분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 53.24}, {\"q\": \"25.4Q\", \"v\": 53.45}, {\"q\": \"26.1Q\", \"v\": 58.42}, {\"q\": \"26.2Q\", \"v\": 67.22}, {\"q\": \"26.3Q\", \"v\": 82.19, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 86.0, \"g\": 1}]}'><\/div>\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">82.19억$ (81.3~81.4억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">+54% / +22%<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">2.20$ (2.15~2.18$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계기준 주당순이익<\/span><span class=\"v\">2.19$ (전년 1.24$)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">52.4% · 사상 최대 (전분기 52.0%)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익<\/span><span class=\"v\">33.01억$ · 이익률 40.2%<\/span><\/div>\n    <div class=\"row\"><span>　영업이익률<\/span><span class=\"v\">처음으로 40%대 (전분기 38.4%)<\/span><\/div>\n    <div class=\"row\"><span>회계기준 순이익<\/span><span class=\"v\">27.53억$ (전년 15.69억$)<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별 · 지역별<\/h4>\n    <div class=\"row\"><span>장비(시스템) 매출<\/span><span class=\"v\">57.33억$ (전분기 42.50억)<\/span><\/div>\n    <div class=\"row\"><span>고객지원·기타 매출<\/span><span class=\"v\">24.87억$ (전분기 24.72억)<\/span><\/div>\n    <div class=\"row\"><span>장비 매출 고객별<\/span><span class=\"v\">메모리 46% · 파운드리 46% · 로직 8%<\/span><\/div>\n    <div class=\"row\"><span>중국<\/span><span class=\"v\">35% (전분기 26%)<\/span><\/div>\n    <div class=\"row\"><span>한국 / 대만 / 일본<\/span><span class=\"v\">20% / 18% / 9%<\/span><\/div>\n    <div class=\"row\"><span>미국 / 동남아 / 유럽<\/span><span class=\"v\">8% / 6% / 4%<\/span><\/div>\n  <\/section>\n\n  <div class=\"vizrow\">\n    <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"지역별 매출 비중 (%)\", \"cap\": \"중국 35%가 12월 분기에 크게 줄어들 예정 — 형광 표시\", \"items\": [{\"k\": \"중국\", \"v\": 35, \"hl\": 1}, {\"k\": \"한국\", \"v\": 20}, {\"k\": \"대만\", \"v\": 18}, {\"k\": \"일본\", \"v\": 9}, {\"k\": \"미국\", \"v\": 8}, {\"k\": \"동남아\", \"v\": 6}, {\"k\": \"유럽\", \"v\": 4}]}'><\/div>\n    <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"장비 매출 고객별 (%)\", \"cap\": \"올해 장비 매출 증가분의 약 80%가 D램·파운드리에서 나왔습니다\", \"items\": [{\"k\": \"메모리\", \"v\": 46, \"hl\": 1}, {\"k\": \"파운드리\", \"v\": 46}, {\"k\": \"로직·기타\", \"v\": 8}]}'><\/div>\n  <\/div>\n\n  <section><h4>핵심 지표 · 업황 숫자 (어닝콜)<\/h4>\n    <div class=\"row\"><span>2026년 업계 장비 투자<\/span><span class=\"v\">약 1,550억$<\/span><\/div>\n    <div class=\"row\"><span>2027년 업계 장비 투자<\/span><span class=\"v\"><mark>2,000억$ 이상 (첫 전망)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　2027 순위<\/span><span>D램 → 파운드리·로직 → 낸드<\/span><\/div>\n    <div class=\"row\"><span>고객지원 매출 성장<\/span><span class=\"v\">2026 +30%↑ · 2027 +15%↑<\/span><\/div>\n    <div class=\"row\"><span>첨단 패키징 성장<\/span><span class=\"v\">2026 +70%↑ 목표 유지<\/span><\/div>\n    <div class=\"row\"><span>이연수익(받아 둔 선수금)<\/span><span class=\"v\">26.6억$ (전분기 24.3억)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">34.98억$ (전분기 14.57억)<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v\">32.40억$ · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v\">10.25억$ (남은 한도 약 30억$)<\/span><\/div>\n    <div class=\"row\"><span>배당<\/span><span class=\"v\">주당 0.33$ · 0.26$에서 27% 인상<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">74.37억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">약 46억$ (회전율 개선 3.4회)<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · FY27 2분기(10~12월)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">86억$ ±4억 (85.4억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">2.33$ ±0.15 (2.32$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>총마진 / 영업이익률<\/span><span class=\"v\">52.5% ±1 / 40.5% ±1<\/span><\/div>\n    <div class=\"row\"><span>세율<\/span><span class=\"v\">약 16.5% (높아짐)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 공급 제약<\/span><span><mark>12월 출하 일부 → 3월 분기로 이월<\/mark><\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 중국<\/span><span><mark>12월 '의미 있게' 감소 예고<\/mark><\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 · 어닝콜 발언<span class=\"call\">어닝콜 반영 · 콜 한국시간 10.22 06:00<\/span><\/h4>\n    <p class=\"q\"><b>더그 베팅어(최고재무책임자)<\/b> <mark>\"단기 공급망 제약이 없었다면 이번 가이던스는 조금 더 높았을 것\"<\/mark> → 수요가 아니라 부품이 모자라 못 판 매출입니다. 애널리스트의 3~4억$ 추정엔 숫자를 확인해 주지 않았습니다.<\/p>\n    <p class=\"q\"><b>더그 베팅어<\/b> <mark>\"12월에는 중국이 의미 있게 줄어든다, 중국 현지 고객 때문\"<\/mark> → 다국적 고객의 중국 공장 수요는 견조할 것이라고 덧붙였습니다.<\/p>\n    <p class=\"q\"><b>팀 아처(최고경영자)<\/b> \"2027년 업계 장비 투자는 2,000억$를 넘을 것\" → D램이 가장 크게 늘고, 2027년 새 대형 공장 10곳이 가동된다고 했습니다.<\/p>\n    <p class=\"q\"><b>팀 아처<\/b> 클린룸 공간과 일부 부품 공급 제약이 2027년까지 업계의 공급을 제한할 것 → 공급사와 함께 생산 능력을 늘리는 중입니다.<\/p>\n    <p class=\"q\"><b>더그 베팅어<\/b> 신제품·현지 생산·가격 덕에 \"총마진을 50% 중반까지 넓힐 기회\" → 수익성은 더 오를 여지가 있습니다.<\/p>\n    <p class=\"na\">발언은 영어 원문을 우리말로 옮긴 요지입니다. 원문은 아래 어닝콜 녹취 링크에 있습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/21 종가)<\/span><span class=\"v\">260.81$ (−1.0%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v no\">약 −7~8% (242$ 부근)<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/22 종가)<\/span><span class=\"v no\">230.15$ (−11.8%)<\/span><\/div>\n    <div class=\"row\"><span>10/23 종가<\/span><span class=\"v\">230.10$ (보합)<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"na\">확인 못 함<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"실적 발표 다음 날 하루에 −11.8%\", \"items\": [{\"d\": \"10/15\", \"v\": 277.46}, {\"d\": \"10/16\", \"v\": 263.94}, {\"d\": \"10/19\", \"v\": 272.2}, {\"d\": \"10/20\", \"v\": 263.45}, {\"d\": \"10/21\", \"v\": 260.81}, {\"d\": \"10/22\", \"v\": 230.15}, {\"d\": \"10/23\", \"v\": 230.1}], \"mark\": \"10/21\", \"markLabel\": \"실적 발표(장후)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>결국 시장이 문제 삼은 건 두 가지였습니다.<\/b> ① <mark>12월 분기 중국 매출이 '의미 있게' 준다는 말<\/mark>, ② <mark>부품 공급 제약으로 출하 일부가 3월로 밀린 것<\/mark>. 사상 최대 실적·가이던스 상회는 이미 기대에 들어 있었고, 하루 −11.8% 뒤 10/23에도 230.10$로 되돌림이 없었습니다.<\/p><p>다음 확인: 이번 주 KLA·어플라이드머티리얼즈 실적에서 '중국 감소'와 '공급 제약'이 반복되면 장비 층 전체 이슈, 램리서치만의 얘기면 회사 이슈로 봅니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>이번 실적의 핵심은 숫자가 아니라 <mark>'공급 병목'<\/mark>입니다. 2027년 장비 투자 전망은 2,000억$ 이상으로 오히려 커졌는데, 장비를 다 못 만들어 매출이 다음 분기로 밀리고 있습니다. 밀린 매출은 사라지는 게 아니라 이월되는 몫이고, 중국 현지 고객 감소분은 실제로 빠지는 몫입니다. 이번 주 KLA·어플라이드 실적에서 '공급 제약'과 '중국 감소' 발언이 반복되는지가 장비 층 전체의 방향을 정합니다.<\/p>\n  <\/section>\n  <p class=\"xref\">X 참고: 이번 정리에선 @wallstengine·@allday_stocks 글이 검색에 잡히지 않아 쓰지 않았습니다. 숫자는 모두 회사 공식 자료 기준입니다.<\/p>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000707549/000070754926000052/lrcx_exhibitx991xq1x2027.htm\">회사 IR(공식) · 실적 보도자료(SEC 8-K)<\/a> · <a href=\"https://investor.lamresearch.com/\">램리서치 투자자 정보<\/a> · <a href=\"https://www.fool.com/earnings/call-transcripts/2026/10/21/lam-research-lrcx-q1-2027-earnings-call-transcript/\">어닝콜 녹취(모틀리풀)<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/lrcx-stock-record-profits-supply-snags-sales-hold-china-slowdown/cZxvH4rRBw4\">스톡트윗츠 · 컨센서스·시간외<\/a> · <a href=\"https://www.tradingkey.com/analysis/stocks/us-stocks/262232001-lam-research-stock-forecast-q1-earnings-december-guide-242-support-october-22-2026-tradingkey\">트레이딩키 · 가이던스 컨센<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "meta-26q3", "date": "2026-10-21", "ts": "2026-10-21", "name": "메타 META", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"meta-26q3\" data-date=\"2026-10-21\" data-layer=\"빅테크\" data-name=\"메타 META\" data-sum=\"매출✅ EPS✅(일회성 제외) · 다음 날 −6.98%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · ★미래전망 킥<\/div>\n  <h3>메타(META)<\/h3>\n  <p class=\"what\">페이스북·인스타그램·왓츠앱을 운영하는 광고 회사이자 AI 데이터센터에 가장 많이 돈을 쓰는 빅테크 중 하나입니다. 설비투자 숫자가 밸류체인 전체 주문을 정합니다. 밸류체인 빅테크 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 646억$(+26%, 예상 633~634억$) <b>상회<\/b>, 일회성 합의금을 뺀 EPS 7.40$도 예상 상회. 4분기 매출 가이던스 730~760억$로 컨센(735.7억$) 수준입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>시간외 +3~5%였다가 다음 날 <b>−6.98%<\/b>. ① <mark>올해 비용 전망을 1,750~1,790억$로 크게 올리고<\/mark>(합의금 포함) ② <mark>2027년에도 \"공격적으로 계속 투자\"<\/mark>한다며 숫자를 안 줬으며 ③ 이번 분기 잉여현금흐름이 −21억$로 돌아섰습니다. 돈은 더 쓰는데 언제 돌아오나가 다시 문제로 떠올랐고, 이날 나스닥 −2.6% 급락을 이끌었습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"투자가 성과를 내고 있고, 핵심 사업은 강하며, 모든 곳에서 속도가 붙고 있습니다\"<\/mark><cite>마크 저커버그 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 광고 단가 +14%로 AI 투자가 광고 효율로 돌아오고 있다는 주장입니다.<\/p>\n    <blockquote>2027년에도 \"공격적으로 계속 투자\"<cite>메타 · 보도자료·가이던스<\/cite><\/blockquote>\n    <p class=\"m\">→ 밸류체인에는 내년 주문이 계속된다는 신호, 메타 주주에게는 비용 부담 신호입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>올해 비용 전망 상향<\/mark><small>1,650~1,690억$ → 1,750~1,790억$ (합의금 98.9억$ 포함)<\/small><\/span><\/li>\n      <li><span><mark>잉여현금흐름 마이너스<\/mark><small>−21.2억$ · 3분기 설비투자 349억$<\/small><\/span><\/li>\n      <li><span>영업이익률 반토막<small>20%(전년 40%) — 일회성 합의금 영향<\/small><\/span><\/li>\n      <li><span>2027 투자 규모 미공개<small>\"공격적으로 계속\" — 숫자 없음<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span>광고 매출 +26%<small>노출 +10%, 광고 단가 +14%<\/small><\/span><\/li>\n      <li><span>올해 설비투자 범위 좁힘<small>1,300~1,450억$ → 1,350~1,450억$<\/small><\/span><\/li>\n      <li><span>4분기 가이던스 컨센 수준<small>730~760억$ vs 735.7억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"EPS는 일회성 합의금 제외 기준(컨센 매체별 차이 있음)\", \"items\": [{\"k\": \"매출\", \"a\": 646.0, \"e\": 633.4, \"u\": \"억$\"}, {\"k\": \"EPS(일회성 제외)\", \"a\": 7.40, \"e\": 6.67, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"실적 발표 다음 날 −6.98%\", \"items\": [{\"d\": \"10/21\", \"v\": 697.54}, {\"d\": \"10/22\", \"v\": 648.85}], \"mark\": \"10/21\", \"markLabel\": \"실적 발표(장후)\"}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">646.0억$ (633~634억$) <span class=\"ok\">✅<\/span> +26%<\/span><\/div>\n    <div class=\"row\"><span>EPS (일회성 제외)<\/span><span class=\"v\">7.40$ (6.67$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">3.83$ · 청소년 정신건강 합의금 98.9억$ 반영<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">20% (전년 40%)<\/span><\/div>\n  <\/section>\n  <section><h4>부문별 · 핵심 지표<\/h4>\n    <div class=\"row\"><span>앱 부문(페북·인스타 등)<\/span><span class=\"v\">641.6억$ · 영업이익 171.2억$<\/span><\/div>\n    <div class=\"row\"><span>리얼리티랩스(VR·AR)<\/span><span class=\"v\">4.43억$ · 영업손실 41.3억$<\/span><\/div>\n    <div class=\"row\"><span>광고 노출 / 광고 단가<\/span><span class=\"v\">+10% / +14%<\/span><\/div>\n    <div class=\"row\"><span>하루 이용자<\/span><span class=\"v\">36.4억 명 (+3%)<\/span><\/div>\n    <div class=\"row\"><span>직원 수<\/span><span class=\"v\">66,775명 (−15%)<\/span><\/div>\n  <\/section>\n  <section><h4>현금 · 설비투자<\/h4>\n    <div class=\"row\"><span><mark>3분기 설비투자<\/mark><\/span><span class=\"v\">349억$<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v no\">−21.2억$<\/span><\/div>\n  <\/section>\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span>4분기 매출<\/span><span class=\"v\">730~760억$ (735.7억$)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 설비투자<\/span><span class=\"v\"><mark>1,350~1,450억$<\/mark> (이전 1,300~1,450억$)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 비용<\/span><span class=\"v\">1,750~1,790억$ (이전 1,650~1,690억$)<\/span><\/div>\n    <div class=\"row\"><span>리얼리티랩스 손실<\/span><span class=\"v\">2026 180~190억$ · 2027 약 150억$<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2027<\/span><span class=\"v\"><mark>\"공격적으로 계속 투자\" (숫자 없음)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>기타<\/span><span>2027년 1월부터 무의결권 C주 1:1 배정 (사실상 2대1 분할)<\/span><\/div>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+3~5%<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/22 종가)<\/span><span class=\"v no\">648.85$ (−6.98%)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·차트는 제목 옆 티커를 누르면 야후 파이낸스에서 볼 수 있습니다.<\/p>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>결국 시장이 문제 삼은 건<\/b> <mark>비용 전망 상향과 숫자 없는 2027 투자 계획<\/mark>이었습니다. 시간외 상승이 다음 날 −7%로 뒤집혔습니다.<\/p><p>다음 확인: 10/29 마이크로소프트·알파벳, 10/30 아마존의 설비투자 계획 — 빅테크가 함께 늘리면 밸류체인에는 호재입니다.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">돈 쓰는 쪽은 아프지만, 밸류체인에는 내년 주문 신호입니다<\/p><p>메타 주가는 7% 빠졌지만 이유를 뜯어보면 \"돈을 너무 많이 쓴다\"는 것이었습니다. 올해 설비투자 하단을 1,350억$로 올리고 2027년에도 공격적으로 계속 쓰겠다고 했습니다.<\/p><p>밸류체인 회사들 입장에서는 그 지출이 곧 GPU·메모리·서버·전력 주문입니다. 투자자 피로와 밸류체인 매출은 반대 방향으로 움직일 수 있다는 걸 보여 준 실적입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 이번 주 마이크로소프트·알파벳·아마존도 내년 투자를 늘리면, 메타가 혼자가 아니라는 확인이 됩니다.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Third-Quarter-2026-Results/default.aspx\">회사 IR(공식)<\/a> · <a href=\"https://ppc.land/meta-takes-9-89bn-teen-settlement-charge-as-ad-revenue-gains-26/\">PPC랜드<\/a> · <a href=\"https://www.newsquawk.com/headlines/meta-platforms-inc-meta-q3-2026-usd-eps-383-exp-667-revenue-646bln-exp-6331bln\">뉴스스쿽 · 컨센<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/meta-stock-jumps-3-after-hours-after-q3-revenue-beats-expectations-with-a-narrowed-ai-capex-outlook-and-new-non-voting-class-c-stock/cZxMhJJRBv6\">스톡트윗츠 · 시간외<\/a> · <a href=\"https://cappnotes.substack.com/p/closing-look-thursday-october-22\">10/22 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "rmbs-26q3", "date": "2026-10-26", "ts": "2026-10-26T16:01", "name": "램버스 RMBS", "run": "10.26(월) 뉴욕 장 마감 후 · 한국시간 10.27(화) 05:00", "html": "<article id=\"rmbs-26q3\" data-date=\"2026-10-26\" data-ts=\"2026-10-26T16:01\" data-layer=\"인터커넥트\" data-name=\"램버스 RMBS\" data-sum=\"매출✅ EPS✅ 가이던스 상향 · 사상 최대 · 시간외 −0.9%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 반영<\/div>\n  <h3>램버스(RMBS)<\/h3>\n  <p class=\"what\">서버 메모리 모듈 안에 들어가는 버퍼·전원관리 칩과 메모리 기술 특허를 파는 회사입니다. AI 서버 한 대에 메모리가 늘수록 칩 수도 늘어납니다. 밸류체인 인터커넥트 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 2.183억$(예상 2.132억$)·조정 EPS 0.84$(예상 0.79$) <b>모두 상회<\/b>. 매출·이익·제품 매출·영업현금흐름 모두 사상 최대이고, 4분기 가이던스도 더 높습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출 대부분이 데이터센터 서버 메모리용입니다. <b>제품 매출(서버 메모리 칩) 1.143억$·+22% 사상 최대<\/b>, 4분기 제품 매출 가이던스 1.27~1.33억$로 또 사상 최대 예고. 어닝콜에서 \"AI가 모든 사업에 강한 순풍\"이라고 했습니다. 메모리 값이 비싸 서버당 메모리 용량을 줄이는 흐름(비AI성 가격 요인)은 따로 봅니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p><mark>제품 매출 1.143억$ 사상 최대<\/mark>(+22%)와 <mark>4분기 제품 매출 1.27~1.33억$ 가이던스<\/mark> — AI 서버 메모리 증가가 칩 판매로 이어지고 있습니다. 재고가 연초의 약 2배로 늘어난 점은 다음 분기 확인할 부분입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"4분기에는 더 강한 실적을 예상합니다\"<\/mark><cite>뤽 세라팽 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 4분기 매출 가이던스 2.27~2.33억$ — 사상 최대 기록을 또 넘기겠다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>제품 매출 사상 최대<\/mark><small>1.143억$ · 전년 +22%<\/small><\/span><\/li>\n      <li><span>매출·EPS 모두 상회<small>매출 +2.4% · EPS +6.5% 예상 대비<\/small><\/span><\/li>\n      <li><span>4분기 가이던스 더 높게<small>제품 매출 1.27~1.33억$<\/small><\/span><\/li>\n      <li><span>영업현금흐름 사상 최대<small>1.025억$, 자사주 1.354억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>재고 2배<small>0.441억$ → 0.872억$ · 사유 미공개<\/small><\/span><\/li>\n      <li><span>현금 감소<small>전분기 대비 −0.48억$ (자사주 매입 영향)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"컨센서스 기준(마켓비트)\", \"items\": [{\"k\": \"매출\", \"a\": 2.183, \"e\": 2.132, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 0.84, \"e\": 0.789, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"row\"><span>조정 주당순이익<\/span><span class=\"v\">0.84~0.92$<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 07:20<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>뤽 세라팽(최고경영자)<\/b> <mark>\"AI가 우리 모든 사업에 강한 순풍을 만들고 있습니다.\"<\/mark> 여러 세대 버퍼칩(RCD) 수요가 강하다고 했습니다.<\/p>\n    <p class=\"q\"><b>뤽 세라팽<\/b> 4분기 \"또 한 번 사상 최대 제품 매출\" 전망. 컴패니언칩(전원관리칩 등)은 연초 제품 매출의 10%대 초반이었고 4분기에도 전분기 대비 늘 것으로 봤습니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>뤽 세라팽<\/b> <mark>\"공급은 계속 빠듯할 것\"<\/mark>. 메모리 값이 비싸 고객이 모듈 수는 늘리되 모듈당 용량은 줄이는 흐름이 있다고 했습니다. → 칩 개수(램버스 매출)에는 영향이 작습니다.<\/p>\n    <p class=\"q\"><b>뤽 세라팽<\/b> MRDIMM(차세대 고용량 모듈)은 \"아직 매우 작다\", 전체 기회는 6억$ 규모. 매출총이익률은 60~63% 유지.<\/p>\n    <p class=\"q\"><b>뤽 세라팽(최고경영자)<\/b> \"가이던스를 넘는 사상 최대 매출과 이익, 사상 최대 제품 매출과 영업현금흐름을 냈고, 4분기는 더 강할 것으로 봅니다.\"<\/p>\n    <p class=\"q\">LPDDR6 메모리 모듈용 새 전원관리 칩과 데이터센터 보안 설계자산을 출시했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>정규장 (발표 전)<\/span><span class=\"v ok\">85.65$ → 90.32$ (+5.45%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v no\">−0.85% · 89.55$<\/span><\/div>\n  \n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v no\">88.91$ (−1.56%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·시간외·차트는 <a href=\"https://finance.yahoo.com/quote/RMBS\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">RMBS ↗ 야후 파이낸스<\/a>에서 바로 보세요(제목 옆 티커를 눌러도 됩니다). 주가 흐름 차트는 첫 거래일 종가가 나오면 여기에 그립니다.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트 예정<\/span><\/h4><p>첫 거래일(10/27) 종가가 나오면 시장이 결국 무엇을 문제 삼았는지(반겼는지) 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 서버 한 대에 들어가는 메모리가 늘고 있습니다<\/p><p>램버스의 제품 매출은 서버 메모리 모듈 수에 비례합니다. 그 제품 매출이 사상 최대를 찍고 4분기엔 더 높게 가이던스를 냈다는 건, AI 서버가 늘어날 뿐 아니라 한 대당 메모리도 많아지고 있다는 뜻입니다.<\/p><p>메모리 층(SK하이닉스·삼성전자·마이크론)의 수요가 탄탄하다는 걸 부품 쪽에서 미리 확인해 준 셈입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/28 SK하이닉스 실적에서 서버 D램·HBM 출하가 같은 방향인지, 램버스 재고 증가가 다음 분기 판매로 소화되는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://ph.investing.com/news/stock-market-news/earnings-call-transcript-rambus-tops-q3-2026-estimates-on-record-revenue-93CH-2650730\">인베스팅닷컴 어닝콜 녹취<\/a> · <a href=\"https://www.financialcontent.com/article/bizwire-2026-10-26-rambus-reports-third-quarter-2026-financial-results\">회사 보도자료(비즈니스와이어)<\/a> · <a href=\"https://www.marketbeat.com/earnings/reports/2026-10-26-rambus-inc-stock/\">마켓비트 · 컨센서스<\/a><\/p>\n<\/article>", "updated": "2026-10-28T05:30:00+09:00"}, {"id": "samsung-26q3", "date": "2026-10-08", "ts": "2026-10-08", "name": "삼성전자 005930", "run": "10.08(목) 한국 장 시작 전 · 잠정실적 · 한국시간 10.08(목) 08:00", "html": "<article id=\"samsung-26q3\" data-date=\"2026-10-08\" data-layer=\"칩·메모리\" data-name=\"삼성전자 005930\" data-sum=\"매출❌ 영업이익✅ · 당일 −2.4%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 잠정실적<\/div>\n  <h3>삼성전자(005930)<\/h3>\n  <p class=\"what\">D램·낸드 같은 메모리 반도체 세계 1위권 회사이자 갤럭시 스마트폰·가전을 만드는 회사입니다. 엔비디아 등 인공지능(AI) 가속기에 들어가는 고대역폭메모리(HBM)를 공급합니다. 밸류체인 칩·메모리 층.<\/p>\n  <p class=\"na\">이번 발표는 <b>잠정실적<\/b>이라 매출·영업이익 두 숫자만 공개됐습니다. 부문별 실적·순이익·회사 전망은 10/29 확정실적 발표 때 나오며, 확정치가 나오면 이 글에 덧붙이겠습니다. 아래 부문별 숫자는 모두 증권사 추정입니다.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>영업이익 107.4조원으로 <b>국내 기업 첫 분기 100조원 돌파<\/b>, 4개 분기 연속 사상 최대. 영업이익률 약 55%. 매출은 예상보다 약 2.8% 낮았지만, 이익의 대부분이 메모리에서 나온 것으로 추정돼 <mark>AI 서버용 메모리 수요는 여전히 잘 빠지고 있다<\/mark>는 신호입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>영업이익이 예상(106.6조원)을 넘겼는데도 당일 −2.4%. ① 영업이익 100조원 돌파는 이미 다 알려진 기대치였고 ② <mark>좋은 소식에 파는 차익실현(셀온) 매물<\/mark>이 쏟아졌으며 ③ 반도체 상장지수펀드(ETF) 비중 조정·옵션 만기·회사 자사주 매입 종료가 한날에 겹쳤습니다. 매출 미스(195조 vs 200.6조원)는 원화 강세와 스마트폰 부진 영향으로 풀이됩니다.<\/p><\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>실적과 상관없는 ‘공포 장세’가 덮쳤습니다.<\/b> 10/12~16 한 주에 삼성전자는 26만2,000원 → 21만5,500원으로 <mark>−17.8%, 2008년 10월 이후 최대 주간 낙폭<\/mark>을 기록했습니다. 10/15에는 코스피가 −7.57% 폭락하며 서킷브레이커가 걸렸고 삼성전자도 하루 −9.48%로 21만원까지 밀렸습니다. 이유로는 ‘AI 투자 속도 조절·수익성 우려’와 ‘중국 메모리 업체 추격’이 꼽혔고, 외국인은 그 주에만 삼성전자를 3조4,763억원 팔아 외국인 보유율이 45.98%(2009년 7월 이후 최저)까지 내려갔습니다.<\/p><p>10/16 +2.62%(21만5,500원) 반등 뒤 10/19~21 외국인이 사흘 연속 순매수했지만 10/23 다시 매도로 돌아섰고, 10/26 종가는 21만3,000원(−1.16%)입니다. 10/27 종가는 <span class=\"na\">확인 못 함<\/span>. 증권가(KB·유안타)는 “기초체력 훼손보다 위험 회피에 따른 일시적 가격 왜곡”으로 봅니다. 다음 확인: 10/29 확정실적에서 메모리 영업이익과 HBM4 매출 증가 폭.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>숫자로 보면 <mark>AI 서버용 메모리 수요는 꺾인 흔적이 없습니다<\/mark>. 메모리 이익(추정 약 110조원)이 회사 전체 이익보다 크고, 매출 미스는 원화 강세·스마트폰 부진 같은 예견된 비AI 요인입니다. 그런데도 주가가 3주 만에 약 21% 빠진 건 실적이 아니라 ‘AI 투자가 언제 꺾이나’라는 공포와 외국인 매도 때문입니다. 10/29 확정실적에서 HBM4 매출과 4분기 메모리 가격 전망이 이 공포를 누를 수 있는지가 핵심입니다.<\/p>\n  <\/section>\n  <p class=\"src\">출처: <a href=\"https://news.samsung.com/global/samsung-electronics-announces-earnings-guidance-for-third-quarter-2026\">회사 공식 · 3분기 잠정실적 발표(삼성 뉴스룸)<\/a> · <a href=\"https://www.nocutnews.co.kr/news/6588684\">노컷뉴스 · 컨센서스·메모리 가격<\/a> · <a href=\"https://www.koreatimes.co.kr/business/companies/20261008/samsung-electronics-1st-korean-firm-to-top-80-bil-in-quarterly-operating-profit\">코리아타임스 · 컨센서스·부문 추정<\/a> · <a href=\"https://www.thevaluenews.co.kr/news/202190\">더밸류뉴스 · 누적 실적<\/a> · <a href=\"https://www.heraldk.com/article/2026100719361447549\">헤럴드경제 · 증권사 부문 추정·HBM<\/a> · <a href=\"https://dealsite.co.kr/articles/169829\">딜사이트 · 사전 컨센서스<\/a> · <a href=\"https://www.fnnews.com/news/202610082215402483\">파이낸셜뉴스 · 10/8 종가<\/a> · <a href=\"https://news.mtn.co.kr/news-detail/2026100815315146268\">MTN · 10/8 마감시황<\/a> · <a href=\"https://news.mtn.co.kr/news-detail/2026100716031835311\">MTN · 10/7 마감시황<\/a> · <a href=\"https://www.mt.co.kr/article/2026100816452415207\">머니투데이 · 하락 이유<\/a> · <a href=\"https://www.ytn.co.kr/_ln/0545_202610130750012288\">YTN · 외국인 보유율<\/a> · <a href=\"https://kbmaeil.com/article/20261016500330\">경북매일 · 10/15~16 주가<\/a> · <a href=\"https://kbmaeil.com/article/20261018500021\">경북매일 · 주간 낙폭<\/a> · <a href=\"https://kbmaeil.com/article/20261023500243\">경북매일 · 10/19~23 수급<\/a> · <a href=\"https://www.seoul.co.kr/news/economy/securities/2026/10/26/20261026500217\">서울신문 · 10/26 종가<\/a> · <a href=\"https://www.mt.co.kr/industry/2026/01/29/2026012907424194498\">머니투데이 · 25.4Q 실적<\/a> · <a href=\"https://biz.newdaily.co.kr/site/data/html/2026/04/30/2026043000086.html\">뉴데일리 · 26.1Q 실적<\/a> · <a href=\"https://www.mt.co.kr/article/2026073008363820079\">머니투데이 · 26.2Q 실적<\/a><\/p>\n<\/article>", "updated": "2026-10-27T19:30+09:00"}, {"id": "semco-26q3", "date": "2026-10-28", "ts": "2026-10-28T12:00", "name": "삼성전기 009150", "run": "10.28(수) 한국 장중 · 한국시간 10.28(수) 12:00", "html": "<article id=\"semco-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T12:00\" data-layer=\"칩·메모리\" data-name=\"삼성전기 009150\" data-sum=\"AI 관점 호재(MLCC +36%·기판 +58%) · 매출❌(−1.8%) 영업이익✅(+4.3%) · 영업이익률 18.4% · 장중 +7~11% · 어닝콜 반영\">\n  <div class=\"tag\"><b>실적결과<\/b> 한국 장중 · 2026년 3분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>삼성전기(009150)<\/h3>\n  <p class=\"what\">전자제품 회로에 들어가는 작은 전기 저장 부품(적층세라믹콘덴서, MLCC)과 AI 칩을 올리는 반도체 기판(FC-BGA), 스마트폰 카메라모듈을 만드는 회사입니다. AI 서버 한 대에는 일반 서버보다 MLCC가 훨씬 많이 들어가 서버 출하를 국내에서 가장 먼저 보여 줍니다. 밸류체인 칩·메모리(부품) 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>3조7633억원<\/b>(컨센 3조8334억원, −1.8%)은 소폭 못 미쳤지만, 영업이익 <b>6910억원<\/b>(컨센 6626억원, +4.3%)은 넘었습니다. 매출·영업이익 모두 분기 사상 최대이고, 영업이익률은 <b>18.4%<\/b>(2분기 12.7%)로 크게 올랐습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 쪽 두 사업이 끌었습니다. MLCC(컴포넌트) 매출 <b>1조8830억원(전년 +36%)<\/b>은 AI 데이터센터(서버·네트워크·전력)가 주도했고, 반도체 기판(패키지솔루션) <b>9390억원(전년 +58%)<\/b>은 서버 CPU·AI 가속기용 FC-BGA가 이끌었습니다. 매출 미달은 해외 스마트폰 고객 수요가 줄어든 카메라모듈(전분기 −9%) 때문이라 예고된 비AI 요인으로 보고 판정에서 뺐습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>매출은 살짝 모자랐지만 <mark>이익이 사상 최대<\/mark>였고, 늘어난 곳이 정확히 <mark>AI 서버용 MLCC와 AI 칩 기판<\/mark>입니다. 회사는 \"4분기에도 AI 데이터센터용 고사양 부품 수요 강세\"를 예상했습니다. 주가는 발표 뒤 <mark>+10.9%<\/mark>(12:37)까지 올랐습니다 — 삼성전자(+6.9%)·코스피 급등과 같은 날이라 시장 전체 분위기도 함께 작용했습니다(자체 해석).<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"2027년 MLCC 매출의 과반 이상이 장기공급계약에서 발생할 것\"<\/mark><cite>이태곤 · 부사장 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년 MLCC 매출 절반 넘게 이미 계약으로 묶였다는 뜻 — 약 50개 고객사와 체결했거나 진행 중입니다.<\/p>\n    <blockquote>\"대규모 증설로도 고객사 수요를 충족하기 어려워 추가 물량 확대 요청이 지속되고 있다\"<cite>이태곤 · 부사장 · 어닝콜(FC-BGA)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 칩 기판도 만드는 만큼 다 팔리고 더 달라는 상황입니다.<\/p>\n    <blockquote><mark>\"4분기에도 AI 데이터센터용 고사양 부품 수요가 강세를 이어갈 것\"<\/mark><cite>삼성전기 · 3분기 실적 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 서버 부품 주문이 연말까지 꺾이지 않는다는 회사 판단입니다.<\/p>\n    <blockquote>\"GPU·ASIC 하나에 필요한 MLCC 용량이 매년 2배로 늘어난다\"(AI MLCC 법칙)<cite>삼성전기 · 실적 발표 자료(보도 요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 칩이 좋아질수록 칩 한 개에 붙는 MLCC가 더 많아진다는 뜻 — AI 칩 출하보다 MLCC 수요가 더 빨리 늘 수 있다는 논리입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>부담이 될 수 있는 점<\/h4><ul>\n      <li><span>매출 컨센 소폭 미달<small>3.76조원 vs 3.83조원(−1.8%)<\/small><\/span><\/li>\n      <li><span>카메라모듈 약세<small>광학솔루션 9413억원, 전분기 −9% — 해외 거래선 수요 감소<\/small><\/span><\/li>\n      <li><span>영업외손실<small>세전이익 6097억원(영업외 −812억원), 내역 미공개<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><mark>영업이익 사상 최대·컨센 상회<\/mark><small>6910억원, 전년 +165%, 이익률 18.4%<\/small><\/span><\/li>\n      <li><span><mark>AI MLCC +36%<\/mark><small>컴포넌트 1.88조원, 전분기 +14%<\/small><\/span><\/li>\n      <li><span>AI 칩 기판 +58%<small>패키지솔루션 9390억원, 전분기 +22%<\/small><\/span><\/li>\n      <li><span>4분기도 강세 전망<small>빅테크 장기공급계약 대응·FC-BGA 증설<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"예상은 에프앤가이드 컨센서스\", \"items\": [{\"k\": \"매출\", \"a\": 3.7633, \"e\": 3.8334, \"u\": \"조원\"}, {\"k\": \"영업이익\", \"a\": 6910, \"e\": 6626, \"u\": \"억원\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"사업부별 매출 비중 (%)\", \"cap\": \"AI가 이끈 MLCC·기판이 75%\", \"items\": [{\"k\": \"컴포넌트(MLCC)\", \"v\": 50, \"hl\": 1}, {\"k\": \"광학(카메라)\", \"v\": 25}, {\"k\": \"패키지(기판)\", \"v\": 25, \"hl\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 영업이익 추이 (억원)\", \"cap\": \"1분기는 일회성 퇴직급여 714억원 포함\", \"items\": [{\"q\": \"25.3Q\", \"v\": 2603}, {\"q\": \"25.4Q\", \"v\": 2395}, {\"q\": \"26.1Q\", \"v\": 2806}, {\"q\": \"26.2Q\", \"v\": 4404}, {\"q\": \"26.3Q\", \"v\": 6910, \"hi\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적 (연결 · 잠정)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">3조7633억원 (3조8334억원) <span class=\"no\">❌<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전분기 / 전년 대비<\/span><span class=\"v\">+9% / +30% · 분기 사상 최대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 영업이익<\/span><span class=\"v\"><mark>6910억원<\/mark> (6626억원) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전분기 / 전년 대비<\/span><span class=\"v\">+57% / +165% · 분기 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">18.4% (2분기 12.7% · 전년 9.0%)<\/span><\/div>\n    <div class=\"row\"><span>세전이익<\/span><span class=\"v\">6097억원 (영업외 −812억원)<\/span><\/div>\n    <div class=\"row\"><span>지배주주 순이익<\/span><span class=\"v\">4687억원 (전분기 +48% · 전년 +113%)<\/span><\/div>\n    <p class=\"na\">영업이익 컨센은 기준에 따라 6423억~6637억원(상회 폭 +4~8%). 한경은 순이익을 4850억원(비지배 포함으로 보임)으로 보도했습니다.<\/p>\n  <\/section>\n\n  <section><h4>사업부별<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 컴포넌트(MLCC)<\/span><span class=\"v\"><mark>1조8830억원<\/mark> · 전분기 +14% · 전년 +36%<\/span><\/div>\n    <div class=\"row\"><span>　이끈 곳<\/span><span class=\"v\">AI 데이터센터(서버·네트워크·전력)용 고사양 MLCC<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 패키지솔루션(기판)<\/span><span class=\"v\">9390억원 · 전분기 +22% · 전년 +58%<\/span><\/div>\n    <div class=\"row\"><span>　이끈 곳<\/span><span class=\"v\">서버 CPU·AI 가속기용 FC-BGA, 자율주행(ADAS) 기판<\/span><\/div>\n    <div class=\"row\"><span>광학솔루션(카메라)<\/span><span class=\"v no\">9413억원 · 전분기 −9% · 전년 +3%<\/span><\/div>\n    <p class=\"na\">사업부별 영업이익, AI 서버용 MLCC 비중, 가동률, 가격 인상 반영, 장기공급계약(4.3조원) 반영 여부는 자료에서 확인하지 못했습니다. 참고: 8월 MLCC 가격 최대 30% 인상 보도, 10월 납기 61주 보도.<\/p>\n  <\/section>\n\n  <section><h4>전망 · 4분기<\/h4>\n    <div class=\"row\"><span>회사 전망<\/span><span class=\"v\">AI 데이터센터용 고사양 부품 수요 강세 지속<\/span><\/div>\n    <div class=\"row\"><span>MLCC<\/span><span class=\"v\">소형·초고용량 AI MLCC 공급 확대, 빅테크 장기공급계약 대응, 전기차·자율주행용 확대<\/span><\/div>\n    <div class=\"row\"><span>FC-BGA<\/span><span class=\"v\">고부가 신제품 적기 공급 · 부산·세종·베트남 증설<\/span><\/div>\n    <div class=\"row\"><span>카메라<\/span><span class=\"v\">전략 거래선 차기 플래그십용 슬림 카메라 양산<\/span><\/div>\n    <p class=\"na\">한국 회사는 숫자 가이던스를 내지 않습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 14:50<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>AI 칩이 커질수록 MLCC가 더<\/b> 이태곤 부사장: AI GPU·ASIC 한 패키지의 다이 수가 <mark>\"2026년 2개, 2027년 4개, 2028년 이후 8개\"<\/mark>로 늘어난다고 했습니다. → 칩 하나에 붙는 MLCC가 계속 늘어난다는 근거입니다.<\/p>\n    <p class=\"q\"><b>4분기 추가<\/b> \"통상적인 수준을 훌쩍 넘어 전분기 대비 큰 폭의 성장\", AI 데이터센터용 매출 비중 추가 확대(수치 비공개), 수급은 3분기보다 더 타이트 — \"전략적 캐파 운영\".<\/p>\n    <p class=\"q\"><b>증설<\/b> 필리핀 신공장은 내년부터 최선단 고부가 MLCC 중심으로 양산을 시작합니다. 올해 설비투자는 국내외 부지·인프라 선행투자로 <mark>당초 전망보다 증가<\/mark>합니다(2027년 금액 비공개).<\/p>\n    <p class=\"q\"><b>기판·카메라<\/b> 빅테크에 공급 중인 임베딩 기판은 2027년 이후 본격 확대, 유리기판은 2028년 본격 가동 기조 유지. 카메라모듈은 3분기부터 휴머노이드용 모듈 양산을 시작했습니다.<\/p>\n    <p class=\"na\">발표: 이동우 IR·기획 담당 부사장. 인베스팅닷컴 녹취록은 장기계약 발언(2027년 MLCC 매출 과반)을 김성진 CFO로 적어, 뉴스핌(이태곤 부사장)과 발언자가 다릅니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>MLCC 장기계약<\/b> 이태곤 부사장: 약 50개 고객사와 체결했거나 진행 중, <mark>\"2027년 MLCC 매출의 과반 이상이 장기공급계약에서 발생\"<\/mark>.<\/p>\n    <p class=\"q\"><b>수급<\/b> 수주가 예상보다 빠르게 늘고, \"고부가 제품 특성상 생산능력 잠식까지 발생해 타이트한 수급이 심화될 전망\". 가격은 \"전략적인 가격 대응을 이어가겠다\"(인상폭 숫자는 없음).<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>4분기<\/b> 보통은 계절적으로 평탄하지만 올해는 전장·AI 서버 선단품 수요가 강해 <mark>\"믹스 개선과 평균판매가격 상승으로 큰 폭의 매출 성장\"<\/mark>.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2027년 AI MLCC<\/b> 고용량 1005 사이즈 47µF 제품은 주요 빅테크 신규 플랫폼 전부에 공급 중이며 <mark>2027년 수요 약 8배<\/mark>, 광모듈용 MLCC 매출은 올해 대비 약 3배 이상 기대.<\/p>\n    <p class=\"q\"><b>FC-BGA<\/b> 증설해도 수요를 못 따라가 추가 물량 요청이 계속됩니다. 세종 4.27조·베트남 2.51조원(9월 발표) 증설은 2027년부터 단계적 양산·2028년부터 매출 기여. 추가 투자는 \"시점과 규모를 신중하게 판단\". 글로벌 빅테크와 장기계약(고객명 비공개), 원자재 가격을 반영한 공급가 협상 중.<\/p>\n    <p class=\"q\"><b>3분기<\/b> 데이터센터 수요로 매출·출하가 늘고 재고는 줄었으며, 산업·전장 비중 확대로 평균판매가격이 올랐습니다.<\/p>\n    <p class=\"na\">가동률, AI 서버용 비중, 4.3조원 장기계약 반영 시점, 유리기판·실리콘 커패시터 발언은 보도에서 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>직전 종가 (10/27)<\/span><span class=\"v\">1,201,000원<\/span><\/div>\n    <div class=\"row\"><span>오전 (09:56, 발표 전)<\/span><span class=\"v ok\">1,286,000원 (+7.08%)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 발표 뒤 (12:37)<\/span><span class=\"v ok\"><mark>1,332,000원 (+10.91%)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>13:20 시황<\/span><span class=\"v ok\">+8.99% (약 130.9만원, 전일 종가로 계산)<\/span><\/div>\n    <div class=\"row\"><span>13:40<\/span><span class=\"v ok\">128.7만원 (+7.16%) · 장중 고가 133.8만원 — 오름폭 일부 반납<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">15:30 마감 뒤 확인<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 장 마감 뒤 업데이트 예정<\/span><\/h4><p>종가와 컨퍼런스콜 발언이 나오면 시장이 결국 무엇을 반겼는지 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 서버 부품은 계속 빡빡합니다 — MLCC·기판이 이익을 끌었습니다<\/p><p>오늘 아침 SK하이닉스가 \"HBM 수요가 공급의 2배\"라고 한 것처럼, 삼성전기도 AI 서버·AI 칩 쪽 부품(MLCC +36%, 기판 +58%)이 성장을 이끌었습니다. 칩뿐 아니라 칩 주변 부품까지 공급 부족이 번지고 있다는 신호입니다.<\/p><p>신호는 AI MLCC·FC-BGA 성장과 장기계약, 소음은 카메라모듈 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 13:00 콜의 MLCC 가격·가동률 발언, 대만 델타(10/29)·라이트온(10/30)의 AI 서버 전원 숫자.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://samsungsem.com/resources/file/kr/ir/earnings_release/3Q26_Earnings_Release_kor.pdf\">회사 IR(공식) · 3분기 실적 자료<\/a> · <a href=\"https://www.hankyung.com/article/2026102804527\">한경 · 공시<\/a> · <a href=\"https://www.mediawatch.kr/news/article.html?no=261520\">미디어워치 · 컨센서스·주가<\/a> · <a href=\"https://zdnet.co.kr/view/?no=20261028122201\">지디넷 · 컨센서스<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707329/\">데일리안 · 전망<\/a> · <a href=\"https://www.etoday.co.kr/news/view/2641103\">이투데이<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000855\">뉴스핌<\/a> · <a href=\"https://www.joongangenews.com/news/articleView.html?idxno=559009\">중앙이코노미 · 주가<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000948\">뉴스핌 · 어닝콜 MLCC<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000953\">뉴스핌 · 2027 전망<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000984\">뉴스핌 · FC-BGA<\/a> · <a href=\"https://www.asiatoday.co.kr/kn/view.php?key=20261028010009877\">아시아투데이 · 어닝콜<\/a> · <a href=\"https://fnnews.com/news/202610281319283116\">파이낸셜뉴스 · 주가<\/a> · <a href=\"https://kr.investing.com/news/transcripts/article-93CH-2144750\">인베스팅닷컴 · 콜 녹취록<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707382\">데일리안 · 4분기<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707358\">데일리안 · 필리핀 공장<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707374\">데일리안 · 임베딩 기판<\/a> · <a href=\"https://www.asiatoday.co.kr/kn/view.php?key=20261028010009910\">아시아투데이 · 설비투자<\/a> · <a href=\"https://www.job-post.co.kr/news/articleView.html?idxno=234990\">잡포스트 · 주가<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T14:50:00+09:00"}, {"id": "skhynix-26q3", "date": "2026-10-28", "ts": "2026-10-28T08:30", "name": "SK하이닉스 000660", "run": "10.28(수) 한국 장중 · 한국시간 10.28(수) 09:00", "html": "<article id=\"skhynix-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T08:30\" data-layer=\"칩·메모리\" data-name=\"SK하이닉스 000660\" data-sum=\"AI 관점 호재(HBM4 본격 출하·장기계약 14곳) · 매출✅ 영업이익✅ · 영업이익률 80% · 주주환원 약 100조 · 장중 +6.8%(10:08) · 시총 1,000조 돌파 · 어닝콜 반영\">\n  <div class=\"tag\"><b>실적결과<\/b> 한국 장전 · 2026년 3분기(7~9월) · 물량확인용 · 미래전망 킥 · 어닝콜 반영<\/div>\n  <h3>SK하이닉스(000660)<\/h3>\n  <p class=\"what\">AI 칩(GPU) 옆에 쌓아 붙이는 고대역폭 메모리(HBM)와 서버용 D램·기업용 SSD(eSSD)를 만드는 회사입니다. 엔비디아 GPU에 들어가는 HBM의 핵심 공급사라, AI 칩이 실제로 얼마나 만들어지는지 메모리 물량으로 보여 줍니다. 밸류체인 칩·메모리 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>104조6155억원<\/b>(컨센 98조2257억원, +6.5%)·영업이익 <b>83조3338억원<\/b>(컨센 76조9640억원, +8.3%)으로 둘 다 예상을 넘었습니다. 분기 매출이 처음 100조원을 넘었고, 영업이익률은 약 <b>80%<\/b>(컨센 기준 약 78%)입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>회사는 3분기에 <b>HBM4 출하가 본격화<\/b>되고 <b>서버용 DDR5 판매가 크게 늘었으며<\/b>, 낸드에서는 321단 기반 <b>기업용 SSD(eSSD) 판매가 확대<\/b>됐다고 밝혔습니다. 4분기엔 HBM4가 출하량·매출 모두 HBM3E를 앞설 것으로 봅니다. 클라우드 업체를 포함한 <b>14개 주요 고객과 장기공급계약<\/b>을 맺어 2027·2028년 생산능력의 50% 이상을 확보했습니다. 스마트폰·PC 등 비AI 부문 숫자는 이번 자료에서 따로 확인되지 않아 판정에 넣지 않았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 주목한 포인트<\/p><p>숫자는 컨센을 <mark>6~8% 상회<\/mark>했고(영업이익은 증권사 최고 추정치 80.1조원보다도 높음), 시장의 또 다른 관심이던 주주환원은 <mark>올해 약 100조원<\/mark>(현금배당 30조원 이상 + 자사주 매입·소각 60조원 이상)으로 나왔습니다. 회사는 <mark>\"2030년까지 메모리 공급 부족이 이어질 것\"<\/mark>으로 전망했습니다. 그런데 정규장 초반 주가는 <mark>+1.8%<\/mark>로 프리마켓(+3.65%)보다 오름폭이 줄었습니다 — 이미 높아진 기대와 순이익 감소(전분기 키옥시아 일회성 효과 소멸)가 겹친 것으로 보입니다(자체 해석). 수요·가격 발언은 09:00 컨퍼런스콜에서 확인합니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"주요 고객과 내년 HBM 물량과 가격을 포함한 거래 조건 협의를 완료했으며 … HBM4의 높아진 가치를 충실히 반영했다\"<\/mark><cite>김우현 · 최고재무책임자(CFO) · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 2027년 HBM 물량·가격이 이미 정해졌고, 값도 더 받기로 했다는 뜻입니다. 내년 실적의 불확실성이 크게 줄었습니다.<\/p>\n    <blockquote>\"HBM과 일반 D램 간 수익성 격차가 유의미하게 축소될 것\"<cite>김우현 · 최고재무책임자(CFO) · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 일반 D램 값이 워낙 올라 HBM만 특별히 돈 되는 구조가 아니라는 말 — 회사 전체 이익률이 높게 유지된다는 신호이자, HBM 프리미엄이 줄어든다는 해석도 가능합니다(자체 해석).<\/p>\n    <blockquote><mark>\"선단 공정의 기술 난이도와 신규 시설 구축 기간을 고려하면 2030년까지 메모리 공급 부족이 이어질 것\"<\/mark><cite>SK하이닉스 · 실적 발표 자료(뉴스핌 보도 요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 메모리를 더 만들고 싶어도 공장·기술 때문에 빨리 못 늘린다는 뜻 — 가격 협상력이 공급사에 있다는 말입니다.<\/p>\n    <blockquote>\"AI 인프라 투자가 빅테크를 넘어 일반 기업과 국가 단위로 확산되고 있습니다\"<cite>SK하이닉스 · 실적 발표 자료(뉴스핌 보도 요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 메모리를 사는 손님이 빅테크 몇 곳에서 더 넓어지고 있다는 판단입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가에 부담이 될 수 있는 점<\/h4><ul>\n      <li><span>기대가 이미 높음<small>3개월 전 영업이익 컨센 81.5조원 → 76.96조원으로 낮아졌다가 다시 상회<\/small><\/span><\/li>\n      <li><span>내년 투자 크게 늘어남<small>용인 1기 팹 가동 등으로 투자 규모가 올해보다 크게 증가 전망<\/small><\/span><\/li>\n      <li><span>장기계약 가격은 범위 안 변동<small>시장 상황을 반영하도록 설계 — 고정가가 아님<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 수 있는 점<\/h4><ul>\n      <li><span><mark>컨센 상회 · 이익률 80%<\/mark><small>매출 +6.5% · 영업이익 +8.3% 상회<\/small><\/span><\/li>\n      <li><span><mark>장기계약 14곳 · 2027~28 물량 50%+<\/mark><small>클라우드 업체 포함<\/small><\/span><\/li>\n      <li><span>주주환원 약 100조원<small>3분기 배당 주당 2만원(특별배당 1만원 포함) · 자사주 20조원 추가<\/small><\/span><\/li>\n      <li><span>순현금 98.7조원<small>현금성 자산 114.5조원<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"예상은 에프앤가이드 컨센서스(10 >\n    <div class=\"row\"><span>기업용 SSD(eSSD)<\/span><span class=\"v\">321단 TLC 기반 판매 확대 · 321단 비중을 국내 생산능력 절반 이상으로<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 장기공급계약<\/span><span class=\"v\"><mark>14개 주요 고객 · 2027~28년 생산능력 50% 이상<\/mark><\/span><\/div>\n    <div class=\"row\"><span>생산능력<\/span><span class=\"v\">청주 M15X 연말까지 최대 가동<\/span><\/div>\n    <p class=\"na\">D램 출하 3분기 +10%·4분기 20% 중반 증가(어닝콜). HBM 매출 비중은 공개되지 않았습니다. 비AI(스마트폰·PC) 요인은 이번 자료에서 따로 확인되지 않았습니다.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>현금성 자산 / 차입금 / 순현금<\/span><span class=\"v\">114.5조원 (전분기 +26.5조) / 15.8조원 (−2.8조) / 98.7조원<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 올해 주주환원<\/span><span class=\"v\"><mark>약 100조원<\/mark> (현금배당 30조원+ · 자사주 매입·소각 60조원+)<\/span><\/div>\n    <div class=\"row\"><span>3분기 결의<\/span><span class=\"v\">현금배당 14조원 · 자사주 매입 20조원(10조원 소각, 10조원 임직원 보상)<\/span><\/div>\n    <div class=\"row\"><span>3분기 배당<\/span><span class=\"v ok\">주당 2만원 (실적분 1만원 + 키옥시아 투자수익 특별배당 1만원)<\/span><\/div>\n    <div class=\"row\"><span>8월 자사주 40조원<\/span><span class=\"v\">매입 완료 · 곧 소각<\/span><\/div>\n    <div class=\"row\"><span>환원 방침<\/span><span class=\"v\">잉여현금흐름의 50% 이상<\/span><\/div>\n  <\/section>\n\n  <section><h4>전망 · 4분기와 내년<\/h4>\n    <div class=\"row\"><span>업황<\/span><span class=\"v\">2030년까지 메모리 공급 부족 지속 전망<\/span><\/div>\n    <div class=\"row\"><span>4분기<\/span><span class=\"v\">HBM4 > HBM3E (출하·매출) · M15X 최대 가동<\/span><\/div>\n    <div class=\"row\"><span>내년 투자<\/span><span class=\"v\">용인 1기 팹 가동 등으로 올해보다 크게 증가 전망 · 규모·시기는 탄력적으로 조정<\/span><\/div>\n    <div class=\"row\"><span>4분기 영업이익 컨센<\/span><span class=\"v\">87.27조원 (에프앤가이드)<\/span><\/div>\n    <div class=\"row\"><span>장기계약 기간<\/span><span class=\"v\">보통 5년 · 더 긴 기간을 논의하는 고객도 있음<\/span><\/div>\n    <p class=\"na\">한국 회사는 숫자 가이던스를 내지 않습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 10:55<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>수요가 공급의 2배<\/b> <mark>고객이 요청한 HBM 물량이 공급 가능량의 2배를 넘는다<\/mark>고 했습니다. HBM을 12단에서 8단으로 낮춰도 필요 용량은 줄지 않고, 오히려 쌓는 묶음(큐브) 수가 늘어 바닥칩·후공정 수요가 커진다는 설명입니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2029년까지 사실상 매진<\/b> 이미 맺은 장기계약과 구체적으로 협의 중인 물량을 합치면 <mark>D램·HBM은 2029년까지 사실상 매진<\/mark>입니다. 장기계약은 중장기에도 생산능력의 50% 이상을 유지할 계획입니다.<\/p>\n    <p class=\"q\"><b>HBM 수율<\/b> HBM4 수율이 계획을 넘어 목표를 올렸고, HBM3E도 계획한 수율을 넘겼습니다. HBM4E는 고객 일정에 맞춰 개발·평가 중입니다(샘플은 2분기 출하).<\/p>\n    <p class=\"q\"><b>2027 투자·공급과잉 질문<\/b> 2027 투자는 올해보다 상당히 늘어납니다(첨단공정·용인 1기·국내외 인프라). 공급과잉 우려 질문(BofA)에는 <mark>팹 건물(셸)을 먼저 짓고 클린룸은 수요에 맞춰 단계적으로 채운다<\/mark>고 답했습니다. → 수요가 꺾이면 투자 속도를 늦출 수 있는 구조라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>솔리다임 상장 보류<\/b> 곽노정 사장(CEO): \"지금 시점의 상장으로는 당초 기대한 효과를 충분히 거두기 어렵다\". 키옥시아 투자이익은 특별배당(주당 1만원)으로 돌려줍니다.<\/p>\n    <p class=\"na\">콜 참석: 곽노정 CEO, 김우현 CFO, 박성환 IR담당, 박준덕 D램마케팅담당, 송창석 낸드마케팅담당, 김기태 HBM세일즈&마케팅담당. EBITDA 87.7조원(인베스팅닷컴 녹취록). 녹취록의 2027 낸드 수요(10% 후반)는 다른 보도(20% 후반)와 달라 확인이 필요합니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2027년 HBM 협의 완료<\/b> 김우현 CFO: <mark>\"주요 고객과 내년 HBM 물량과 가격을 포함한 거래 조건 협의를 완료\"<\/mark>, \"HBM4의 높아진 가치를 충실히 반영\". → 내년 HBM은 이미 팔렸고 값도 올랐다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>HBM4 전환<\/b> 김우현 CFO: \"4분기 HBM4는 전체 HBM 출하량과 매출에서 차지하는 비중이 모두 HBM3E를 넘어 주력 제품으로 자리 잡을 것\", \"HBM4 12단 제품은 협의한 일정대로 순조롭게 출하\". 회사는 HBM4 수율도 \"상당히 안정적\"이라고 했습니다.<\/p>\n    <p class=\"q\"><b>3분기 물량·가격<\/b> D램 출하 약 +10%·평균판매가격 20% 후반 상승, 낸드 출하 소폭 감소·평균판매가격 20% 중반 상승(전분기 대비).<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>4분기·내년<\/b> 4분기 D램 출하 <mark>20% 중반 증가<\/mark>(1c 공정·M15X HBM4 증산), 낸드 한 자릿수 중반 증가. 내년 수요는 D램 비트 20% 중반, 낸드 20% 후반 성장 전망.<\/p>\n    <p class=\"q\"><b>수요 근거<\/b> 클라우드 기업 내년 설비투자 60% 이상 증가(외부 리서치 인용), AI 데이터센터 인프라 2030년까지 연 40% 이상 성장. 김우현 CFO: \"공급이 수요에 못 미치는 환경이 2030년까지 지속\".<\/p>\n    <p class=\"q\"><b>장기계약<\/b> 14개 고객·2027~28년 생산능력 50% 이상, <mark>\"예치금 등 실질적인 이행 장치를 포함\"<\/mark> — 고객이 돈을 미리 걸어 둔 계약이라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>영업외손실 32.6조원<\/b> 외환순손실 11.63조원(환율 하락) + 투자자산 평가손실 22.92조원(서울경제). 어떤 자산의 평가손실인지는 보도되지 않았습니다.<\/p>\n    <p class=\"na\">HBM4와 HBM3E 가격 차이, HBM의 D램 매출 비중, 구체적 설비투자 금액은 보도에서 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>직전 종가 (10/27)<\/span><span class=\"v\">약 1,341,000원 (기사 등락폭으로 역산)<\/span><\/div>\n    <div class=\"row\"><span>넥스트레이드 프리마켓 (10/28 08:01, 발표 전)<\/span><span class=\"v ok\">1,390,000원 (+3.65%) · 한때 +4%대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 정규장 초반 (10/28 09:07)<\/span><span class=\"v ok\">1,365,000원 (+1.79%) — 프리마켓 +3.65%보다 상승폭 축소<\/span><\/div>\n    <div class=\"row\"><span>코스피 개장<\/span><span class=\"v\">5,763.85 (+2.23%)<\/span><\/div>\n    <div class=\"row\"><span>장중 (09:33 기사)<\/span><span class=\"v ok\">약 1,394,000원 (+3.95%) · 코스피 +3.5%대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 장중 (10:08 기사)<\/span><span class=\"v ok\"><mark>143.2만원 (+6.79%)<\/mark> · 시가총액 1,000조원 돌파 · 코스피 5,927.53(+5.13%) 매수 사이드카<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">15:30 마감 뒤 확인<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 장 마감 뒤 업데이트 예정<\/span><\/h4><p>첫 거래일 종가와 컨퍼런스콜 발언이 나오면 시장이 결국 무엇을 반겼는지(문제 삼았는지) 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 칩 옆 메모리 물량은 더 늘고 있습니다 — HBM4 본격 출하, 2028년까지 절반 넘게 예약<\/p><p>영업이익률 80%는 메모리가 지금 AI 칩 공급의 병목이고 가격 결정권이 공급사에 있다는 신호입니다. 14개 고객 장기계약은 빅테크 설비투자가 2027~28년까지 이어진다는 '계약' 단위의 증거입니다.<\/p><p>신호는 HBM4 전환·장기계약·내년 투자 규모, 소음은 첫날 주가 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 09:00 콜의 HBM 가격·물량 발언, 삼성전자 확정 실적의 HBM4 숫자, 마이크론 다음 실적.<\/p><\/section>\n  <p class=\"src\">출처: SK하이닉스 공정공시(연결 영업 잠정실적, 2026.10.28) · <a href=\"https://www.newspim.com/news/view/20261028000155\">뉴스핌 · 회사 발표 신규 수주를 올렸고, 사상 최대 수주잔고로 2027 회계연도에 들어섰다\"<cite>찰스 리앙 · 최고경영자 · 8월 FY26 4분기 실적 발표<\/cite><\/blockquote>\n    <p class=\"m\">→ 이번 잠정치는 이 수주잔고가 매출로 바뀌기 시작했다는 첫 신호입니다. 이번 보도자료엔 경영진 발언이 실리지 않았습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><mark>매출 가이던스를 약 25% 상회<\/mark><small>잠정 185~195억$ vs 이전 가이던스 145~155억$ · 시장 예상 152.3억$<\/small><\/span><\/li>\n      <li><span>총마진도 가이던스 위<small>12.0~12.5% vs 이전 가이던스 10.4~10.8% · 시장 예상 10.15% — \"고객·제품 구성 덕분\"<\/small><\/span><\/li>\n      <li><span>눌려 있던 주가<small>발표 전 7거래일 연속 하락, 상대강도지수(RSI) 30 부근 '과매도'<\/small><\/span><\/li>\n      <li><span>새 최고재무책임자(CFO) 선임 직후<small>10/14 웨스턴디지털 전 CFO 마크 롱 선임 — 재무 관리 우려 완화 기대<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>그래도 남은 걱정<\/h4><ul>\n      <li><span><mark>감사 전 숫자 · 주당순이익 미공개<\/mark><small>회사도 \"실제 결과는 크게 다를 수 있다\"고 명시 — 11/3 본실적에서 확인 필요<\/small><\/span><\/li>\n      <li><span>마진은 직전 분기보다 낮음<small>FY26 4분기 17.5% → 이번 12.0~12.5% · 대형 GPU 물량일수록 마진이 얇음<\/small><\/span><\/li>\n      <li><span>현금 소진<small>FY26 영업현금흐름 −68.1억$(재고 쌓기) · 씨티 '중립' — 마진 지속성·운전자본 부담 지적<\/small><\/span><\/li>\n      <li><span>지배구조·수출통제 꼬리표<small>10/8 협력업체 관계자, 25억$ 규모 AI 서버 중국 밀반출 사건 유죄 인정(회사는 피고 아님)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"잠정치 범위의 중간값 기준입니다. 매출은 예상보다 약 25% 많았습니다.\", \"items\": [{\"k\": \"매출(잠정 중간값)\", \"a\": 190.0, \"e\": 152.3, \"u\": \"억$\"}, {\"k\": \"총마진(잠정 중간값)\", \"a\": 12.25, \"e\": 10.15, \"u\": \"%\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"26.3Q는 잠정치 범위(185~195억$) 중간값입니다. 회계연도 기준 FY26 1분기 → FY27 1분기\", \"items\": [{\"q\": \"25.3Q\", \"v\": 50.2}, {\"q\": \"25.4Q\", \"v\": 126.8}, {\"q\": \"26.1Q\", \"v\": 102.0}, {\"q\": \"26.2Q\", \"v\": 111.0}, {\"q\": \"26.3Q 잠정\", \"v\": 190.0, \"hi\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적 · 잠정치<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">185~195억$ (152.3억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　이전 회사 가이던스<\/span><span class=\"v\">145~155억$ → 중간값 기준 +26.7%<\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">약 3.8배 (전년 50.2억$) / 약 +71% (전분기 111억$)<\/span><\/div>\n    <div class=\"row\"><span>총마진<\/span><span class=\"v\">12.0~12.5% (10.15%) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　이전 회사 가이던스<\/span><span class=\"v\">10.4~10.8%<\/span><\/div>\n    <div class=\"row\"><span>　직전 분기(FY26 4분기)<\/span><span class=\"v\">17.5% (조정 17.6%)<\/span><\/div>\n    <div class=\"row\"><span>주당순이익<\/span><span class=\"na\">잠정치에 포함 안 됨 · 11/3 공개<\/span><\/div>\n    <div class=\"row\"><span>　기존 가이던스<\/span><span class=\"v\">회계기준 0.89~0.98$ / 조정 1.01~1.10$ (갱신 안 함)<\/span><\/div>\n    <div class=\"row\"><span>상향 이유 (회사 설명)<\/span><span>매출: AI 플랫폼 수요 증가 · 마진: 고객·제품 구성<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 기타<\/h4>\n    <div class=\"row\"><span>FY27 연간 매출 가이던스<\/span><span class=\"v\">650~720억$ (8월 제시, 이번엔 언급 없음)<\/span><\/div>\n    <div class=\"row\"><span>　참고: 8월 당시 시장 예상<\/span><span class=\"v\">약 544억$ (니덤 집계)<\/span><\/div>\n    <div class=\"row\"><span>본실적 · 어닝콜<\/span><span class=\"v\">11/3(화) 미국 동부 17:00 · 한국시간 11/4 07:00<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 최고재무책임자 교체<\/span><span><mark>10/14 이사회 결의, 마크 롱 선임(즉시 효력)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　마크 롱은 누구<\/span><span>웨스턴디지털 전 CFO(~2019) · 투자사 프라임임팩트캐피털 공동창업<\/span><\/div>\n    <div class=\"row\"><span>　전임 데이비드 웨이건드<\/span><span>2021년부터 CFO · 인수인계 후 사업 개선·속도 높이는 역할로 이동<\/span><\/div>\n    <div class=\"row\"><span>　배경<\/span><span>2024년 12월 회계 관행 외부 점검 이후부터 새 CFO 물색<\/span><\/div>\n    <div class=\"row\"><span>증권 집단소송<\/span><span>10/16 법원 기각(원고 수정 제소 허용)<\/span><\/div>\n    <div class=\"row\"><span>수출통제 사건<\/span><span>10/8 협력업체 관계자 유죄 인정 · 공동창업자 등 2명은 재판 중 · 회사는 \"사업에 영향 없다\"<\/span><\/div>\n    <div class=\"row\"><span>증권사<\/span><span>로젠블랫 목표가 51→57$ · 씨티 '중립' 유지 · 커버 20곳 중 15곳 '보유' 이하<\/span><\/div>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/20 종가)<\/span><span class=\"v\">32.47$ (+1.2%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">최고 37.5$대 (+15~17%)<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/21 종가)<\/span><span class=\"v ok\">35.57$ (+9.5%)<\/span><\/div>\n    <div class=\"row\"><span>10/22 종가<\/span><span class=\"v no\">33.72$ (−5.2%)<\/span><\/div>\n    <div class=\"row\"><span>10/23 종가<\/span><span class=\"v no\">32.94$ (−2.3%)<\/span><\/div>\n    <div class=\"row\"><span>10/26 종가<\/span><span class=\"v no\">32.69$ (−0.8%)<\/span><\/div>\n    <div class=\"row\"><span>공매도 잔고<\/span><span class=\"v\">약 9,736만 주 · 유통주식의 15.2%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"na\">확인 못 함<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"발표 다음 날 +9.5% 뒤 사흘 연속 밀려 발표 전 가격으로 복귀\", \"items\": [{\"d\": \"10/15\", \"v\": 35.09}, {\"d\": \"10/16\", \"v\": 31.63}, {\"d\": \"10/19\", \"v\": 32.1}, {\"d\": \"10/20\", \"v\": 32.47}, {\"d\": \"10/21\", \"v\": 35.57}, {\"d\": \"10/22\", \"v\": 33.72}, {\"d\": \"10/23\", \"v\": 32.94}, {\"d\": \"10/26\", \"v\": 32.69}], \"mark\": \"10/20\", \"markLabel\": \"잠정치 발표(장후)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>환호는 하루였습니다.<\/b> 10/21 +9.5%로 35.57$까지 올랐지만, 10/22 나스닥이 'AI 비용 걱정'으로 2% 넘게 빠진 날 −5.2%, 이어 이틀 더 밀려 10/26 종가 32.69$ — <mark>발표 전 가격(32.47$)으로 거의 되돌아왔습니다<\/mark>. 시장은 '매출이 늘었다'는 사실보다 '감사 전 숫자이고, 이익과 현금은 아직 모른다'는 점을 더 무겁게 본 셈입니다. 10/27 종가는 <span class=\"na\">확인 못 함<\/span>.<\/p><p>다음 확인: 11/3 본실적에서 ① 매출이 185억$ 이상·총마진 12% 이상으로 확정되는지 ② 주당순이익과 영업현금흐름 ③ 연간 가이던스(650~720억$)를 올리는지. 새 CFO의 첫 어닝콜이기도 합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 발표가 우리에게 말해 주는 것<\/h4>\n    <p>서버 층에서 나온 숫자는 분명합니다. 7~9월에 AI 서버가 회사 예상보다 약 40억$ 더 출하됐고, 이유는 'AI 플랫폼 수요'였습니다. 엔비디아 칩이 실제 서버로 조립돼 데이터센터로 <mark>잘 빠지고 있다<\/mark>는 신호입니다. 다만 슈퍼마이크로는 마진이 얇고 현금을 많이 쓰는 회사라, 주가가 하루 만에 원위치한 건 '수요'보다 '회사 고유의 숙제(이익·현금·지배구조)'에 대한 의심입니다. 수요 판정은 긍정, 회사 판정은 11/3 본실적 뒤로 미룹니다.<\/p>\n  <\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0001375365/000137536526000025/smcifirstquarterfy2027busi.htm\">회사 공식 · 잠정 실적 보도자료(SEC 8-K)<\/a> · <a href=\"https://ir.supermicro.com/news/news-details/2026/Supermicro-Provides-First-Quarter-of-Fiscal-Year-2027-Preliminary-Business-Update/default.aspx\">슈퍼마이크로 투자자 정보<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0001375365/000137536526000024/smci-20261014.htm\">CFO 선임 공시(SEC 8-K)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0001375365/000137536526000021/exhibit991_20260630.htm\">FY26 4분기 실적 보도자료<\/a> · <a href=\"https://247wallst.com/investing/2026/10/21/super-micro-says-ai-demand-is-so-strong-it-blew-past-its-own-forecast-by-25/\">247월스트 · 컨센서스(LSEG·로이터)<\/a> · <a href=\"https://www.tradingnews.com/news/super-micro-35-usd-rips-on-a-4b-usd-revenue-beat-path-to-44-usd-runs-through-meta-and-november-3\">트레이딩뉴스 · 시간외·과거 분기<\/a> · <a href=\"https://finviz.com/news/405544/super-micro-lifts-2027-revenue-guidance-calms-ai-trade-fears\">쉐퍼스(핀비즈) · 목표가·공매도<\/a> · <a href=\"https://www.ksl.com/article/51636757/super-micro-names-former-western-digital-executive-mark-long-as-new-cfo\">로이터(KSL) · CFO 교체 배경<\/a> · <a href=\"https://www.techi.com/quote/SMCI/historical/\">일별 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T19:30+09:00"}, {"id": "stx-26q3", "date": "2026-10-27", "ts": "2026-10-27T16:05", "name": "시게이트 STX", "run": "10.27(화) 뉴욕 장 마감 후 · 한국시간 10.28(수) 05:00", "html": "<article id=\"stx-26q3\" data-date=\"2026-10-27\" data-ts=\"2026-10-27T16:05\" data-layer=\"칩·메모리\" data-name=\"시게이트 STX\" data-sum=\"AI 관점 호재(사상 최대 매출·이익) · 매출✅ EPS✅ 가이던스✅ · 시간외 −5.9% · 어닝콜: 공급 2028년까지 장기계약 배정\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 회계 2027년 1분기(7~9월) · 물량확인용 · 어닝콜 반영(한국시간 07:40)<\/div>\n  <h3>시게이트(STX)<\/h3>\n  <p class=\"what\">데이터센터에 들어가는 대용량 하드디스크를 만드는 회사입니다. AI가 만든 데이터를 싸게 오래 저장하는 창고 역할이라, 클라우드 업체가 저장장치를 실제로 얼마나 사는지 보여 줍니다. 밸류체인 칩·메모리 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 42.33억$(예상 41.3~41.4억$)·조정 EPS 7.68$(예상 7.39~7.42$) <b>모두 회사 가이던스 상단 위<\/b>입니다. 다음 분기 가이던스도 매출 48억$±1억$·EPS 9.20$±0.20$로 컨센(45.3억$·8.54~8.58$)을 크게 넘었습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출 <b>전년 +61%·전분기 +17%<\/b>, 매출총이익률 <b>57.8%<\/b>(전년 40.1%)로 사상 최대 수익성입니다. 경영진은 \"수요 환경이 강해지고 있다\", \"장기 고객 수요 가시성\"을 말했습니다. 어닝콜에서 <b>데이터센터 매출 34억$(전년 +63%·전체의 81%)<\/b>, 데이터센터 출하 <b>198엑사바이트(사상 최대·전년 +24%)<\/b>가 확인됐습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>숫자는 상회·상향인데 시간외 초반 <mark>−7%<\/mark>입니다. 발표 당일 정규장에서 약 +4.7% 올라 기대가 이미 높았고, 한 달 동안 약 −25% 빠지며 <mark>공급 과잉 우려<\/mark>가 쟁점이었습니다. 어닝콜에서 <mark>\"공급은 2028년까지 장기계약으로 배정\"<\/mark>, 가격 상승이 빨라지고 있다는 발언이 나왔지만 시간외 낙폭은 −5.9%(628.38$) 수준입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"데이터 생성·보관·재사용이 저장 수요를 계속 키우고, 장기 고객 수요 가시성이 다년간 성장 국면이라는 우리 판단을 뒷받침합니다\"<\/mark><cite>데이브 모슬리 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 데이터가 늘수록 하드디스크 수요도 몇 년 이어진다는 뜻입니다.<\/p>\n    <blockquote>\"HAMR 기술 로드맵으로 공급 규율을 지키면서 늘어나는 엑사바이트 수요에 대응합니다\"<cite>데이브 모슬리 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 공장을 늘리기보다 디스크 한 장에 더 많이 담아 공급 과잉을 피하겠다는 말입니다.<\/p>\n    <blockquote><mark>\"대용량 엑사바이트 공급은 이미 2028년까지 장기 공급계약으로 배정돼 있습니다\"<\/mark><cite>데이브 모슬리 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 앞으로 2년 넘게 팔 물량이 이미 주인이 정해졌다는 뜻 — 공급 과잉 우려에 대한 회사의 답입니다.<\/p>\n    <blockquote>\"계획보다 더 만드는 물량까지 전부 주인이 정해지고 있습니다\"<cite>데이브 모슬리 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 공급보다 크다는 말. 재무책임자는 \"수요와 공급 격차가 오히려 커지고 있다\"고 덧붙였습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>공급 과잉 우려<\/mark><small>최근 한 달 주가 약 −25%<\/small><\/span><\/li>\n      <li><span>발표 전 기대 선반영<small>발표 당일 정규장 약 +4.7%<\/small><\/span><\/li>\n      <li><span>경쟁사 증설 질문엔 답 피함<small>\"경쟁사 계획은 추측하지 않겠다\"<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>가이던스 대폭 상회<\/mark><small>매출 48억$(컨센 45.3억$) · EPS 9.20$(컨센 8.58$)<\/small><\/span><\/li>\n      <li><span>사상 최대 수익성<small>조정 매출총이익률 57.8% · 영업이익률 50.7%<\/small><\/span><\/li>\n      <li><span>사상 최대 잉여현금흐름<small>14.79억$ · 배당 +3% · 자사주 4억$<\/small><\/span><\/li>\n      <li><span><mark>2028년까지 공급 계약 배정<\/mark><small>일부 클라우드 계약은 2030년까지 · 엑사바이트 성장 목표 연 25%<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"예상은 팁랭크스·247월스트리트 기준\", \"items\": [{\"k\": \"매출\", \"a\": 42.33, \"e\": 41.4, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 7.68, \"e\": 7.41, \"u\": \"$\"}, {\"k\": \"다음 분기 매출 가이던스\", \"a\": 48, \"e\": 45.3, \"u\": \"억$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"회계 26년 2·3분기는 이번 정리에서 빠짐 · 점선 = 다음 분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 26.29}, {\"q\": \"26.2Q\", \"v\": 36.29}, {\"q\": \"26.3Q\", \"v\": 42.33, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 48, \"g\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">42.33억$ (41.3~41.4억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 / 전분기 대비<\/span><span class=\"v\">+61.0% / +16.6%<\/span><\/div>\n    <div class=\"row\"><span>　회사 가이던스<\/span><span class=\"v\">41억$±1억$ (상단 위)<\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">7.68$ (7.39~7.42$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">7.59$ (전년 2.43$)<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률 회계 / 조정<\/span><span class=\"v\">57.3% / 57.8% (전분기 52.7%)<\/span><\/div>\n    <div class=\"row\"><span>영업이익 조정<\/span><span class=\"v\">21.47억$ · 50.7%<\/span><\/div>\n    <div class=\"row\"><span>순이익 회계 / 조정<\/span><span class=\"v\">17.61억$ / 17.81억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>매출 구성 · 물량 지표<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 데이터센터 매출<\/span><span class=\"v\"><mark>34억$ · 전체 81%<\/mark> · 전년 +63% · 전분기 +18%<\/span><\/div>\n    <div class=\"row\"><span>엣지·사물인터넷 매출<\/span><span class=\"v\">7.84억$ · 19% · 전년 +52% · 전분기 +13%<\/span><\/div>\n    <div class=\"row\"><span>전체 출하 용량<\/span><span class=\"v\">220엑사바이트 · 전년 +21%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 데이터센터 출하<\/span><span class=\"v\">198엑사바이트 사상 최대 · 전년 +24% · 출하 용량의 90%<\/span><\/div>\n    <div class=\"row\"><span>HAMR(모자이크) 목표<\/span><span class=\"v\">2026년 말 대용량 출하의 약 50%<\/span><\/div>\n    <div class=\"row\"><span>모자이크 4 / 5<\/span><span class=\"v\">최대 44TB, 대형 클라우드 2곳 양산 중 / 50TB 이상, 2027년 말 고객 인증용 출하<\/span><\/div>\n    <p class=\"na\">출처: 어닝콜(인베스팅닷컴 녹취). 테라바이트당 가격은 공개하지 않았습니다.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">16.90억$<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">2.11억$<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v ok\">14.79억$ 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">12.58억$<\/span><\/div>\n    <div class=\"row\"><span>차입금<\/span><span class=\"v\">24억$ → 분기 후 7.5억$ 추가 상환해 16억$<\/span><\/div>\n    <div class=\"row\"><span>자사주 / 배당<\/span><span class=\"v\">4.00억$ / 1.68억$<\/span><\/div>\n    <div class=\"row\"><span>분기 배당<\/span><span class=\"v ok\">주당 0.76$로 약 +3% 인상<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 회계 2027년 2분기(10~12월)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 매출<\/span><span class=\"v\"><mark>48억$±1억$<\/mark> (컨센 45.3억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 조정 EPS<\/span><span class=\"v\"><mark>9.20$±0.20$<\/mark> (컨센 8.54~8.58$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익률<\/span><span class=\"v\">50~55% (어닝콜) · 매출총이익률 추가 상승<\/span><\/div>\n    <div class=\"row\"><span>영업비용 / 세율 / 주식수<\/span><span class=\"v\">약 3억$ / 약 16% / 2.33억 주<\/span><\/div>\n    <div class=\"row\"><span>설비투자 (연간)<\/span><span class=\"v\">매출의 4~6% 유지 (이번 분기 5%)<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<\/h4>\n    <p class=\"q\"><b>데이브 모슬리(최고경영자)<\/b> \"9월 분기에 또 한 번 사상 최대 수익성과 사상 최대 잉여현금흐름을 냈고, 수요 환경이 강해지는 가운데 우리 사업의 이익 창출력을 보여 줬습니다.\"<\/p>\n    <p class=\"q\"><b>데이브 모슬리<\/b> \"가치 기반 가격 전략과 튼튼해진 재무구조로 장기적으로 이익 성장·현금 창출·주주환원 확대를 이어갈 수 있다고 봅니다.\"<\/p>\n    <p class=\"na\"><b>어닝콜 반영 · 한국시간 07:40<\/b><\/p>\n    <p class=\"q\"><b>데이브 모슬리(최고경영자)<\/b> \"수요 환경이 매우 강하고, 가시성은 2030년 이후까지 이어집니다.\" → 고객이 몇 년 치 물량을 미리 잡고 있다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>데이브 모슬리<\/b> \"주문형 제품의 구성·가격은 2027년까지 확정돼 있습니다.\" → 내년 가격이 이미 정해져 이익 가시성이 높습니다.<\/p>\n    <p class=\"q\"><b>데이브 모슬리<\/b> \"엑사바이트 성장 목표는 25%가 맞다고 봅니다.\" · \"그 기간 동안 공급은 꽤 빠듯할 것입니다.\" → 증설 대신 기술로 용량을 늘리는 공급 규율을 유지합니다.<\/p>\n    <p class=\"q\"><b>지안루카 로마노(최고재무책임자)<\/b> <mark>\"가격이 과거보다 조금 더 빠르게 오르고 있습니다\"<\/mark> · \"12월 분기 출하 용량이 의미 있게 늘어날 것\" → 가격·물량 둘 다 늘어나는 구간입니다.<\/p>\n    <p class=\"q\"><b>데이브 모슬리<\/b> \"경쟁사 계획은 추측하지 않겠습니다.\" → 시장이 걱정하는 경쟁사 증설에는 직접 답하지 않았습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 당일 정규장<\/span><span class=\"v ok\">약 +4.7% (뉴욕 15:36 기준 674.59$)<\/span><\/div>\n    <div class=\"row\"><span>최근 한 달<\/span>< -93CH-4976386\">인베스팅닷컴 · 프리뷰<\/a><\/p>\n<\/article>\n", "updated": "2026-10-27T18:40:00-04:00"}, {"id": "tel-26q3", "date": "2026-10-28", "ts": "2026-10-28T06:00", "name": "TE커넥티비티 TEL", "run": "10.28(수) 뉴욕 장전 · 한국시간 10.28(수) 20:00", "html": "<article id=\"tel-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T06:00\" data-layer=\"인터커넥트\" data-name=\"TE커넥티비티 TEL\" data-sum=\"AI 관점 호재(데이터 네트워크 +34%·수주 +29%) · 매출✅ EPS✅ 가이던스✅(1분기 EPS 3.30$ vs 예상 2.99$) · 프리마켓 +1.6%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026 회계연도 4분기(7~9월) · 어닝콜 대기(한국시간 10.28 21:30)<\/div>\n  <h3>TE커넥티비티(TEL)<\/h3>\n  <p class=\"what\">자동차·산업 장비·데이터센터에 들어가는 커넥터(연결 부품)와 센서를 만드는 회사입니다. AI 서버 랙 안팎을 잇는 고속 커넥터·케이블이 '디지털 데이터 네트워크' 사업에 잡힙니다. 밸류체인 인터커넥트 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 53.1억$(예상 52.7억$)·조정 EPS 3.14$(예상 3.07$)로 <b>둘 다 상회<\/b>했고, 7월에 낸 4분기 가이던스(52.5억$·3.05$)도 넘었습니다. 다음 분기 가이던스는 매출 53.5억$(예상 51.2억$)·EPS 3.30$(예상 2.99$)로 <b>컨센서스를 크게 웃돌았습니다<\/b>.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 데이터센터 연결 부품이 들어간 <b>디지털 데이터 네트워크 매출이 +34.2%(유기 +34.4%)<\/b>로 회사 전체(+12%)의 세 배 속도입니다. 수주 61억$(+29%)도 매출보다 훨씬 많아 앞으로 물량이 쌓이고 있습니다. 광학·전력 필터 쪽 인수에 16억$을 약정해 AI 연결 쪽으로 무게를 옮기는 중입니다. 자동차(+7%)는 비AI라 판정에 넣지 않았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>이번 분기 숫자보다 <mark>다음 분기 EPS 가이던스 3.30$ — 컨센 2.99$보다 약 10% 높게<\/mark> 낸 게 핵심입니다. 수주가 <mark>61억$, 전년 대비 +29%<\/mark>로 3분기 연속 매출을 크게 앞서, 내년(회계 2027) 두 자릿수 매출 성장 전망에 숫자 근거가 붙었습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"2026년의 강한 흐름이 2027 회계연도에도 이어질 것으로 봅니다\"<\/mark><cite>테렌스 커틴 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년도 매출이 두 자릿수로 늘고, 유기적 성장도 올해(+12%)와 비슷할 거라는 뜻입니다.<\/p>\n    <blockquote>\"데이터·전력 흐름이 빨라지면서 고객 수요가 늘고 있습니다\"<cite>테렌스 커틴 · 최고경영자 · 보도자료(기사 인용)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 데이터센터와 전력망 투자가 커넥터 수요를 끌어올린다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>1분기 EPS 가이던스 3.30$<\/mark><small>예상 2.99$ · +21% YoY · 매출 53.5억$ vs 예상 51.2억$<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 수주 61억$ +29%<small>전분기 대비 +6% · 연간 수주 222억$ +27%<\/small><\/span><\/li>\n      <li><span>디지털 데이터 네트워크 +34.2%<small>산업 부문 +19.8% 중 가장 빠름<\/small><\/span><\/li>\n      <li><span>마진 개선<small>조정 영업이익률 22.1% (전년 21.1%)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>매출 서프라이즈는 작음<small>53.1억$ vs 예상 52.7억$ (+0.8%)<\/small><\/span><\/li>\n      <li><span>AI 매출 금액 미공개<small>보도자료에 달러 금액 없음 · 어닝콜 확인<\/small><\/span><\/li>\n      <li><span>센서 −2.0%<small>운송 부문 안 · 자동차 +7.0%로 완만<\/small><\/span><\/li>\n      <li><span>관세 환급 조정<small>4분기 −0.87억$(고객 반환 예정분)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\":\"surprise\",\"title\":\"예상 대비 · 얼마나 넘었나\",\"cap\":\"컨센서스: 인베스팅닷컴 기사 기준\",\"items\":[{\"k\":\"매출\",\"a\":53.12,\"e\":52.7,\"u\":\"억$\"},{\"k\":\"조정 EPS\",\"a\":3.14,\"e\":3.07,\"u\":\"$\"},{\"k\":\"1분기 매출 가이던스\",\"a\":53.5,\"e\":51.2,\"u\":\"억$\"},{\"k\":\"1분기 EPS 가이던스\",\"a\":3.30,\"e\":2.99,\"u\":\"$\"}]}'><\/div>\n  <div class=\"vizrow\">\n  <div class=\"viz\" data-viz='{\"type\":\"trend\",\"title\":\"분기 매출 (억$)\",\"cap\":\"달력 분기 기준 · 점선은 다음 분기 가이던스\",\"items\":[{\"q\":\"25 Q3\",\"v\":47.5},{\"q\":\"25 Q4\",\"v\":46.7},{\"q\":\"26 Q1\",\"v\":47.4},{\"q\":\"26 Q2\",\"v\":51.6},{\"q\":\"26 Q3\",\"v\":53.1,\"hi\":1},{\"q\":\"26 Q4\",\"v\":53.5,\"g\":1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\":\"stack\",\"title\":\"부문별 매출 비중 (%)\",\"cap\":\"두 부문 합계 기준 · AI 연결 부품이 든 산업 부문 형광\",\"items\":[{\"k\":\"산업(데이터 네트워크 포함)\",\"v\":51.8,\"hl\":1},{\"k\":\"운송(자동차 등)\",\"v\":48.2}]}'><\/div>\n  <\/div>\n  <p class=\"na\">발표 앞뒤 주가 그래프는 첫 거래일 종가가
