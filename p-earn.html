n><\/div>\n    <div class=\"row\"><span>정규장 (10/26, 발표 전)<\/span><span class=\"v no\">246.65$ (−5.1%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+9~10% · 약 269$<\/span><\/div>\n    <div class=\"row\"><span>프리마켓 (10/27 뉴욕 아침)<\/span><span class=\"v ok\">+16~17% <b class=\"ckd\">✔<\/b><\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v ok\">276.54$ (+12.12%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">10/27 프리마켓 업데이트(뉴욕 08:35): 트레이딩키 +15.8%, 구루포커스 +17% — 밤사이 시간외보다 상승폭이 더 커졌습니다. 오늘 투자자의 날 발언이 다음 재료입니다.<\/p>\n    <p class=\"na\">📈 실시간 주가·시간외·차트는 <a href=\"https://finance.yahoo.com/quote/CLS\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">CLS ↗ 야후 파이낸스<\/a>에서 바로 보세요.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트 예정<\/span><\/h4><p>투자자의 날(10/27)에 나오는 중장기 목표와 첫 거래일 종가를 보고 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">빅테크가 2027년 장비 주문을 이미 크게 잡아 두고 있습니다<\/p><p>셀레스티카는 하이퍼스케일러가 주문한 서버·스위치를 실제로 조립해 넘기는 회사라, 이 회사의 내년 전망은 곧 빅테크의 내년 장비 구매 계획입니다. 그 전망이 매출 400억$, 올해의 두 배 가까이로 나왔습니다.<\/p><p>고객들이 2028년 수요 예측까지 \"의미 있게 더 높게\" 알려 주고 있다는 건, AI 인프라 투자가 올해로 끝나지 않고 최소 2~3년 이어질 계획이라는 가장 구체적인 확인입니다. 이번 주 빅테크 설비투자 발표의 눈높이도 함께 올라갔습니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 오늘 밤 투자자의 날의 고객별·제품별(1.6T 스위치·구글 TPU 서버) 설명, 10/29 알파벳 설비투자 계획.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://moneycheck.com/celestica-cls-stock-rallies-9-after-hours-on-record-5-83b-quarterly-revenue\">머니체크 · 시간외<\/a> · <a href=\"https://www.tipranks.com/news/celestica-stock-takes-off-after-hours-whats-driving-the-surge-and-what-wall-street-sees-next\">팁랭크스 · 시간외<\/a> · <a href=\"https://www.globenewswire.com/news-release/2026/10/26/3388573/0/en/celestica-announces-third-quarter-2026-financial-results-and-will-hold-2026-investor-and-analyst-day.html\">회사 보도자료(글로브뉴스와이어)<\/a> · <a href=\"https://www.stocktitan.net/news/CLS/celestica-announces-third-quarter-2026-financial-results-and-will-b19vo85byhx2.html\">스톡타이탄<\/a> · <a href=\"https://www.benzinga.com/analyst-stock-ratings/price-target/26/10/62583576/celestica-gears-up-for-q3-print-here-are-the-recent-forecast-changes-from-wall-streets-most-accurate-analysts\">벤징가 · 컨센서스<\/a><\/p>\n<\/article>", "updated": "2026-10-28T05:30:00+09:00"}, {"id": "delta-26q3", "date": "2026-10-29", "ts": "2026-10-29T16:00", "name": "델타일렉트로닉스 2308", "run": "10.29(목) 대만 실적 설명회 · 한국시간 10.29(목) 16:00", "html": "<article id=\"delta-26q3\" data-date=\"2026-10-29\" data-krun=\"2026-10-29\" data-ts=\"2026-10-29T16:00\" data-layer=\"전력·냉각\" data-name=\"델타일렉트로닉스 2308\" data-sum=\"AI 관점 중립(전력전자 +40%·재고 평가손) · 매출·영업이익 사상 최대 · 순이익 −6.5%(전분기) · 매출총이익률 34.1% · 종가 −4.5% · 어닝콜 반영\">\n  <div class=\"tag\"><b>실적결과<\/b> 대만 · 2026년 3분기(7~9월) · 물량확인용 · 어닝콜 반영<\/div>\n  <h3>델타일렉트로닉스(2308)<\/h3>\n  <p class=\"what\">대만의 전원공급장치·전력 변환 회사입니다. 엔비디아 GPU 랙에 들어가는 전원 장치와 데이터센터 전력·액체냉각 장비의 핵심 공급사라, 대만 월매출로 AI 서버 출하가 매달 바로 보입니다. 밸류체인 전력·냉각 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">보통<\/span>매출 <b>1,970.6억 대만달러<\/b>(전분기 +7.5%, 전년 +31.1%)와 영업이익 <b>326.2억 대만달러<\/b>(전년 +31.5%)는 사상 최대입니다. 하지만 매출총이익률이 <b>34.08%<\/b>(2분기 35.6%)로 내려가고 재고 평가손실이 생겨 순이익은 <b>235.0억 대만달러로 전분기 대비 −6.5%<\/b>, 주당순이익 9.04대만달러(2분기 9.68)에 그쳤습니다. 대만 언론은 시장 기대보다 낮았다고 평가했습니다(공식 컨센서스 숫자는 확인 못 함).<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">중립<\/span>AI 서버 전원이 들어 있는 <b>전력전자 부문 매출 1,059.3억 대만달러(전년 +40%)<\/b>, 데이터센터 전력·냉각이 들어 있는 <b>인프라 부문 658.8억(전년 +25%)<\/b>으로 수요는 강합니다. 다만 부품 부족기에 부품 입고가 어긋나며 쌓인 재고를 약 39억 대만달러 평가손실로 털었고, JP모건은 태국 자회사에 대해 \"일부 데이터센터 고객이 재고 관리를 위해 구매를 늦췄다\"고 봤습니다. 수요는 좋지만 마진·재고가 걸려 판정을 중립으로 둡니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 실망한 포인트<\/p><p>매출·영업이익은 신기록이었지만 시장은 <mark>매출총이익률이 35% 아래로<\/mark> 내려간 것과 <mark>재고 평가손실 약 39억 대만달러<\/mark>를 문제 삼았습니다. 주가는 <mark>−4.52%<\/mark>(1,480대만달러)로 마감했고 장중 −7.7%까지 밀렸습니다. 같은 날 대만 가권지수도 667포인트 떨어져 시장 전체 약세도 겹쳤습니다(자체 해석).<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"4분기 매출은 3분기보다 좋고, 매출총이익률도 3분기보다 나빠지지 않을 것\"<\/mark><cite>정핑(鄭平) · 회장 · 3분기 실적 설명회<\/cite><\/blockquote>\n    <p class=\"m\">→ 이번 분기 마진 하락이 일시적이라는 회사 설명입니다. 원가 상승분(재료비 +2%)은 고객과 가격 인상을 협상 중입니다.<\/p>\n    <blockquote>\"재고는 부품 부족 속에 입고가 어긋나 생긴 단기 현상으로, 4분기에 소화될 것\"<cite>정핑(鄭平) · 회장 · 실적 설명회(요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 꺾여서 쌓인 재고가 아니라는 주장 — 4분기 재고 숫자로 확인해야 합니다.<\/p>\n    <blockquote>\"주문 가시성은 높고, 지금은 하위 공정 생산능력을 확보하는 것이 관건\"<cite>정핑(鄭平) · 회장 · 실적 설명회(요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 물건이 안 팔리는 게 아니라 만들 능력이 모자란다는 뜻입니다. 이사회는 말레이시아 페낭 신규 생산기지를 승인했습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>매출총이익률 35% 아래로<\/mark><small>34.08%, 전분기 −1.56%p<\/small><\/span><\/li>\n      <li><span>재고 평가손실<small>약 39억 대만달러 · 태국 자회사 약 18억 바트<\/small><\/span><\/li>\n      <li><span>순이익 전분기 대비 감소<small>235.0억 대만달러 −6.5% · 영업외이익 44.3억 → 10.5억<\/small><\/span><\/li>\n      <li><span>일부 데이터센터 고객 구매 속도 조절<small>JP모건(태국 자회사) — 2027년 상반기까지 부담 예상<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>매출·영업이익 사상 최대<\/mark><small>매출 10분기 연속 최대 · 영업이익 326.2억, 전년 +31.5%<\/small><\/span><\/li>\n      <li><span>전력전자 +40%<small>1,059.3억 대만달러, 전분기 +10%<\/small><\/span><\/li>\n      <li><span>4분기 매출·마진 개선 예고<small>회장 발언 · 원가 인상분 가격 반영 협상<\/small><\/span><\/li>\n      <li><span>1~9월 주당순이익 26.64대만달러<small>이미 2025년 연간(23.14)을 넘음<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억 대만달러)\", \"cap\": \"25.3Q·26.1Q·26.2Q는 회사가 밝힌 증감률로 거꾸로 계산한 값입니다. 공식 컨센서스는 확인하지 못해 예상 대비 그림은 넣지 않았습니다.\", \"items\": [{\"q\": \"25.3Q\", \"v\": 1503}, {\"q\": \"25.4Q\", \"v\": 1616}, {\"q\": \"26.1Q\", \"v\": 1594}, {\"q\": \"26.2Q\", \"v\": 1833}, {\"q\": \"26.3Q\", \"v\": 1971, \"hi\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 주당순이익 추이 (대만달러)\", \"cap\": \"매출은 늘었지만 주당순이익은 2분기보다 낮아졌습니다 — 마진 하락·재고 평가손실\", \"items\": [{\"q\": \"25.3Q\", \"v\": 7.16}, {\"q\": \"25.4Q\", \"v\": 6.67}, {\"q\": \"26.1Q\", \"v\": 7.91}, {\"q\": \"26.2Q\", \"v\": 9.68}, {\"q\": \"26.3Q\", \"v\": 9.04, \"hi\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"부문별 매출 비중 (%)\", \"cap\": \"AI 서버 전원이 든 전력전자와 데이터센터 전력·냉각이 든 인프라가 87%\", \"items\": [{\"k\": \"전력전자\", \"v\": 54, \"hl\": 1}, {\"k\": \"인프라(데이터센터 등)\", \"v\": 33, \"hl\": 1}, {\"k\": \"자동화\", \"v\": 8}, {\"k\": \"모빌리티\", \"v\": 5}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"발표 앞뒤 주가 (대만달러)\", \"cap\": \"10/28 장 마감 뒤 실적 공시 → 10/29 −4.52%\", \"items\": [{\"d\": \"10/27\", \"v\": 1510}, {\"d\": \"10/28\", \"v\": 1550}, {\"d\": \"10/29\", \"v\": 1480}], \"mark\": \"10/29\", \"markLabel\": \"실적 반영\"}'><\/div>\n\n  <section><h4>핵심 실적 (연결)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 매출<\/span><span class=\"v\"><mark>1,970.6억 대만달러<\/mark> · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>　전분기 / 전년 대비<\/span><span class=\"v\">+7.53% / +31.09%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 매출총이익률<\/span><span class=\"v no\">34.08% (2분기 35.6% · 전년 대비 −0.79%p)<\/span><\/div>\n    <div class=\"row\"><span>영업이익<\/span><span class=\"v\">326.2억 · 이익률 16.55% · 전년 +31.5% · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>영업외이익<\/span><span class=\"v no\">10.5억 (2분기 44.3억)<\/span><\/div>\n    <div class=\"row\"><span>지배주주 순이익<\/span><span class=\"v\">235.0억 · 전분기 −6.53% · 전년 +26.28%<\/span><\/div>\n    <div class=\"row\"><span>주당순이익<\/span><span class=\"v\">9.04대만달러 (2분기 9.68 · 전년 7.16)<\/span><\/div>\n    <div class=\"row\"><span>EBITDA<\/span><span class=\"v\">437억 (매출의 22.2%)<\/span><\/div>\n    <div class=\"row\"><span>1~9월 누적<\/span><span class=\"v\">매출 5,396.7억(+37.2%) · 주당순이익 26.64<\/span><\/div>\n    <p class=\"na\">공식 컨센서스 숫자는 찾지 못했습니다. 대만 언론(SETN·TaiSounds)은 \"시장 기대보다 낮음\", \"매출 소폭 미달\"로 평가했습니다. 매출총이익률 하락폭은 매체에 따라 −1.52~−1.56%p.<\/p>\n  <\/section>\n\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 전력전자<\/span><span class=\"v\"><mark>1,059.3억 · 전년 +40% · 전분기 +10%<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　부문 이익<\/span><span class=\"v\">199.2억 (전년 +22% · 전분기 −1%)<\/span><\/div>\n    <div class=\"row\"><span>인프라(데이터센터 전력·냉각 등)<\/span><span class=\"v\">658.8억 · 전년 +25% · 전분기 +5%<\/span><\/div>\n    <div class=\"row\"><span>　부문 이익<\/span><span class=\"v ok\">120.7억 (전년 +40% · 전분기 +7%)<\/span><\/div>\n    <div class=\"row\"><span>자동화<\/span><span class=\"v\">159.0억 · 전년 +19% · 흑자 전환(7.7억)<\/span><\/div>\n    <div class=\"row\"><span>모빌리티<\/span><span class=\"v\">90.7억 · 전년 +7% · 손실 1.4억(전분기 대비 65% 축소)<\/span><\/div>\n    <p class=\"na\">3분기 AI·데이터센터 매출 비중은 자료에서 확인하지 못했습니다. 7/30 설명회에서 위보원(余博文) 최고재무책임자는 2026년 연간 AI 매출 비중 25% 이상을 제시했습니다.<\/p>\n  <\/section>\n\n  <section><h4>핵심 지표 · 물량 (월매출)<\/h4>\n    <div class=\"row\"><span>7월<\/span><span class=\"v\">670.7억 · 전년 +47.8%<\/span><\/div>\n    <div class=\"row\"><span>8월<\/span><span class=\"v\">645.9억 · 전년 +35.0%<\/span><\/div>\n    <div class=\"row\"><span>9월<\/span><span class=\"v\">654.0억 · 전년 +14.6%<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v no\">약 90일 · 평가손실 약 39억<\/span><\/div>\n    <p class=\"na\">전년 대비 증가율이 7월 +47.8% → 9월 +14.6%로 낮아졌습니다(전년 기저 영향 포함). 10월 월매출(11월 초 발표)로 4분기 흐름을 확인합니다.<\/p>\n  <\/section>\n\n  <section><h4>전망 · 4분기<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기<\/span><span class=\"v\"><mark>매출 3분기보다 증가 · 매출총이익률 3분기보다 나빠지지 않음<\/mark><\/span><\/div>\n    <div class=\"row\"><span>원가<\/span><span class=\"v\">재료비 +2% → 고객과 가격 인상 협상<\/span><\/div>\n    <div class=\"row\"><span>증설<\/span><span class=\"v\">말레이시아 페낭 신규 생산기지 이사회 승인<\/span><\/div>\n    <div class=\"row\"><span>2027년<\/span><span class=\"v\">4대 클라우드 설비투자 유지 · 연료전지(SOFC) 양산 예정<\/span><\/div>\n    <p class=\"na\">대만 회사라 숫자 가이던스는 없습니다. 800V 직류 전원·액체냉각 관련 새 숫자는 이번 설명회 보도에서 확인하지 못했습니다(7/30: 800V 제품 3분기 양산·4분기 출하, 2027년 본격 확대).<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 17:30<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>4분기<\/b> 정핑(鄭平) 회장: <mark>\"4분기 매출은 3분기보다 좋고, 매출총이익률도 3분기보다 나빠지지 않을 것\"<\/mark> → 마진 하락이 이번 분기에 그친다는 판단입니다.<\/p>\n    <p class=\"q\"><b>재고<\/b> 정핑 회장: 부품 부족 속에 입고 시점이 어긋나 쌓인 단기 재고이며 4분기에 소화. → 수요 둔화가 아니라는 설명입니다.<\/p>\n    <p class=\"q\"><b>수요·생산능력<\/b> 정핑 회장: 주문 가시성은 높고, 지금은 하위 공정 생산능력 확보가 필요. → 공급이 병목입니다.<\/p>\n    <p class=\"q\"><b>데이터센터<\/b> 4대 클라우드 회사의 설비투자는 계속되고 2027년 데이터센터 투자는 \"1.2조\" 이상(통화 단위 미표기)으로 봤습니다. 전기·원자재·숙련 인력 부족이 AI 성장의 걸림돌이라고 짚었습니다(발언자 미표기, TaiSounds).<\/p>\n    <p class=\"na\">설명회는 대만 15:00(한국 16:00) 시작으로 보도됐고, 질의응답 전문은 아직 나오지 않았습니다. 엔비디아 800V 전원·액체냉각 숫자 발언은 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>10/28 종가 (실적 공시 전)<\/span><span class=\"v ok\">1,550 (+2.65%)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 10/29 종가<\/span><span class=\"v no\"><mark>1,480 (−4.52%)<\/mark> · 장중 저가 1,430(−7.7%)<\/span><\/div>\n    <div class=\"row\"><span>같은 날 대만 가권지수<\/span><span class=\"v no\">−667포인트 (46,368)<\/span><\/div>\n    <div class=\"row\"><span>고점 대비<\/span><span class=\"v no\">5월 고점 2,585 대비 −40% 이상<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/30 업데이트 예정<\/span><\/h4><p>질의응답 전문과 증권사 목표가 변경, 10/30 라이트온 설명회(AI 서버 전원 2번 주자)를 보고 시장이 결국 무엇을 문제 삼았는지 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 전원 수요는 매출로 계속 들어오지만, 부품 부족이 마진과 재고를 흔들고 있습니다<\/p><p>전력전자 +40%, 인프라 +25%로 빅테크 설비투자는 실제 전원 장비 출하로 내려오고 있습니다. 다만 부품이 제때 안 들어와 재고가 꼬이고 원가가 올랐습니다. 공급망 병목이 칩에서 전원·부품으로 번지고 있다는 신호입니다.<\/p><p>신호는 부문 매출 성장과 4분기 마진 회복 발언, 소음은 하루 주가 낙폭입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10월 월매출(11월 초), 4분기 재고 감소 여부, 라이트온(10/30 15:00) AI 전원 매출.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://filecenter.deltaww.com/ir/download/calendar/3Q26_Analyst%20Meeting.pdf\">회사 IR(공식) · 3분기 설명회 자료<\/a> · <a href=\"https://www.deltaww.com/zh-TW/investors/analyst-meeting\">회사 IR · 설명회<\/a> · <a href=\"https://www.cna.com.tw/news/afe/202610280291.aspx\">중앙통신(CNA)<\/a> · <a href=\"https://news.cnyes.com/news/id/6640264\">鉅亨<\/a> · <a href=\"https://www.ctee.com.tw/news/20261029700635-430201\">工商時報<\/a> · <a href=\"https://www.taisounds.com/news/content/80/296639\">TaiSounds · 설명회<\/a> · <a href=\"https://inews.setn.com/news/1930254\">SETN · 재고·태국 자회사<\/a> · <a href=\"https://www.ftnn.com.tw/news/591200\">FTNN · 10/29 종가<\/a> · <a href=\"https://finance.technews.tw/2026/10/12/delta-2308-202609-financial-report/\">TechNews · 9월 매출<\/a> · <a href=\"https://money.udn.com/money/story/5612/9660982\">經濟日報 · 7/30 설명회<\/a><\/p>\n<\/article>", "updated": "2026-10-29T17:35+09:00"}, {"id": "dlr-26q3", "date": "2026-10-29", "ts": "2026-10-29T16:17", "name": "디지털리얼티 DLR", "run": "10.29(목) 뉴욕 장 마감 후 · 한국시간 10.30(금) 05:00", "html": "<article id=\"dlr-26q3\" data-date=\"2026-10-29\" data-ts=\"2026-10-29T16:17\" data-layer=\"리츠\" data-name=\"디지털리얼티 DLR\" data-sum=\"AI 관점 호재(사상 최대 신규계약 8.55억$·수주잔고 25억$) · 핵심FFO✅(2.10$ vs 1.97$) · 매출 +21% · 2026 핵심FFO 전망 상향 · 시간외 +0.5%(뉴욕 16:11)\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 대기(한국시간 10.30 06:00)<\/div>\n  <h3>디지털리얼티(DLR)<\/h3>\n  <p class=\"what\">전 세계에 데이터센터 건물을 짓고 전력·공간을 빌려주는 데이터센터 리츠(부동산 투자회사)입니다. 빅테크·클라우드·AI 회사가 서버를 넣을 자리를 임대합니다. 밸류체인 리츠 층(추적용).<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 19억$(+21%), 주당 핵심FFO(리츠의 EPS 격) <b>2.10$<\/b>(전년 1.89$)입니다. 2026년 핵심FFO 전망을 8.15~8.20$에서 <b>8.30~8.35$로 올렸습니다<\/b>. 주당 핵심FFO는 잭스 컨센서스 1.97$도 <b>상회<\/b>했습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>신규 임대계약(부킹)이 100% 지분 기준 <b>8.55억$로 사상 최대<\/b>, 아직 매출로 잡히지 않은 수주잔고도 <b>25억$로 사상 최대<\/b>입니다. 데이터센터 자리를 미리 잡으려는 수요가 계속 늘고 있다는 뜻입니다(AI 비중은 어닝콜 확인 필요).<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장 반응 · 볼 포인트<\/p><p>시간외는 <mark>+0.5%(183.91$, 뉴욕 16:11)<\/mark>로 차분합니다. <mark>연간 전망 상향과 사상 최대 계약<\/mark>이 핵심이고, 리츠라 주가 움직임은 원래 작은 편입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>사상 최대 신규계약 8.55억$ · 수주잔고 25억$<\/mark><cite>디지털리얼티 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 빅테크·AI 회사가 1~2년 뒤 쓸 데이터센터 자리를 지금 계약하고 있다는 뜻입니다. 경영진 발언은 어닝콜 뒤 보강합니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> 사상 최대 신규계약<small>8.55억$ (자기 지분 6.27억$)<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 연간 전망 상향<small>핵심FFO 8.30~8.35$ (종전 8.15~8.20$)<\/small><\/span><\/li>\n      <li><span>수주잔고 최대<small>25억$ (자기 지분 18억$)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>부담 요인<\/h4><ul>\n      <li><span>전분기 대비 FFO 소폭 감소<small>2.10$ (2분기 2.13$)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"전년 대비 · 얼마나 늘었나\", \"cap\": \"핵심FFO 컨센서스 확인 중이라 전년 값과 비교\", \"items\": [{\"k\": \"주당 핵심FFO\", \"a\": 2.10, \"e\": 1.89, \"u\": \"$\"}, {\"k\": \"2026 핵심FFO 전망 중간\", \"a\": 8.325, \"e\": 8.175, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"주당 핵심FFO ($)\", \"cap\": \"회사 발표 기준\", \"items\": [{\"q\": \"25 Q3\", \"v\": 1.89}, {\"q\": \"26 Q2\", \"v\": 2.13}, {\"q\": \"26 Q3\", \"v\": 2.10, \"hi\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"발표 앞뒤 주가 ($)\", \"cap\": \"시간외는 뉴욕 16:11 기준\", \"items\": [{\"d\": \"10.29 종가\", \"v\": 182.91}, {\"d\": \"시간외\", \"v\": 183.91}], \"mark\": \"10.29 종가\", \"markLabel\": \"발표\"}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">19억$ · +21%<\/span><\/div>\n    <div class=\"row\"><span>주당 핵심FFO <span class=\"call\">보강<\/span><\/span><span class=\"v\">2.10$ (잭스 1.97$) <span class=\"ok\">✅<\/span> · 전년 1.89$ · 2분기 2.13$<\/span><\/div>\n    <div class=\"row\"><span>주당 순이익 / FFO<\/span><span class=\"v\">0.48$ / 1.97$<\/span><\/div>\n    <div class=\"row\"><span>조정 EBITDA<\/span><span class=\"v\">9.78억$ · +13%<\/span><\/div>\n    <div class=\"row\"><span>재계약 임대료 상승<\/span><span class=\"v\">현금 +11.8% · 회계 +17.0% (2.61억$ 재계약)<\/span><\/div>\n    <div class=\"row\"><span>신규계약 세부(자기 지분)<\/span><span class=\"v\">184.8MW · 평균 kW당 272$ · 1MW 초과 대형 4.74억$ · 아시아태평양 2.83억$·미주 2.43억$<\/span><\/div>\n    <div class=\"row\"><span>토지 매입<\/span><span class=\"v\">7.42억$ · 인디애나폴리스 1GW 이상·샬럿 최대 600MW·시카고 360MW<\/span><\/div>\n    <p class=\"na\">잭스 매출 예상(17.4억$)은 수수료 수입 집계 기준이 다를 수 있어 비교에서 뺐습니다.<\/p>\n  <\/section>\n  <section><h4>핵심 지표<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 신규계약(부킹)<\/span><span class=\"v ok\"><mark>8.55억$<\/mark> 사상 최대 (자기 지분 6.27억$)<\/span><\/div>\n    <div class=\"row\"><span>수주잔고<\/span><span class=\"v\">25억$ 사상 최대 (자기 지분 18억$)<\/span><\/div>\n  <\/section>\n  <section><h4>가이던스 (2026년)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 주당 핵심FFO<\/span><span class=\"v ok\">8.30~8.35$ (종전 8.15~8.20$) 상향<\/span><\/div>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">70.50~71.25억$<\/span><\/div>\n  <\/section>\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 대기 · 한국시간 10.30 06:00<\/span><\/h4>\n    <p class=\"na\">어닝콜에서 볼 것: 신규계약 중 AI 비중, 전력 확보 일정, 임대료 상승률.<\/p>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>10.29 종가<\/span><span class=\"v\">182.91$<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+0.5% (183.91$, 뉴욕 16:11)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/DLR\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">DLR ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터 '자리' 수요는 사상 최대<\/p><p>사상 최대 계약과 수주잔고는 빅테크 설비투자가 건물·전력 임대 수요로도 이어진다는 확인입니다. 신호는 계약·수주잔고, 소음은 시간외 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 어닝콜의 AI 고객 비중, 첫 거래일 종가.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/1297996/000110465926120212/dlr-ex99d1.htm\">회사 IR(공식) · SEC 8-K 보도자료<\/a> · 야후 파이낸스 · 시간외 주가<\/p>\n<\/article>\n", "updated": "2026-10-29T20:26:32Z"}, {"id": "eqix-26q3", "date": "2026-10-28", "ts": "2026-10-28T16:05", "name": "에퀴닉스 EQIX", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"eqix-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T16:05\" data-layer=\"리츠\" data-name=\"에퀴닉스 EQIX\" data-sum=\"AI 관점 중립(예약 사상 최대 +35%, AI 전용 숫자 미공개) · 매출✅ 주당 AFFO✅(일회성 수수료 포함) · 연간 가이던스 상향 · 어닝콜 반영(신규 계약 가격 +12%·4분기 예약 목표 60% 확보) · 시간외 +1.6~2.2%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기(7~9월) · 어닝콜 반영(한국시간 10.29 08:10)<\/div>\n  <h3>에퀴닉스(EQIX)<\/h3>\n  <p class=\"what\">전 세계 데이터센터 공간·전력·회선 연결을 빌려주는 데이터센터 리츠 1위입니다. 기업·클라우드끼리 직접 연결해 주는 '상호연결'이 강점. 밸류체인 리츠 층(추적용).<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 25.71억$(예상 25.6억~25.7억$)로 <b>소폭 상회·부합<\/b>, 주당 AFFO 11.64$(예상 10.51$)로 <b>상회<\/b>했습니다. 다만 노르웨이 아트노스 합작 일회성 수수료가 들어 있어, 빼면 주당 AFFO 성장은 +12%(고정환율)입니다. 연간 매출·EBITDA·주당 AFFO 가이던스를 모두 올렸습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">중립<\/span>연환산 총예약이 <b>사상 최대 5.33억$, +35%<\/b>이고 올해 공급 캐비닛이 원래 계획보다 약 40% 많아질 전망이라 데이터센터 수요는 강합니다. 그러나 대형 하이퍼스케일(xScale) 임대·메가와트·AI 계약 숫자는 보도자료에 없어 AI 몫을 숫자로 확인하지 못했습니다. 엔비디아와 함께하는 'AI 추론 교환망'(2027년 1분기)을 새로 내놓았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 지켜보는 포인트<\/p><p><mark>연간 주당 AFFO 가이던스 43.71~44.11$<\/mark>(이전 42.69~43.29$)로 상향했고, <mark>예약이 사상 최대(+35%)<\/mark>입니다. 다만 AFFO 서프라이즈의 일부는 일회성 수수료라, 깨끗한 숫자는 어닝콜에서 확인합니다. 설비투자 50억~60억$은 그대로입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"폭넓은 수요에 맞추려고 공급 능력 확충을 앞당겼습니다\"<\/mark><cite>아데어 폭스마틴 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 데이터센터 자리가 모자랄 만큼 수요가 강해 공사 속도를 올렸다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 받쳐 준 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>연간 가이던스 상향<\/mark><small>매출 103.25억~103.65억$ · 주당 AFFO 43.71~44.11$<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 예약 사상 최대<small>연환산 5.33억$ · +35% YoY<\/small><\/span><\/li>\n      <li><span>상호연결 6,900개 순증<small>패브릭 매출 +24%<\/small><\/span><\/li>\n      <li><span>공급 캐비닛 +40%<small>원래 계획 대비<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>AFFO에 일회성 포함<small>제외 시 +12%(고정환율)<\/small><\/span><\/li>\n      <li><span>배당 동결<small>분기 5.16$ · 전분기와 같음<\/small><\/span><\/li>\n      <li><span>AI 숫자 미공개<small>xScale 임대·MW 없음<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\":\"surprise\",\"title\":\"예상 대비 · 얼마나 넘었나\",\"cap\":\"컨센서스: 마켓비트·잭스 · 주당 AFFO는 일회성 수수료 포함\",\"items\":[{\"k\":\"매출\",\"a\":25.71,\"e\":25.6,\"u\":\"억$\"},{\"k\":\"주당 AFFO\",\"a\":11.64,\"e\":10.51,\"u\":\"$\"},{\"k\":\"EPS\",\"a\":4.93,\"e\":4.11,\"u\":\"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\":\"trend\",\"title\":\"분기 매출 (억$)\",\"cap\":\"분기별 추이 대시보드 기준 · 점선은 4분기 가이던스 중간값\",\"items\":[{\"q\":\"25 Q3\",\"v\":23.27},{\"q\":\"25 Q4\",\"v\":24.20},{\"q\":\"26 Q1\",\"v\":24.44},{\"q\":\"26 Q2\",\"v\":26.25},{\"q\":\"26 Q3\",\"v\":25.71,\"hi\":1},{\"q\":\"26 Q4\",\"v\":27.04,\"g\":1}]}'><\/div>\n  <p class=\"na\">발표 앞뒤 주가 그래프는 첫 거래일 종가가 나오면 붙입니다.<\/p>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">25.71억$ (25.6억~25.7억$) <span class=\"ok\">✅<\/span> +11% · 고정환율 +12%<\/span><\/div>\n    <div class=\"row\"><span>조정 EBITDA<\/span><span class=\"v\">13.21억$ · +15% · 이익률 약 51.4%(계산)<\/span><\/div>\n    <div class=\"row\"><span>AFFO<\/span><span class=\"v\">11.56억$ · +20%<\/span><\/div>\n    <div class=\"row\"><span>주당 AFFO<\/span><span class=\"v\">11.64$ (10.51$) <span class=\"ok\">✅<\/span> +18% · 일회성 제외 +12%(고정환율)<\/span><\/div>\n    <div class=\"row\"><span>EPS<\/span><span class=\"v\">4.93$ (4.11$) <span class=\"ok\">✅<\/span> +29%<\/span><\/div>\n  <\/section>\n\n  <section><h4>핵심 지표<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 연환산 총예약<\/span><span class=\"v ok\">5.33억$ · +35% · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>상호연결 순증<\/span><span class=\"v\">6,900개 · 상호연결 매출 +10%<\/span><\/div>\n    <div class=\"row\"><span>반복 매출<\/span><span class=\"v\">24.42억$ · 월 반복매출 4분기 연속 두 자릿수 증가<\/span><\/div>\n    <div class=\"row\"><span>새 상품<\/span><span class=\"v\">AI 추론 교환망(엔비디아·투게더AI) · 패브릭원(AWS·구글 클라우드)<\/span><\/div>\n    <div class=\"row\"><span>아트노스(북유럽)<\/span><span class=\"v\">캐나다연금(CPP)과 인수 마무리<\/span><\/div>\n  <\/section>\n\n  <section><h4>배당 · 설비투자<\/h4>\n    <div class=\"row\"><span>분기 배당<\/span><span class=\"v\">5.16$ · 동결 · 12/16 지급<\/span><\/div>\n    <div class=\"row\"><span>연간 설비투자<\/span><span class=\"v\">50억~60억$ · 유지<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 (상향)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 매출<\/span><span class=\"v ok\">103.25억~103.65억$ (이전 102.05억~102.85억$)<\/span><\/div>\n    <div class=\"row\"><span>2026 조정 EBITDA<\/span><span class=\"v ok\">52.9억~53.3억$ (이전 52.1억~52.7억$)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> <mark>2026 주당 AFFO<\/mark><\/span><span class=\"v ok\">43.71~44.11$ (이전 42.69~43.29$)<\/span><\/div>\n    <div class=\"row\"><span>4분기 매출<\/span><span class=\"v\">26.84억~27.24억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<\/h4>\n    <p class=\"q\"><b>아데어 폭스마틴(최고경영자) · 보도자료<\/b> \"3분기 실적과 연간 가이던스 상향은 에퀴닉스의 차별화된 위치와 커지는 중요성을 보여 줍니다.\" \"핵심 지표 전반에서 두 자릿수 성장을 냈습니다.\"<\/p>\n    <p class=\"q\"><b>전력 확보(보도자료)<\/b> 조지아 햄프턴 부지는 20년 계약으로 전력망 비용을 에퀴닉스가 전부 부담, 텍사스에는 16억$ 넘는 장기 투자. 4분기 캐비닛 공급은 사상 최대 13,450개 예정.<\/p>\n    <h4 style=\"margin-top:10px\">어닝콜 반영 · 한국시간 10.29 08:10<\/h4><p class=\"q\"><b>아데어 폭스마틴(최고경영자) · 어닝콜<\/b> \"연환산 총예약 <mark>5억 3,300만$, 35% 증가<\/mark>로 사상 최대.\" \"사전 영업을 포함한 전체 영업 활동은 38% 늘어 3분기 연속 30% 넘게 성장했습니다.\" → 공간 수요가 한 분기 반짝이 아니라는 뜻입니다.<\/p><p class=\"q\"><b>폭스마틴 · 어닝콜<\/b> \"이번 분기 <mark>신규 계약 가격이 전년보다 12% 올랐다<\/mark>.\" \"지속적인 가격 강세의 아주 초기 단계라고 봅니다.\" → 자리가 모자라 값을 올려 받을 수 있다는 뜻입니다.<\/p><p class=\"q\"><b>폭스마틴 · 어닝콜<\/b> 대형 기업, 특히 금융사가 자체 하이브리드 AI 인프라를 짓고 있고, AI 서버 주문 대기분이 올해 두 배가 됐다고 했습니다. 엔비디아·투게더AI와 만든 추론 서비스(인퍼런스 익스체인지)는 시험판 단계. 전력 확보·규제·지역 여론은 업계의 걸림돌로 꼽았습니다.<\/p><p class=\"q\"><b>폭스마틴 · 어닝콜<\/b> xScale(초대형 임대)보다 \"소매(일반 기업 임대) 쪽에 초점과 탄력이 있다.\" 4분기 예약 목표의 <mark>60%를 이미 확보<\/mark>했다고 했습니다.<\/p><p class=\"q\"><b>올리비에 레오네티(최고재무책임자) · 어닝콜<\/b> 3분기 설비투자 약 16억$, 연간 50억~60억$ 유지. 조정 EBITDA 마진 51.4%(+1.8%p), 2029년 53% 넘게가 목표.<\/p><p class=\"na\">조정 EPS 4.93$(예상 4.12$)은 인베스팅닷컴 집계 · 배당 주당 5.16$. 녹취: 인베스팅닷컴.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>정규장 종가<\/span><span class=\"v\">1,007.66$<\/span><\/div>\n    <div class=\"row\"><span>시간외 (뉴욕 17:52 · 어닝콜 중)<\/span><span class=\"v ok\">1,023.50$ · +1.6% (인베스팅닷컴)<\/span><\/div>\n    <div class=\"row\"><span>시간외 (뉴욕 16:52)<\/span><span class=\"v ok\">1,030.00$ · +2.2% (야후 파이낸스 1분 봉, 종가 1,007.66$ · 거래 적음)<\/span><\/div>\n    <div class=\"row\"><span>시간외 (뉴욕 16:12)<\/span><span class=\"v\">거래 거의 없음 · 0% 안팎<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/EQIX\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">EQIX ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터 자리는 모자라고, 예약은 사상 최대<\/p><p>예약 +35%와 공급 확대는 데이터센터 공간 수요가 강하다는 확인입니다. 다만 리츠는 AI 칩 수요의 직접 지표가 아니라 추적용으로 봅니다.<\/p><p>신호는 예약·가이던스, 소음은 일회성 수수료로 부푼 AFFO입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 내일 디지털리얼티 실적, 신규 계약 가격 상승(+12%)이 이어지는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.prnewswire.com/news-releases/equinix-reports-third-quarter-results-and-raises-2026-guidance-302922554.html\">회사 실적 보도자료(PR뉴스와이어, 공식)<\/a> · <a href=\"https://www.stocktitan.net/news/EQIX/equinix-declares-quarterly-dividend-on-its-common-q6zqwekrcoc7.html\">배당 발표<\/a> · <a href=\"https://www.marketbeat.com/earnings/reports/2026-10-28-equinix-inc-reit-stock/\">마켓비트 · 컨센서스<\/a> · <a href=\"https://www.tradingview.com/news/zacks:fcd75a5d9094b:0-equinix-to-post-q3-earnings-what-s-in-store-for-the-stock/\">잭스 · AFFO 컨센서스<\/a> · <a href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-equinix-tops-q3-2026-profit-estimates-shares-rise-93CH-4981155\">어닝콜 녹취(인베스팅닷컴)<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T23:12:00Z"}, {"id": "form-26q3", "date": "2026-10-28", "ts": "2026-10-28T16:02", "name": "폼팩터 FORM", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"form-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T16:02\" data-layer=\"장비\" data-name=\"폼팩터 FORM\" data-sum=\"AI 관점 호재(4분기 연속 사상 최대 · 공동패키징광학 시스템 +20%↑) · 매출✅ EPS✅ 4분기 가이던스 2.85억$(QoQ +1.6%)·총마진 가이던스 54.0% · 어닝콜 반영(3분기 총마진에 관세 환급 3.8%p) · 시간외 −9.8%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기(7~9월) · 어닝콜 반영(한국시간 07:10)<\/div>\n  <h3>폼팩터(FORM)<\/h3>\n  <p class=\"what\">웨이퍼 위 칩을 하나하나 찔러 검사하는 프로브카드를 만드는 회사입니다. HBM·AI 칩을 생산한 웨이퍼 수만큼 소모돼, 생산 물량이 바로 보이는 물량확인용 <p class=\"vn\"><b>다음에 볼 것<\/b> 4분기 HBM 비중 회복 여부, 파머스브랜치 증산 속도(2027년 말 연 4억$ 능력), 일회성 뺀 기준 총마진 53%가 올라가는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/1039399/000103939926000040/ex9901-earningsreleasexq326.htm\">회사 IR(공식) · SEC 8-K 첨부 99.1<\/a> · <a href=\"https://finance.yahoo.com/markets/stocks/articles/formfactor-stock-q3-earnings-smart-165900812.html\">잭스(야후파이낸스) · 컨센서스<\/a> · <a href=\"https://www.marketbeat.com/instant-alerts/formfactor-nasdaqform-updates-q3-2026-earnings-guidance-2026-07-29/\">마켓비트 · 3분기 가이던스<\/a> · <a href=\"https://uk.investing.com/news/stock-market-news/earnings-call-transcript-formfactor-beats-q3-2026-estimates-stock-slips-after-hours-93CH-4939361\">인베스팅닷컴 · 어닝콜 녹취<\/a> · <a href=\"https://gloom.sh/stocks/form/transcripts/q3-2026\">글룸 · 어닝콜 녹취<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T22:07:32Z"}, {"id": "gev-26q3", "date": "2026-10-28", "ts": "2026-10-28T06:29", "name": "GE버노바 GEV", "run": "10.28(수) 뉴욕 장전 · 한국시간 10.28(수) 20:00", "html": "<article id=\"gev-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T06:29\" data-layer=\"전력·발전\" data-name=\"GE버노바 GEV\" data-sum=\"AI 관점 호재(전력 수주 +178%·가스터빈 122GW) · 매출✅ EPS✅ 가이던스✅(연간 매출·마진·현금 상향) · 데이터센터 수주 연초 이후 60억$+ · 전력망 수주 −9%는 전년 사우디 16억$ 기저 · 프리마켓 +3.9%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 반영(한국시간 10.28 22:20)<\/div>\n  <h3>GE버노바(GEV)<\/h3>\n  <p class=\"what\">가스터빈(발전기)·전력망 장비(변압기·개폐기)·풍력 터빈을 만들고 정비하는 회사입니다. 데이터센터의 진짜 병목인 '전기'를 만드는 쪽. 밸류체인 전력·발전 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 126.4억$(예상 120억$)·EPS 4.81$(예상 4.00~4.01$)·조정 EBITDA 19.4억$(예상 16.8억$)로 <b>모두 상회<\/b>했습니다. 수주 293억$(유기 +96%), 잉여현금 54.1억$로 연간 매출·EBITDA 마진·잉여현금 가이던스를 <b>모두 올렸습니다<\/b>.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>데이터센터 전력 수요가 몰리는 전력(가스터빈) 부문 수주가 <b>217.8억$, 유기 +178%<\/b>입니다. 가스터빈 s=\"row\"><span>풍력<\/span><span class=\"v\">수주 21.4억$ +17% · 매출 27.4억$ +4% · 이익률 2.6% (전년 −2.3%)<\/span><\/div>\n  <\/section>\n\n  <section><h4>핵심 지표<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 수주<\/span><span class=\"v ok\">293억$ · 유기 +96%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 수주잔고<\/span><span class=\"v ok\">1,970억$ · 전분기 대비 +200억$ (4분기 2,000억$ 넘을 전망)<\/span><\/div>\n    <div class=\"row\"><span><mark>가스터빈 잔고+슬롯 예약<\/mark><\/span><span class=\"v\">116 → 122GW · 연말 130GW 이상 전망<\/span><\/div>\n    <div class=\"row\"><span>　이번 분기 신규 계약<\/span><span class=\"v\">11GW (슬롯 예약 8 + 주문 3) · 예약→주문 전환 13GW · 출하 5GW<\/span><\/div>\n    <div class=\"row\"><span>　가스 장비 잔고 / 슬롯 예약<\/span><span class=\"v\">53 → 64GW / 63 → 58GW<\/span><\/div>\n    <div class=\"row\"><span>전력망 장비 잔고<\/span><span class=\"v\">422억$ · +60% YoY (프롤렉GE 50억$ 포함) · 수주/매출 약 1.4<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> <mark>데이터센터 수주<\/mark><\/span><span class=\"v ok\">올해 누적 60억$ 이상 · 3분기 약 14억$ (어닝콜)<\/span><\/div>\n    <div class=\"row\"><span>가스 장비 수주 가격<\/span><span class=\"v\">3분기 2025년 4분기 대비 +20% 이상 · 2026년 전체 kW당 2025년보다 약 +50% (어닝콜)<\/span><\/div>\n    <div class=\"row\"><span>AI 데이터센터 비중<\/span><span class=\"v\">가스터빈 주문 장부의 약 20% (기사 인용)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">61억$<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v\">54.1억$ (전년 7.3억$)<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">168억$ (전분기 대비 약 +40억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주<\/span><span class=\"v\">3분기 16억$(170만 주) · 10/1~23 13억$ · 한도 100억$ → 200억$<\/span><\/div>\n    <div class=\"row\"><span>배당<\/span><span class=\"v\">분기 0.50$ 유지 · 1~9월 주주환원 57억$<\/span><\/div>\n    <div class=\"row\"><span>인수<\/span><span class=\"v\">트렌치 그룹(고압 전력망 장비) 90억$ · 2027년 말 완료 예정<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 (2026년)<\/h4>\n    <div class=\"row\"><span><mark>매출<\/mark><\/span><span class=\"v ok\">465~475억$ (이전 455~465억$, 예상 462억$) ✅ 상향<\/span><\/div>\n    <div class=\"row\"><span>조정 EBITDA 이익률<\/span><span class=\"v ok\">13.5~14.5% (이전 12~14%) 상향<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 잉여현금흐름<\/span><span class=\"v ok\">160~170억$ (이전 115~125억$) 상향<\/span><\/div>\n    <div class=\"row\"><span>전력 유기 성장 / 이익률<\/span><span class=\"v\">19~21% (이전 18~20%) / 19~21% (이전 17~19%)<\/span><\/div>\n    <div class=\"row\"><span>전력망 매출 / 이익률<\/span><span class=\"v\">145~150억$ (프롤렉GE 약 31억$ 포함) / 18~20% 위쪽<\/span><\/div>\n    <div class=\"row\"><span>풍력<\/span><span class=\"v\">유기 매출 한 자릿수 중반 감소(이전 10% 초반 감소) · EBITDA 손실 4~5억$(이전 약 4억$)<\/span><\/div>\n    <p class=\"na\">연간 매출 가이던스는 1월 440~450억$ → 4월 445~455억$ → 7월 455~465억$ → 10월 465~475억$로 올해 세 번 올랐습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜 <span class=\"call\">어닝콜 반영 · 한국시간 10.28 22:20<\/span><\/h4>\n    <p class=\"q\"><b>스콧 스트라직(최고경영자) · 보도자료<\/b> \"전 세계에서 전력 인프라 수요가 늘고 있다\", 전력회사·데이터센터 고객을 위한 새 해법을 계속 내놓겠다고 했습니다.<\/p>\n    <p class=\"q\"><b>켄 파크스(최고재무책임자) · 보도자료<\/b> \"강한 실적을 바탕으로 2026년 매출·조정 EBITDA 이익률·잉여현금 가이던스를 올린다\".<\/p>\n    <p class=\"q\"><b>경영진 · 어닝콜<\/b> \"부문 합계 데이터센터 수주는 올해 누적 60억$를 넘었고, 3분기에 약 14억$입니다.\" → 데이터센터 전력 주문이 숫자로 확인됐습니다.<\/p>\n    <p class=\"q\"><b>스콧 스트라직 · 어닝콜<\/b> <mark>\"3분기 수주는 2025년 4분기 장비 주문보다 20% 넘게 높은 가격에 받았습니다\"<\/mark>, 2026년 전체 가스 주문 kW당 가격은 2025년보다 약 50% 높을 전망. → 물량뿐 아니라 가격도 오르고 있습니다.<\/p>\n    <p class=\"q\"><b>스콧 스트라직 · 어닝콜<\/b> \"이번 분기 2032년 인도분 슬롯을 여러 개 팔았습니다\", 항공 파생형 터빈은 \"이미 다 팔렸다\". 2027년에도 계약 GW와 가스 장비 잔고가 계속 늘 것으로 봅니다. → 몇 년 뒤까지 생산 자리가 찼습니다.<\/p>\n    <p class=\"q\"><b>스콧 스트라직 · 어닝콜<\/b> \"최근 하이퍼스케일러와 첫 중전압 무정전전원장치(MV-UPS) 주문을 맺었습니다\", 트렌치도 지난 2년간 하이퍼스케일러와 여러 계약을 확보. → 터빈 밖 데이터센터 직접 납품이 생겼습니다.<\/p>\n    <p class=\"q\"><b>켄 파크스(최고재무책임자) · 어닝콜<\/b> 전력망 수주 −9%는 \"전년 16억$ 대형 주문\" (사우디 동기조상기) 기저 때문이라고 했습니다. 스트라직 최고경영자는 전력망 잔고 증가를 \"기존 고객과 데이터센터 모두\"가 이끈다고 했습니다. 트렌치 인수가는 2028년 EBITDA의 13배(시너지 전), 트렌치 매출은 2028년 약 20억$ 전망.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 직후<\/span><span class=\"v ok\">912.09$ · +1.7% (스톡스토리) · 다른 기사 +2.5%<\/span><\/div>\n    <div class=\"row\"><span>프리마켓(뉴욕 7:11)<\/span><span class=\"v ok\">930$ · +3.9% (RTT뉴스)<\/span><\/div>\n    <div class=\"row\"><span>지난 실적 반응<\/span><span class=\"v\">7/22 −8.7% · 4/22 +13.7%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/GEV\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">GEV ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터용 전기를 만드는 터빈 주문이 거의 세 배가 됐습니다<\/p><p>GPU와 냉각 설비가 있어도 전기가 없으면 데이터센터를 못 돌립니다. 전력 부문 수주 +178%와 가스터빈 122GW는 몇 년 뒤 들어설 데이터센터 규모를 미리 보여 줍니다. 오늘 아침 버티브(수주 +100% 이상)와 같은 방향의 신호입니다.<\/p><p>신호는 수주·수주잔고와 잉여현금 가이던스, 소음은 프리마켓 등락입니다. 어닝콜에서 데이터센터 수주가 올해 60억$를 넘었고 가스 장비 가격이 20% 넘게 올랐다고 확인돼, 전력망 수주 −9%는 전년 대형 주문 기저 효과로 정리됐습니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 본장에서 프리마켓 +3.9%가 이어지는지, 그리고 내일 캐터필러·콴타서비스.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0001996810/000199681026000162/gevpressrelease3q26.htm\">회사 실적 보도자료(SEC 8-K, 공식)<\/a> · <a href=\"https://www.gevernova.com/news/ge-vernova-reports-strong-third-quarter-2026-financial-performance\">회사 IR 뉴스(공식)<\/a> · <a href=\"https://www.investing.com/news/earnings/ge-vernova-stock-gains-on-earnings-beat-raised-guidance-4978247\">인베스팅닷컴 · 컨센서스<\/a> · <a href=\"https://stockstory.org/us/stocks/nyse/gev/news/earnings/ge-vernova-nysegev-reports-strong-q3-2026-full-year-outlook-slightly-exceeds-expectations\">스톡스토리 · 컨센서스·주가<\/a> · <a href=\"https://ng.investing.com/news/stock-market-news/earnings-call-transcript-ge-vernova-tops-q3-2026-forecasts-on-orders-and-cash-93CH-2763481\">인베스팅닷컴 · 어닝콜 녹취<\/a> · <a href=\"https://www.rttnews.com/3704288/ge-vernova-to-buy-trench-group-for-9-bln-gev-up-over-3-in-pre-market.aspx\">RTT뉴스 · 프리마켓<\/a> · <a href=\"https://huggingnews.com/earnings/ge-vernova-hikes-2026-outlook-following-surge-in-third-quarter-orders-f9a15b32\">허깅뉴스 · 데이터센터 비중<\/a> · <a href=\"https://www.benzinga.com/analyst-stock-ratings/analyst-color/26/10/62479818/ge-vernova-q3-preview-analyst-projects-orders-growth-of-44\">벤징가 · 수주 전망(제목)<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T13:24:00Z"}, {"id": "glw-26q3", "date": "2026-10-27", "ts": "2026-10-27T07:01", "name": "코닝 GLW", "run": "10.27(화) 뉴욕 장전 · 한국시간 10.27(화) 20:00", "html": "<article id=\"glw-26q3\" data-date=\"2026-10-27\" data-ts=\"2026-10-27T07:01\" data-layer=\"광학\" data-name=\"코닝 GLW\" data-sum=\"AI 관점 호재(광통신 +44%·생성형 AI 제품 두 배) · 매출✅ EPS✅ 가이던스✅ · 설비투자 약 20억$ 부담 · 첫 거래일 −1.1%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 반영(한국시간 10.28 07:05)<\/div>\n  <h3>코닝(GLW)<\/h3>\n  <p class=\"what\">데이터센터 안팎을 잇는 광섬유·광케이블·커넥터와 디스플레이·스마트폰 커버 유리를 만드는 소재 회사입니다. AI 데이터센터에서는 GPU 서버끼리 잇는 광 연결선 공급사. 밸류체인 광학 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>코어 매출 50.8억$(+19%, 예상 50.3억$)·코어 EPS 0.91$(+36%, 예상 0.88$) <b>모두 상회<\/b>하고, 7월에 낸 3분기 가이던스(매출 49~50억$·EPS 0.85~0.89$) 위쪽 끝도 넘었습니다. 4분기 EPS 가이던스 0.96~1.00$도 예상 0.93$보다 높습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 쪽인 광통신 부문 매출이 <b>23.8억$·+44%<\/b>, 그 안의 엔터프라이즈(데이터센터) +84%, <b>생성형 AI 제품 +100% 이상(두 배)<\/b>입니다. 광통신 비중은 코어 매출의 약 47%. 비AI 쪽 유리(디스플레이·특수소재 통합) 15.1억$는 −3%로 약하지만 AI 판정과는 따로 봅니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p>광통신 성장 속도가 2분기 +32%에서 <mark>3분기 +44%로 더 빨라졌습니다<\/mark>. 분기 중 <mark>여러 해짜리 수십억$ 규모 장기계약 4건<\/mark>(버라이즌·AT&T 포함)을 따냈습니다. 주가는 지난 1년 약 +48% 오른 상태라, 숫자보다 어닝콜에서 나올 하이퍼스케일러 물량 발언이 반응을 가를 수 있습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"뛰어난 3분기를 냈습니다\"<\/mark><cite>웬델 위크스 · 회장 겸 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 매출·EPS·마진이 모두 가이던스 위로 나왔다는 자신감입니다.<\/p>\n    <blockquote>연 매출 속도를 \"두 배로 늘릴 길\"을 제시했습니다<cite>에드 슐레진저 · 최고재무책임자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 연 200억$ 속도를 2030년 말까지 400억$로 키우는 '스프링보드' 계획을 그대로 밀고 간다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>생성형 AI 제품 매출 두 배<\/mark><small>엔터프라이즈 +84% · 광통신 +44%<\/small><\/span><\/li>\n      <li><span>가이던스 위쪽 끝 돌파<small>매출 50.8억$(가이던스 49~50억$) · EPS 0.91$(0.85~0.89$)<\/small><\/span><\/li>\n      <li><span>4분기 EPS 가이던스 예상 상회<small>0.96~1.00$ vs 예상 0.93$<\/small><\/span><\/li>\n      <li><span>장기계약 4건<small>여러 해·수십억$ 규모 · 버라이즌·AT&T<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>유리 부문 역성장<small>15.1억$ −3% · 순이익 −10%<\/small><\/span><\/li>\n      <li><span>4분기 매출 가이던스 아래쪽<small>52억$ — 예상 52.1억$와 비슷<\/small><\/span><\/li>\n      <li><span>태양광 적자 전환<small>순손실 0.07억$(전년 이익 0.3억$)<\/small><\/span><\/li>\n      <li><span>1년 +48% 오른 주가<small>기대가 이미 높음<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"컨센서스 기준(인베스팅닷컴)\", \"items\": [{\"k\": \"코어 매출\", \"a\": 50.81, \"e\": 50.3, \"u\": \"억$\"}, {\"k\": \"코어 EPS\", \"a\": 0.91, \"e\": 0.88, \"u\": \"$\"}, {\"k\": \"4Q EPS 가이던스(중간)\", \"a\": 0.98, \"e\": 0.93, \"u\": \"$\"}]}'><\/div>\n  <div class=\"vizrow\">\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 코어 매출 (억$)\", \"cap\": \"점선은 4분기 가이던스 중간값\", \"items\": [{\"q\": \"25 Q3\", \"v\": 42.7}, {\"q\": \"25 Q4\", \"v\": 44.1}, {\"q\": \"26 Q1\", \"v\": 43.5}, {\"q\": \"26 Q2\", \"v\": ><b>웬델 위크스(최고경영자)<\/b> \"뛰어난 3분기를 냈습니다.\" 생성형 AI 제품 매출이 전년의 두 배가 됐다고 했습니다.<\/p>\n    <p class=\"q\"><b>에드 슐레진저(최고재무책임자)<\/b> 스프링보드 계획으로 연 매출 속도를 두 배로 늘릴 길을 제시했고, 이익이 매출보다 빨리 늘 것이라고 했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/26 종가)<\/span><span class=\"v\">127.74$<\/span><\/div>\n    <div class=\"row\"><span>최근 흐름<\/span><span class=\"v\">3개월 −5.5% · 1년 +47.8%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 프리마켓 (뉴욕 7:21)<\/span><span class=\"v ok\">+3.2%<\/span><\/div>\n    <div class=\"row\"><span>장 시작 직전 (뉴욕 9:18)<\/span><span class=\"v ok\">+2%대<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v no\">126.30$ (−1.13%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/GLW\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">GLW ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트<\/span><\/h4><p>결국 시장이 문제 삼은 건 <mark>약 20억$ 설비투자 계획과 태양광 부문 적자 전환<\/mark>이었습니다. 프리마켓 +3%대로 출발했지만 장중 한때 −4%대까지 밀렸다가 종가 126.30$(−1.13%)로 마쳤습니다. 광통신 +44%·생성형 AI 제품 두 배라는 AI 수요 숫자 자체는 흔들리지 않았습니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 이번 주 빅테크 설비투자 계획, 그리고 다음 분기 고객 선수금·광통신 성장률이 유지되는지.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터 광 연결 수요가 더 빨라지고 있습니다<\/p><p>코닝 광통신 성장률이 +32% → +44%로 올라갔고 생성형 AI 제품은 두 배입니다. GPU 서버가 늘수록 서버를 잇는 광섬유 물량이 함께 늘어난다는 확인으로, 어제 셀레스티카의 2027년 전망과 같은 방향입니다.<\/p><p>신호는 광통신 성장 가속과 장기계약, 소음은 장 초반 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 오늘 어닝콜의 하이퍼스케일러 계약 규모, 이번 주 빅테크 설비투자 계획.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.financialcontent.com/article/bizwire-2026-10-27-corning-delivers-outstanding-third-quarter-results1\">회사 보도자료(비즈니스와이어)<\/a> · <a href=\"https://www.stocktitan.net/news/GLW/corning-delivers-outstanding-third-quarter-results-ijv492ou5imj.html\">스톡타이탄<\/a> · <a href=\"https://in.investing.com/news/earnings/corning-earnings-beat-by-003-revenue-topped-estimates-5656413\">인베스팅닷컴 · 컨센서스<\/a> · <a href=\"https://www.investing.com/news/earnings/corning-shares-rise-3-in-premarket-trade-after-q3-eps-revenue-beat-estimates-4975090\">인베스팅닷컴 · 프리마켓<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/glw-stock-gains-as-corning-tops-q3-earnings-estimates-company-targets-40-b-annualized-sales-run-rate-by-2030/cZUeJ5FRBCa\">스톡트윗츠 · CNBC 인터뷰 인용<\/a><\/p>\n<\/article>\n", "updated": "2026-10-27T22:08:00Z"}, {"id": "googl-26q3", "date": "2026-10-28", "ts": "2026-10-28T16:01", "name": "알파벳 GOOGL", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"googl-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T16:01\" data-layer=\"빅테크\" data-name=\"알파벳 GOOGL\" data-sum=\"AI 관점 호재(구글 클라우드 +103% · 이익률 36%) · 매출 부합 EPS❌(주식 평가손실 −0.55$ 포함) · 설비투자 513억$(예상 552억$) · 올해 설비투자 계획 유지·내년 크게 증가 · 클라우드 수주잔고 5,610억$ · 어닝콜 반영 · 시간외 −9.3%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기(7~9월) · 어닝콜 반영(한국시간 07:10)<\/div>\n  <h3>알파벳(GOOGL)<\/h3>\n  <p class=\"what\">구글 검색·유튜브 광고로 돈을 벌고, 구글 클라우드와 자체 AI 칩(TPU)으로 AI 인프라를 직접 파는 회사입니다. 엔비디아 GPU·TPU·서버·전력을 사들이는 빅테크 설비투자의 큰손. 밸류체인 빅테크 층(미래전망 킥).<\/p>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">보통<\/span>매출 1,275.8억$(예상 1,273.5억~1,282억$)로 <b>예상 수준<\/b>, 회계 EPS 2.12$(예상 2.96~3.04$)는 <b>하회<\/b>했습니다. 보유 주식 평가손실 86.6억$이 EPS를 0.55$ 깎았는데, 이를 빼도 약 2.67$(계산)로 예상에 못 미칩니다. 영업이익 405.8억$(+30%)·이익률 31.8%는 좋아졌습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span><b>구글 클라우드 매출 307.1억$, +103%<\/b>(예상 287억~290억$)로 두 배가 됐고, 영업이익 111.2억$·이익률 36.2%(전년 23.7%)입니다. TPU 시스템 판매가 성장에 \"의미 있게 기여\"했다고 밝혔습니다. 다만 3분기 설비투자 513.6억$은 예상 552억$보다 적었습니다 — 어닝콜에서 연간 1,950억~2,050억$ 계획을 <b>유지<\/b>하고 2027년에는 <b>크게 늘린다<\/b>고 했습니다(CNBC 헤드라인). 검색 +12%·유튜브 광고 +9%는 비AI라 판정에 넣지 않았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>클라우드는 폭발했지만 <mark>EPS가 예상(약 3$)에 크게 못 미쳤고<\/mark>, 설비투자로 <mark>잉여현금흐름이 −90.7억$<\/mark>로 마이너스가 됐습니다. 자사주 매입은 0, 대신 회사채 287억$·신주 판매 124억$로 돈을 조달했습니다. 유튜브 광고(+9%)도 예상(112억~116억$) 하단입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"구글 클라우드 매출이 103% 늘었습니다. AI 인프라와 AI 솔루션에 대한 엄청난 수요 덕분입니다\"<\/mark><cite>순다르 피차이 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 빅테크가 산 GPU·TPU가 실제 매출로 돌아오고 있다는 뜻입니다. 밸류체인 수요의 출발점이 튼튼합니다.<\/p>\n    <blockquote>\"다양한 고객에게서 TPU 시스템 수요가 강합니다\"<cite>순다르 피차이 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 자체 칩(TPU)을 외부에도 팔기 시작했다는 뜻. 브로드컴·미디어텍(TPU 설계 협력)에 직접 연결됩니다.<\/p>\n    <blockquote><mark>\"공급이 제약된 환경이라 3분기 말부터 외부 컴퓨팅 용량을 쓰기 시작했습니다\"<\/mark><cite>아낫 아슈케나지 · 최고재무책임자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 자기 데이터센터만으로는 수요를 다 못 받는다는 뜻. 네오클라우드·서버·전력 층 수요로 이어집니다.<\/p>\n    <blockquote>\"2027년 설비투자는 크게 늘어날 것으로 예상하며, 자세한 내용은 4분기 실적 때 밝히겠습니다\"<cite>아낫 아슈케나지 · 최고재무책임자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년 숫자는 1월 말에 나옵니다. 방향은 '증가'로 확인.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>EPS 2.12$ vs 예상 약 3$<\/mark><small>평가손실 제외해도 약 2.67$(계산)<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 잉여현금흐름 −90.7억$<small>영업현금 422.9억$ − 설비투자 513.6억$<\/small><\/span><\/li>\n      <li><span>자사주 매입 중단 · 증자·회사채<small>매입 0$(전년 115억$) · 신주 판매 124억$<\/small><\/span><\/li>\n      <li><span>유튜브 광고 +9.2%<small>112.1억$ · 예상 112억~116억$ 하단<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>클라우드 +103%<\/mark><small>307.1억$ · 예상 287억~290억$<\/small><\/span><\/li>\n      <li><span>클라우드 이익률 36.2%<small>영업이익 111.2억$ (전년 35.9억$)<\/small><\/span><\/li>\n      <li><span>검색 +12%<small>633.5억$ er\" style=\"color:var(--accent);font-weight:700\">GOOGL ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 인프라 매출은 두 배, 주가는 현금흐름을 걱정<\/p><p>클라우드 +103%와 TPU 수요는 빅테크가 산 칩이 돈으로 돌아온다는 확인이라 밸류체인 수요에는 좋은 신호입니다. 시간외 하락은 EPS·잉여현금흐름 마이너스·증자 같은 '돈을 너무 쓴다'는 걱정입니다.<\/p><p>신호는 클라우드 성장·설비투자 계획, 소음은 시간외 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 1월 말 4분기 실적의 2027년 설비투자 금액, 외부 컴퓨팅 임대(네오클라우드) 확대 여부, 내일 아마존 설비투자.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm\">회사 IR(공식) · SEC 8-K 첨부 99.1<\/a> · <a href=\"https://247wallst.com/investing/2026/10/28/live-will-alphabet-smash-q3-earnings-tonight-after-the-market-closes/\">24/7 월스트리트 · 컨센서스<\/a> · <a href=\"https://www.zetik.com/news/article/story_id-p008-227465\">CNBC 컨센서스 인용<\/a> · <a href=\"https://moneycheck.com/alphabet-googl-stock-what-analysts-expects-from-earnings-today\">머니체크 · 옵션<\/a> · <a href=\"https://www.cnbc.com/2026/10/28/alphabet-googl-earnings-q3-2026.html\">CNBC · 어닝콜 설비투자 헤드라인<\/a> · <a href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-alphabet-q3-2026-profit-miss-sparks-10-afterhours-drop-93CH-4981037\">인베스팅닷컴 · 어닝콜 녹취<\/a> · <a href=\"https://fortune.com/2026/10/28/alphabet-google-stock-drops-cloud-revenue-doubles-free-cash-flow-negative/\">포천<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T22:07:32Z"}, {"id": "ibm-26q3", "date": "2026-10-21", "ts": "2026-10-21", "name": "IBM IBM", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"ibm-26q3\" data-date=\"2026-10-21\" data-layer=\"빅테크\" data-name=\"IBM IBM\" data-sum=\"매출✅ EPS✅ · 시간외 +4.4%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기<\/div>\n  <h3>IBM(IBM)<\/h3>\n  <p class=\"what\">기업용 소프트웨어(레드햇)·컨설팅·메인프레임 회사입니다. 기업들이 AI에 실제로 돈을 쓰는지 보여 주는 '쓰는 쪽' 지표. 밸류체인 빅테크 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 171억$(+5%, 예상 168.2억$)·영업 EPS 2.95$(예상 2.85~2.86$) <b>모두 상회<\/b>, 연간 잉여현금흐름 증가 전망 상향. 연간 매출 성장 전망(4~5%)은 유지했습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p><mark>소프트웨어 +8%<\/mark>(레드햇 +11%, 데이터 +19%)가 실적을 끌었습니다. 반면 최고경영자가 <mark>\"고객들이 일부 AI 지출이 수익 없이 통제 불능이라고 걱정한다\"<\/mark>고 말해, AI 투자 회의론에 불을 붙인 발언으로 회자됐습니다.<\/p><\/div>\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"고객들은 일부 AI 지출이 실제 수익 없이 완전히 통제 불능이 아닌지 걱정하고 있습니다\"<\/mark><cite>아르빈드 크리슈나 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 기업 고객 쪽에서 AI 투자 효율을 따지기 시작했다는 신호. 이번 주 빅테크 실적에서 '수익화' 질문이 커질 수 있습니다.<\/p>\n  <\/div>\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span>소프트웨어 +8%<small>레드햇 +11% · 데이터 +19%<\/small><\/span><\/li>\n      <li><span>잉여현금흐름 전망 상향<small>전년 대비 10억$ 이상 증가<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>메인프레임(IBM Z) −20%<small>신제품 주기 끝물<\/small><\/span><\/li>\n      <li><span>소프트웨어 일부는 2분기에서 밀린 계약<small>회사 설명<\/small><\/span><\/li>\n      <li><span>컨설팅 보합<small>53억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"\", \"items\": [{\"k\": \"매출\", \"a\": 171.0, \"e\": 168.2, \"u\": \"억$\"}, {\"k\": \"영업 EPS\", \"a\": 2.95, \"e\": 2.86, \"u\": \"$\"}]}'><\/div>\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">171억$ (168.2억$) <span class=\"ok\">✅<\/span> +5% (환율 제외 +6%)<\/span><\/div>\n    <div class=\"row\"><span>영업 EPS<\/span><span class=\"v\">2.95$ (2.85~2.86$) <span class=\"ok\">✅<\/span> +11%<\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">2.31$ (+26%, 낮은 세율 영향)<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">58.5% (회계 56.8%)<\/span><\/div>\n  <\/section>\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span>소프트웨어<\/span><span class=\"v\">78억$ · +8%<\/span><\/div>\n    <div class=\"row\"><span>　레드햇·하이브리드클라우드 / 데이터<\/span><span class=\"v\">+11% / +19%<\/span><\/div>\n    <div class=\"row\"><span>　거래처리 / 자동화<\/span><span class=\"v\">+9% / −3%<\/span><\/div>\n    <div class=\"row\"><span>컨설팅<\/span><span class=\"v\">53억$ · 보합<\/span><\/div>\n    <div class=\"row\"><span>인프라<\/span><span class=\"v\">37억$ · +4% (메인프레임 −20%, 분산형 +31%)<\/span><\/div>\n  <\/section>\n  <section><h4>현금 · 가이던스<\/h4>\n    <div class=\"row\"><span>3분기 잉여현금흐름<\/span><span class=\"v\">30억$ (+7억$)<\/span><\/div>\n    <div class=\"row\"><span>연간 매출 성장<\/span><span class=\"v\">환율 제외 4~5% (유지)<\/span><\/div>\n    <div class=\"row\"><span>연간 잉여현금흐름<\/span><span class=\"v\">전년 대비 10억$ 이상 증가 (상향)<\/span><\/div>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">약 +4.4% → 다음 날 장전 밀림<\/span><\/div>\n    <div class=\"row\"><span>다음 날<\/span><span class=\"na\">종가 % 확인 중<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·차트는 제목 옆 티커를 누르면 야후 파이낸스에서 볼 수 있습니다.<\/p>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p>숫자는 좋았지만 시장에서는 <mark>'AI 지출 통제 불능' 발언<\/mark>이 더 많이 회자됐습니다.<\/p><p>다음 확인: 10/29 서비스나우 — 기업용 AI 수익화가 실제 계약으로 이어지는지.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">\"AI에 쓴 돈이 돌아오나\"라는 질문이 커지고 있습니다<\/p><p>IBM 숫자 자체는 좋았지만, 최고경영자가 \"고객들이 AI 지출이 수익 없이 통제 불능이 아닌지 걱정한다\"고 말했습니다.<\/p><p>밸류체인의 돈줄은 빅테크 설비투자이고, 그 투자가 계속되려면 결국 기업 고객이 AI에 돈을 내야 합니다. IBM 발언은 그 고리의 맨 끝, 수익화 쪽이 아직 검증 중이라는 경고입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/29 서비스나우와 마이크로소프트 애저 성장률 — 기업들이 실제로 AI에 돈을 내고 있는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000051143/000005114326000093/ibm-20261021xex991.htm\">회사 보도자료(SEC 8-K)<\/a> · <a href=\"https://stock3.com/news/ibm-software-traegt-das-wachstum-ibm-z-bricht-ein-17344934\">스톡3 · 부문<\/a> · <a href=\"https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-22-dow-sp-500-nasdaq-tesla-meta-112217857.html\">야후파이낸스 · 10/22 시장<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "intc-26q3", "date": "2026-10-29", "ts": "2026-10-29T16:01", "name": "인텔 INTC", "run": "10.29(목) 뉴욕 장 마감 후 · 한국시간 10.30(금) 05:00", "html": "<article id=\"intc-26q3\" data-date=\"2026-10-29\" data-ts=\"2026-10-29T16:01\" data-layer=\"칩·메모리\" data-name=\"인텔 INTC\" data-sum=\"AI 관점 호재(데이터센터 +78%·73.2억$) · 매출 부합 EPS✅ · 4분기 가이던스❌(매출 150~160억$ vs 170.7억$) · PC 둔화·이스라엘 공장 폭발 · 어닝콜: 공장 사고 영향 두 분기 약 6억$·PC 부진 내년 상반기까지 · 시간외 −17%(뉴욕 17:18)\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 반영(한국시간 10.30 07:10)<\/div>\n  <h3>인텔(INTC)<\/h3>\n  <p class=\"what\">PC·서버용 중앙처리장치(CPU) 제온을 만들고, 남의 칩도 대신 만들어 주는 파운드리(인텔 파운드리)를 키우는 회사입니다. AI 데이터센터에서는 GPU 옆에서 일을 나눠 주는 서버 CPU를 공급합니다. 밸류체인 칩·메모리 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">보통<\/span>3분기만 보면 매출 165.1억$(+21%)는 예상 165억$에 <b>부합<\/b>, 조정 EPS 0.52$는 예상 0.40$을 <b>크게 상회<\/b>, 조정 총마진 44.1%도 가이던스 42%를 넘었습니다. 하지만 4분기 가이던스가 매출 150~160억$(예상 170.7억$)·EPS 0.25$(예상 0.43$)로 <b>크게 못 미쳐<\/b> 전체 판정은 '보통'입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 쪽인 데이터센터·AI(DCAI) 매출이 <b>73.2억$·+78%<\/b>(예상 약 66억$)로 최고재무책임자 표현대로 '15년 만에 가장 강한 데이터센터 성장'입니다. 최고경영자는 제온 수요를 '엄청나다(extraordinary)'며 공급을 늘리는 것이 최우선이라고 했습니다. 비AI인 PC(CCPG)는 81.0억$·−5%로, 메모리 가격 급등에 따른 PC 수요 둔화라는 예견된 요인이라 AI 판정에서 따로 봅니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>3분기는 좋았지만 <mark>시간외에서 20% 넘게 빠졌습니다<\/mark>(로이터 · 옵션 예상 ±9.4%의 두 배 이상). 이유는 4분기 가이던스입니다. <mark>매출 중간값 155억$로 예상 170.7억$보다 약 9% 낮고<\/mark>, EPS 0.25$·조정 총마진 38%도 크게 내려갑니다. 로이터에 따르면 10월 이스라엘 키르야트가트 공장 폭발로 4분기 매출 약 3억$·총마진 약 2%p가 깎이고, 내년 1분기에도 비슷한 영향이 이어집니다. 최고재무책임자는 <mark>\"PC 둔화가 적어도 내년 상반기까지 이어진다\"<\/mark>고 했습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"Our immediate priority is to unlock additional supply to meet extraordinary demand for our Xeon family\"<\/mark><cite>립부 탄 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 서버 CPU는 수요가 넘치는데 만들 물량이 모자란다는 뜻입니다. AI 데이터센터 수요는 강하고, 문제는 공급입니다.<\/p>\n    <blockquote>\"Looking ahead, we see the PC slowdown continuing at least through the first half of next year\"<cite>데이비드 진스너 · 최고재무책임자 · 로이터 인용<\/cite><\/blockquote>\n    <p class=\"m\">→ 가이던스를 끌어내린 건 AI가 아니라 PC 쪽이라는 설명입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> 4분기 매출 가이던스 큰 미달<small>150~160억$ (예상 170.7억$, LSEG)<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 4분기 EPS·마진 하락<small>EPS 0.25$ (0.43$) · 조정 총마진 38.0%<\/small><\/span><\/li>\n      <li><span>이스라엘 공장 폭발<small>4분기 매출 약 −3억$ · 총마진 약 −2%p (로이터)<\/small><\/span><\/li>\n      <li><span>PC 매출 감소<small>81.0억$ −5% (예상 89.8억$) · 내년 상반기까지 둔화<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> 데이터센터 +78%<small>73.2억$ (예상 약 66억$) · 15년 만에 최강<\/small><\/span><\/li>\n      <li><span>파운드리 매출 +58%<small>67.0억$ · 영업손실 18.5억$로 축소(전년 23.2억$)<\/small><\/span><\/li>\n      <li><span>EPS·마진 상회<small>조정 EPS 0.52$ (0.40$) · 총마진 44.1%<\/small><\/span><\/li>\n      <li><span>설비투자 상향<small>2026년 200억$(종전 180억$) · 2027년 '크게' 증가(로이터)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"LSEG(로이터) 컨센서스 · 데이터센터는 블룸버그 추정\", \"items\": [{\"k\": \"매출\", \"a\": 165.1, \"e\": 165.0, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 0.52, \"e\": 0.40, \"u\": \"$\"}, {\"k\": \"데이터센터\", \"a\": 73.2, \"e\": 66.0, \"u\": \"억$\"}, {\"k\": \"4분기 매출 가이던스\", \"a\": 155, \"e\": 170.7, \ n>인텔 파운드리<\/span><span class=\"v\">67.0억$ · +58% · 영업손실 18.5억$ (전년 23.2억$)<\/span><\/div>\n    <div class=\"row\"><span>기타(모빌아이 등)<\/span><span class=\"v\">6.9억$ · −30%(알테라 연결 제외)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">50.8억$ (전년 25.5억$)<\/span><\/div>\n    <div class=\"row\"><span>설비투자(총액)<\/span><span class=\"v\">42.2억$<\/span><\/div>\n    <div class=\"row\"><span>조정 잉여현금흐름<\/span><span class=\"v\">16.4억$ (전년 9.0억$)<\/span><\/div>\n    <div class=\"row\"><span>현금+단기투자 / 차입금<\/span><span class=\"v\">약 540억$ / 약 501억$<\/span><\/div>\n    <div class=\"row\"><span>유상증자<\/span><span class=\"v\">230억$ 공모 완료 · 희석 주식수 53.1억주(전년 45.3억주)<\/span><\/div>\n    <div class=\"row\"><span>그 밖의 발표<\/span><span class=\"v\">오라클 OCI 제온 다년 협력 · 클래식(양자) 인수 · 14A 0.9 설계키트 배포<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 매출<\/span><span class=\"v no\"><mark>150~160억$<\/mark> (예상 170.7억$) ❌<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 EPS<\/span><span class=\"v no\">0.25$ (예상 0.43$) ❌ · 회계 0.10$<\/span><\/div>\n    <div class=\"row\"><span>4분기 총마진 조정 / 회계<\/span><span class=\"v\">38.0% / 37.1%<\/span><\/div>\n    <div class=\"row\"><span>4분기 영업비용(조정)<\/span><span class=\"v\">약 44억$ · 2026년 163억$<\/span><\/div>\n    <div class=\"row\"><span>2026년 설비투자<\/span><span class=\"v\">200억$로 상향(종전 180억$, 로이터)<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 07:10<\/span><\/h4>\n    <p class=\"q\"><b>립부 탄(최고경영자) · 보도자료<\/b> \"3분기 실적은 실행력 개선과 공급 확대의 의미 있는 진전을 보여 준다\" → 만드는 능력이 나아지고 있다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>데이비드 진스너(최고재무책임자) · 보도자료<\/b> \"매출·총마진·EPS 모두 가이던스를 넘었다\" → 3분기 자체는 약속보다 잘했다는 얘기입니다.<\/p>\n    <p class=\"q\"><b>로이터 보도<\/b> 공장 폭발 영향 4분기 매출 약 3억$·총마진 약 2%p, 2027년 설비투자 '크게' 증가 → 공급을 늘리려 투자는 더 한다는 뜻입니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>립부 탄(최고경영자) · 블룸버그 인터뷰<\/b> \"I am a bit disappointed in terms of how we cannot fulfill the customer requirements\" → 기판·메모리 부족과 이스라엘 공장 중단으로 <mark>고객 주문을 다 채우지 못했다<\/mark>는 뜻입니다.<\/p>\n    <p class=\"q\"><b>립부 탄 · 실적 발표<\/b> \"Our immediate priority is to unlock additional supply to meet extraordinary demand for our Xeon family\" → 제온 수요는 넘치고, 공급을 푸는 것이 1순위라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>데이비드 진스너(최고재무책임자)<\/b> \"we see the PC slowdown continuing at least through the first half of next year\" → PC 부진이 내년 상반기까지 이어진다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>데이비드 진스너 · 칼칼리스트<\/b> \"We're still assessing all of the wafers to see which ones are usable\" → 공장 폭발 영향은 4분기 매출 약 3억$·총마진 약 2%p에 2027년 1분기에도 비슷하게 이어져 <mark>두 분기 합계 약 6억$<\/mark>입니다. 공장은 이번 주 다시 돌기 시작했습니다.<\/p>\n    <p class=\"na\">녹취 전문은 아직 공개 전입니다. 18A·14A 고객 관련 새 발언은 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 흐름<\/span><span class=\"v\">1개월 약 −20% · 연초 대비 +150% 넘음 · 10.29 정규장 −3~4%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v\">±9.4% (최근 4번 평균 실제 12.2%)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 시간외<\/span><span class=\"v no\">한때 −20% 넘게 (로이터) → −16.8% (76.58$, 뉴욕 17:18 · 머니체크) · 정규장 종가 92.07$ (−3.6%)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/INTC\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">INTC ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 서버 CPU는 부족, 문제는 PC와 공장 사고<\/p><p>데이터센터 +78%와 '엄청난 제온 수요'는 AI 데이터센터가 GPU뿐 아니라 CPU도 많이 사고 있다는 확인입니다. 가이던스 하향은 PC 둔화(메모리값 상승 영향)와 공장 폭발 탓이라 AI 수요가 꺾였다는 신호는 아닙니다.<\/p><p>신호는 데이터센터 매출과 공급 확대 계획, 소음은 시간외 −20%입니다. 다만 '공급 부족'은 수요가 있어도 매출로 못 바꾼다는 뜻이라, 공급이 언제 풀리는지가 다음 분기 관건입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 첫 거래일 종가, 기판·메모리 부족이 풀리는 시점(다른 칩 회사에도 같은 병목인지), 18A·14A 고객.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.intc.com/news-events/press-releases/detail/1786/intel-reports-third-quarter-2026-financial-results\">회사 IR(공식) · 보도자료<\/a> · <a href=\"https://www.globalbankingandfinance.com/intel-signals-slower-growth-pc-market-remains-pressure/\">로이터 · 컨센서스·시간외·어닝 발언<\/a> · <a href=\"https://www.tipranks.com/news/intel-q3-earnings-tomorrow-options-traders-expect-a-9-4-move-in-intc-stock\">팁랭크스 · 옵션 예상<\/a> · <a href=\"https://www.kucoin.com/news/flash/intel-q3-earnings-preview-ai-server-cpu-demand-in-focus-analysts-eye-q4-guidance-and-expansion\">블룸버그 데이터센터 추정(쿠코인)<\/a> · <a href=\"https://247wallst.com/investing/2026/10/29/live-will-intels-q3-earnings-tonight-spark-a-recovery-after-20-selloff/\">24/7 월스트리트 라이브<\/a> · <a href=\"https://calcalistech.com/ctechnews/article/7djs538lu\">칼칼리스트 · 공장 영향<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/intc-stock-tumbles-after-hours-after-q3-pc-slump-and-supply-bottlenecks-cloud-fourth-quarter-guidance/cZUQyleR9Rf\">스톡트윗츠 · 블룸버그 인터뷰 인용<\/a> · <a href=\"https://moneycheck.com/intel-intc-shares-drop-16-82-after-hours-despite-16-5-billion-revenue-beat/\">머니체크 · 시간외<\/a><\/p>\n<\/article>\n", "updated": "2026-10-29T22:07:19Z"}, {"id": "klac-26q3", "date": "2026-10-28", "ts": "2026-10-28T16:05", "name": "KLA KLAC", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"klac-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T16:05\" data-layer=\"장비\" data-name=\"KLA KLAC\" data-sum=\"AI 관점 호재(다음 분기 가이던스 47억$ vs 예상 44억$·공정 제어 +29.5%) · 매출✅ EPS✅ 가이던스✅ · 어닝콜 반영(2027년 웨이퍼 장비 2,000억$ 이상·공급 부족) · 시간외 +3.9%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2027 회계연도 1분기(2026년 7~9월) · 어닝콜 반영(한국시간 10.29 07:45)<\/div>\n  <h3>KLA(KLAC)<\/h3>\n  <p class=\"what\">반도체 웨이퍼에 결함이 없는지 찾아내는 검사 장비와, 회로가 설계대로 새겨졌는지 재는 계측 장비(합쳐서 '공정 제어')의 세계 1위 회사입니다. AI 칩처럼 미세하고 복잡한 칩, HBM 같은 쌓는 메모리, 첨단 패키징일수록 검사 단계가 늘어나 수혜가 커지는 자리. 밸류체인 장비 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 41.4억$(+28.9%, 예상 40.4~40.5억$)·조정 EPS 1.22$(+38.6%, 예상 1.18$)로 <b>모두 상회<\/b>했고, 회사 가이던스 중간값(40억$·1.16$)도 넘었습니다. 무엇보다 12월 분기 매출 가이던스 <b>47억$(예상 44억$)·EPS 1.44$(예상 1.34$)<\/b>로 예상보다 7% 안팎 높게 냈습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출의 91%인 반도체 공정 제어가 <b>37.5억$(+29.5%, 전분기 +15.3%)<\/b>로 뛰었습니다. 최고경영자는 공정 제어가 <b>'AI 생태계 구축에 필수'<\/b>라며 첨단 파운드리·로직, 메모리 복잡도, 첨단 패키징, 고성능 컴퓨팅 수요를 성장 동력으로 꼽았습니다. 12월 분기 가이던스 47억$는 전년 대비 약 +43%입니다. 다만 HBM·패키징·중국 비중 숫자는 보도자료에 없어 어닝콜 확인이 필요합니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 주목하는 포인트<\/p><p>10월 22일 'AI 데이터센터 투자 둔화' 우려로 장비주가 일제히 빠지며 하루 약 −10%, <mark>52주 고점 307$ 대비 약 −50%<\/mark>까지 밀려 있었습니다. 7월엔 실적을 넘고도 가이던스 실망으로 −6%(시간외 추가 −7.7%) 빠졌던 회사라, 이번엔 <mark>다음 분기 매출 가이던스 47억$(예상 44억$)<\/mark>가 그 우려를 숫자로 반박하는지가 핵심입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"2026년 내내 AI 수요 환경은 계속 강해졌습니다\"<\/mark><cite>릭 월리스 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 2026년 웨이퍼 장비 시장을 1,500억$대 중반으로 올리고 2027년은 2,000억$ 이상으로 봤습니다.<\/p>\n    <blockquote>\"아직 공급이 (수요를) 못 따라가고 있습니다\"<cite>렌 히긴스 · 최고재무책임자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 장비 납기가 평균 약 12개월로, 광학 부품이 가장 큰 병목이라는 뜻입니다.<\/p>\n    <blockquote><mark>\"공정 제어, 특히 KLA는 AI 생태계 구축에 필수적입니다\"<\/mark><cite>릭 월리스 · 최고경영자 · 보도자료(요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 칩·HBM이 복잡해질수록 검사·계측 장비가 더 많이 필요하다는 뜻입니다.<\/p>\n    <blockquote>\"9월 분기는 모든 핵심 지표에서 가이던스 중간값을 넘었습니다\"<cite>릭 월리스 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 매출·마진·EPS가 회사가 약속한 수준보다 좋았다는 확인입니다.<\/p>\n    <blockquote>\"2026년을 좋은 위치에서 마치고 2027년을 내다보고 있습니다\"<cite>릭 월리스 · 최고경영자 · 보도자료(요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년 성장에 대한 자신감입니다. 2027년 웨이퍼 장비 시장 숫자는 오늘 어닝콜에서 나올 예정입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 받칠 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>12월 분기 가이던스 예상 row\"><span>옵션 예상 변동폭<\/span><span class=\"v\">±8.0% (최근 2년 평균 실제 ±7.1%)<\/span><\/div>\n    <div class=\"row\"><span>지난 실적 반응<\/span><span class=\"v\">7/29 −6.2%(시간외 추가 −7.7%)<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/KLAC\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">KLAC ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 칩 공장의 '검사 장비' 주문이 다음 분기에 더 커집니다<\/p><p>칩을 만드는 회사가 공장을 늘리면 검사·계측 장비가 먼저 들어갑니다. KLA가 다음 분기 매출을 예상보다 3억$ 높은 47억$로 잡았다는 건, 10월 장비주 급락의 이유였던 'AI 데이터센터 투자 둔화' 걱정과 달리 TSMC 같은 파운드리와 HBM 메모리 업체가 장비를 계속 사 가고 있다는 신호입니다.<\/p><p>신호는 12월 분기 가이던스와 공정 제어 +29.5%, 소음은 한 달 −23%의 주가 하락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 어닝콜에서 2027년 웨이퍼 장비 2,000억$ 이상, 패키징 공정 제어 +70% 넘게, 공급 부족이 나왔습니다. 다음은 램리서치·어플라이드머티리얼즈가 같은 2027년 숫자를 내는지, 광학 부품 병목이 언제 풀리는지입니다.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.prnewswire.com/news-releases/kla-corporation-reports-fiscal-2027-first-quarter-results-302922511.html\">회사 실적 보도자료(PR뉴스와이어, 공식)<\/a> · <a href=\"https://ir.kla.com/\">회사 IR<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0000319201/000031920126000024/exhibit991earningsrelease7.htm\">7월 실적 보도자료(SEC 8-K 첨부 99.1)<\/a> · <a href=\"https://www.stocktitan.net/news/KLAC/kla-corporation-reports-fiscal-2027-first-quarter-c4typye17e88.html\">스톡타이탄<\/a> · <a href=\"https://www.earningswhispers.com/epsdetails/KLAC\">어닝위스퍼스 · 컨센·위스퍼<\/a> · <a href=\"https://www.marketbeat.com/instant-alerts/upcoming-kla-klac-projected-to-post-earnings-on-wednesday-2026-10-21/\">마켓비트 · 컨센서스<\/a> · <a href=\"https://www.investing.com/news/earnings/kla-corporation-earnings-on-deck-after-semiconductor-selloff-93CH-4980317\">인베스팅닷컴 · 프리뷰<\/a> · <a href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-kla-beats-q4-2026-estimates-but-shares-fall-93CH-4818299\">인베스팅닷컴 · 7월 어닝콜 녹취<\/a> · <a href=\"https://www.tradingkey.com/news/market-movers/262247389-market-movers-klac-20261028\">트레이딩키 · 10/28 주가<\/a> · <a href=\"https://earnings-watcher.com/wiki/klac-implied-move\">어닝워처 · 옵션 예상 변동폭<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T22:43:10Z"}, {"id": "liteon-26q3", "date": "2026-10-30", "ts": "2026-10-30T15:00", "name": "라이트온 2301", "run": "10.30(금) 대만 실적 설명회 · 한국시간 10.30(금) 15:00", "html": "<article id=\"liteon-26q3\" data-date=\"2026-10-30\" data-krun=\"2026-10-30\" data-ts=\"2026-10-30T15:00\" data-layer=\"전력·냉각\" data-name=\"라이트온 2301\" data-sum=\"AI 관점 호재(AI 매출 비중 30% 돌파·클라우드 +약 60%) · 매출 574억(+28%) · EPS 3.27 사상 최대 · 4분기 전년·전분기 동반 성장 · 발표 전 종가 −4.6%(시장 급락) · 어닝콜 반영\">\n  <div class=\"tag\"><b>실적결과<\/b> 대만 · 2026년 3분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>라이트온(2301)<\/h3>\n  <p class=\"what\">대만 전원공급장치 회사입니다. AI 서버·랙 전원 모듈과 배터리 백업 장치를 클라우드 회사와 서버 조립사에 공급해, 델타와 함께 엔비디아·빅테크 랙 전원을 나눠 맡는 2번 주자입니다. 밸류체인 전력·냉각 층.<\/p>\n  <div class=\"hl chainpos\"><p class=\"k\">🔗 사슬 위치 · 엔비디아·클라우드 ▶ AI 서버 전원 공급장치<\/p><p>▪ <b>델타전자<\/b>: AI 서버 전원·냉각 대장<\/p><p>▪ <b>라이트온<\/b>: AI 서버 전원 2번 주자, 클라우드 고객 확대 중<\/p><p class=\"m\">→ 라이트온 AI 매출이 늘면 → AI 서버 랙 출하가 계속 늘고 있다는 신호입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>574억 대만달러<\/b>(전분기 +9%, 전년 +28%), 주당순이익 <b>3.27대만달러<\/b>(전년 +60%)로 사상 최대입니다. 증권가는 \"2분기 3.14를 넘고 3대만달러 이상\"을 예상했는데 이를 넘었습니다(공식 컨센서스 숫자는 확인 못 함). 매출총이익률 25.9%는 2분기 27.2%보다 낮지만 회사가 '평상시 기준'으로 든 상반기 평균 24.7%보다 높습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>올해 <b>AI 관련 매출 비중이 30%를 넘었고<\/b>, 3분기 클라우드·IoT 매출은 전년 대비 <b>약 60%<\/b>, 1~9월 클라우드 관련 매출은 <b>약 80%<\/b> 늘었습니다. 4분기에는 맞춤형 칩(ASIC)용 8.5kW 전원·배터리 백업이 양산 중이고 110kW 전원 선반이 새로 양산에 들어갑니다. 빅테크 설비투자가 랙 전원 출하로 그대로 내려오고 있다는 숫자입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p>실적은 <mark>EPS 3.27대만달러로 사상 최대<\/mark>였고 AI 매출 비중이 30%를 넘었습니다. 다만 <mark>매출총이익률은 25.9%로 2분기(27.2%)보다 낮아졌습니다<\/mark>. 실적은 대만 장 마감 뒤 나와 주가 반응은 다음 거래일(11/2)에 나옵니다. 10/30 종가 −4.6%는 대만 가권지수 1,156포인트 급락과 겹친 발표 전 움직임입니다.<\/p><\/div>\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"올해 AI 관련 매출 비중이 30%를 넘었습니다\"<\/mark><cite>추썬빈(邱森彬) · 총경리(사장) · 3분기 실적 설명회<\/cite><\/blockquote>\n    <p class=\"m\">→ 예전 PC·가전 부품 회사가 AI 전원 회사로 바뀌고 있다는 회사 스스로의 확인입니다.<\/p>\n    <blockquote>\"전 세계 AI 연산·데이터센터 인프라 수요가 계속 늘어 고급 AI 서버 전원과 전력 관리 시스템 수요가 올라갔고, 1~9월 클라우드 관련 매출이 전년보다 80% 늘었습니다\"<cite>추썬빈(邱森彬) · 총경리 · 3분기 실적 설명회<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 꺾인 기미는 없다는 뜻입니다. 4분기에도 핵심 사업이 전년·전분기 모두 성장한다고 했습니다(요지).<\/p>\n  <\/div>\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 누를 수 있는 이유<\/h4><ul>\n      <li><span><mark>매출총이익률 하락<\/mark><small>25.9% · 2분기 27.2%<\/small><\/span><\/li>\n      <li><span>4분기 숫자 가이던스 없음<small>'동반 성장' 문장만 · 마진 전망 없음<\/small><\/span><\/li>\n      <li><span>800V 전원 랙은 아직 샘플<small>이번 분기 샘플 출하 · 본격 양산은 2027년부터(7월 설명회 기준)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>EPS 3.27 사상 최대<\/mark><small>전년 +60% · 1~9월 8.08(+64%)<\/small><\/span><\/li>\n      <li><span>AI 매출 비중 30% 돌파<small>클라우드·IoT 3분기 약 +60%<\/small><\/span><\/li>\n      <li><span>4분기 신제품 양산<small>110kW 전원 선반·42인치 전원 선반 · 8.5kW 전원·배터리 백업<\/small><\/span><\/li>\n      <li><span>영업이익률 15.1%<small>전년 대비 +4.7%p<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억 대만달러)\", \"cap\": \"25.3Q는 전년 대비 +28%로 거꾸로 계산, 26.1Q는 1~9월 누적에서 뺀 값입니다\", \"items\": [{\"q\": \"25.3Q\", \"v\": 449}, {\"q\": \"26.1Q\", \"v\": 434}, {\"q\": \"26.2Q\", \"v\": 527}, {\"q\": \"26.3Q\", \"v\": 574, \"hi\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 주당순이익 추이 (대만달러)\", \"cap\": \"세 분기 연속 증가 · 3분기 사상
