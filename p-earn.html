    U.appendChild(row)});

<script type="application/json" id="seed">{"stamp": "2026-10-28 20:25", "notes": [{"id": "amkr-26q3", "date": "2026-10-26", "ts": "2026-10-26T16:03", "name": "앰코 AMKR", "run": "10.26(월) 뉴욕 장 마감 후 · 한국시간 10.27(화) 05:00", "html": "<article id=\"amkr-26q3\" data-date=\"2026-10-26\" data-ts=\"2026-10-26T16:03\" data-layer=\"후공정\" data-name=\"앰코 AMKR\" data-sum=\"AI 관점 호재(컴퓨팅 사상 최대·4Q 전년 +50%↑) · 매출❌ EPS❌(스마트폰 약세) · 시간외 +3.6%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · ★꼭 볼 것 · 물량확인용 · 어닝콜 반영<\/div>\n  <h3>앰코(AMKR)<\/h3>\n  <p class=\"what\">칩이 다 만들어진 뒤 마지막에 포장(패키징)하는 후공정 회사입니다. 주문서가 아니라 실제로 나온 물건을 세는 자리라, AI 칩 수요가 실제로 얼마나 움직이는지 보여 줍니다. 밸류체인 후공정 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">보통<\/span>헤드라인 매출 19.91억$(예상 20.2억$)·EPS 0.76$(예상 0.77~0.79$) <b>소폭 미달<\/b>, 4분기 가이던스(매출 19~20억$·EPS 0.65~0.75$)도 컨센(20.4억$·0.78$) 아래입니다. 다만 매출총이익률 18.3%(전년 14.3%)·순이익 +51%로 이익의 질은 좋아졌습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI·서버 쪽(컴퓨팅) 매출이 <b>전분기 +25%로 사상 최대<\/b>(비중 26%, 전년 19%)입니다. 어닝콜에서 4분기 컴퓨팅 매출을 <b>전분기 +10%대 초반·전년 +50% 넘게<\/b> 전망했고, 2.5D(AI 칩용 첨단 패키징) 프로그램 두 개가 4분기에 양산을 시작합니다. 헤드라인 미스는 메모리 가격 급등에 따른 스마트폰(통신) 약세라는 예고된 비AI 요인이라 판정에서 뺐습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 실망한 포인트 · 그래도 볼 포인트<\/p><p>헤드라인 미스의 원인은 <mark>스마트폰(통신) 매출 급감<\/mark>입니다 — 비중이 1년 새 51%에서 37%로 줄었습니다. 반대로 <mark>컴퓨팅 비중은 26%로 사상 최대<\/mark>, 금액으로 전분기 대비 약 +24%(비중으로 추정)입니다. AI 칩 포장 물량은 실제로 늘고 있다는 뜻입니다. 다만 올해 설비투자를 25억$로 상단을 깎은 점은 체크 포인트입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"예상했던 통신 약세에도 컴퓨팅과 자동차·산업이 사상 최대를 기록했고 마진도 계속 개선됐습니다\"<\/mark><cite>케빈 엥겔 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 스마트폰이 빠진 자리를 AI·서버(컴퓨팅)가 메우고 있다는 뜻입니다.<\/p>\n    <blockquote>\"고객 약정이 늘면서 수요 가시성이 좋아졌습니다\"<cite>케빈 엥겔 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 앞으로 받을 물량이 미리 잡히고 있다는 얘기입니다. 어닝콜에서 숫자로 확인합니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>매출·EPS 소폭 미달<\/mark><small>매출 19.91억$ vs 예상 20.2억$ · EPS 0.76$ vs 0.79$<\/small><\/span><\/li>\n      <li><span>통신(스마트폰) 급감<small>비중 51% → 37%, 금액 전년 약 −27%<\/small><\/span><\/li>\n      <li><span>4분기 가이던스 기대 이하<small>매출 19~20억$ · EPS 0.65~0.75$<\/small><\/span><\/li>\n      <li><span><mark>설비투자 상단 축소<\/mark><small>2026년 25~30억$ → 약 25억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>컴퓨팅 사상 최대<\/mark><small>비중 26%(전년 19%), 금액 전분기 약 +24%<\/small><\/span><\/li>\n      <li><span>마진 개선 계속<small>매출총이익률 18.3%(전년 14.3%), 순이익 전년 +51%<\/small><\/span><\/li>\n      <li><span>고객 다변화<small>상위 10개 고객 비중 73% → 66%<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"빨간 막대 = 예상보다 적음. 폭은 1~4% 안팎입니다.\", \"items\": [{\"k\": \"매출\", \"a\": 19.91, \"e\": 20.2, \"u\": \"억$\"}, {\"k\": \"EPS\", \"a\": 0.76, \"e\": 0.79, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"최종시장 비중 (%)\", \"cap\": \"컴퓨팅 26% 사상 최대 — 1년 전 19%\", \"items\": [{\"k\": \"통신\", \"v\": 37}, {\"k\": \"컴퓨팅\", \"v\": 26, \"hl\": 1}, {\"k\": \"자동차·산업\", \"v\": 22}, {\"k\": \"소비자\", \"v\": 15}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"점선 막대 = 4분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 19.87}, {\"q\": \"26.1Q\", \"v\": 16.85}, {\"q\": \"26.2Q\", \"v\": 18.98}, {\"q\": \"26.3Q\", \"v\": 19.91, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 19.5, \"g\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">19.91억$ (20.2~20.3억$) <span class=\"no\">❌<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전분기 / 전년 대비<\/span><span class=\"v\">+4.9% / +0.2%<\/span><\/div>\n    <div class=\"row\"><span>　회사 가이던스<\/span><span class=\"v\">19.5~20.5억$ (범위 안)<\/span><\/div>\n    <div class=\"row\"><span>주당순이익(회계)<\/span><span class=\"v\">0.76$ (0.77~0.79$) <span class=\"no\">❌<\/span><\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">18.3% (전분기 16.8% · 전년 14.3%)<\/span><\/div>\n    <div class=\"row\"><span>영업이익<\/span><span class=\"v\">2.25억$ · 11.3% (전년 +41%)<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">1.91억$ (전년 +51%)<\/span><\/div>\n    <div class=\"row\"><span>EBITDA<\/span><span class=\"v\">4.35억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>최종시장 · 물량 지표<\/h4>\n    <div class=\"row\"><span><mark>컴퓨팅<\/mark><\/span><span class=\"v\">26% (2Q 22% · 전년 19%) 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>　금액 추정<\/span><span class=\"v\">전분기 약 +24% · 전년 약 +37%<\/span><\/div>\n    <div class=\"row\"><span>통신(스마트폰)<\/span><span class=\"v no\">37% (2Q 42% · 전년 51%)<\/span><\/div>\n    <div class=\"row\"><span>　금액 추정<\/span><span class=\"v no\">전분기 약 −8% · 전년 약 −27%<\/span><\/div>\n    <div class=\"row\"><span>자동차·산업<\/span><span class=\"v\">22% · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>소비자<\/span><span class=\"v\">15%<\/span><\/div>\n    <div class=\"row\"><span>첨단 패키징<\/span><span class=\"v\">16.32억$ (전분기 +4.8% · 전년 −3.1%)<\/span><\/div>\n    <div class=\"row\"><span>일반 패키징<\/span><span class=\"v\">3.59억$ (전분기 +5.3% · 전년 +18.5%)<\/span><\/div>\n    <div class=\"row\"><span>상위 10개 고객 비중<\/span><span class=\"v\">66% (전년 73%)<\/span><\/div>\n    <p class=\"na\">금액 증감은 회사가 밝힌 비중으로 계산한 추정치입니다.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 재무 (1~9월 누적)<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">8.68억$<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">12.37억$<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름(계산)<\/span><span class=\"v no\">약 −3.7억$<\/span><\/div>\n    <div class=\"row\"><span>현금·단기투자<\/span><span class=\"v\">23.8억$<\/span><\/div>\n    <div class=\"row\"><span>차입금<\/span><span class=\"v\">24.7억$<\/span><\/div>\n    <div class=\"row\"><span>자사주 / 배당<\/span><span class=\"v\">약 0.32억$ / 주당 0.0835$<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 4분기<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">19~20억$<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">18~19%<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">1.60~1.85억$<\/span><\/div>\n    <div class=\"row\"><span>주당순이익<\/span><span class=\"v\">0.65~0.75$<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 설비투자<\/span><span class=\"v\"><mark>약 25억$로 축소 (기존 25~30억$)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>4분기 컨센서스<\/span><span class=\"v\">매출 20.4억$ · EPS 0.78$ → 가이던스가 <span class=\"no\">아래<\/span><\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 07:20<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>4분기 컴퓨팅 전망<\/b> <mark>전분기 대비 +10%대 초반, 전년 대비 +50% 이상<\/mark> — 고밀도 팬아웃(HDFO) CPU 프로그램 추가와 <mark>2.5D 프로그램 2개가 4분기 양산 시작<\/mark>. → AI 칩 포장 물량이 4분기에도 계속 늘어난다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>3분기 컴퓨팅<\/b> 전분기 +25%로 사상 최대, HDFO CPU 프로그램이 이끌었습니다.<\/p>\n    <p class=\"q\"><b>첨단 패키징 수요<\/b> 고객들이 더 일찍 참여하고 <mark>더 긴 생산능력 약정과 선급금<\/mark>으로 증설을 뒷받침하고 있다고 했습니다. → 설비투자 부담을 고객이 일부 나눠 지는 구조입니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>설비투자<\/b> 2026년 약 25억$, <mark>2027년에도 높은 수준 유지(2028~2029년까지 가능)<\/mark>. → 상단을 깎은 건 집행 시점 문제이고 증설 의지는 그대로라는 신호입니다.<\/p>\n    <p class=\"q\"><b>애리조나 공장<\/b> 1단계 2027년 말 완공·2028년 말 양산, 2단계 2027년 말 착공.<\/p>\n    <p class=\"q\"><b>메건 파우스트(최고재무책임자)<\/b> 마진 개선은 주로 \"고부가 첨단 패키징 비중이 커진 덕\"이라고 했습니다.<\/p>\n    <p class=\"na\">공장 가동률 숫자는 공개 요약 자료에서 확인하지 못했습니다.<\/p>\n    <p class=\"q\"><b>케빈 엥겔(최고경영자)<\/b> \"예상했던 통신 약세에도 컴퓨팅·자동차·산업이 사상 최대를 기록했고 마진도 계속 개선됐습니다.\"<\/p>\n    <p class=\"q\"><b>케빈 엥겔<\/b> \"핵심 고객 프로그램이 진행되고 고객 약정이 늘면서 수요 가시성이 좋아졌습니다.\"<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>정규장(발표 전)<\/span><span class=\"v no\">−6.34%<\/span><\/div>\n    <div class=\"row\"><span>정규장 종가<\/span><span class=\"v no\">36.81$<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+3.6% · 38.12$ (어닝콜 뒤, 정규장 낙폭 절반 회복)<\/span><\/div>\n    <div class=\"row\"><span>프리마켓 (10/27 뉴욕 8:11, 벤징가)<\/span><span class=\"v ok\">+3.64% · 38.15$<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v ok\">39.94$ (+8.50%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n  \n    <p class=\"na\">📈 실시간 주가·시간외·차트는 <a href=\"https://finance.yahoo.com/quote/AMKR\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">AMKR ↗ 야후 파이낸스<\/a>에서 바로 보세요(제목 옆 티커를 눌러도 됩니다). 주가 흐름 차트는 첫 거래일 종가가 나오면 여기에 그립니다.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트 예정<\/span><\/h4><p>첫 거래일(10/27) 종가가 나오면 시장이 결국 무엇을 문제 삼았는지(반겼는지) 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 칩 포장 물량은 늘고 있습니다 — 미스는 스마트폰 탓<\/p><p>앰코는 칩이 실제로 다 만들어져 나오는 마지막 관문이라, 주문서가 아니라 진짜 출하 물량을 보여 줍니다. 그 관문에서 AI·서버용(컴퓨팅) 물량이 네 분기 연속 늘어 비중이 19%에서 26%까지 올라왔습니다. 빅테크 설비투자가 실제 칩 생산으로 바뀌고 있다는 가장 정직한 증거입니다.<\/p><p>헤드라인이 예상에 못 미친 건 스마트폰(통신) 물량이 1년 새 3분의 1 가까이 줄었기 때문인데, 메모리 가격 급등으로 이미 예고된 약세라 AI 수요와는 따로 봐야 합니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 4분기 2.5D 프로그램 2개의 실제 양산 속도, 그리고 2027년 설비투자 규모.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.financialcontent.com/article/bizwire-2026-10-26-amkor-technology-reports-financial-results-for-the-third-quarter-2026\">회사 보도자료(비즈니스와이어)<\/a> · <a href=\"https://www.stocktitan.net/news/AMKR/amkor-technology-reports-financial-results-for-the-third-quarter-ksz89uoue40x.html\">스톡타이탄<\/a> · <a href=\"https://au.investing.com/news/stock-market-news/amkor-q3-2026-slides-highlight-margin-gains-advanced-packaging-growth-93CH-4715899\">인베스팅닷컴 · 슬라이드·어닝콜<\/a> · <a href=\"https://finance.yahoo.com/markets/stocks/articles/analyst-projections-key-metrics-reveal-184212797.html\">야후·잭스 컨센서스<\/a> · <a href=\"https://seekingalpha.com/news/4657190-amkor-technology-slips-as-q3-results-guidance-miss-estimates\">시킹알파 · 시간외<\/a><\/p>\n<\/article>", "updated": "2026-10-28T05:30:00+09:00"}, {"id": "asml-26q3", "date": "2026-10-14", "ts": "2026-10-14", "name": "ASML ASML", "run": "10.14(수) 유럽 장 시작 전 · 한국시간 10.14(수) 14:00", "html": "<article id=\"asml-26q3\" data-date=\"2026-10-14\" data-layer=\"장비\" data-name=\"ASML ASML\" data-sum=\"매출✅(부합) EPS✅ 가이던스✅ · 당일 −3.9%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기<\/div>\n  <h3>ASML(ASML)<\/h3>\n  <p class=\"what\">반도체 회로를 빛으로 웨이퍼에 찍어 내는 노광장비 세계 1위 회사입니다. 최첨단 칩에 꼭 필요한 극자외선(EUV) 노광장비는 전 세계에서 이 회사만 만듭니다. 엔비디아 GPU·고대역폭메모리(HBM)를 만드는 TSMC·삼성전자·SK하이닉스가 핵심 고객입니다. 밸류체인 장비 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출은 예상 <b>부합<\/b>, 주당순이익(EPS)·4분기 가이던스는 <b>예상 상회<\/b>. 사상 최대 매출 116.62억€(+55%), 총이익률 57.5%로 회사 목표 상단을 넘었습니다. 'AI 인프라 수요가 잘 빠지고 있나' 관점에선 오히려 <b>수요가 공급을 넘어서는<\/b> 단계 — 2027·2028년 생산 능력으로도 고객 수요를 다 못 채운다고 했습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>사상 최대 실적·연간 전망 상향에도 당일 −3.94%. ① 매출이 예상을 <b>겨우 맞춘 수준<\/b>(넘지 못함)이었고 ② 주당순이익 상회분의 일부는 투자 지분(미스트랄 AI) 평가이익 약 5억€ 같은 일회성이었으며 ③ 연간 전망 '상향'도 하단만 430→440억€로 올리고 상단은 450억€ 그대로였습니다. 여기에 ④ <mark>\"2027·2028년 공급이 수요를 다 못 채운다\"<\/mark> — 수요는 넘치는데 <b>팔 수 있는 양이 막혀 있다<\/b>는 말이 성장의 천장으로 읽혔습니다. 실적 전 7거래일 중 6일 하락하던 반도체 매도 흐름도 겹쳤습니다.<\/p><\/div>\n\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"현재 계획된 2027년과 2028년 공급은 고객 수요를 다 채우지 못할 것\"<\/mark><cite>크리스토프 푸케 · 최고경영자 · 실적 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 장비가 안 팔리는 게 아니라 <b>만드는 속도가 수요를 못 따라가는 것<\/b>. AI 인프라 수요가 2년 뒤까지 꽉 차 있다는 뜻입니다.<\/p>\n    <blockquote>\"고객들의 수요 전망은 주로 AI 관련 투자의 규모와 지속 기간에 대한 기대에서 나온다\"<cite>크리스토프 푸케 · 최고경영자<\/cite><\/blockquote>\n    <p class=\"m\">→ 고객들이 단기·중기 장비 수요 전망을 계속 올리고 있고, 그 근거가 AI라는 것. 일부 고객은 2029년, 심지어 2030년 물량까지 주문하고 싶어 한다고 했습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span>매출은 '부합'에 그침<small>116.62억€ vs 예상 116.2~117.2억€ — 기대가 높았던 만큼 '넘지 못함'<\/small><\/span><\/li>\n      <li><span><mark>공급이 성장의 천장<\/mark><small>2027·2028년 계획 생산 능력으로도 수요를 다 못 채움 — 신규 공장 1단계는 2029년<\/small><\/span><\/li>\n      <li><span>순이익 상회 일부는 일회성<small>미스트랄 AI 지분 평가이익 약 5억€ (주당 약 1.3€)<\/small><\/span><\/li>\n      <li><span>연간 전망 상단은 그대로<small>430~450억€ → 440~450억€, 하단만 상향<\/small><\/span><\/li>\n      <li><span>2027년 전망 구체성 부족<small>J.P.모건 \"2027년 전망 세부 내용 부족\"<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>4분기 가이던스 142~152억€<\/mark><small>예상 141.9억€ — 가이던스 하단이 이미 예상치<\/small><\/span><\/li>\n      <li><span>총이익률 57.5%로 목표 상단 돌파<small>회사 목표 55~57%, 4분기도 약 57% (예상 55.4%)<\/small><\/span><\/li>\n      <li><span>2027년부터 가격 인상<small>2028년에 효과 전부 반영 — 로저 다센 최고재무책임자<\/small><\/span><\/li>\n      <li><span>고객 선수금 급증<small>영업현금흐름 117.98억€ · 장기 계약부채 93.0억€ (작년 말 33.7억€)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"매출은 사실상 예상과 같고, 이익·다음 분기 전망이 크게 넘었습니다. 주당순이익에는 일회성 평가이익이 포함돼 있습니다.\", \"items\": [{\"k\": \"매출\", \"a\": 116.62, \"e\": 116.2, \"u\": \"억€\"}, {\"k\": \"희석 EPS\", \"a\": 12.93, \"e\": 10.8, \"u\": \"€\"}, {\"k\": \"4분기 매출 가이던스(중간값)\", \"a\": 147.0, \"e\": 141.9, \"u\": \"억€\"}, {\"k\": \"4분기 총이익률 가이던스\", \"a\": 57.0, \"e\": 55.4, \"u\": \"%\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억€)\", \"cap\": \"점선 막대 = 회사가 제시한 4분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 75.16}, {\"q\": \"25.4Q\", \"v\": 97.18}, {\"q\": \"26.1Q\", \"v\": 87.67}, {\"q\": \"26.2Q\", \" >중간배당<\/span><span class=\"v\">주당 1.88€ (전년 1.60€) · 11/4 지급<\/span><\/div>\n    <div class=\"row\"><span>현금·단기투자<\/span><span class=\"v\">127.35억€ (전분기 75.82억€)<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">119.07억€<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 2026년 4분기<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">142~152억€ (141.9억€) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>총이익률<\/span><span class=\"v\">약 57% (55.4%) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>연구개발비 / 판관비<\/span><span class=\"v\">약 12억€ / 약 4억€<\/span><\/div>\n    <div class=\"row\"><span>설치기반 관리 매출<\/span><span class=\"v\">약 37억€<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026년 연간 매출<\/span><span class=\"v\">440~450억€ (기존 430~450억€) · 약 +36%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026년 연간 총이익률<\/span><span class=\"v\">약 56% (기존 54~56%)<\/span><\/div>\n    <div class=\"row\"><span>　2026년 부문별 성장<\/span><span class=\"v\">극자외선(EUV) +45%↑ · 그 외 장비 약 +20% · 설치기반 약 +50%<\/span><\/div>\n    <div class=\"row\"><span>　메모리 / 로직 장비<\/span><span class=\"v\"><mark>메모리 약 +75%<\/mark> / 로직 약 +10%<\/span><\/div>\n    <div class=\"row\"><span>　중국<\/span><span class=\"v\">2026년 전체 매출의 약 20%<\/span><\/div>\n    <div class=\"row\"><span>EPS 가이던스<\/span><span class=\"na\">제시 안 함<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 발언<span class=\"call\">보도자료·인터뷰 반영<\/span><\/h4>\n    <p class=\"q\"><b>크리스토프 푸케(최고경영자)<\/b> <mark>\"현재 계획된 2027년과 2028년 공급은 고객 수요를 다 채우지 못할 것\"<\/mark> → 2027년·2028년 각각 30% 증설 계획으로도 부족하다는 말입니다. 아인트호번 신규 공장은 지난달 착공했지만 1단계 완공은 2029년이라, 그 전까지는 기존 장비 업그레이드와 처리량이 더 높은 장비 판매로 메웁니다.<\/p>\n    <p class=\"q\"><b>크리스토프 푸케<\/b> \"고객들이 단기·중기 장비 수요 전망을 계속 올리고 있다\" → 그 근거는 \"AI 관련 투자의 규모와 지속 기간에 대한 기대\"라고 했고, 2028년분 주문도 많이 들어오고 있다고 밝혔습니다.<\/p>\n    <p class=\"q\"><b>크리스토프 푸케<\/b> \"설치기반 관리 매출 33억€는 생산성 업그레이드 수요가 강해 목표를 넘었고, 총이익률을 목표 이상으로 끌어올렸다\" → 이미 깔린 장비를 업그레이드해 생산량을 늘리려는 고객이 많다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>로저 다센(최고재무책임자)<\/b> 2027년부터 가격을 올리고 2028년에 효과가 전부 반영된다 → 주문부터 출하까지 기간이 길어 가격 인상이 바로 실적에 찍히지는 않습니다.<\/p>\n    <p class=\"q\"><b>로저 다센<\/b> 일론 머스크의 테라팹(TeraFab) 같은 신규 고객에 대해 \"그 기회의 정확한 규모는 아직 살펴보는 중\" → 기존 TSMC·삼성전자·인텔·SK하이닉스·마이크론 외 새 수요처도 생기고 있습니다.<\/p>\n    <p class=\"na\">발언은 영어 원문을 우리말로 옮긴 요지입니다. 컨퍼런스콜 전문 녹취는 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/13 종가)<\/span><span class=\"v\">1,717.76$ (−1.9%)<\/span><\/div>\n    <div class=\"row\"><span>장전 · 암스테르담 장중<\/span><span class=\"v\">암스테르담 장중 최대 +3.6% 뒤 상승분 대부분 반납<\/span><\/div>\n    <div class=\"row\"><span>당일 (10/14 종가)<\/span><span class=\"v no\">1,650.00$ (−3.94%)<\/span><\/div>\n    <div class=\"row\"><span>10/15 종가<\/span><span class=\"v\">1,657.44$ (+0.45%)<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v\">±5.4%<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (미국예탁증서 종가, 달러)\", \"cap\": \"실적 당일 −3.94%, 10/22 램리서치 실적 다음 날 장비주와 함께 −6.93%\", \"items\": [{\"d\": \"10/9\", \"v\": 1780.34}, {\"d\": \"10/12\", \"v\": 1750.24}, {\"d\": \"10/13\", \"v\": 1717.76}, {\"d\": \"10/14\", \"v\": 1650.0}, {\"d\": \"10/15\", \"v\": 1657.44}, {\"d\": \"10/16\", \"v\": 1641.52}, {\"d\": \"10/19\", \"v\": 1647.12}, {\"d\": \"10/20\", \"v\": 1630.84}, {\"d\": \"10/21\", \"v\": 1676.69}, {\"d\": \"10/22\", \"v\": 1560.54}, {\"d\": \"10/23\", \"v\": 1571.8}, {\"d\": \"10/26\", \"v\": 1590.9}], \"mark\": \"10/14\", \"markLabel\": \"실적 발표(장전)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>실적 뒤 되돌림은 없었습니다.<\/b> 10/14 1,650$ 이후 1,630~1,660$에서 옆걸음하다 10/21 +2.8%로 반등했지만, 10/22 <mark>램리서치가 공급 제약·12월 중국 감소를 말하며 −11.8% 빠진 날 함께 −6.93%<\/mark>(1,560.54$) 밀렸습니다. 10/26 종가 1,590.90$로 발표 전(10/13)보다 약 −7.4%입니다.<\/p><p>결국 ASML·램리서치 모두 '수요는 넘치는데 공급이 막혀 다 못 판다'는 같은 이야기를 했고, 시장은 이를 장비 층 전체의 성장 속도 제한으로 받아들이는 중입니다. 다음 확인: 2027년 생산 능력 30% 증설이 계획대로 가는지, 2026년 1월 실적 때 2027년 매출 전망 숫자가 나오는지.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>AI 인프라 수요는 '잘 빠지는' 수준을 넘어 <b>장비 공급이 못 따라가는<\/b> 단계입니다. 메모리 장비 매출이 올해 약 75% 늘고 고객이 2029~2030년 물량까지 묻는다는 건 HBM·첨단 파운드리 증설이 길게 간다는 신호입니다. 다만 주가는 '얼마나 더 팔 수 있나'에 묶여 있어, 앞으로는 수요보다 생산 능력 증설 속도와 2027년 가격 인상이 실적을 정합니다.<\/p>\n  <\/section>\n  <p class=\"xref\">X 참고: 이번 정리에선 @wallstengine·@allday_stocks 글을 쓰지 않았습니다. 숫자는 회사 공식 자료(SEC 6-K) 기준이며, 지역별 비중·연간 부문별 성장률은 회사 발표를 옮긴 보도 기준입니다.<\/p>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000937966/000162828026065813/pressreleasefinancialresul.htm\">회사 IR(공식) · 3분기 실적 보도자료(SEC 6-K)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0000937966/000162828026025147/pressreleasefinancialresul.htm\">1분기 실적 보도자료(SEC 6-K)<\/a> · <a href=\"https://whbl.com/2026/10/14/asml-forecasts-q4-sales-above-expectations-on-ai-chip-demand/\">로이터 · 경영진 발언·2029~2030 주문<\/a> · <a href=\"https://www.boersen-zeitung.de/unternehmen-branchen/asml-erhoeht-die-prognose\">뵈르젠차이퉁 · 4분기 컨센서스(LSEG)·장중 반응<\/a> · <a href=\"https://finimize.com/content/asmls-blowout-quarter-put-its-guidance-back-in-focus\">피니마이즈 · 매출·EPS 컨센서스(팩트셋)<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/asml-raises-sales-forecast-for-a-third-time-but-q3-sales-miss-sends-stock-lower-earnings-selloff-spreads-to-mu-sndk-intc/cZxfWHbRBp9\">스톡트윗츠 · 컨센서스·발언<\/a> · <a href=\"https://xenospectrum.com/en/asml-china-sales-q3-2026/\">제노스펙트럼 · 지역별 비중<\/a> · <a href=\"https://www.tikr.com/zh/blog/asml-stock-falls-third-quarter-sales-miss\">TIKR · 미스트랄 평가이익·가격 인상<\/a> · <a href=\"https://beancount.io/blog/2026/10/20/asml-fy2026-q3-earnings-analysis\">빈카운트 · 손익·현금흐름 세부<\/a> · <a href=\"https://stockanalysis.com/stocks/asml/history/\">스톡애널리시스 · 일별 종가<\/a> · <a href=\"https://earnings-watcher.com/wiki/asml-earnings-october-2026\">어닝스워처 · 옵션 예상 변동폭<\/a><\/p>\n<\/article>", "updated": "2026-10-27T19:30+09:00"}, {"id": "be", "date": "2026-10-22", "ts": "2026-10-22", "name": "블룸에너지 BE", "run": "10.22(목) 뉴욕 장 마감 후 · 한국시간 10.23(금) 05:00", "html": "<article id=\"be\" data-date=\"2026-10-22\" data-layer=\"전력·발전\" data-name=\"블룸에너지 BE\" data-sum=\"매출✅ EPS✅ · 다음 날 −11.2%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기<\/div>\n  <h3>블룸에너지(BE)<\/h3>\n  <p class=\"what\">데이터센터 부지에 바로 설치하는 연료전지 발전기 회사입니다. 전력망 연결을 기다리지 않는 현장 전력이라 AI 데이터센터 수요를 받고 있습니다. 밸류체인 전력·발전 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>예상보다 17% 많음<\/b>(전년 대비 +138%), EPS 0.94$(예상 0.69$), 올해 세 번째 연간 가이던스 상향 — 숫자는 강했습니다. 아쉬운 건 이번 분기 영업현금흐름 마이너스 하나입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>매출 예상 17% 상회·세 번째 연간 가이던스 상향·S&amp;P 500 편입에도 금요일 <b>−11.2%<\/b>. ① <mark>영업현금흐름이 마이너스로 돌아서고 잉여현금흐름 약 −1.81억$<\/mark> — 재고·설비투자가 늘며 현금이 빠져나갔고 ② 올해 +122% 오른 뒤라 차익실현이 겹쳤습니다. 시장은 '매출은 늘었는데 현금은 언제 들어오나'를 물었습니다.<\/p><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">12.36억$ (10.6억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">+138% / +16%<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">0.94$ (0.69$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계기준 주당순이익<\/span><span class=\"v\">0.78$ (전년 −0.10$)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">34.5% (전년 30.4%)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익<\/span><span class=\"v\">2.86억$ · 마진 23.1%<\/span><\/div>\n    <div class=\"row\"><span>회계기준 영업이익<\/span><span class=\"v\">2.25억$ · 마진 18.2%<\/span><\/div>\n    <div class=\"row\"><span>조정 상각전영업이익<\/span><span class=\"v\">2.99억$ (전년 0.59억)<\/span><\/div>\n    <div class=\"row\"><span>조정 순이익<\/span><span class=\"v\">3.03억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별 매출 (마진은 조정 기준)<\/h4>\n    <div class=\"row\"><span>제품<\/span><span class=\"v\">10.74억$ (+179% YoY) · 38.4%<\/span><\/div>\n    <div class=\"row\"><span>설치<\/span><span class=\"v\">0.85억$ · −3.5%<\/span><\/div>\n    <div class=\"row\"><span>서비스<\/span><span class=\"v\">0.68억$ · 21.4%<\/span><\/div>\n    <div class=\"row\"><span>전기 판매<\/span><span class=\"v\">0.10억$ · 25.7%<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v no\">−0.27억$ (전분기 +2.26억)<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">1.53억$ (전분기 0.52억)<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름(계산)<\/span><span class=\"v no\">약 −1.81억$<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">24.87억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">9.28억$ (연초 6.43억)<\/span><\/div>\n    <div class=\"row\"><span>계약자산<\/span><span class=\"v\">7.93억$ (연초 1.79억)<\/span><\/div>\n    <div class=\"row\"><span>선수금·이연수익<\/span><span class=\"v\">7.54억$ (연초 1.44억)<\/span><\/div>\n    <div class=\"row\"><span>차입금<\/span><span class=\"v\">24.73억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>2026년 가이던스 (올해 세 번째 상향)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">44~46억$ (중간값 +122% YoY)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">약 34%<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익<\/span><span class=\"v\">9.6~10.3억$<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">3.10~3.40$<\/span><\/div>\n    <div class=\"row\"><span>이전 가이던스·컨센<\/span><span class=\"na\">보도자료에 없음, 확인 필요<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 (보도자료)<\/h4>\n    <p>최고경영자 KR 스리다르: 전력 공급이 중앙 발전소에서 현장 분산 발전으로 옮겨 가는 중이고, 블룸이 그 전환을 이끌고 있다고 했습니다. 고객으로 하이퍼스케일러(AI 데이터센터), 반도체 공장, 대형 유틸리티를 꼽았습니다.<\/p>\n    <p>최고재무책임자 사이먼 에드워즈: 매출 성장과 영업마진 확대, 연초 이후 실적과 고객 수요를 근거로 가이던스를 올렸다고 했습니다.<\/p>\n    <p class=\"na\">수주잔고 금액과 개별 계약은 보도자료에 없습니다. 어닝콜(한국시간 10/23 06:00) 요약은 아직 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 후<\/span><span>프리마켓 +2.5% / −2.5% 매체별 엇갈림<\/span><\/div>\n    <div class=\"row\"><span>금요일(10/23) 종가<\/span><span class=\"v no\">193.30$ · −11.2%<\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p>금요일 −11.2%(193.30$). 매출·이익은 강했지만 <mark>현금흐름 마이너스<\/mark>가 하락 이유로 정리됐습니다(모틀리풀). 연초 대비 크게 오른 상태라 '좋은 실적에 판다' 흐름도 겹쳤습니다.<\/p><p>다음 확인: 4분기에 계약자산·선수금이 실제 현금으로 바뀌는지(영업현금흐름 플러스 복귀).<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>계약자산과 선수금이 연초 대비 각각 4~5배로 늘어 수요는 숫자로 확인됩니다. 대신 재고와 설비투자가 함께 늘며 이번 분기 현금이 빠져나갔습니다. '계약→매출'은 확인, '매출→현금'은 다음 분기 확인 과제입니다.<\/p>\n  <\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0001664703/000162828026066890/ex991_q326financialresults.htm\">회사 보도자료(SEC)<\/a> · <a href=\"https://www.fool.com/coverage/stock-market-today/2026/10/23/stock-market-today-oct-23-bloom-energy-falls-on-cash-flow-concerns-despite-record-q3-revenue/\">모틀리풀 · 10/23 주가·하락 이유<\/a> · <a href=\"https://za.investing.com/news/stock-market-news/premarket-movers-crown-castle-jumps-75-on-spacex-talks-autoliv-slides-4522307\">인베스팅닷컴 프리마켓<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "camt-26q3", "date": "2026-10-14", "ts": "2026-10-14", "name": "캠텍 CAMT", "run": "10.14(수) 뉴욕 장 시작 전 · 사전공시 · 한국시간 10.14(수) 저녁", "html": "<article id=\"camt-26q3\" data-date=\"2026-10-14\" data-layer=\"장비\" data-name=\"캠텍 CAMT\" data-sum=\"사전공시 매출✅ · 4Q 가이던스 사상 최대 · 당일 −4.9%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 사전공시<\/div>\n  <h3>캠텍(CAMT)<\/h3>\n  <p class=\"what\">반도체를 쌓고 잇는 '첨단 패키징' 공정에서 칩에 흠집·불량이 없는지 보는 검사 장비와, 범프(칩을 잇는 미세한 돌기) 높이를 재는 계측 장비를 만드는 이스라엘 회사입니다. 고대역폭메모리(HBM)·2.5D/3D 칩 적층 공정에 장비가 들어갑니다. 밸류체인 장비 층.<\/p>\n  <p class=\"na\">※ 이 정리는 10/14 <b>사전공시(잠정 매출 미리 알리기)<\/b>와 같은 날 투자자 설명회 내용 기준입니다. 이익·마진 등 본실적은 <b>11/4 발표 후 덧붙입니다.<\/b><\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 수요가 잘 빠지고 있나?<\/p><p><span class=\"g\">좋음<\/span>3분기 매출이 회사 가이던스 상단을 살짝 넘겼고, 4분기는 <b>전년 대비 +40%<\/b> 사상 최대를 제시했습니다. 올해 받은 주문 8억$ 이상 가운데 <b>80% 이상이 첨단 패키징<\/b>에서 나왔습니다. AI 칩 패키징 수요가 이 회사 장비로 그대로 흘러들어오고 있다는 뜻입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>사상 최대 매출, 4분기 +40%, 2027년 8억$ 이상 전망까지 내놨는데 당일 −4.9%. ① 3분기 매출은 기존 가이던스(1.58~1.60억$) 상단을 <b>겨우 0.0~0.1억$<\/b> 넘겼고, ② 발표 전 이틀 동안 이미 −3%대씩 빠지며 기대가 식고 있었습니다. ③ 그 뒤 10/22 장비 업종 급락(같은 날 램리서치 −11.8%)에 <mark>−10.2%<\/mark>가 더해지면서 <mark>발표 전보다 약 −14%<\/mark> 아래에 있습니다. 하락 이유를 회사·언론이 직접 짚은 기사는 찾지 못했습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"우리 장비에 대해 지금까지 경험해 보지 못한 수준의 수요\"<\/mark><cite>라피 아미트 · 최고경영자 · 투자자 설명회(세미콘 웨스트)<\/cite><\/blockquote>\n    <p class=\"m\">→ 주문 8억$ 이상, 그중 80% 이상이 첨단 패키징. <b>수요가 숫자로 확인<\/b>되고 있다는 말입니다.<\/p>\n    <blockquote>\"올해의 이례적인 주문 유입이 탄탄한 수주잔고와 영업 기회를 만들어, 2027년까지 내다볼 수 있게 됐다\"<cite>라피 아미트 · 최고경영자 · 사전공시 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 2027년 매출 8억$ 이상(+35% 이상)을 처음 제시한 근거가 이미 쌓인 주문이라는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span>3분기 '상회' 폭이 작음<small>기존 가이던스 1.58~1.60억$ → 잠정 1.60~1.61억$ · 컨센서스 대비 +0.9%<\/small><\/span><\/li>\n      <li><span>장비 업종 전체 급락에 휩쓸림<small>10/22 램리서치 실적 다음 날 캠텍도 −10.2%<\/small><\/span><\/li>\n      <li><span>중국 비중 약 45%<small>회사는 \"2027년에도 최소 2026년만큼 강하다\"고 했지만, 수출 규제 이슈에 민감한 구조<\/small><\/span><\/li>\n      <li><span>증권사 목표가 하향<small>B.라일리 200$→166$(10/20, 매수 유지) — '밸류에이션 재조정'<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>2027년 매출 8억$ 이상 첫 전망<\/mark><small>2026년 약 5.95억$ 대비 +35% 이상 · 회사는 \"확정 가이던스 아닌 전망, 더 오를 수 있음\"<\/small><\/span><\/li>\n      <li><span><mark>약 3년 안에 연 12억$ 목표<\/mark><small>그 시점 총마진 55~56%, 영업이익률 34~36%(2025년 30%)<\/small><\/span><\/li>\n      <li><span>올해 주문 8억$ 이상<small>지난 업데이트 이후에만 2억$ 이상 추가 · 납품은 2027년까지<\/small><\/span><\/li>\n      <li><span>현금 8억$ 이상<small>인수합병 후보 100곳 이상 검토<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나 (사전공시 중간값)\", \"cap\": \"3분기 잠정 매출 1.60~1.61억$의 중간값 기준입니다. 넘긴 했지만 폭은 1% 안팎입니다.\", \"items\": [{\"k\": \"3분기 매출 vs 컨센서스\", \"a\": 1.605, \"e\": 1.59, \"u\": \"억$\"}, {\"k\": \"3분기 매출 vs 기존 가이던스 상단\", \"a\": 1.605, \"e\": 1.60, \"u\": \"억$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"26.3Q는 사전공시 중간값, 점선 막대 = 회사가 제시한 4분기 가이던스(약 1.8억$)\", \"items\": [{\"q\": \"25.3Q\", \"v\": 1.26}, {\"q\": \"25.4Q\", \"v\": 1.281}, {\"q\": \"26.1Q\", \"v\": 1.217}, {\"q\": \"26.2Q\", \"v\": 1.332}, {\"q\": \"26.3Q 잠정\", \"v\": 1.605, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 1.8, \"g\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적 (사전공시 · 잠정)<\/h4>\n    <div class=\"row\"><span>3분기 매출<\/span><span class=\"v\">1.60~1.61억$ (1.59억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　기존 회사 가이던스<\/span><span class=\"v\">1.58~1.60억$ → 상단 소폭 상회<\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">+27% / 약 +20%<\/span><\/div>\n    <div class=\"row\"><span>　분기 기준<\/span><span class=\"v\">사상 최대<\/span><\/div>\n    <div class=\"row\"><span>주당순이익 · 마진 · 이익<\/span><span class=\"na\">11/4 본실적에서 공개<\/span><\/div>\n    <div class=\"row\"><span>올해 누적 주문<\/span><span class=\"v\"><mark>8억$ 이상<\/mark> · 납품 2026~2027년<\/span><\/div>\n    <div class=\"row\"><span>　첨단 패키징 비중<\/span><span class=\"v\">주문의 80% 이상<\/span><\/div>\n    <div class=\"row\"><span>　외주 패키징·테스트 회사(OSAT) 비중<\/span><span class=\"v\">주문의 절반 조금 넘음<\/span><\/div>\n    <div class=\"row\"><span>　광(光)반도체(실리콘 포토닉스) 관련<\/span><span class=\"v\">현재 주문의 약 5%<\/span><\/div>\n    <div class=\"row\"><span>중국 비중<\/span><span class=\"v\">약 45%<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 전망<\/h4>\n    <div class=\"row\"><span>4분기 매출<\/span><span class=\"v\">약 1.80억$ · 전년 대비 +40% · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>　4분기 컨센서스<\/span><span class=\"na\">확인 못 함<\/span><\/div>\n    <div class=\"row\"><span>2026년 연간 매출<\/span><span class=\"v\">약 5.95억$ (2025년 4.96억$)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2027년 매출 (첫 전망)<\/span><span class=\"v\"><mark>8억$ 이상 · +35% 이상<\/mark><\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 장기 모델 (약 3년 내)<\/span><span class=\"v\">연 매출 약 12억$ · 연평균 +26% 이상<\/span><\/div>\n    <div class=\"row\"><span>　그때 총마진 / 영업이익률<\/span><span class=\"v\">55~56% / 34~36%<\/span><\/div>\n    <div class=\"row\"><span>　소프트웨어·서비스 비중<\/span><span class=\"v\">6% → 12% (약 1.4억$)<\/span><\/div>\n    <div class=\"row\"><span>공략 가능 시장 규모<\/span><span class=\"v\">약 22억$ → 2030년 약 60억$<\/span><\/div>\n    <div class=\"row\"><span>성장 동력 (신제품)<\/span><span>호크(Hawk)·이글 G5 · 내년 10세대 범프 높이 계측 센서<\/span><\/div>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/13 종가)<\/span><span class=\"v\">142.78$ (−3.3%)<\/span><\/div>\n    <div class=\"row\"><span>발표 당일 (10/14 종가)<\/span><span class=\"v no\">135.72$ (−4.9%)<\/span><\/div>\n    <div class=\"row\"><span>10/20 종가<\/span><span class=\"v\">127.90$ (4거래일 연속 하락)<\/span><\/div>\n    <div class=\"row\"><span>10/22 종가<\/span><span class=\"v no\">119.48$ (−10.2%)<\/span><\/div>\n    <div class=\"row\"><span>10/26 종가<\/span><span class=\"v\">123.31$ (+1.8%)<\/span><\/div>\n    <div class=\"row\"><span>52주 범위<\/span><span class=\"v\">91.91~215.99$<\/span><\/div>\n    <div class=\"row\"><span>본실적까지 옵션 예상 변동폭<\/span><span class=\"v\">±18.7% (11/20 만기 기준, 10/23 시점)<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"사전공시 당일 −4.9%, 10/22 장비 업종 급락일 −10.2%\", \"items\": [{\"d\": \"10/9\", \"v\": 152.81}, {\"d\": \"10/12\", \"v\": 147.63}, {\"d\": \"10/13\", \"v\": 142.78}, {\"d\": \"10/14\", \"v\": 135.72}, {\"d\": \"10/15\", \"v\": 131.38}, {\"d\": \"10/16\", \"v\": 129.47}, {\"d\": \"10/19\", \"v\": 128.94}, {\"d\": \"10/20\", \"v\": 127.9}, {\"d\": \"10/21\", \"v\": 133.09}, {\"d\": \"10/22\", \"v\": 119.48}, {\"d\": \"10/23\", \"v\": 121.16}, {\"d\": \"10/26\", \"v\": 123.31}], \"mark\": \"10/14\", \"markLabel\": \"사전공시(장전)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>숫자는 좋아졌는데 주가는 계속 밀렸습니다.<\/b> 10/14 135.72$ → 10/20 127.90$까지 4거래일 연속 하락, 10/22엔 램리서치 실적 충격으로 장비주가 함께 빠지며 하루 −10.2%(119.48$). 10/26 123.31$로 소폭 되돌렸지만 <mark>사전공시 전(142.78$)보다 약 −14%<\/mark>, 52주 고점보다는 40% 넘게 낮습니다. 그사이 B.라일리가 목표가를 200$→166$로 내렸습니다(매수 유지). 10/27 종가는 <span class=\"na\">확인 못 함<\/span>.<\/p><p>다음 확인: 11/4 본실적에서 ① 4분기 1.8억$ 유지·상향 여부, ② 마진(신제품 비중 확대 효과), ③ 3분기 신규 주문 규모와 중국 비중.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>캠텍의 주문 80% 이상이 첨단 패키징이라는 건, AI 칩을 HBM과 붙이는 공정 투자가 2027년까지 이어진다는 신호입니다. 수요 쪽 신호는 분명히 '좋음'이고, 주가 약세는 장비 업종 전체의 기대치 조정에 휩쓸린 성격이 큽니다. 11/4 본실적에서 주문 흐름이 꺾이지 않으면 패키징 장비 층의 그림은 그대로입니다.<\/p>\n  <\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0001109138/000117891326004767/zk2636225.htm\">회사 사전공시(SEC 6-K)<\/a> · <a href=\"https://www.prnewswire.com/il/news-releases/camtek-pre-announces-record-q3-revenues-above-guidance-provides-record-q4-guidance-and-initial-revenue-outlook-for-2027-302908515.html\">사전공시 보도자료(PR뉴스와이어)<\/a> · <a href=\"https://finviz.com/news/402462/camtek-pre-announces-record-q3-revenues-above-guidance-provides-record-q4-guidance-and-initial-revenue-outlook-for-2027\">핀비즈<\/a> · <a href=\"https://finance.yahoo.com/technology/ai/articles/camtek-targets-1-2b-revenue-010205008.html\">투자자 설명회 요약(야후 파이낸스)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0001109138/000117891326003975/zk2635905.htm\">2분기 실적·3분기 가이던스(SEC 6-K)<\/a> · <a href=\"https://stockanalysis.com/stocks/camt/history/\">주가(스톡애널리시스)<\/a> · <a href=\"https://ad-hoc-news.de/boerse/news/corporate-news/b-riley-cuts-target-for-camtek-stock-to-usd-166-00-outlook-rises-above-usd-800-00-million-in-2027/70415110\">B.라일리 목표가(ad-hoc-news)<\/a> · <a href=\"https://marketchameleon.com/articles/b/2026/10/14/camt-record-q3-revenue-above-guidance-2027-outlook-over-800-million\">옵션 예상 변동폭(마켓카멜레온)<\/a><\/p>\n<\/article>", "updated": "2026-10-27T19:30+09:00"}, {"id": "cdns-26q3", "date": "2026-10-26", "ts": "2026-10-26T16:02", "name": "케이던스 CDNS", "run": "10.26(월) 뉴욕 장 마감 후 · 한국시간 10.27(화) 05:00", "html": "<article id=\"cdns-26q3\" data-date=\"2026-10-26\" data-ts=\"2026-10-26T16:02\" data-layer=\"설계·EDA\" data-name=\"케이던스 CDNS\" data-sum=\"매출✅ EPS✅ 연간 가이던스 상향 · 백로그 사상 최대 · 시간외 +2~3%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 반영<\/div>\n  <h3>케이던스(CDNS)<\/h3>\n  <p class=\"what\">AI 칩을 설계하는 소프트웨어(EDA)와 설계자산, 칩 검증용 하드웨어(에뮬레이터)를 파는 회사입니다. 칩 물량보다 1~2년 앞서 움직이는 맨 앞단. 밸류체인 설계·EDA 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 16.33억$(+22%)·조정 EPS 2.11$ <b>모두 회사 가이던스 상단 돌파<\/b>, 연간 매출·EPS 가이던스 또 상향, 백로그 82억$ 사상 최대, 자사주 25억$ 추가.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 인프라 직접 매출(서버·HBM 등)은 없는 설계 단계 회사라, <b>AI 칩 설계가 얼마나 늘고 있나<\/b>로 봅니다. 백로그(받아 둔 주문) <b>82억$ 사상 최대<\/b>(연초 78억$), 그중 42억$가 1년 안 매출, 칩 설계자산(IP) 비중 15%(전년 14%)로 상승, 연간 매출 성장 전망 21%로 올해 세 번째 상향입니다. 비AI·지정학 변수인 중국 비중은 16%(전년 18%).<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p><mark>백로그 82억$ 사상 최대<\/mark>(직전 78억$)와 <mark>연간 매출 성장 21%로 상향<\/mark> — 빅테크 자체 AI 칩 설계가 늘어나는 흐름이 숫자로 확인됐습니다. 회계 EPS 미달은 인수·구조조정 비용 영향입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"뛰어난 3분기를 냈고 2026년 매출 성장 전망을 21%로 올립니다\"<\/mark><cite>아니루드 데브간 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 올해만 세 번째 상향. 칩 설계 수요가 계속 커지고 있다는 뜻입니다.<\/p>\n    <blockquote>AI 에이전트 도입 고객 100곳 넘어<cite>아니루드 데브간 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 설계 도구 자체에 AI를 붙여 파는 새 매출원이 자리 잡는 중입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>백로그 82억$ 사상 최대<\/mark><small>직전 분기 78억$<\/small><\/span><\/li>\n      <li><span><mark>연간 가이던스 상향<\/mark><small>매출 +21%, 조정 EPS 8.37~8.43$(이전 8.05~8.15$)<\/small><\/span><\/li>\n      <li><span>회사 가이던스 상단 돌파<small>매출 16.33억$ vs 15.95~16.25억$<\/small><\/span><\/li>\n      <li><span>자사주 25억$ 추가<small>잉여현금의 50% 넘게 환원<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>회계 EPS 가이던스 미달<small>1.05$ vs 1.11~1.17$ — 인수·구조조정 비용<\/small><\/span><\/li>\n      <li><span>회계 영업이익률 하락<small>26.2%(전년 31.8%)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"컨센서스 기준(잭스)\", \"items\": [{\"k\": \"매출\", \"a\": 16.33, \"e\": 16.1, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 2.11, \"e\": 2.04, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"점선 막대 = 4분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 13.39}, {\"q\": \"25.4Q\", \"v\": 14.4}, {\"q\": \"26.1Q\", \"v\": 14.74}, {\"q\": \"26.2Q\", \"v\": 15.84}, {\"q\": \"26.3Q\", \"v\": 16.33, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 17.1, \"g\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">16.33억$ (16.1억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 회사 가이던스<\/span><span class=\"v\">+22% / 15.95~16.25억$ 상단 돌파<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">2.11$ (2.04$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 주당순이익<\/span><span class=\"v no\">1.05$ (가이던스 1.11~1.17$)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익률<\/span><span class=\"v\">44.1% (가이던스 43.5~44.5%)<\/span><\/div>\n    <div class=\"row\"><span>회계 영업이익률<\/span><span class=\"v\">26.2% (전년 31.8%)<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별 · 핵심 지표<\/h4>\n    <div class=\"row\"><span>핵심 설계도구(EDA)<\/span><span class=\"v\">비중 69% · +20%<\/span><\/div>\n    <div class=\"row\"><span>설계자산(IP)<\/span><span class=\"v\">15% · +24%<\/span><\/div>\n    <div class=\"row\"><span>시스템 설계·해석<\/span><span class=\"v\">16% · +30%<\/span><\/div>\n    <div class=\"row\"><span>중국 비중<\/span><span class=\"v\">16% (전년 18%)<\/span><\/div>\n    <div class=\"row\"><span>하드웨어(에뮬레이터)<\/span><span class=\"v\">분기 사상 최대<\/span><\/div>\n    <div class=\"row\"><span><mark>백로그<\/mark><\/span><span class=\"v\">82억$ 사상 최대 (직전 78억$)<\/span><\/div>\n    <div class=\"row\"><span>1년 내 잔여계약<\/span><span class=\"v\">42억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 주주환원<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">4.24억$ (1~9월 14.14억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v\">4억$ · 한도 25억$ 추가<\/span><\/div>\n    <div class=\"row\"><span>구조조정 비용<\/span><span class=\"v\">0.42억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span>4분기 매출<\/span><span class=\"v\">16.95~17.25억$<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 EPS<\/span><span class=\"v\">2.19~2.25$<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 영업이익률<\/span><span class=\"v\">44~45%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 연간 매출<\/span><span class=\"v\"><mark>63.87~64.17억$ (+21%)<\/mark> · 이전 62.6~63.4억$<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 연간 조정 EPS<\/span><span class=\"v\">8.37~8.43$ · 이전 8.05~8.15$<\/span><\/div>\n    <div class=\"row\"><span>연간 영업현금흐름<\/span><span class=\"v\">약 20억$ (유지)<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 10.27(화) 07:45<\/span><\/h4>\n    <p class=\"q\"><b>아니루드 데브간(최고경영자)<\/b> \"뛰어난 3분기를 냈고 2026년 매출 성장 전망을 21%로 올립니다.\" AI 칩 설계 모델 '마에스트로'를 출시했고, AI 에이전트 도입 고객이 100곳을 넘었다고 했습니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>아니루드 데브간<\/b> <mark>\"설계 활동은 제가 본 것 중 가장 강합니다\"<\/mark> — 거의 모든 부문에서 점유율을 늘리고 있다고 했습니다.<br>→ 다음 세대 AI 칩 설계 물량이 계속 늘고 있다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>존 월(최고재무책임자)<\/b> \"성장이 빨라지고 넓어지고 있습니다.\" 하드웨어(에뮬레이터)는 AI·고성능컴퓨팅 고객 덕에 또 분기 최대, 올해도 연간 최대를 예상하며 공급 제약은 없다고 했습니다.<br>→ 칩이 커질수록 검증 장비가 꼭 필요해지는 구조입니다.<\/p>\n    <p class=\"q\"><b>아니루드 데브간<\/b> 반복 매출의 전년 비교는 지난해 있던 중국 매출 시점 효과가 올해 없어서 눌린 것이고, 그걸 빼면 견조하다고 했습니다. 2027년 전망은 평소처럼 2월에 내놓습니다.<\/p>\n    <p class=\"q\"><b>존 월<\/b> 2026년 조정 영업이익률 약 44.7% 예상(전년보다 약간 높음). 인수한 헥사곤 설계·엔지니어링 사업이 올해 마진을 누르지만 통합이 진행되면 내년엔 도움이 된다고 했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>정규장 (10/26, 발표 전)<\/span><span class=\"v ok\">322.17$ (+1.8%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+2.2~2.6% · 약 329~331$<\/span><\/div>\n  \n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v ok\">343.08$ (+6.49%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·시간외·차트는 <a href=\"https://finance.yahoo.com/quote/CDNS\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">CDNS ↗ 야후 파이낸스<\/a>에서 바로 보세요(제목 옆 티커를 눌러도 됩니다). 주가 흐름 차트는 첫 거래일 종가가 나오면 여기에 그립니다.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트 예정<\/span><\/h4><p>첫 거래일(10/27) 종가가 나오면 시장이 결국 무엇을 문제 삼았는지(반겼는지) 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">다음 AI 칩 설계가 더 늘고 있습니다<\/p><p>케이던스는 칩이 만들어지기 1~2년 전, 설계 단계에서 돈을 버는 회사입니다. 받아 둔 주문(백로그)이 82억$로 사상 최대를 찍고 연간 성장 전망을 21%로 올렸다는 건, 빅테크와 칩 회사들이 다음 세대 AI 칩을 더 많이 그리고 있다는 뜻입니다.<\/p><p>지금의 설비투자가 끝이 아니라 그다음 물량까지 준비되고 있다는 선행 신호로 읽힙니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/29 마이크로소프트·알파벳의 자체 칩(TPU 등) 계획 발언과 연결해 봅니다.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-cadence-tops-q3-2026-estimates-and-lifts-outlook-93CH-4973868\">어닝콜 녹취(인베스팅닷컴)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0000813672/000081367226000116/cdns10262026ex9901.htm\">회사 보도자료(SEC 8-K)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0000813672/000081367226000116/cfocommentary10262026ex9902.htm\">최고재무책임자 코멘트(SEC)<\/a><\/p>\n<\/article>", "updated": "2026-10-28T05:30:00+09:00"}, {"id": "cls-26q3", "date": "2026-10-26", "ts": "2026-10-26T16:17", "name": "셀레스티카 CLS", "run": "10.26(월) 뉴욕 장 마감 후 · 한국시간 10.27(화) 05:00", "html": "<article id=\"cls-26q3\" data-date=\"2026-10-26\" data-ts=\"2026-10-26T16:17\" data-layer=\"서버\" data-name=\"셀레스티카 CLS\" data-sum=\"매출✅ EPS✅ 가이던스 상향 · 2027 매출 400억$ 전망 · 프리마켓 +16~17%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 물량확인용 · 투자자의 날 10/27<\/div>\n  <h3>셀레스티카(CLS)<\/h3>\n  <p class=\"what\">하이퍼스케일러(빅테크 데이터센터)와 AI 연구소에 들어가는 AI 서버·네트워크 스위치를 설계·조립해 납품하는 회사입니다. 빅테크 설비투자가 실제 장비 물량으로 바뀌는 자리. 밸류체인 서버 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 58.3억$(+83%, 예상 54.7억$)·조정 EPS 3.30$(+109%, 예상 2.97$) <b>모두 큰 폭 상회<\/b>. 4분기 가이던스 62.75~65.75억$, 올해 연간 전망 상향, 2027년 매출 400억$(+90%) 첫 전망까지 나왔습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 데이터센터 쪽(CCS 부문) 매출이 <b>48.7억$로 전년 대비 +102%<\/b>, 그 안의 자체 설계 장비(HPS)가 약 23억$(+70%)입니다. 비AI 쪽(ATS)은 9.6억$·+23%로 비중이 작습니다. 회사는 2028년 고객 수요 전망이 2027년보다 \"의미 있게 높다\"고 했습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p><mark>2027년 매출 400억$·조정 EPS 21.50$<\/mark> 첫 전망 — 올해(210억$)의 약 2배입니다. 걸리는 점은 <mark>올해 잉여현금흐름 전망을 6억$에서 4.6억$로 낮춘 것<\/mark>입니다. 2027년 물량을 준비하느라 재고·운전자본에 돈이 묶이는 중입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"수요 환경은 계속 매우 견고합니다\"<\/mark><cite>롭 미오니스 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 하이퍼스케일러·AI 연구소 주문이 꺾이지 않았다는 뜻입니다.<\/p>\n    <blockquote>2028년 고객 수요 전망이 \"의미 있게 더 높습니다\"<cite>롭 미오니스 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 2027년 400억$ 다음 해까지 고객이 물량을 미리 알려 주고 있다는 얘기입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>2027 매출 400억$ 전망<\/mark><small>올해 210억$ 대비 +90% · 조정 EPS 21.50$<\/small><\/span><\/li>\n      <li><span>AI 데이터센터 부문 +102%<small>CCS 48.7억$ · 부문 마진 8.9%(전년 8.3%)<\/small><\/span><\/li>\n      <li><span>올해 전망 또 상향<small>매출 205억$ → 210억$ · EPS 11.30$ → 11.55$<\/small><\/span><\/li>\n      <li><span>예상 대비 큰 폭 상회<small>매출 +6.6% · EPS +11%<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span><mark>잉여현금흐름 전망 하향<\/mark><small>6억$ → 4.6억$ · 2027 성장용 운전자본<\/small><\/span><\/li>\n      <li><span>2027 설비투자 15~20억$<small>올해보다 크게 늘어나는 투자<\/small><\/span><\/li>\n      <li><span>34.5억$ 주식 발행<small>희석 · 순수령 33.9억$<\/small><\/span><\/li>\n      <li><span>조정 총마진 소폭 하락<small>11.2%(전년 11.7%)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"컨센서스 기준(벤징가)\", \"items\": [{\"k\": \"매출\", \"a\": 58.3, \"e\": 54.7, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 3.30, \"e\": 2.97, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"부문별 매출 비중 (%)\", \"cap\": \"AI 데이터센터 쪽(CCS)이 84% — 형광 표시\", \"items\": [{\"k\": \"CCS(데이터센터·통신)\", \"v\": 84, \"hl\": 1}, {\"k\": \"ATS(항공·산업 등)\", \"v\": 16}]}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">58.3억$ (54.7억$) <span class=\"ok\">✅<\/span> +83%<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">3.30$ (2.97$) <span class=\"ok\">✅<\/span> +109%<\/span><\/div>\n    <div class=\"row\"><span>회계 주당순이익<\/span><span class=\"v\">3.26$ (전년 2.31$)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익률<\/span><span class=\"v\">8.5% (전년 7.6%)<\/span><\/div>\n    <div class=\"row\"><span>회계 영업이익률<\/span><span class=\"v\">7.9% (전년 10.2%)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">11.2% (전년 11.7%)<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span><mark>CCS(데이터센터·통신)<\/mark><\/span><span class=\"v\">48.7억$ · +102% · 마진 8.9%<\/span><\/div>\n    <div class=\"row\"><span>　자체 설계 장비(HPS)<\/span><span class=\"v\">약 23억$ · +70%<\/span><\/div>\n    <div class=\"row\"><span>ATS(항공·산업·헬스케어 등)<\/span><span class=\"v\">9.6억$ · +23% · 마진 6.6%<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v\">1.28억$ (전년 0.89억$)<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">39.6억$<\/span><\/div>\n    <div class=\"row\"><span>차입금<\/span><span class=\"v\">약 8.2억$<\/span><\/div>\n    <div class=\"row\"><span>주식 발행<\/span><span class=\"v\">34.5억$ (순수령 33.9억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주<\/span><span class=\"v\">3분기 없음 · 4분기 유통주식 2.5% 한도 새로 신청<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span>4분기 매출<\/span><span class=\"v\">62.75~65.75억$<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 EPS<\/span><span class=\"v\">3.37~3.57$<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 영업이익률<\/span><span class=\"v\">8.7% (중간값)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 매출 / 조정 EPS<\/span><span class=\"v\">210억$ (이전 205억$) / 11.55$ (이전 11.30$)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 잉여현금흐름<\/span><span class=\"v no\">4.6억$ (이전 6억$)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2027 첫 전망<\/span><span class=\"v\"><mark>매출 400억$ · 조정 EPS 21.50$ · 영업이익률 9.0%<\/mark><\/span><\/div>\n    <div class=\"row\"><span>2027 설비투자<\/span><span class=\"v\">15~20억$<\/span><\/div>\n    <p class=\"na\">4분기 컨센서스는 확인 중입니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 (보도자료)<span class=\"call\">어닝콜·투자자의 날 한국시간 10.27(화) 21:00 — 끝나면 반영<\/span><\/h4>\n    <p class=\"q\"><b>롭 미오니스(최고경영자)<\/b> \"수요 환경은 계속 매우 견고합니다.\" 하이퍼스케일러와 최첨단 AI 연구소의 AI 인프라 사이클을 받칠 자리에 있다고 했습니다.<\/p>\n    <p class=\"q\"><b>롭 미오니스<\/b> 2028년 고객 수요 전망이 2027년 매출 전망보다 \"의미 있게 더 높다\"고 했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/23 종가)<\/span><span class=\"v\">260.01$ (−3.4%)<\/span><\/div>\n    <div class=\"row\"><span>정규장 (10/26, 발표 전)<\/span><span class=\"v no\">246.65$ (−5.1%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+9~10% · 약 269$<\/span><\/div>\n    <div class=\"row\"><span>프리마켓 (10/27 뉴욕 아침)<\/span><span class=\"v ok\">+16~17% <b class=\"ckd\">✔<\/b><\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v ok\">276.54$ (+12.12%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">10/27 프리마켓 업데이트(뉴욕 08:35): 트레이딩키 +15.8%, 구루포커스 +17% — 밤사이 시간외보다 상승폭이 더 커졌습니다. 오늘 투자자의 날 발언이 다음 재료입니다.<\/p>\n    <p class=\"na\">📈 실시간 주가·시간외·차트는 <a href=\"https://finance.yahoo.com/quote/CLS\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">CLS ↗ 야후 파이낸스<\/a>에서 바로 보세요.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트 예정<\/span><\/h4><p>투자자의 날(10/27)에 나오는 중장기 목표와 첫 거래일 종가를 보고 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">빅테크가 2027년 장비 주문을 이미 크게 잡아 두고 있습니다<\/p><p>셀레스티카는 하이퍼스케일러가 주문한 서버·스위치를 실제로 조립해 넘기는 회사라, 이 회사의 내년 전망은 곧 빅테크의 내년 장비 구매 계획입니다. 그 전망이 매출 400억$, 올해의 두 배 가까이로 나왔습니다.<\/p><p>고객들이 2028년 수요 예측까지 \"의미 있게 더 높게\" 알려 주고 있다는 건, AI 인프라 투자가 올해로 끝나지 않고 최소 2~3년 이어질 계획이라는 가장 구체적인 확인입니다. 이번 주 빅테크 설비투자 발표의 눈높이도 함께 올라갔습니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 오늘 밤 투자자의 날의 고객별·제품별(1.6T 스위치·구글 TPU 서버) 설명, 10/29 알파벳 설비투자 계획.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://moneycheck.com/celestica-cls-stock-rallies-9-after-hours-on-record-5-83b-quarterly-revenue\">머니체크 · 시간외<\/a> · <a href=\"https://www.tipranks.com/news/celestica-stock-takes-off-after-hours-whats-driving-the-surge-and-what-wall-street-sees-next\">팁랭크스 · 시간외<\/a> · <a href=\"https://www.globenewswire.com/news-release/2026/10/26/3388573/0/en/celestica-announces-third-quarter-2026-financial-results-and-will-hold-2026-investor-and-analyst-day.html\">회사 보도자료(글로브뉴스와이어)<\/a> · <a href=\"https://www.stocktitan.net/news/CLS/celestica-announces-third-quarter-2026-financial-results-and-will-b19vo85byhx2.html\">스톡타이탄<\/a> · <a href=\"https://www.benzinga.com/analyst-stock-ratings/price-target/26/10/62583576/celestica-gears-up-for-q3-print-here-are-the-recent-forecast-changes-from-wall-streets-most-accurate-analysts\">벤징가 · 컨센서스<\/a><\/p>\n<\/article>", "updated": "2026-10-28T05:30:00+09:00"}, {"id": "gev-26q3", "date": "2026-10-28", "ts": "2026-10-28T06:29", "name": "GE버노바 GEV", "run": "10.28(수) 뉴욕 장전 · 한국시간 10.28(수) 20:00", "html": "<article id=\"gev-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T06:29\" data-layer=\"전력·발전\" data-name=\"GE버노바 GEV\" data-sum=\"AI 관점 호재(전력 수주 +178%·가스터빈 122GW) · 매출✅ EPS✅ 가이던스✅(연간 매출·마진·현금 상향) · 전력망 수주 유기 −9%⚠ · 프리마켓 +1.7%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 대기(한국시간 10.28 20:30)<\/div>\n  <h3>GE버노바(GEV)<\/h3>\n  <p class=\"what\">가스터빈(발전기)·전력망 장비(변압기·개폐기)·풍력 터빈을 만들고 정비하는 회사입니다. 데이터센터의 진짜 병목인 '전기'를 만드는 쪽. 밸류체인 전력·발전 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 126.4억$(예상 120억$)·EPS 4.81$(예상 4.00~4.01$)·조정 EBITDA 19.4억$(예상 16.8억$)로 <b>모두 상회<\/b>했습니다. 수주 293억$(유기 +96%), 잉여현금 54.1억$로 연간 매출·EBITDA 마진·잉여현금 가이던스를 <b>모두 올렸습니다<\/b>.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>데이터센터 전력 수요가 몰리는 전력(가스터빈) 부문 수주가 <b>217.8억$, 유기 +178%<\/b>입니다. 가스터빈 수주잔고+생산슬롯 예약이 <b>116 → 122GW<\/b>로 늘었고 연말 130GW 이상을 예상합니다. 기사 인용으로는 가스터빈 주문 장부의 약 20%가 AI 데이터센터입니다. 다만 전력망(일렉트리피케이션) 수주가 <b>유기 기준 −9%<\/b>라 이 줄은 어닝콜에서 확인이 필요합니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>7월엔 EPS가 예상에 못 미쳐 하루 −8.7% 빠졌던 회사입니다. 이번엔 <mark>수주 293억$·유기 +96%<\/mark>(사전 한 애널리스트 전망 +44%)로 두 배를 넘었고, <mark>연간 잉여현금 가이던스를 115~125억$ → 160~170억$<\/mark>로 크게 올렸습니다. 수주잔고는 1,970억$로 한 분기에 200억$ 늘었습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"4분기에 수주잔고가 2,000억$를 넘을 것으로 봅니다\"<\/mark><cite>스콧 스트라직 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 몇 년 치 일감이 이미 쌓여 있고 계속 늘고 있다는 뜻입니다.<\/p>\n    <blockquote>\"우리 실적과 앞으로의 궤도에 대한 자신감으로 2026년 가이던스를 올립니다\"<cite>스콧 스트라직 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 올해 세 번째 연속 연간 가이던스 상향입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>수주 293억$ 유기 +96%<\/mark><small>전력 부문 217.8억$ · 유기 +178%<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 연간 잉여현금 가이던스 160~170억$<small>이전 115~125억$ · 3분기에만 54.1억$<\/small><\/span><\/li>\n      <li><span>가스터빈 122GW<small>잔고 53→64GW · 슬롯 예약 63→58GW(주문 전환)<\/small><\/span><\/li>\n      <li><span>자사주 한도 2배<small>100억$ → 200억$ · 3분기 16억$ 매입<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>⚠ 전력망 수주 유기 −9%<small>53.7억$ · 회계상 +6%는 인수 효과<\/small><\/span><\/li>\n      <li><span>대형 인수 90억$<small>트렌치 그룹 · 2027년 말 완료 예정<\/small><\/span><\/li>\n      <li><span>풍력 여전히 약함<small>EBITDA 이익률 2.6% · 연간 손실 4~5억$<\/small><\/span><\/li>\n      <li><span>데이터센터 수주 금액 미공개<small>보도자료에 없음  class=\"row\"><span>풍력<\/span><span class=\"v\">수주 21.4억$ +17% · 매출 27.4억$ +4% · 이익률 2.6% (전년 −2.3%)<\/span><\/div>\n  <\/section>\n\n  <section><h4>핵심 지표<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 수주<\/span><span class=\"v ok\">293억$ · 유기 +96%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 수주잔고<\/span><span class=\"v ok\">1,970억$ · 전분기 대비 +200억$ (4분기 2,000억$ 넘을 전망)<\/span><\/div>\n    <div class=\"row\"><span><mark>가스터빈 잔고+슬롯 예약<\/mark><\/span><span class=\"v\">116 → 122GW · 연말 130GW 이상 전망<\/span><\/div>\n    <div class=\"row\"><span>　이번 분기 신규 계약<\/span><span class=\"v\">11GW (슬롯 예약 8 + 주문 3) · 예약→주문 전환 13GW · 출하 5GW<\/span><\/div>\n    <div class=\"row\"><span>　가스 장비 잔고 / 슬롯 예약<\/span><span class=\"v\">53 → 64GW / 63 → 58GW<\/span><\/div>\n    <div class=\"row\"><span>전력망 장비 잔고<\/span><span class=\"v\">422억$ · +60% YoY (프롤렉GE 50억$ 포함) · 수주/매출 약 1.4<\/span><\/div>\n    <div class=\"row\"><span>AI 데이터센터 비중<\/span><span class=\"v\">가스터빈 주문 장부의 약 20% (기사 인용)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">61억$<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v\">54.1억$ (전년 7.3억$)<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">168억$ (전분기 대비 약 +40억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주<\/span><span class=\"v\">3분기 16억$(170만 주) · 10/1~23 13억$ · 한도 100억$ → 200억$<\/span><\/div>\n    <div class=\"row\"><span>배당<\/span><span class=\"v\">분기 0.50$ 유지 · 1~9월 주주환원 57억$<\/span><\/div>\n    <div class=\"row\"><span>인수<\/span><span class=\"v\">트렌치 그룹(고압 전력망 장비) 90억$ · 2027년 말 완료 예정<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 (2026년)<\/h4>\n    <div class=\"row\"><span><mark>매출<\/mark><\/span><span class=\"v ok\">465~475억$ (이전 455~465억$, 예상 462억$) ✅ 상향<\/span><\/div>\n    <div class=\"row\"><span>조정 EBITDA 이익률<\/span><span class=\"v ok\">13.5~14.5% (이전 12~14%) 상향<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 잉여현금흐름<\/span><span class=\"v ok\">160~170억$ (이전 115~125억$) 상향<\/span><\/div>\n    <div class=\"row\"><span>전력 유기 성장 / 이익률<\/span><span class=\"v\">19~21% (이전 18~20%) / 19~21% (이전 17~19%)<\/span><\/div>\n    <div class=\"row\"><span>전력망 매출 / 이익률<\/span><span class=\"v\">145~150억$ (프롤렉GE 약 31억$ 포함) / 18~20% 위쪽<\/span><\/div>\n    <div class=\"row\"><span>풍력<\/span><span class=\"v\">유기 매출 한 자릿수 중반 감소(이전 10% 초반 감소) · EBITDA 손실 4~5억$(이전 약 4억$)<\/span><\/div>\n    <p class=\"na\">연간 매출 가이던스는 1월 440~450억$ → 4월 445~455억$ → 7월 455~465억$ → 10월 465~475억$로 올해 세 번 올랐습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<\/h4>\n    <p class=\"q\"><b>스콧 스트라직(최고경영자) · 보도자료<\/b> \"전 세계에서 전력 인프라 수요가 늘고 있다\", 전력회사·데이터센터 고객을 위한 새 해법을 계속 내놓겠다고 했습니다.<\/p>\n    <p class=\"q\"><b>켄 파크스(최고재무책임자) · 보도자료<\/b> \"강한 실적을 바탕으로 2026년 매출·조정 EBITDA 이익률·잉여현금 가이던스를 올린다\".<\/p>\n    <p class=\"na\">어닝콜은 뉴욕 7:30(한국시간 20:30)입니다. 데이터센터·하이퍼스케일러 직접 계약, 전력망 수주 감소 이유, 가스터빈 가격·증설 발언은 콜 뒤에 보강합니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 직후<\/span><span class=\"v ok\">912.09$ · +1.7% (스톡스토리) · 다른 기사 +2.5%<\/span><\/div>\n    <div class=\"row\"><span>지난 실적 반응<\/span><span class=\"v\">7/22 −8.7% · 4/22 +13.7%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/GEV\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">GEV ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터용 전기를 만드는 터빈 주문이 거의 세 배가 됐습니다<\/p><p>GPU와 냉각 설비가 있어도 전기가 없으면 데이터센터를 못 돌립니다. 전력 부문 수주 +178%와 가스터빈 122GW는 몇 년 뒤 들어설 데이터센터 규모를 미리 보여 줍니다. 오늘 아침 버티브(수주 +100% 이상)와 같은 방향의 신호입니다.<\/p><p>신호는 수주·수주잔고와 잉여현금 가이던스, 소음은 프리마켓 등락입니다. 전력망 수주 유기 −9%는 한 분기 숫자인지 어닝콜에서 확인합니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 어닝콜의 데이터센터 직접 계약 발언, 그리고 내일 캐터필러·콴타서비스.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0001996810/000199681026000162/gevpressrelease3q26.htm\">회사 실적 보도자료(SEC 8-K, 공식)<\/a> · <a href=\"https://www.gevernova.com/news/ge-vernova-reports-strong-third-quarter-2026-financial-performance\">회사 IR 뉴스(공식)<\/a> · <a href=\"https://www.investing.com/news/earnings/ge-vernova-stock-gains-on-earnings-beat-raised-guidance-4978247\">인베스팅닷컴 · 컨센서스<\/a> · <a href=\"https://stockstory.org/us/stocks/nyse/gev/news/earnings/ge-vernova-nysegev-reports-strong-q3-2026-full-year-outlook-slightly-exceeds-expectations\">스톡스토리 · 컨센서스·주가<\/a> · <a href=\"https://huggingnews.com/earnings/ge-vernova-hikes-2026-outlook-following-surge-in-third-quarter-orders-f9a15b32\">허깅뉴스 · 데이터센터 비중<\/a> · <a href=\"https://www.benzinga.com/analyst-stock-ratings/analyst-color/26/10/62479818/ge-vernova-q3-preview-analyst-projects-orders-growth-of-44\">벤징가 · 수주 전망(제목)<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T11:18:26Z"}, {"id": "glw-26q3", "date": "2026-10-27", "ts": "2026-10-27T07:01", "name": "코닝 GLW", "run": "10.27(화) 뉴욕 장전 · 한국시간 10.27(화) 20:00", "html": "<article id=\"glw-26q3\" data-date=\"2026-10-27\" data-ts=\"2026-10-27T07:01\" data-layer=\"광학\" data-name=\"코닝 GLW\" data-sum=\"AI 관점 호재(광통신 +44%·생성형 AI 제품 두 배) · 매출✅ EPS✅ 가이던스✅ · 설비투자 약 20억$ 부담 · 첫 거래일 −1.1%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 반영(한국시간 10.28 07:05)<\/div>\n  <h3>코닝(GLW)<\/h3>\n  <p class=\"what\">데이터센터 안팎을 잇는 광섬유·광케이블·커넥터와 디스플레이·스마트폰 커버 유리를 만드는 소재 회사입니다. AI 데이터센터에서는 GPU 서버끼리 잇는 광 연결선 공급사. 밸류체인 광학 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>코어 매출 50.8억$(+19%, 예상 50.3억$)·코어 EPS 0.91$(+36%, 예상 0.88$) <b>모두 상회<\/b>하고, 7월에 낸 3분기 가이던스(매출 49~50억$·EPS 0.85~0.89$) 위쪽 끝도 넘었습니다. 4분기 EPS 가이던스 0.96~1.00$도 예상 0.93$보다 높습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 쪽인 광통신 부문 매출이 <b>23.8억$·+44%<\/b>, 그 안의 엔터프라이즈(데이터센터) +84%, <b>생성형 AI 제품 +100% 이상(두 배)<\/b>입니다. 광통신 비중은 코어 매출의 약 47%. 비AI 쪽 유리(디스플레이·특수소재 통합) 15.1억$는 −3%로 약하지만 AI 판정과는 따로 봅니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p>광통신 성장 속도가 2분기 +32%에서 <mark>3분기 +44%로 더 빨라졌습니다<\/mark>. 분기 중 <mark>여러 해짜리 수십억$ 규모 장기계약 4건<\/mark>(버라이즌·AT&T 포함)을 따냈습니다. 주가는 지난 1년 약 +48% 오른 상태라, 숫자보다 어닝콜에서 나올 하이퍼스케일러 물량 발언이 반응을 가를 수 있습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"뛰어난 3분기를 냈습니다\"<\/mark><cite>웬델 위크스 · 회장 겸 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 매출·EPS·마진이 모두 가이던스 위로 나왔다는 자신감입니다.<\/p>\n    <blockquote>연 매출 속도를 \"두 배로 늘릴 길\"을 제시했습니다<cite>에드 슐레진저 · 최고재무책임자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 연 200억$ 속도를 2030년 말까지 400억$로 키우는 '스프링보드' 계획을 그대로 밀고 간다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>생성형 AI 제품 매출 두 배<\/mark><small>엔터프라이즈 +84% · 광통신 +44%<\/small><\/span><\/li>\n      <li><span>가이던스 위쪽 끝 돌파<small>매출 50.8억$(가이던스 49~50억$) · EPS 0.91$(0.85~0.89$)<\/small><\/span><\/li>\n      <li><span>4분기 EPS 가이던스 예상 상회<small>0.96~1.00$ vs 예상 0.93$<\/small><\/span><\/li>\n      <li><span>장기계약 4건<small>여러 해·수십억$ 규모 · 버라이즌·AT&T<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>유리 부문 역성장<small>15.1억$ −3% · 순이익 −10%<\/small><\/span><\/li>\n      <li><span>4분기 매출 가이던스 아래쪽<small>52억$ — 예상 52.1억$와 비슷<\/small><\/span><\/li>\n      <li><span>태양광 적자 전환<small>순손실 0.07억$(전년 이익 0.3억$)<\/small><\/span><\/li>\n      <li><span>1년 +48% 오른 주가<small>기대가 이미 높음<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"컨센서스 기준(인베스팅닷컴)\", \"items\": [{\"k\": \"코어 매출\", \"a\": 50.81, \"e\":
