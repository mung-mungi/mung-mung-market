계 38%)<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span><mark>제품 매출<\/mark><\/span><span class=\"v\">1.143억$ · +22% 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>로열티<\/span><span class=\"v\">0.77억$ (전년 0.651억$)<\/span><\/div>\n    <div class=\"row\"><span>계약·기타<\/span><span class=\"v\">0.27억$ (전년 0.201억$)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">1.025억$ · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>현금·투자자산<\/span><span class=\"v\">7.77억$ (전분기 −0.48억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v\">1.354억$<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 재고<\/span><span class=\"v\">0.872억$ (연초 0.441억$) · 사유 미공개<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 4분기<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">2.27~2.33억$<\/span><\/div>\n    <div class=\"row\"><span>제품 매출<\/span><span class=\"v\">1.27~1.33억$<\/span><\/div>\n    <div class=\"row\"><span>로열티 / 계약·기타<\/span><span class=\"v\">0.68~0.74억$ / 0.26~0.32억$<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">0.84~0.92$<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 07:20<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>뤽 세라팽(최고경영자)<\/b> <mark>\"AI가 우리 모든 사업에 강한 순풍을 만들고 있습니다.\"<\/mark> 여러 세대 버퍼칩(RCD) 수요가 강하다고 했습니다.<\/p>\n    <p class=\"q\"><b>뤽 세라팽<\/b> 4분기 \"또 한 번 사상 최대 제품 매출\" 전망. 컴패니언칩(전원관리칩 등)은 연초 제품 매출의 10%대 초반이었고 4분기에도 전분기 대비 늘 것으로 봤습니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>뤽 세라팽<\/b> <mark>\"공급은 계속 빠듯할 것\"<\/mark>. 메모리 값이 비싸 고객이 모듈 수는 늘리되 모듈당 용량은 줄이는 흐름이 있다고 했습니다. → 칩 개수(램버스 매출)에는 영향이 작습니다.<\/p>\n    <p class=\"q\"><b>뤽 세라팽<\/b> MRDIMM(차세대 고용량 모듈)은 \"아직 매우 작다\", 전체 기회는 6억$ 규모. 매출총이익률은 60~63% 유지.<\/p>\n    <p class=\"q\"><b>뤽 세라팽(최고경영자)<\/b> \"가이던스를 넘는 사상 최대 매출과 이익, 사상 최대 제품 매출과 영업현금흐름을 냈고, 4분기는 더 강할 것으로 봅니다.\"<\/p>\n    <p class=\"q\">LPDDR6 메모리 모듈용 새 전원관리 칩과 데이터센터 보안 설계자산을 출시했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>정규장 (발표 전)<\/span><span class=\"v ok\">85.65$ → 90.32$ (+5.45%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v no\">−0.85% · 89.55$<\/span><\/div>\n  \n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v no\">88.91$ (−1.56%, 10/27 종가 · 직전 종가 대비)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·시간외·차트는 <a href=\"https://finance.yahoo.com/quote/RMBS\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">RMBS ↗ 야후 파이낸스<\/a>에서 바로 보세요(제목 옆 티커를 눌러도 됩니다). 주가 흐름 차트는 첫 거래일 종가가 나오면 여기에 그립니다.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 업데이트 예정<\/span><\/h4><p>첫 거래일(10/27) 종가가 나오면 시장이 결국 무엇을 문제 삼았는지(반겼는지) 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 서버 한 대에 들어가는 메모리가 늘고 있습니다<\/p><p>램버스의 제품 매출은 서버 메모리 모듈 수에 비례합니다. 그 제품 매출이 사상 최대를 찍고 4분기엔 더 높게 가이던스를 냈다는 건, AI 서버가 늘어날 뿐 아니라 한 대당 메모리도 많아지고 있다는 뜻입니다.<\/p><p>메모리 층(SK하이닉스·삼성전자·마이크론)의 수요가 탄탄하다는 걸 부품 쪽에서 미리 확인해 준 셈입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/28 SK하이닉스 실적에서 서버 D램·HBM 출하가 같은 방향인지, 램버스 재고 증가가 다음 분기 판매로 소화되는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://ph.investing.com/news/stock-market-news/earnings-call-transcript-rambus-tops-q3-2026-estimates-on-record-revenue-93CH-2650730\">인베스팅닷컴 어닝콜 녹취<\/a> · <a href=\"https://www.financialcontent.com/article/bizwire-2026-10-26-rambus-reports-third-quarter-2026-financial-results\">회사 보도자료(비즈니스와이어)<\/a> · <a href=\"https://www.marketbeat.com/earnings/reports/2026-10-26-rambus-inc-stock/\">마켓비트 · 컨센서스<\/a><\/p>\n<\/article>", "updated": "2026-10-28T05:30:00+09:00"}, {"id": "samsung-26q3", "date": "2026-10-29", "ts": "2026-10-29T09:00", "name": "삼성전자 005930", "run": "10.29(목) 한국 장중 · 확정실적 · 한국시간 10.29(목) 09:00", "html": "<article id=\"samsung-26q3\" data-date=\"2026-10-29\" data-krun=\"2026-10-29\" data-ts=\"2026-10-29T09:00\" data-layer=\"칩·메모리\" data-name=\"삼성전자 005930\" data-sum=\"매출❌ 영업이익✅ EPS❌ · AI 관점 호재(메모리 매출 +16%) · 장중 −4.8%\">\n  <div class=\"tag\"><b>실적결과<\/b> 한국 장중 · 2026년 3분기 확정실적 · 물량확인용 · 미래전망 킥 · 어닝콜 반영<\/div>\n  <h3>삼성전자(005930)<\/h3>\n  <p class=\"what\">D램·낸드·고대역폭메모리(HBM)를 만드는 세계 최대 메모리 회사이자 갤럭시 스마트폰·가전을 만드는 회사입니다. 엔비디아 등 AI 가속기와 빅테크 데이터센터에 메모리를 공급합니다. 밸류체인 칩·메모리 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>영업이익 107.4조원으로 잠정치 그대로 확정, 예상(106.6조원)을 0.8% 넘겼습니다. 매출 195.3조원은 예상(200.6조원)보다 2.7% 낮고, 주당순이익 11,462원도 예상(13,376원)에 못 미쳤습니다. 매출 미달은 원화 강세로 전분기 대비 약 10조원의 이익이 깎인 영향이 큽니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span><b>메모리 매출 140.7조원, 전분기보다 +16%<\/b>(약 19조원 증가)입니다. HBM4 판매가 대폭 늘었고 서버 D램·서버 SSD 수요도 커졌습니다. 완제품(DX) 적자는 메모리값 급등에 따른 원가 부담이라는 예견된 비AI 요인이라 판정에서 뺐습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>숫자는 이미 10/8 잠정실적으로 다 알려진 상태였습니다. 전날 SK하이닉스 실적에 <mark>삼성전자도 +9.01% 급등<\/mark>했던 터라 발표 직후 <mark>차익실현 매물<\/mark>이 나왔고, 코스피도 −2.5%대로 함께 밀렸습니다. 새로 나온 숫자 중에서는 매출·주당순이익 미달과 완제품 적자 지속이 아쉬운 대목입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"HBM4E를 상반기에 양산 개시하고, 하반기에 볼륨 램프업\"<\/mark><cite>삼성전자 · 3분기 실적발표 컨퍼런스콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 차세대 HBM 일정을 처음 못 박았습니다. 2027년 AI 메모리 경쟁에서 앞서 가겠다는 신호입니다.<\/p>\n    <blockquote>\"AI 인프라 투자가 장기화되며 수요가 공급을 크게 웃돌 것\"<cite>삼성전자 · 3분기 실적 발표(전망)<\/cite><\/blockquote>\n    <p class=\"m\">→ 2027년에도 메모리가 모자란다는 회사 판단입니다. 다만 모바일·PC는 일부 수요 조정을 예상했습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>전날 +9% 급등 뒤 차익실현<\/mark><small>10/28 종가 242,000원 → 장중 230,500원(−4.75%)<\/small><\/span><\/li>\n      <li><span>매출·주당순이익 예상 미달<small>매출 195.3조 vs 200.6조원 · 주당순이익 11,462원 vs 13,376원<\/small><\/span><\/li>\n      <li><span>원화 강세 부담<small>환율 영향 전분기 대비 약 −10조원<\/small><\/span><\/li>\n      <li><span>완제품(DX) 적자 지속<small>영업손실 0.8조원 (전년 +3.5조원)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>메모리 매출 +16%<\/mark><small>140.7조원 · 전년 대비 +427%<\/small><\/span><\/li>\n      <li><span>반도체 영업이익률 72%<small>DS 영업이익 106.5조원, 전분기 +17.3조원<\/small><\/span><\/li>\n      <li><span><mark>주주환원 잔여 55~75조원<\/mark><small>3분기 배당 30조원(주당 4,601원) · 자사주 매입·소각 1월 말 확정<\/small><\/span><\/li>\n      <li><span>파운드리 회복<small>HBM 베이스다이 매출 증가 · 2나노 하이퍼스케일러 신규 수주<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"영업이익은 예상을 넘겼고 매출·주당순이익은 못 미쳤습니다. 매출·영업이익 예상은 에프앤가이드, 주당순이익 예상은 인베스팅닷컴입니다.\", \"items\": [{\"k\": \"매출\", \"a\": 195.25, \"e\": 200.64, \"u\": \"조원\"}, {\"k\": \"영업이익\", \"a\": 107.44, \"e\": 106.64, \"u\": \"조원\"}, {\"k\": \"주당순이익\", \"a\": 11462, \"e\": 13376, \"u\": \"원\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 영업이익 추이 (조원)\", \"cap\": \"1년 만에 12.2조원 → 107.4조원. 점선 막대 = 4분기 영업이익 컨센서스(연합인포맥스 116.3조원)\", \"items\": [{\"q\": \"25.3Q\", \"v\": 12.2}, {\"q\": \"26.1Q\", \"v\": 57.2}, {\"q\": \"26.2Q\", \"v\": 89.5}, {\"q\": \"26.3Q\", \"v\": 107.4, \"hi\": 1}, {\"q\": \"26.4Q 컨센\", \"v\": 116.3, \"g\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"부문별 매출 비중 (%)\", \"cap\": \"부문 매출 단순 합계 기준(내부거래 포함). 반도체가 약 70%\", \"items\": [{\"k\": \"반도체(DS)\", \"v\": 69.6, \"hl\": 1}, {\"k\": \"완제품(DX)\", \"v\": 24.6}, {\"k\": \"디스플레이\", \"v\": 3.8}, {\"k\": \"하만\", \"v\": 2.0}]}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">195.3조원 (200.6조원) <span class=\"no\">❌<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 / 전분기 대비<\/span><span class=\"v\">+126.9% / +14%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 영업이익<\/span><span class=\"v\"><mark>107.4조원<\/mark> (106.1~106.6조원) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 / 전분기 대비<\/span><span class=\"v\">+783% / +20%<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">55.0% (전분기 +2.8%p)<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">75.1조원 (전년 +514.6%, 2분기 71.6조원)<\/span><\/div>\n    <div class=\"row\"><span>주당순이익(보통주)<\/span><span class=\"v\">11,462원 (13,376원) <span class=\"no\">❌<\/span><\/span><\/div>\n    <div class=\"row\"><span>연구개발비<\/span><span class=\"v\">14.4조원 (전년 +63%)<\/span><\/div>\n    <div class=\"row\"><span>환율 영향<\/span><span class=\"v no\">전분기 대비 약 −10조원<\/span><\/div>\n    <p class=\"na\">예상치는 매체마다 다릅니다(영업이익: LSEG 106.1조 · 에프앤가이드 106.6조원). 주당순이익 예상은 인베스팅닷컴 집계입니다.<\/p>\n  <\/section>\n\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 반도체(DS)<\/span><span class=\"v\">매출 147.1조 · 영업이익 106.5조원 (이익률 72%)<\/span><\/div>\n    <div class=\"row\"><span>　<mark>메모리 매출<\/mark><\/span><span class=\"v\"><mark>140.7조원 (전분기 +16% · 전년 +427%)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　시스템LSI<\/span><span class=\"v\">신규 SoC·이미지센서 공급 확대로 매출 증가<\/span><\/div>\n    <div class=\"row\"><span>　파운드리<\/span><span class=\"v\">HBM 베이스다이·첨단공정 판매로 크게 개선<\/span><\/div>\n    <div class=\"row\"><span>완제품(DX)<\/span><span class=\"v no\">매출 52.1조(+8%) · 영업손실 0.8조원<\/span><\/div>\n    <div class=\"row\"><span>　모바일·네트워크<\/span><span class=\"v\">매출 37.7조(전년 +11%) · 손실 0.6조원 (적자 0.1조 축소)<\/span><\/div>\n    <div class=\"row\"><span>　TV·생활가전<\/span><span class=\"v\">매출 13.9조 · 손실 0.2조원<\/span><\/div>\n    <div class=\"row\"><span>삼성디스플레이<\/span><span class=\"v\">매출 8.0조(+7%) · 영업이익 1.1조원(+0.4조)<\/span><\/div>\n    <div class=\"row\"><span>하만<\/span><span class=\"v\">매출 4.3조 · 영업이익 0.6조원 (미국 관세 환급 효과)<\/span><\/div>\n  <\/section>\n\n  <section><h4>핵심 지표 · 물량<\/h4>\n    <p class=\"q\"><b>HBM4<\/b> 3분기 판매 대폭 확대 — 2분기 콜에서 \"3분기 HBM4 매출 전분기의 3배 이상, 하반기 HBM 매출의 60% 이상\"을 예고했습니다.<\/p>\n    <p class=\"q\"><b>서버 메모리<\/b> 서버 D램·서버 SSD 수요 증가, 메모리 가격 상승이 실적을 받쳤습니다.<\/p>\n    <p class=\"q\"><b>파운드리 수주<\/b> 대형 하이퍼스케일러를 포함한 2나노 고성능컴퓨팅 고객 신규 수주.<\/p>\n    <p class=\"na\">HBM 매출 금액·비트 출하량 증가율은 공식 자료에서 확인하지 못했습니다(번스타인 추정 3분기 HBM 매출 87억$).<\/p>\n  <\/section>\n\n  <section><h4>투자 · 주주환원<\/h4>\n    <div class=\"row\"><span>2026 시설투자<\/span><span class=\"v\">84.4조원 (반도체 76.8조 · 디스플레이 3.9조)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 3분기 현금배당<\/span><span class=\"v\">30조원 · 주당 4,601원(보통·우선)<\/span><\/div>\n    <div class=\"row\"><span>올해 주주환원<\/span><span class=\"v\">90~110조원 (집행·확정 35조원)<\/span><\/div>\n    <div class=\"row\"><span>　잔여 재원<\/span><span class=\"v\"><mark>55~75조원 → 자사주 매입·소각, 1월 말 이사회 확정<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　소각 대상<\/span><span class=\"v\">\"우선주 적극 고민\"<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 전망<\/h4>\n    <div class=\"row\"><span>4분기<\/span><span class=\"v\">전사 실적 성장 전망<\/span><\/div>\n    <div class=\"row\"><span>　4분기 영업이익 컨센<\/span><span class=\"v\">116.3조원 (연합인포맥스)<\/span><\/div>\n    <div class=\"row\"><span>　메모리<\/span><span class=\"v\">에이전틱 AI·신규 GPU·CPU로 수요 확대 → HBM4·고성능 DDR5·서버 SSD 공급 확대<\/span><\/div>\n    <div class=\"row\"><span>　파운드리<\/span><span class=\"v\">2나노·4나노 양산 확대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2027년<\/span><span class=\"v\"><mark>AI 투자 장기화로 수요가 공급을 크게 웃돔<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　HBM<\/span><span class=\"v\">HBM4 공급 확대 · HBM4E 상반기 양산, 하반기 물량 확대<\/span><\/div>\n    <div class=\"row\"><span>　생산<\/span><span class=\"v\">미국 테일러 파운드리 가동<\/span><\/div>\n    <div class=\"row\"><span>　주의<\/span><span class=\"v no\">모바일·PC 일부 수요 조정 예상<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 10:30<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>HBM4E<\/b> \"D램은 HBM4 판매를 확대하는 한편 HBM4E를 상반기에 양산 개시\" → 하반기 볼륨 램프업 계획.<\/p>\n    <p class=\"q\"><b>수요<\/b> 내년 모바일·PC에서 일부 수요 조정이 예상되지만, 주요 하이퍼스케일러의 데이터센터 투자는 늘어날 것이라고 봤습니다.<\/p>\n    <p class=\"q\"><b>주주환원<\/b> \"3분기 현금 배당 30조 · 자사주 소각 시 우선주 적극 고민\".<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2027 공급<\/b> AI 연관 제품이 이끄는 메모리 수요 증가폭이 매우 커서, 내년 공급부족은 올해보다 <mark>\"오히려 심화될 것\"<\/mark>이라고 봤습니다. → 메모리 가격 강세가 내년에도 이어질 수 있다는 회사 판단입니다.<\/p>\n    <p class=\"q\"><b>투자<\/b> 올해 시설투자 84.4조원 중 메모리는 신규 팹 등 인프라 확충, 파운드리는 미국 테일러 팹 중심. 4분기는 HBM·서버 D램·서버 SSD 판매 비중을 높이는 AI 제품 중심 운영.<\/p>\n    <p class=\"q\"><b>파운드리·LSI<\/b> 2나노 2세대 모바일 제품·4나노 NPU 양산 시작, 2억 화소 이미지센서 안정 양산.<\/p>\n    <p class=\"na\">보도에는 발언자 이름·직함 없이 '삼성전자' 명의로만 나옵니다(11:20 확인). 장기공급계약 비중·HBM 비트 출하 가이던스는 녹취 정리가 나오는 대로 보충합니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>10/28 (SK하이닉스 실적일)<\/span><span class=\"v ok\">+9.01% · 242,000원<\/span><\/div>\n    <div class=\"row\"><span>10/29 장중 (발표 후)<\/span><span class=\"v no\">230,500원 −4.75% (오전 확인 시점)<\/span><\/div>\n    <div class=\"row\"><span>코스피 같은 시점<\/span><span class=\"v no\">−2.5%대<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">장 마감 후 확인 필요<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n\n  <section><h4>10/08 잠정실적 때는<\/h4>\n    <p>잠정 매출 195조 · 영업이익 107.4조원 발표 당일 −2.4%(종가 기준 차익실현). 이번 확정치는 잠정치와 사실상 같고, 새로 나온 것은 부문별 숫자·전망·주주환원입니다.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>밸류체인 코멘트<\/h4>\n    <p class=\"vh\">메모리 매출이 한 분기 만에 약 19조원 늘었습니다 — 빅테크 설비투자가 실제 칩 물량으로 계속 내려오고 있다는 뜻입니다.<\/p>\n    <p class=\"vn\">신호는 메모리 매출·HBM4E 일정·2027 수요>공급 발언, 소음은 차익실현에 따른 장중 하락입니다. 다음 확인: 장기공급계약 비중·가격, 1월 말 자사주 규모.<\/p>\n  <\/section>\n\n  <p class=\"src\">출처: <a href=\"https://www.etoday.co.kr/news/view/2641606\">이투데이 종합<\/a> · <a href=\"https://www.etoday.co.kr/news/view/2641586\">이투데이 상보<\/a> · <a href=\"https://www.g-enews.com/article/Industry/2026/10/20261029101159961727fa31d75c_1\">글로벌이코노믹<\/a> · <a href=\"https://www.kukinews.com/article/view/kuk202610290050\">쿠키뉴스<\/a> · <a href=\"https://www.fnnews.com/news/202610291036075821\">파이낸셜뉴스(컨콜)<\/a> · <a href=\"https://zdnet.co.kr/view/?no=20261029102311\">지디넷 · 2027 공급부족·시설투자<\/a> · <a href=\"https://www.fnnews.com/news/202610290947230838\">파이낸셜뉴스 · 반도체 106.5조<\/a> · <a href=\"https://www.mt.co.kr/industry/2026/10/29/2026102907544366296\">머니투데이<\/a> · <a href=\"https://kr.investing.com/news/stock-market-news/article-2144594\">인베스팅닷컴(4분기 컨센)<\/a><\/p>\n<\/article>\n", "updated": "2026-10-29T11:28+09:00"}, {"id": "semco-26q3", "date": "2026-10-28", "ts": "2026-10-28T12:00", "name": "삼성전기 009150", "run": "10.28(수) 한국 장중 · 한국시간 10.28(수) 12:00", "html": "<article id=\"semco-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T12:00\" data-layer=\"칩·메모리\" data-name=\"삼성전기 009150\" data-sum=\"AI 관점 호재(MLCC +36%·기판 +58%) · 매출❌(−1.8%) 영업이익✅(+4.3%) · 영업이익률 18.4% · 장중 +7~11% · 어닝콜 반영\">\n  <div class=\"tag\"><b>실적결과<\/b> 한국 장중 · 2026년 3분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>삼성전기(009150)<\/h3>\n  <p class=\"what\">전자제품 회로에 들어가는 작은 전기 저장 부품(적층세라믹콘덴서, MLCC)과 AI 칩을 올리는 반도체 기판(FC-BGA), 스마트폰 카메라모듈을 만드는 회사입니다. AI 서버 한 대에는 일반 서버보다 MLCC가 훨씬 많이 들어가 서버 출하를 국내에서 가장 먼저 보여 줍니다. 밸류체인 칩·메모리(부품) 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>3조7633억원<\/b>(컨센 3조8334억원, −1.8%)은 소폭 못 미쳤지만, 영업이익 <b>6910억원<\/b>(컨센 6626억원, +4.3%)은 넘었습니다. 매출·영업이익 모두 분기 사상 최대이고, 영업이익률은 <b>18.4%<\/b>(2분기 12.7%)로 크게 올랐습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 쪽 두 사업이 끌었습니다. MLCC(컴포넌트) 매출 <b>1조8830억원(전년 +36%)<\/b>은 AI 데이터센터(서버·네트워크·전력)가 주도했고, 반도체 기판(패키지솔루션) <b>9390억원(전년 +58%)<\/b>은 서버 CPU·AI 가속기용 FC-BGA가 이끌었습니다. 매출 미달은 해외 스마트폰 고객 수요가 줄어든 카메라모듈(전분기 −9%) 때문이라 예고된 비AI 요인으로 보고 판정에서 뺐습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>매출은 살짝 모자랐지만 <mark>이익이 사상 최대<\/mark>였고, 늘어난 곳이 정확히 <mark>AI 서버용 MLCC와 AI 칩 기판<\/mark>입니다. 회사는 \"4분기에도 AI 데이터센터용 고사양 부품 수요 강세\"를 예상했습니다. 주가는 발표 뒤 <mark>+10.9%<\/mark>(12:37)까지 올랐습니다 — 삼성전자(+6.9%)·코스피 급등과 같은 날이라 시장 전체 분위기도 함께 작용했습니다(자체 해석).<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"2027년 MLCC 매출의 과반 이상이 장기공급계약에서 발생할 것\"<\/mark><cite>이태곤 · 부사장 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년 MLCC 매출 절반 넘게 이미 계약으로 묶였다는 뜻 — 약 50개 고객사와 체결했거나 진행 중입니다.<\/p>\n    <blockquote>\"대규모 증설로도 고객사 수요를 충족하기 어려워 추가 물량 확대 요청이 지속되고 있다\"<cite>이태곤 · 부사장 · 어닝콜(FC-BGA)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 칩 기판도 만드는 만큼 다 팔리고 더 달라는 상황입니다.<\/p>\n    <blockquote><mark>\"4분기에도 AI 데이터센터용 고사양 부품 수요가 강세를 이어갈 것\"<\/mark><cite>삼성전기 · 3분기 실적 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 서버 부품 주문이 연말까지 꺾이지 않는다는 회사 판단입니다.<\/p>\n    <blockquote>\"GPU·ASIC 하나에 필요한 MLCC 용량이 매년 2배로 늘어난다\"(AI MLCC 법칙)<cite>삼성전기 · 실적 발표 자료(보도 요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 칩이 좋아질수록 칩 한 개에 붙는 MLCC가 더 많아진다는 뜻 — AI 칩 출하보다 MLCC 수요가 더 빨리 늘 수 있다는 논리입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>부담이 될 수 있는 점<\/h4><ul>\n      <li><span>매출 컨센 소폭 미달<small>3.76조원 vs 3.83조원(−1.8%)<\/small><\/span><\/li>\n      <li><span>카메라모듈 약세<small>광학솔루션 9413억원, 전분기 −9% — 해외 거래선 수요 감소<\/small><\/span><\/li>\n      <li><span>영업외손실<small>세전이익 6097억원(영업외 −812억원), 내역 미공개<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><mark>영업이익 사상 최대·컨센 상회<\/mark><small>6910억원, 전년 +165%, 이익률 18.4%<\/small><\/span><\/li>\n      <li><span><mark>AI MLCC +36%<\/mark><small>컴포넌트 1.88조원, 전분기 +14%<\/small><\/span><\/li>\n      <li><span>AI 칩 기판 +58%<small>패키지솔루션 9390억원, 전분기 +22%<\/small><\/span><\/li>\n      <li><span>4분기도 강세 전망<small>빅테크 장기공급계약 대응·FC-BGA 증설<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"예상은 에프앤가이드 컨센서스\", \"items\": [{\"k\": \"매출\", \"a\": 3.7633, \"e\": 3.8334, \"u\": \"조원\"}, {\"k\": \"영업이익\", \"a\": 6910, \"e\": 6626, \"u\": \"억원\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"사업부별 매출 비중 (%)\", \"cap\": \"AI가 이끈 MLCC·기판이 75%\", \"items\": [{\"k\": \"컴포넌트(MLCC)\", \"v\": 50, \"hl\": 1}, {\"k\": \"광학(카메라)\", \"v\": 25}, {\"k\": \"패키지(기판)\", \"v\": 25, \"hl\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 영업이익 추이 (억원)\", \"cap\": \"1분기는 일회성 퇴직급여 714억원 포함\", \"items\": [{\"q\": \"25.3Q\", \"v\": 2603}, {\"q\": \"25.4Q\", \"v\": 2395}, {\"q\": \"26.1Q\", \"v\": 2806}, {\"q\": \"26.2Q\", \"v\": 4404}, {\"q\": \"26.3Q\", \"v\": 6910, \"hi\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적 (연결 · 잠정)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">3조7633억원 (3조8334억원) <span class=\"no\">❌<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전분기 / 전년 대비<\/span><span class=\"v\">+9% / +30% · 분기 사상 최대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 영업이익<\/span><span class=\"v\"><mark>6910억원<\/mark> (6626억원) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전분기 / 전년 대비<\/span><span class=\"v\">+57% / +165% · 분기 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">18.4% (2분기 12.7% · 전년 9.0%)<\/span><\/div>\n    <div class=\"row\"><span>세전이익<\/span><span class=\"v\">6097억원 (영업외 −812억원)<\/span><\/div>\n    <div class=\"row\"><span>지배주주 순이익<\/span><span class=\"v\">4687억원 (전분기 +48% · 전년 +113%)<\/span><\/div>\n    <p class=\"na\">영업이익 컨센은 기준에 따라 6423억~6637억원(상회 폭 +4~8%). 한경은 순이익을 4850억원(비지배 포함으로 보임)으로 보도했습니다.<\/p>\n  <\/section>\n\n  <section><h4>사업부별<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 컴포넌트(MLCC)<\/span><span class=\"v\"><mark>1조8830억원<\/mark> · 전분기 +14% · 전년 +36%<\/span><\/div>\n    <div class=\"row\"><span>　이끈 곳<\/span><span class=\"v\">AI 데이터센터(서버·네트워크·전력)용 고사양 MLCC<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 패키지솔루션(기판)<\/span><span class=\"v\">9390억원 · 전분기 +22% · 전년 +58%<\/span><\/div>\n    <div class=\"row\"><span>　이끈 곳<\/span><span class=\"v\">서버 CPU·AI 가속기용 FC-BGA, 자율주행(ADAS) 기판<\/span><\/div>\n    <div class=\"row\"><span>광학솔루션(카메라)<\/span><span class=\"v no\">9413억원 · 전분기 −9% · 전년 +3%<\/span><\/div>\n    <p class=\"na\">사업부별 영업이익, AI 서버용 MLCC 비중, 가동률, 가격 인상 반영, 장기공급계약(4.3조원) 반영 여부는 자료에서 확인하지 못했습니다. 참고: 8월 MLCC 가격 최대 30% 인상 보도, 10월 납기 61주 보도.<\/p>\n  <\/section>\n\n  <section><h4>전망 · 4분기<\/h4>\n    <div class=\"row\"><span>회사 전망<\/span><span class=\"v\">AI 데이터센터용 고사양 부품 수요 강세 지속<\/span><\/div>\n    <div class=\"row\"><span>MLCC<\/span><span class=\"v\">소형·초고용량 AI MLCC 공급 확대, 빅테크 장기공급계약 대응, 전기차·자율주행용 확대<\/span><\/div>\n    <div class=\"row\"><span>FC-BGA<\/span><span class=\"v\">고부가 신제품 적기 공급 · 부산·세종·베트남 증설<\/span><\/div>\n    <div class=\"row\"><span>카메라<\/span><span class=\"v\">전략 거래선 차기 플래그십용 슬림 카메라 양산<\/span><\/div>\n    <p class=\"na\">한국 회사는 숫자 가이던스를 내지 않습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 14:50<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>AI 칩이 커질수록 MLCC가 더<\/b> 이태곤 부사장: AI GPU·ASIC 한 패키지의 다이 수가 <mark>\"2026년 2개, 2027년 4개, 2028년 이후 8개\"<\/mark>로 늘어난다고 했습니다. → 칩 하나에 붙는 MLCC가 계속 늘어난다는 근거입니다.<\/p>\n    <p class=\"q\"><b>4분기 추가<\/b> \"통상적인 수준을 훌쩍 넘어 전분기 대비 큰 폭의 성장\", AI 데이터센터용 매출 비중 추가 확대(수치 비공개), 수급은 3분기보다 더 타이트 — \"전략적 캐파 운영\".<\/p>\n    <p class=\"q\"><b>증설<\/b> 필리핀 신공장은 내년부터 최선단 고부가 MLCC 중심으로 양산을 시작합니다. 올해 설비투자는 국내외 부지·인프라 선행투자로 <mark>당초 전망보다 증가<\/mark>합니다(2027년 금액 비공개).<\/p>\n    <p class=\"q\"><b>기판·카메라<\/b> 빅테크에 공급 중인 임베딩 기판은 2027년 이후 본격 확대, 유리기판은 2028년 본격 가동 기조 유지. 카메라모듈은 3분기부터 휴머노이드용 모듈 양산을 시작했습니다.<\/p>\n    <p class=\"na\">발표: 이동우 IR·기획 담당 부사장. 인베스팅닷컴 녹취록은 장기계약 발언(2027년 MLCC 매출 과반)을 김성진 CFO로 적어, 뉴스핌(이태곤 부사장)과 발언자가 다릅니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>MLCC 장기계약<\/b> 이태곤 부사장: 약 50개 고객사와 체결했거나 진행 중, <mark>\"2027년 MLCC 매출의 과반 이상이 장기공급계약에서 발생\"<\/mark>.<\/p>\n    <p class=\"q\"><b>수급<\/b> 수주가 예상보다 빠르게 늘고, \"고부가 제품 특성상 생산능력 잠식까지 발생해 타이트한 수급이 심화될 전망\". 가격은 \"전략적인 가격 대응을 이어가겠다\"(인상폭 숫자는 없음).<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>4분기<\/b> 보통은 계절적으로 평탄하지만 올해는 전장·AI 서버 선단품 수요가 강해 <mark>\"믹스 개선과 평균판매가격 상승으로 큰 폭의 매출 성장\"<\/mark>.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2027년 AI MLCC<\/b> 고용량 1005 사이즈 47µF 제품은 주요 빅테크 신규 플랫폼 전부에 공급 중이며 <mark>2027년 수요 약 8배<\/mark>, 광모듈용 MLCC 매출은 올해 대비 약 3배 이상 기대.<\/p>\n    <p class=\"q\"><b>FC-BGA<\/b> 증설해도 수요를 못 따라가 추가 물량 요청이 계속됩니다. 세종 4.27조·베트남 2.51조원(9월 발표) 증설은 2027년부터 단계적 양산·2028년부터 매출 기여. 추가 투자는 \"시점과 규모를 신중하게 판단\". 글로벌 빅테크와 장기계약(고객명 비공개), 원자재 가격을 반영한 공급가 협상 중.<\/p>\n    <p class=\"q\"><b>3분기<\/b> 데이터센터 수요로 매출·출하가 늘고 재고는 줄었으며, 산업·전장 비중 확대로 평균판매가격이 올랐습니다.<\/p>\n    <p class=\"na\">가동률, AI 서버용 비중, 4.3조원 장기계약 반영 시점, 유리기판·실리콘 커패시터 발언은 보도에서 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>직전 종가 (10/27)<\/span><span class=\"v\">1,201,000원<\/span><\/div>\n    <div class=\"row\"><span>오전 (09:56, 발표 전)<\/span><span class=\"v ok\">1,286,000원 (+7.08%)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 발표 뒤 (12:37)<\/span><span class=\"v ok\"><mark>1,332,000원 (+10.91%)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>13:20 시황<\/span><span class=\"v ok\">+8.99% (약 130.9만원, 전일 종가로 계산)<\/span><\/div>\n    <div class=\"row\"><span>13:40<\/span><span class=\"v ok\">128.7만원 (+7.16%) · 장중 고가 133.8만원 — 오름폭 일부 반납<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">15:30 마감 뒤 확인<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 장 마감 뒤 업데이트 예정<\/span><\/h4><p>종가와 컨퍼런스콜 발언이 나오면 시장이 결국 무엇을 반겼는지 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 서버 부품은 계속 빡빡합니다 — MLCC·기판이 이익을 끌었습니다<\/p><p>오늘 아침 SK하이닉스가 \"HBM 수요가 공급의 2배\"라고 한 것처럼, 삼성전기도 AI 서버·AI 칩 쪽 부품(MLCC +36%, 기판 +58%)이 성장을 이끌었습니다. 칩뿐 아니라 칩 주변 부품까지 공급 부족이 번지고 있다는 신호입니다.<\/p><p>신호는 AI MLCC·FC-BGA 성장과 장기계약, 소음은 카메라모듈 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 13:00 콜의 MLCC 가격·가동률 발언, 대만 델타(10/29)·라이트온(10/30)의 AI 서버 전원 숫자.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://samsungsem.com/resources/file/kr/ir/earnings_release/3Q26_Earnings_Release_kor.pdf\">회사 IR(공식) · 3분기 실적 자료<\/a> · <a href=\"https://www.hankyung.com/article/2026102804527\">한경 · 공시<\/a> · <a href=\"https://www.mediawatch.kr/news/article.html?no=261520\">미디어워치 · 컨센서스·주가<\/a> · <a href=\"https://zdnet.co.kr/view/?no=20261028122201\">지디넷 · 컨센서스<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707329/\">데일리안 · 전망<\/a> · <a href=\"https://www.etoday.co.kr/news/view/2641103\">이투데이<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000855\">뉴스핌<\/a> · <a href=\"https://www.joongangenews.com/news/articleView.html?idxno=559009\">중앙이코노미 · 주가<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000948\">뉴스핌 · 어닝콜 MLCC<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000953\">뉴스핌 · 2027 전망<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000984\">뉴스핌 · FC-BGA<\/a> · <a href=\"https://www.asiatoday.co.kr/kn/view.php?key=20261028010009877\">아시아투데이 · 어닝콜<\/a> · <a href=\"https://fnnews.com/news/202610281319283116\">파이낸셜뉴스 · 주가<\/a> · <a href=\"https://kr.investing.com/news/transcripts/article-93CH-2144750\">인베스팅닷컴 · 콜 녹취록<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707382\">데일리안 · 4분기<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707358\">데일리안 · 필리핀 공장<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707374\">데일리안 · 임베딩 기판<\/a> · <a href=\"https://www.asiatoday.co.kr/kn/view.php?key=20261028010009910\">아시아투데이 · 설비투자<\/a> · <a href=\"https://www.job-post.co.kr/news/articleView.html?idxno=234990\">잡포스트 · 주가<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T14:50:00+09:00"}, {"id": "simo-26q3", "date": "2026-10-28", "ts": "2026-10-28T18:00", "name": "실리콘모션 SIMO", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"simo-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T18:00\" data-layer=\"컨트롤러\" data-name=\"실리콘모션 SIMO\" data-sum=\"AI 관점 중립(기업·AI용 컨트롤러 '확대 시작'·숫자 미공개) · 매출✅ EPS✅ · 4분기 가이던스 5.88~6.16억$(+5~10%) · 올해 매출 +100% 넘게 · 어닝콜 끝남·녹취 대기 · 장중 +2.9%(뉴욕 09:33)\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기(7~9월) · 어닝콜 대기(한국시간 10.29 21:00)<\/div>\n  <h3>실리콘모션(SIMO)<\/h3>\n  <p class=\"what\">낸드 플래시를 SSD·스마트폰 저장장치로 쓰게 해 주는 '컨트롤러' 칩을 설계하는 회사입니다. 소비자용 SSD·eMMC·UFS가 주력이고, 데이터센터용 SSD 컨트롤러(몬타이탄)와 부팅 드라이브(페리)로 넓히는 중입니다. 밸류체인 컨트롤러 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 5.602억$(+131%, 전분기 +24%)로 예상(5.291억$, 마켓비트)을 약 6% 넘었고, 조정 주당순이익(ADS 기준) 4.35$로 예상(3.30$)을 크게 넘었습니다. 4분기 매출 가이던스도 5.88~6.16억$로 한 번 더 늘어납니다(전분기 +5~10%).<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">중립<\/span>AI 데이터센터용인 몬타이탄 기업용 SSD 컨트롤러는 <b>'확대가 시작됐다'<\/b>는 말뿐 숫자가 없습니다. 이번 성장은 SSD 컨트롤러(+55~60%)·부팅 드라이브(+2,580%대)·모바일(+35~40%) 등 대부분 소비자·일반 저장장치 쪽입니다. 메모리 가격 급등기에 낸드 업체들이 컨트롤러를 많이 사 간 영향으로 보이며, AI 몫은 어닝콜에서 확인이 필요합니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>매출이 1년 새 <mark>2.3배(+131%)<\/mark>, 조정 EPS가 예상보다 <mark>약 32% 높게<\/mark> 나왔고 최고경영자가 <mark>\"2026년 매출이 전년의 두 배를 넘는 사상 최대\"<\/mark>를 다시 말했습니다. 발표 뒤 시간외에서 한때 233$(+6.1%)까지 올랐다가 226$ 안팎(+2.9%)으로 내려왔습니다. 회계 순이익(1.91$)이 조정치보다 훨씬 적은 건 투자 평가손실 7,797만$ 때문입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"2026년 연간 매출이 사상 최대, 전년 대비 100% 넘는 성장을 낼 궤도에 있습니다\"<\/mark><cite>월리스 코우 · 사장 겸 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 4분기 가이던스까지 더하면 올해 매출이 약 19.5억$ 안팎으로, 지난해의 두 배가 넘는다는 뜻입 (컨센 98조2257억원, +6.5%)·영업이익 <b>83조3338억원<\/b>(컨센 76조9640억원, +8.3%)으로 둘 다 예상을 넘었습니다. 분기 매출이 처음 100조원을 넘었고, 영업이익률은 약 <b>80%<\/b>(컨센 기준 약 78%)입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>회사는 3분기에 <b>HBM4 출하가 본격화<\/b>되고 <b>서버용 DDR5 판매가 크게 늘었으며<\/b>, 낸드에서는 321단 기반 <b>기업용 SSD(eSSD) 판매가 확대<\/b>됐다고 밝혔습니다. 4분기엔 HBM4가 출하량·매출 모두 HBM3E를 앞설 것으로 봅니다. 클라우드 업체를 포함한 <b>14개 주요 고객과 장기공급계약<\/b>을 맺어 2027·2028년 생산능력의 50% 이상을 확보했습니다. 스마트폰·PC 등 비AI 부문 숫자는 이번 자료에서 따로 확인되지 않아 판정에 넣지 않았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 주목한 포인트<\/p><p>숫자는 컨센을 <mark>6~8% 상회<\/mark>했고(영업이익은 증권사 최고 추정치 80.1조원보다도 높음), 시장의 또 다른 관심이던 주주환원은 <mark>올해 약 100조원<\/mark>(현금배당 30조원 이상 + 자사주 매입·소각 60조원 이상)으로 나왔습니다. 회사는 <mark>\"2030년까지 메모리 공급 부족이 이어질 것\"<\/mark>으로 전망했습니다. 그런데 정규장 초반 주가는 <mark>+1.8%<\/mark>로 프리마켓(+3.65%)보다 오름폭이 줄었습니다 — 이미 높아진 기대와 순이익 감소(전분기 키옥시아 일회성 효과 소멸)가 겹친 것으로 보입니다(자체 해석). 수요·가격 발언은 09:00 컨퍼런스콜에서 확인합니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"주요 고객과 내년 HBM 물량과 가격을 포함한 거래 조건 협의를 완료했으며 … HBM4의 높아진 가치를 충실히 반영했다\"<\/mark><cite>김우현 · 최고재무책임자(CFO) · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 2027년 HBM 물량·가격이 이미 정해졌고, 값도 더 받기로 했다는 뜻입니다. 내년 실적의 불확실성이 크게 줄었습니다.<\/p>\n    <blockquote>\"HBM과 일반 D램 간 수익성 격차가 유의미하게 축소될 것\"<cite>김우현 · 최고재무책임자(CFO) · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 일반 D램 값이 워낙 올라 HBM만 특별히 돈 되는 구조가 아니라는 말 — 회사 전체 이익률이 높게 유지된다는 신호이자, HBM 프리미엄이 줄어든다는 해석도 가능합니다(자체 해석).<\/p>\n    <blockquote><mark>\"선단 공정의 기술 난이도와 신규 시설 구축 기간을 고려하면 2030년까지 메모리 공급 부족이 이어질 것\"<\/mark><cite>SK하이닉스 · 실적 발표 자료(뉴스핌 보도 요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 메모리를 더 만들고 싶어도 공장·기술 때문에 빨리 못 늘린다는 뜻 — 가격 협상력이 공급사에 있다는 말입니다.<\/p>\n    <blockquote>\"AI 인프라 투자가 빅테크를 넘어 일반 기업과 국가 단위로 확산되고 있습니다\"<cite>SK하이닉스 · 실적 발표 자료(뉴스핌 보도 요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 메모리를 사는 손님이 빅테크 몇 곳에서 더 넓어지고 있다는 판단입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가에 부담이 될 수 있는 점<\/h4><ul>\n      <li><span>기대가 이미 높음<small>3개월 전 영업이익 컨센 81.5조원 → 76.96조원으로 낮아졌다가 다시 상회<\/small><\/span><\/li>\n      <li><span>내년 투자 크게 늘어남<small>용인 1기 팹 가동 등으로 투자 규모가 올해보다 크게 증가 전망<\/small><\/span><\/li>\n      <li><span>장기계약 가격은 범위 안 변동<small>시장 상황을 반영하도록 설계 — 고정가가 아님<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 수 있는 점<\/h4><ul>\n      <li><span><mark>컨센 상회 · 이익률 80%<\/mark><small>매출 +6.5% · 영업이익 +8.3% 상회<\/small><\/span><\/li>\n      <li><span><mark>장기계약 14곳 · 2027~28 물량 50%+<\/mark><small>클라우드 업체 포함<\/small><\/span><\/li>\n      <li><span>주주환원 약 100조원<small>3분기 배당 주당 2만원(특별배당 1만원 포함) · 자사주 20조원 추가<\/small><\/span><\/li>\n      <li><span>순현금 98.7조원<small>현금성 자산 114.5조원<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"예상은 에프앤가이드 컨센서스(10월 중순 집계)\", \"items\": [{\"k\": \"매출\", \"a\": 104.62, \"e\": 98.23, \"u\": \"조원\"}, {\"k\": \"영업이익\", \"a\": 83.33, \"e\": 76.96, \"u\": \"조원\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (조원)\", \"cap\": \"다섯 분기 연속 사상 최대 — 1년 만에 4배\", \"items\": [{\"q\": \"25.3Q\", \"v\": 24.45}, {\"q\": \"25.4Q\", \"v\": 32.83}, {\"q\": \"26.1Q\", \"v\": 52.58}, {\"q\": \"26.2Q\", \"v\": 79.32}, {\"q\": \"26.3Q\", \"v\": 104.62, \"hi\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적 (연결 · 잠정)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">104조6155억원 (98조2257억원) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 / 전분기 대비<\/span><span class=\"v\">+327.9% / +31.9%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 영업이익<\/span><span class=\"v\"><mark>83조3338억원<\/mark> (76조9640억원) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 / 전분기 대비<\/span><span class=\"v\">+632.1% / +37.6% (2분기 60조5426억원)<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">약 79.7% (예상 약 78%)<\/span><\/div>\n    <div class=\"row\"><span>세전이익<\/span><span class=\"v\">50조7085억원 (전년 +242.8%)<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">39조7756억원 · 순이익률 38% (전분기 −57.7% · 전년 +215.7%)<\/span><\/div>\n    <p class=\"na\">영업이익(83.3조)과 세전이익(50.7조) 사이 영업외손실 32.6조원은 외환순손실 11.63조원(환율 하락)과 투자자산 평가손실 22.92조원 때문입니다(서울경제). 전분기 순이익 93.9조원에는 키옥시아 지분 매각 차익 등 일회성(머니투데이 추정 약 40조원)이 들어 있어 전분기 대비 감소폭이 크게 보입니다.<\/p>\n    <div class=\"row\"><span>1~3분기 누적<\/span><span class=\"v\">매출 236조5105억원 · 영업이익 181조4867억원<\/span><\/div>\n  <\/section>\n\n  <section><h4>AI 인프라 물량 (HBM · 서버 D램 · eSSD)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> HBM<\/span><span class=\"v\">3분기 HBM4 출하 본격화 · 4분기 HBM4가 출하·매출 모두 HBM3E 추월 예상<\/span><\/div>\n    <div class=\"row\"><span>서버 D램<\/span><span class=\"v\">서버용 DDR5 판매 크게 증가 · 1c 공정·DDR5·LPDDR5 SOCAMM 비중 확대<\/span><\/div>\n    <div class=\"row\"><span>기업용 SSD(eSSD)<\/span><span class=\"v\">321단 TLC 기반 판매 확대 · 321단 비중을 국내 생산능력 절반 이상으로<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 장기공급계약<\/span><span class=\"v\"><mark>14개 주요 고객 · 2027~28년 생산능력 50% 이상<\/mark><\/span><\/div>\n    <div class=\"row\"><span>생산능력<\/span><span class=\"v\">청주 M15X 연말까지 최대 가동<\/span><\/div>\n    <p class=\"na\">D램 출하 3분기 +10%·4분기 20% 중반 증가(어닝콜). HBM 매출 비중은 공개되지 않았습니다. 비AI(스마트폰·PC) 요인은 이번 자료에서 따로 확인되지 않았습니다.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>현금성 자산 / 차입금 / 순현금<\/span><span class=\"v\">114.5조원 (전분기 +26.5조) / 15.8조원 (−2.8조) / 98.7조원<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 올해 주주환원<\/span><span class=\"v\"><mark>약 100조원<\/mark> (현금배당 30조원+ · 자사주 매입·소각 60조원+)<\/span><\/div>\n    <div class=\"row\"><span>3분기 결의<\/span><span class=\"v\">현금배당 14조원 · 자사주 매입 20조원(10조원 소각, 10조원 임직원 보상)<\/span><\/div>\n    <div class=\"row\"><span>3분기 배당<\/span><span class=\"v ok\">주당 2만원 (실적분 1만원 + 키옥시아 투자수익 특별배당 1만원)<\/span><\/div>\n    <div class=\"row\"><span>8월 자사주 40조원<\/span><span class=\"v\">매입 완료 · 곧 소각<\/span><\/div>\n    <div class=\"row\"><span>환원 방침<\/span><span class=\"v\">잉여현금흐름의 50% 이상<\/span><\/div>\n  <\/section>\n\n  <section><h4>전망 · 4분기와 내년<\/h4>\n    <div class=\"row\"><span>업황<\/span><span class=\"v\">2030년까지 메모리 공급 부족 지속 전망<\/span><\/div>\n    <div class=\"row\"><span>4분기<\/span><span class=\"v\">HBM4 > HBM3E (출하·매출) · M15X 최대 가동<\/span><\/div>\n    <div class=\"row\"><span>내년 투자<\/span><span class=\"v\">용인 1기 팹 가동 등으로 올해보다 크게 증가 전망 · 규모·시기는 탄력적으로 조정<\/span><\/div>\n    <div class=\"row\"><span>4분기 영업이익 컨센<\/span><span class=\"v\">87.27조원 (에프앤가이드)<\/span><\/div>\n    <div class=\"row\"><span>장기계약 기간<\/span><span class=\"v\">보통 5년 · 더 긴 기간을 논의하는 고객도 있음<\/span><\/div>\n    <p class=\"na\">한국 회사는 숫자 가이던스를 내지 않습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 10:55<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>수요가 공급의 2배<\/b> <mark>고객이 요청한 HBM 물량이 공급 가능량의 2배를 넘는다<\/mark>고 했습니다. HBM을 12단에서 8단으로 낮춰도 필요 용량은 줄지 않고, 오히려 쌓는 묶음(큐브) 수가 늘어 바닥칩·후공정 수요가 커진다는 설명입니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2029년까지 사실상 매진<\/b> 이미 맺은 장기계약과 구체적으로 협의 중인 물량을 합치면 <mark>D램·HBM은 2029년까지 사실상 매진<\/mark>입니다. 장기계약은 중장기에도 생산능력의 50% 이상을 유지할 계획입니다.<\/p>\n    <p class=\"q\"><b>HBM 수율<\/b> HBM4 수율이 계획을 넘어 목표를 올렸고, HBM3E도 계획한 수율을 넘겼습니다. HBM4E는 고객 일정에 맞춰 개발·평가 중입니다(샘플은 2분기 출하).<\/p>\n    <p class=\"q\"><b>2027 투자·공급과잉 질문<\/b> 2027 투자는 올해보다 상당히 늘어납니다(첨단공정·용인 1기·국내외 인프라). 공급과잉 우려 질문(BofA)에는 <mark>팹 건물(셸)을 먼저 짓고 클린룸은 수요에 맞춰 단계적으로 채운다<\/mark>고 답했습니다. → 수요가 꺾이면 투자 속도를 늦출 수 있는 구조라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>솔리다임 상장 보류<\/b> 곽노정 사장(CEO): \"지금 시점의 상장으로는 당초 기대한 효과를 충분히 거두기 어렵다\". 키옥시아 투자이익은 특별배당(주당 1만원)으로 돌려줍니다.<\/p>\n    <p class=\"na\">콜 참석: 곽노정 CEO, 김우현 CFO, 박성환 IR담당, 박준덕 D램마케팅담당, 송창석 낸드마케팅담당, 김기태 HBM세일즈&마케팅담당. EBITDA 87.7조원(인베스팅닷컴 녹취록). 녹취록의 2027 낸드 수요(10% 후반)는 다른 보도(20% 후반)와 달라 확인이 필요합니다.<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>2027년 HBM 협의 완료<\/b> 김우현 CFO: <mark>\"주요 고객과 내년 HBM 물량과 가격을 포함한 거래 조건 협의를 완료\"<\/mark>, \"HBM4의 높아진 가치를 충실히 반영\". → 내년 HBM은 이미 팔렸고 값도 올랐다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>HBM4 전환<\/b> 김우현 CFO: \"4분기 HBM4는 전체 HBM 출하량과 매출에서 차지하는 비중이 모두 HBM3E를 넘어 주력 제품으로 자리 잡을 것\", \"HBM4 12단 제품은 협의한 일정대로 순조롭게 출하\". 회사는 HBM4 수율도 \"상당히 안정적\"이라고 했습니다.<\/p>\n    <p class=\"q\"><b>3분기 물량·가격<\/b> D램 출하 약 +10%·평균판매가격 20% 후반 상승, 낸드 출하 소폭 감소·평균판매가격 20% 중반 상승(전분기 대비).<\/p>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>4분기·내년<\/b> 4분기 D램 출하 <mark>20% 중반 증가<\/mark>(1c 공정·M15X HBM4 증산), 낸드 한 자릿수 중반 증가. 내년 수요는 D램 비트 20% 중반, 낸드 20% 후반 성장 전망.<\/p>\n    <p class=\"q\"><b>수요 근거<\/b> 클라우드 기업 내년 설비투자 60% 이상 증가(외부 리서치 인용), AI 데이터센터 인프라 2030년까지 연 40% 이상 성장. 김우현 CFO: \"공급이 수요에 못 미치는 환경이 2030년까지 지속\".<\/p>\n    <p class=\"q\"><b>장기계약<\/b> 14개 고객·2027~28년 생산능력 50% 이상, <mark>\"예치금 등 실질적인 이행 장치를 포함\"<\/mark> — 고객이 돈을 미리 걸어 둔 계약이라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>영업외손실 32.6조원<\/b> 외환순손실 11.63조원(환율 하락) + 투자자산 평가손실 22.92조원(서울경제). 어떤 자산의 평가손실인지는 보도되지 않았습니다.<\/p>\n    <p class=\"na\">HBM4와 HBM3E 가격 차이, HBM의 D램 매출 비중, 구체적 설비투자 금액은 보도에서 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>직전 종가 (10/27)<\/span><span class=\"v\">약 1,341,000원 (기사 등락폭으로 역산)<\/span><\/div>\n    <div class=\"row\"><span>넥스트레이드 프리마켓 (10/28 08:01, 발표 전)<\/span><span class=\"v ok\">1,390,000원 (+3.65%) · 한때 +4%대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 정규장 초반 (10/28 09:07)<\/span><span class=\"v ok\">1,365,000원 (+1.79%) — 프리마켓 +3.65%보다 상승폭 축소<\/span><\/div>\n    <div class=\"row\"><span>코스피 개장<\/span><span class=\"v\">5,763.85 (+2.23%)<\/span><\/div>\n    <div class=\"row\"><span>장중 (09:33 기사)<\/span><span class=\"v ok\">약 1,394,000원 (+3.95%) · 코스피 +3.5%대<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 장중 (10:08 기사)<\/span><span class=\"v ok\"><mark>143.2만원 (+6.79%)<\/mark> · 시가총액 1,000조원 돌파 · 코스피 5,927.53(+5.13%) 매수 사이드카<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">15:30 마감 뒤 확인<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/28 장 마감 뒤 업데이트 예정<\/span><\/h4><p>첫 거래일 종가와 컨퍼런스콜 발언이 나오면 시장이 결국 무엇을 반겼는지(문제 삼았는지) 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 칩 옆 메모리 물량은 더 늘고 있습니다 — HBM4 본격 출하, 2028년까지 절반 넘게 예약<\/p><p>영업이익률 80%는 메모리가 지금 AI 칩 공급의 병목이고 가격 결정권이 공급사에 있다는 신호입니다. 14개 고객 장기계약은 빅테크 설비투자가 2027~28년까지 이어진다는 '계약' 단위의 증거입니다.<\/p><p>신호는 HBM4 전환·장기계약·내년 투자 규모, 소음은 첫날 주가 등락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 09:00 콜의 HBM 가격·물량 발언, 삼성전자 확정 실적의 HBM4 숫자, 마이크론 다음 실적.<\/p><\/section>\n  <p class=\"src\">출처: SK하이닉스 공정공시(연결 영업 잠정실적, 2026.10.28) · <a href=\"https://www.newspim.com/news/view/20261028000155\">뉴스핌 · 회사 발표 요지·주주환원<\/a> · <a href=\"https://m.sedaily.com/article/20106929\">서울경제 · 증감률<\/a> · <a href=\"https://biz.heraldcorp.com/article/10916973\">헤럴드경제 · 전분기·누적<\/a> · <a href=\"https://www.etoday.co.kr/news/view/2640888\">이투데이 · 영업이익률<\/a> · <a href=\"https://blog.sangclub.co.kr/posts/guide-hynix_q3_earnings_202610.html\">에프앤가이드 컨센서스 인용<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000044\">뉴스핌 · 프리마켓 주가<\/a> · <a href=\"https://www.stocktitan.net/news/SKHY/sk-hynix-announces-3q26-financial-fcr2bh8ikc0x.html\">회사 영문 보도자료(SEC 6-K)<\/a> · <a href=\"https://www.hankyung.com/article/202610289272g\">한국경제 · 세전·순이익<\/a> · <a href=\"https://www.etoday.co.kr/news/view/2640952\">이투데이 · 장 초반 주가<\/a> · <a href=\"https://zdnet.co.kr/view/?no=20261028085225\">지디넷 · 컨센서스<\/a> · <a href=\"https://www.trendforce.com/news/2026/10/26/news-sk-hynix-3q-earnings-preview-record-profit-at-78-operating-margin-hbm4-ltas-solidigm-in-focus/\">트렌드포스 · 증권사 추정<\/a> · <a href=\"https://www.segye.com/newsView/20261028503634\">세계일보 · 전망<\/a> · <a href=\"https://m.inews24.com/v/2019745\">아이뉴스24 · 어닝콜 HBM<\/a> · <a href=\"https://view.asiae.co.kr/article/2026102809413399119\">아시아경제 · HBM4<\/a> · <a href=\"http://www.the-biz.co.kr/news/articleView.html?idxno=730079\">더비즈 · 출하·가격<\/a> · <a href=\"https://m.sedaily.com/article/20106993\">서울경제 · 수요 전망<\/a> · <a href=\"https://m.sedaily.com/article/20106941\">서울경제 · 영업외손실<\/a> · <a href=\"https://www.newspim.com/news/view/20261028000278\">뉴스핌 · 장기계약<\/a> · <a href=\"https://www.ziksir.com/news/articleView.html?idxno=151013\">직썰 · 장중 주가<\/a> · <a href=\"https://m.sedaily.com/article/20107053\">서울경제 · 수요 2배<\/a> · <a href=\"https://view.asiae.co.kr/article/2026102809584449660\">아시아경제 · 2029년 매진<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707120/\">데일리안 · 투자·공급과잉 답변<\/a> · <a href=\"https://www.dailian.co.kr/news/view/1707203/\">데일리안 · 수율<\/a> · <a href=\"https://www.market-ink.co.kr/news/articleView.html?idxno=14200\">마켓잉크 · 솔리다임<\/a> · <a href=\"https://in.investing.com/news/stock-market-news/earnings-call-transcript-sk-hynix-posts-record-q3-2026-results-shares-jump-after-hours-93CH-5658561\">인베스팅닷컴 · 콜 녹취록<\/a> · <a href=\"https://www.ddaily.co.kr/page/view/2026102810130597058\">디지털데일리 · 시총 1,000조<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T10:55:00+09:00"}, {"id": "smci-27q1", "date": "2026-10-20", "ts": "2026-10-20", "name": "슈퍼마이크로 SMCI", "run": "10.20(화) 뉴욕 장 마감 후 · 잠정치 · 한국시간 10.21(수) 05:00", "html": "<article id=\"smci-27q1\" data-date=\"2026-10-20\" data-layer=\"서버\" data-name=\"슈퍼마이크로 SMCI\" data-sum=\"잠정 매출✅ 총마진✅ · 다음 날 +9.5%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · FY27 1분기(7~9월) 잠정치<\/div>\n  <h3>슈퍼마이크로(SMCI)<\/h3>\n  <p class=\"what\">엔비디아 그래픽처리장치(GPU)를 넣은 AI 서버를 조립해, 냉각·전원까지 갖춘 서버 묶음(랙) 단위로 데이터센터에 공급하는 회사입니다. 칩을 사서 '완성된 AI 서버'로 바꿔 파는 역할이라 매출은 크고 마진은 얇습니다. 밸류체인 서버 층.<\/p>\n  <p class=\"na\">※ 이번 정리는 10/20 장 마감 뒤 회사가 낸 <b>잠정치(예비 실적 발표)<\/b> 기준입니다. 감사 전 숫자이며, 주당순이익 등 전체 본실적은 11/3(미국 동부 17:00) 발표 뒤 이 글에 덧붙입니다.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>잠정 매출 185~195억$로 회사 자신의 가이던스(145~155억$)와 시장 예상(152.3억$)을 <b>약 25% 넘었습니다<\/b>. 회사가 꼽은 이유는 <b>\"AI 플랫폼 수요 증가\"<\/b> — 'AI 인프라 수요가 잘 빠지고 있나'라는 질문엔 분명한 '예'입니다. 총마진도 12.0~12.5%로 가이던스(10.4~10.8%)를 넘었지만, 직전 분기 17.5%보다는 낮아 <b>매출은 크게, 마진은 얇게<\/b>라는 이 회사 특유의 구조는 그대로입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>발표 전 일주일 동안 7거래일 연속 하락(10/13 39.07$ → 10/16 31.63$)으로 눌려 있던 상황에서, <mark>분기 매출이 회사 가이던스 중간값보다 약 40억$ 많다<\/mark>는 깜짝 발표가 나왔습니다. 마진이 떨어질 거라던 걱정과 달리 <mark>총마진도 가이던스 위<\/mark>였습니다. 다만 하루 +9.5% 뒤 사흘 연속 밀려 10/26엔 발표 전 가격(32.47$) 수준으로 돌아왔습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 발표의 핵심 한마디<\/p>\n    <blockquote><mark>\"(매출 상향은) 주로 AI 플랫폼 수요 증가 때문\"<\/mark><cite>슈퍼마이크로 · 잠정 실적 보도자료(10/20)<\/cite><\/blockquote>\n    <p class=\"m\">→ 고객이 늦어서 매출이 밀렸던 직전 분기와 달리, 이번엔 <b>수요가 예상보다 빨리 실제 출하로 이어졌다<\/b>는 뜻입니다.<\/p>\n    <blockquote>\"600억$ 넘는 신규 수주를 올렸고, 사상 최대 수주잔고로 2027 회계연도에 들어섰다\"<cite>찰스 리앙 · 최고경영자 · 8월 FY26 4분기 실적 발표<\/cite><\/blockquote>\n    <p class=\"m\">→ 이번 잠정치는 이 수주잔고가 매출로 바뀌기 시작했다는 첫 신호입니다. 이번 보도자료엔 경영진 발언이 실리지 않았습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><mark>매출 가이던스를 약 25% 상회<\/mark><small>잠정 185~195억$ vs 이전 가이던스 145~155억$ · 시장 예상 152.3억$<\/small><\/span><\/li>\n      <li><span>총마진도 가이던스 위<small>12.0~12.5% vs 이전 가이던스 10.4~10.8% · 시장 예상 10.15% — \"고객·제품 구성 덕분\"<\/small><\/span><\/li>\n      <li><span>눌려 있던 주가<small>발표 전 7거래일 연속 하락, 상대강도지수(RSI) 30 부근 '과매도'<\/small><\/span><\/li>\n      <li><span>새 최고재무책임자(CFO) 선임 직후<small>10/14 웨스턴디지털 전 CFO 마크 롱 선임 — 재무 관리 우려 완화 기대<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>그래도 남은 걱정<\/h4><ul>\n      <li><span><mark>감사 전 숫자 · 주당순이익 미공개<\/mark><small>회사도 \"실제 결과는 크게 다를 수 있다\"고 명시 — 11/3 본실적에서 확인 필요<\/small><\/span><\/li>\n      <li><span>마진은 직전 분기보다 낮음<small>FY26 4분기 17.5% → 이번 12.0~12.5% · 대형 GPU 물량일수록 마진이 얇음<\/small><\/span><\/li>\n      <li><span>현금 소진<small>FY26 영업현금흐름 −68.1억$(재고 쌓기) · 씨티 '중립' — 마진 지속성·운전자본 부담 지적<\/small><\/span><\/li>\n      <li><span>지배구조·수출통제 꼬리표<small>10/8 협력업체 관계자, 25억$ 규모 AI 서버 중국 밀반출 사건 유죄 인정(회사는 피고 아님)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"잠정치 범위의 중간값 기준입니다. 매출은 예상보다 약 25% 많았습니다.\", \"items\": [{\"k\": \"매출(잠정 중간값)\", \"a\": 190.0, \"e\": 152.3, \"u\": \"억$\"}, {\"k\": \"총마진(잠정 중간값)\", \"a\": 12.25, \"e\": 10.15, \"u\": \"%\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"26.3Q는 잠정치 범위(185~195억$) 중간값입니다. 회계연도 기준 FY26 1분기 → FY27 1분기\", \"items\": [{\"q\": \"25.3Q\", \"v\": 50.2}, {\"q\": \"25.4Q\", \"v\": 126.8}, {\"q\": \"26.1Q\", \"v\": 102.0}, {\"q\": \"26.2Q\", \"v\": 111.0}, {\"q\": \"26.3Q 잠정\", \"v\": 190.0, \"hi\": 1}]}'><\/div>\n\n  <section><h4>핵심 실적 · 잠정치<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">185~195억$ (152.3억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　이전 회사 가이던스<\/span><span class=\"v\">145~155억$ → 중간값 기준 +26.7%<\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">약 3.8배 (전년 50.2억$) / 약 +71% (전분기 111억$)<\/span><\/div>\n    <div class=\"row\"><span>총마진<\/span><span class=\"v\">12.0~12.5% (10.15%) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　이전 회사 가이던스<\/span><span class=\"v\">10.4~10.8%<\/span><\/div>\n    <div class=\"row\"><span>　직전 분기(FY26 4분기)<\/span><span class=\"v\">17.5% (조정 17.6%)<\/span><\/div>\n    <div class=\"row\"><span>주당순이익<\/span><span class=\"na\">잠정치에 포함 안 됨 · 11/3 공개<\/span><\/div>\n    <div class=\"row\"><span>　기존 가이던스<\/span><span class=\"v\">회계기준 0.89~0.98$ / 조정 1.01~1.10$ (갱신 안 함)<\/span><\/div>\n    <div class=\"row\"><span>상향 이유 (회사 설명)<\/span><span>매출: AI 플랫폼 수요 증가 · 마진: 고객·제품 구성<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 기타<\/h4>\n    <div class=\"row\"><span>FY27 연간 매출 가이던스<\/span><span class=\"v\">650~720억$ (8월 제시, 이번엔 언급 없음)<\/span><\/div>\n    <div class=\"row\"><span>　참고: 8월 당시 시장 예상<\/span><span class=\"v\">약 544억$ (니덤 집계)<\/span><\/div>\n    <div class=\"row\"><span>본실적 · 어닝콜<\/span><span class=\"v\">11/3(화) 미국 동부 17:00 · 한국시간 11/4 07:00<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 최고재무책임자 교체<\/span><span><mark>10/14 이사회 결의, 마크 롱 선임(즉시 효력)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　마크 롱은 누구<\/span><span>웨스턴디지털 전 CFO(~2019) · 투자사 프라임임팩트캐피털 공동창업<\/span><\/div>\n    <div class=\"row\"><span>　전임 데이비드 웨이건드<\/span><span>2021년부터 CFO · 인수인계 후 사업 개선·속도 높이는 역할로 이동<\/span><\/div>\n    <div class=\"row\"><span>　배경<\/span><span>2024년 12월 회계 관행 외부 점검 이후부터 새 CFO 물색<\/span><\/div>\n    <div class=\"row\"><span>증권 집단소송<\/span><span>10/16 법원 기각(원고 수정 제소 허용)<\/span><\/div>\n    <div class=\"row\"><span>수출통제 사건<\/span><span>10/8 협력업체 관계자 유죄 인정 · 공동창업자 등 2명은 재판 중 · 회사는 \"사업에 영향 없다\"<\/span><\/div>\n    <div class=\"row\"><span>증권사<\/span><span>로젠블랫 목표가 51→57$ · 씨티 '중립' 유지 · 커버 20곳 중 15곳 '보유' 이하<\/span><\/div>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/20 종가)<\/span><span class=\"v\">32.47$ (+1.2%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">최고 37.5$대 (+15~17%)<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/21 종가)<\/span><span class=\"v ok\">35.57$ (+9.5%)<\/span><\/div>\n    <div class=\"row\"><span>10/22 종가<\/span><span class=\"v no\">33.72$ (−5.2%)<\/span><\/div>\n    <div class=\"row\"><span>10/23 종가<\/span><span class=\"v no\">32.94$ (−2.3%)<\/span><\/div>\n    <div class=\"row\"><span>10/26 종가<\/span><span class=\"v no\">32.69$ (−0.8%)<\/span><\/div>\n    <div class=\"row\"><span>공매도 잔고<\/span><span class=\"v\">약 9,736만 주 · 유통주식의 15.2%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"na\">확인 못 함<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"발표 다음 날 +9.5% 뒤 사흘 연속 밀려 발표 전 가격으로 복귀\", \"items\": [{\"d\": \"10/15\", \"v\": 35.09}, {\"d\": \"10/16\", \"v\": 31.63}, {\"d\": \"10/19\", \"v\": 32.1}, {\"d\": \"10/20\", \"v\": 32.47}, {\"d\": \"10/21\", \"v\": 35.57}, {\"d\": \"10/22\", \"v\": 33.72}, {\"d\": \"10/23\", \"v\": 32.94}, {\"d\": \"10/26\", \"v\": 32.69}], \"mark\": \"10/20\", \"markLabel\": \"잠정치 발표(장후)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>환호는 하루였습니다.<\/b> 10/21 +9.5%로 35.57$까지 올랐지만, 10/22 나스닥이 'AI 비용 걱정'으로 2% 넘게 빠진 날 −5.2%, 이어 이틀 더 밀려 10/26 종가 32.69$ — <mark>발표 전 가격(32.47$)으로 거의 되돌아왔습니다<\/mark>. 시장은 '매출이 늘었다'는 사실보다 '감사 전 숫자이고, 이익과 현금은 아직 모른다'는 점을 더 무겁게 본 셈입니다. 10/27 종가는 <span class=\"na\">확인 못 함<\/span>.<\/p><p>다음 확인: 11/3 본실적에서 ① 매출이 185억$ 이상·총마진 12% 이상으로 확정되는지 ② 주당순이익과 영업현금흐름 ③ 연간 가이던스(650~720억$)를 올리는지. 새 CFO의 첫 어닝콜이기도 합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 발표가 우리에게 말해 주는 것<\/h4>\n    <p>서버 층에서 나온 숫자는 분명합니다. 7~9월에 AI 서버가 회사 예상보다 약 40억$ 더 출하됐고, 이유는 'AI 플랫폼 수요'였습니다. 엔비디아 칩이 실제 서버로 조립돼 데이터센터로 <mark>잘 빠지고 있다<\/mark>는 신호입니다. 다만 슈퍼마이크로는 마진이 얇고 현금을 많이 쓰는 회사라, 주가가 하루 만에 원위치한 건 '수요'보다 '회사 고유의 숙제(이익·현금·지배구조)'에 대한 의심입니다. 수요 판정은 긍정, 회사 판정은 11/3 본실적 뒤로 미룹니다.<\/p>\n  <\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0001375365/000137536526000025/smcifirstquarterfy2027busi.htm\">회사 공식 · 잠정 실적 보도자료(SEC 8-K)<\/a> · <a href=\"https://ir.supermicro.com/news/news-details/2026/Supermicro-Provides-First-Quarter-of-Fiscal-Year-2027-Preliminary-Business-Update/default.aspx\">슈퍼마이크로 투자자 정보<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0001375365/000137536526000024/smci-20261014.htm\">CFO 선임 공시(SEC 8-K)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/0001375365/000137536526000021/exhibit991_20260630.htm\">FY26 4분기 실적 보도자료<\/a> · <a href=\"https://247wallst.com/investing/2026/10/21/super-micro-says-ai-demand-is-so-strong-it-blew-past-its-own-forecast-by-25/\">247월스트 · 컨센서스(LSEG·로이터)<\/a> · <a href=\"https://www.tradingnews.com/news/super-micro-35-usd-rips-on-a-4b-usd-revenue-beat-path-to-44-usd-runs-through-meta-and-november-3\">트레이딩뉴스 · 시간외·과거 분기<\/a> · <a href=\"https://finviz.com/news/405544/super-micro-lifts-2027-revenue-guidance-calms-ai-trade-fears\">쉐퍼스(핀비즈) · 목표가·공매도<\/a> · <a href=\"https://www.ksl.com/article/51636757/super-micro-names-former-western-digital-executive-mark-long-as-new-cfo\">로이터(KSL) · CFO 교체 배경<\/a> · <a href=\"https://www.techi.com/quote/SMCI/historical/\">일별 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T19:30+09:00"}, {"id": "sndk-26q3", "date": "2026-10-29", "ts": "2026-10-29T16:05", "name": "샌디스크 SNDK", "run": "10.29(목) 뉴욕 장 마감 후 · 한국시간 10.30(금) 05:00", "html": "<article id=\"sndk-26q3\" data-date=\"2026-10-29\" data-ts=\"2026-10-29T16:05\" data-layer=\"칩·메모리\" data-name=\"샌디스크 SNDK\" data-sum=\"AI 관점 호재(데이터센터 48.0억$·전분기 +61%) · 매출✅ EPS✅ · 다음 분기 매출 122~126억$ · 8대1 주식분할 · 어닝콜: 장기공급계약이 올해 물량 절반·내년 3분의 2 · 2027 강한 시장 · 시간외 +0.6%(뉴욕 16:42)\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2027 회계연도 1분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>샌디스크(SNDK)<\/h3>\n  <p class=\"what\">낸드플래시 메모리와 이를 담은 SSD·메모리카드를 만드는 회사입니다. AI 데이터센터에는 학습·추론 데이터를 저장하는 기업용 SSD를 공급합니다. 밸류체인 칩·메모리 층 · 물량확인용.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 110.3억$(전분기 +23%, 전년 +378%)로 예상 약 106.8억$을, 조정 EPS 49.51$로 예상 약 46.2~46.9$을 <b>모두 상회<\/b>했습니다. 회사 자체 가이던스(103~108억$·44~46$) 상단도 넘었고, 조정 총마진은 <b>85.1%<\/b>입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 쪽인 데이터센터 매출이 <b>48.0억$·전분기 +61%<\/b>로 전체(+23%)보다 훨씬 빠르고, 전체 매출의 약 44%까지 올라왔습니다(1년 전 2.7억$). 최고경영자는 \"데이터센터 사업이 앞서 커지고 있다\"고 했습니다. 비AI인 소비자용은 4.0억$·전분기 −29%로 줄었지만, 메모리를 데이터센터로 돌리는 데 따른 예견된 변화라 판정을 깎지 않습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 반긴 포인트<\/p><p>정규장에서 삼성전자 실적 여파로 −5.3% 빠진 뒤, 시간외는 <mark>−1.0%(16:05) → +1.1%(뉴욕 16:20)<\/mark>로 돌아섰습니다(옵션 예상 ±8~10%). 다음 분기 매출 가이던스 <mark>122~126억$로 전분기보다 약 12% 더 늘고<\/mark>, 조정 EPS 55~57$도 이번 분기보다 높습니다. <mark>8대1 주식분할<\/mark>도 함께 발표했습니다(11월 20일부터 분할 가격으로 거래). 다음 분기 가이던스 중간값은 컨센서스(매출 122.1억$·EPS 52.94$, 24/7 월스트리트)도 넘었습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"robust and growing demand for our products driving outpaced growth in our data center business\"<\/mark><cite>데이비드 게클러 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 탄탄하고 계속 늘며, 그중 데이터센터가 가장 빨리 큰다는 뜻입니다.<\/p>\n    <blockquote><mark>\"장기공급계약이 올해 물량의 절반, 내년은 3분의 2\"<\/mark><cite>데이비드 게클러 · 최고경영자 · 어닝콜(자동 녹취 기준)<\/cite><\/blockquote>\n    <p class=\"m\">→ 앞으로 팔 물량 상당 부분이 이미 계약으로 묶여 있어, 메모리 가격 정점 우려에 대한 답으로 읽힙니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> 데이터센터 +61%<small>48.0억$ · 매출 비중 약 44%<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 다음 분기도 성장<small>매출 122~126억$ · EPS 55~57$<\/small><\/span><\/li>\n      <li><span>마진 85%<small>조정 총마진 85.1% (전분기 84.6%)<\/small><\/span><\/li>\n      <li><span>자사주 50억$ · 분할<small>8대1 주식분할 · 11.20부터<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>부담 요인<\/h4><ul>\n      <li><span>성장 속도 둔화<small>전분기 대비 +97% → +51% → +23% → 가이던스 +12%<\/small><\/span><\/li>\n      <li><span>소비자용 감소<small>4.0억$ 전분기 −29%<\/small><\/span><\/li>\n      <li><span>발표 전 급락<small>1개월 −23% · 10.29 정규장 −5.3%<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"24/7 월스트리트·벤징가·허드슨랩스 컨센서스 중간\", \"items\": [{\"k\": \"매출\", \"a\": 110.3, \"e\": 106.8, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 49.51, \"e\": 46.4, \"u\": \"$\"}]}'><\/div>\n  <div class=\"vizrow\">\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 (억$)\", \"cap\": \"회계 분기 기준 · 점선은 다음 분기 가이던스 중간값\", \"items\": [{\"q\": \"FY26 Q2\", \"v\": 30.25}, {\"q\": \"FY26 Q3\", \"v\": 59.5}, {\"q\": \"FY26 Q4\", \"v\": 89.65}, {\"q\": \"FY27 Q1\", \"v\": 110.31, \"hi\": 1}, {\"q\": \"FY27 Q2\", \"v\": 124, \"g\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"시장별 매출 비중 (%)\", \"cap\": \"AI 쪽 데이터센터 형광\", \"items\": [{\"k\": \"데이터센터\", \"v\": 44, \"hl\": 1}, {\"k\": \"엣지(PC·스마트폰)\", \"v\": 53}, {\"k\": \"소비자\", \"v\": 4}]}'><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"발표 앞뒤 주가 ($)\", \"cap\": \"시간외는 뉴욕 16:20 기준 · 분할 전 가격\", \"items\": [{\"d\": \"09.29\", \"v\": 1729.76}, {\"d\": \"10.28\", \"v\": 1404.77}, {\"d\": \"10.29\", \"v\": 1330.05}, {\"d\": \"시간외\", \"v\": 1344.61}], \"mark\": \"10.29\", \"markLabel\": \"발표\"}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">110.3억$ (약 106.8억$) <span class=\"ok\">✅<\/span> 전분기 +23% · 전년 +378%<\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">49.51$ (약 46.2~46.9$) <span class=\"ok\">✅<\/span> 전분기 39.25$<\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">52.60$ · 지분증권 평가이익 5.13억$ 포함<\/span><\/div>\n    <div class=\"row\"><span>총마진 조정 / 회계<\/span><span class=\"v\">85.1% / 85.0% (1년 전 약 29.9%)<\/span><\/div>\n    <div class=\"row\"><span>영업이익 조정<\/span><span class=\"v\">88.7억$ · 영업이익률 80.4%<\/span><\/div>\n    <div class=\"row\"><span>순이익 조정 / 회계<\/span><span class=\"v\">76.2억$ / 81.0억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별(시장별)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> <mark>데이터센터<\/mark><\/span><span class=\"v ok\">48.0억$ · 전분기 +61% (1년 전 2.7억$)<\/span><\/div>\n    <div class=\"row\"><span>엣지<\/span><span class=\"v\">58.3억$ · 전분기 +7% · 전년 +320%<\/span><\/div>\n    <div class=\"row\"><span>소비자<\/span><span class=\"v no\">4.0억$ · 전분기 −29% · 전년 −39%<\/span><\/div>\n    <p class=\"na\">비트 출하량·평균판매가격 변화는 보도자료에 없어 어닝콜에서 확인합니다.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">63.6억$ (전분기 71.3억$)<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">0.54억$<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름 / 조정<\/span><span class=\"v\">63.1억$ / 57.0억$ (마진 51.6%)<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">51.4억$ + 지분증권 22.9억$ · 차입금 없음<\/span><\/div>\n    <div class=\"row\"><span>자사주<\/span><span class=\"v\">50억$(약 320만 주) · 최근 2분기 발행주식 약 4%<\/span><\/div>\n    <div class=\"row\"><span>주식분할<\/span><span class=\"v\">8대1 · 기준일 11.9 · 11.20부터 분할 가격 거래<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 (2027 회계연도 2분기)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 매출<\/span><span class=\"v\"><mark>122~126억$<\/mark> (중간값 전분기 +12%)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">84.5~85.5%<\/span><\/div>\n    <div class=\"row\"><span>조정 영업비용<\/span><span class=\"v\">5.4~5.6억$<\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">55.00~57.00$ (분할 전 · 세율 14.3%)<\/span><\/div>\n    <div class=\"row\"><span>컨센서스 대비 <span class=\"call\">보강<\/span><\/span><span class=\"v ok\">매출 중간 124억$ (122.1억$) ✅ · EPS 중간 56$ (52.94$) ✅<\/span><\/div>\n    <p class=\"na\">다음 분기 컨센서스는 24/7 월스트리트 발표 전 기사 기준입니다. 분할 뒤 기준 EPS 가이던스는 약 6.88~7.13$(자체 계산).<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 10.30 07:40<\/span><\/h4>\n    <p class=\"q\"><b>데이비드 게클러(최고경영자) · 보도자료<\/b> \"기술 우위와 고객 협력, 재무 규율로 늘어나고 지속 가능한 잉여현금흐름을 내고 있다\" → 돈 버는 힘이 일회성이 아니라는 강조입니다.<\/p>\n    <p class=\"q\"><b>루이스 비소소(최고재무책임자)<\/b> \"데이터센터 매출 48억$, 전분기 61% 증가로 시장 성장보다 빨랐다\" · 성장의 약 60%는 물량, 40%는 가격 → 가격만이 아니라 <mark>실제 물량이 늘었다<\/mark>는 뜻입니다.<\/p>\n    <p class=\"q\"><b>루이스 비소소(최고재무책임자)<\/b> \"가격은 올해 내내 완만하게 계속 오를 것\" → 가격 정점이 아직 아니라는 회사 판단입니다.<\/p>\n    <p class=\"q\"><b>루이스 비소소(최고재무책임자)<\/b> \"웨이퍼 하나 만드는 데 120일 정도 걸려 단기에는 공급을 늘릴 방법이 거의 없다\" · \"장기계약 수요가 2020년대 말까지 우리 공급을 넘는다\" → <mark>공급 부족이 길게 간다<\/mark>는 발언입니다.<\/p>\n    <p class=\"q\"><b>데이비드 게클러(최고경영자)<\/b> <b class=\"ckd\">✔<\/b> \"장기공급계약이 이번 회계연도 물량의 절반, 다음 해는 3분의 2\" · \"이제 고객과 거래하는 주된 방식\" → 계약 고객의 95%가 투자등급, 미국 하이퍼스케일러 3곳 포함.<\/p>\n    <p class=\"q\"><b>루이스 비소소(최고재무책임자)<\/b> <b class=\"ckd\">✔<\/b> \"<mark>2027년에도 강한 시장<\/mark>을 예상한다\" · 업계 2027년 비트 수요 약 +40%, 데이터센터가 비트의 55% 이상 → AI 저장장치 수요가 내년에도 이어진다는 전망입니다.<\/p>\n    <p class=\"na\">설비투자는 이번 분기 3.78억$(매출의 3.4%)에서 올해 매출의 한 자릿수 중반%로 늘릴 계획입니다. 발언·숫자는 자동 녹취록 기준이라 문구가 공식 녹취와 조금 다를 수 있습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 흐름<\/span><span class=\"v\">1개월 −23.1% · 10.29 정규장 −5.3% (1,330.05$)<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v\">±7.7~9.9%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 시간외<\/span><span class=\"v ok\">−1.0% (16:05) → +1.1% (16:20) → +0.6% (1,338.00$, 뉴욕 16:42 · 어닝콜 중)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/SNDK\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">SNDK ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 저장장치 물량은 아직 늘고 있습니다<\/p><p>데이터센터 매출이 한 분기 만에 61% 늘고 다음 분기도 성장 가이던스를 낸 것은, 아마존·마이크로소프트의 설비투자가 메모리·저장장치 주문으로 그대로 내려오고 있다는 물량 확인입니다.<\/p><p>신호는 데이터센터 매출과 다음 분기 가이던스, 소음은 시간외 등락입니다. 성장 속도가 분기마다 느려지는 점은 메모리 가격 정점 논쟁과 함께 계속 볼 부분입니다.<\/p><p>어닝콜에서 장기계약이 내년 물량의 3분의 2를 덮고 2027년 업계 비트 수요 +40%를 제시한 것은, 성장 속도 둔화가 수요가 아니라 공급 한계 때문이라는 설명입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 첫 거래일 종가, 2027년 계약 가격 조건.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/2023554/000162828026068243/sndkq1-27ex991xpressrelease.htm\">회사 IR(공식) · SEC 8-K 보도자료<\/a> · <a href=\"https://247wallst.com/investing/2026/10/29/live-will-sandisks-q1-earnings-disappoint-tonight-after-a-6-intraday-plunge/\">24/7 월스트리트 · 컨센서스<\/a> · <a href=\"https://financefeeds.com/sandisk-sndk-stock-1405-thursday-results-tonight-44-46-guide-after-7-7-percent-jump-samsung-record-bull-1600-bear-1230/\">파이낸스피즈(벤징가)<\/a> · <a href=\"https://www.hudson-labs.com/research/sandisk-q1-2027-earnings-preview-sndk-guidance-and-key-metrics\">허드슨랩스<\/a> · <a href=\"https://gloom.sh/stocks/sndk/transcripts/q1-2027\">어닝콜 녹취(자동)<\/a> · <a href=\"https://finance.yahoo.com/markets/stocks/live/earnings-live-updates-sandisk-posts-solid-earnings-announces-8-for-1-stock-split-202935679.html\">야후 파이낸스 라이브<\/a> · 시간외 주가<\/p>\n<\/article>\n", "updated": "2026-10-29T22:39:21Z"}, {"id": "stx-26q3", "date": "2026-10-27", "ts": "2026-10-27T16:05", "name": "시게이트 STX", "run": "10.27(화) 뉴욕 장 마감 후 · 한국시간 10.28(수) 05:00", "html": "<article id=\"stx-26q3\" data-date=\"2026-10-27\" data-ts=\"2026-10-27T16:05\" data-layer=\"칩·메모리\" data-name=\"시게이트 STX\" data-sum=\"AI 관점 호재(사상 최대 매출·이익) · 매출✅ EPS✅ 가이던스✅ · 시간외 −5.9% · 어닝콜: 공급 2028년까지 장기계약 배정\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 회계 2027년 1분기(7~9월) · 물량확인용 · 어닝콜 반영(한국시간 07:40)<\/div>\n  <h3>시게이트(STX)<\/h3>\n  <p class=\"what\">데이터센터에 들어가는 대용량 하드디스크를 만드는 회사입니다. AI가 만든 데이터를 싸게 오래 저장하는 창고 역할이라, 클라우드 업체가 저장장치를 실제로 얼마나 사는지 보여 줍니다. 밸류체인 칩·메모리 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 42.33억$(예상 41.3~41.4억$)·조정 EPS 7.68$(예상 7.39~7.42$) <b>모두 회사 가이던스 상단 위<\/b>입니다. 다음 분기 가이던스도 매출 48억$±1억$·EPS 9.20$±0.20$로 컨센(45.3억$·8.54~8.58$)을 크게 넘었습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출 <b>전년 +61%·전분기 +17%<\/b>, 매출총이익률 <b>57.8%<\/b>(전년 40.1%)로 사상 최대 수익성입니다. 경영진은 \"수요 환경이 강해지고 있다\", \"장기 고객 수요 가시성\"을 말했습니다. 어닝콜에서 <b>데이터센터 매출 34억$(전년 +63%·전체의 81%)<\/b>, 데이터센터 출하 <b>198엑사바이트(사상 최대·전년 +24%)<\/b>가 확인됐습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>숫자는 상회·상향인데 시간외 초반 <mark>−7%<\/mark>입니다. 발표 당일 정규장에서 약 +4.7% 올라 기대가 이미 높았고, 한 달 동안 약 −25% 빠지며 <mark>공급 과잉 우려<\/mark>가 쟁점이었습니다. 어닝콜에서 <mark>\"공급은 2028년까지 장기계약으로 배정\"<\/mark>, 가격 상승이 빨라지고 있다는 발언이 나왔지만 시간외 낙폭은 −5.9%(628.38$) 수준입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"데이터 생성·보관·재사용이 저장 수요를 계속 키우고, 장기 고객 수요 가시성이 다년간 성장 국면이라는 우리 판단을 뒷받침합니다\"<\/mark><cite>데이브 모슬리 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 데이터가 늘수록 하드디스크 수요도 몇 년 이어진다는 뜻입니다.<\/p>\n    <blockquote>\"HAMR 기술 로드맵으로 공급 규율을 지키면서 늘어나는 엑사바이트 수요에 대응합니다\"<cite>데이브 모슬리 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 공장을 늘리기보다 디스크 한 장에 더 많이 담아 공급 과잉을 피하겠다는 말입니다.<\/p>\n    <blockquote><mark>\"대용량 엑사바이트 공급은 이미 2028년까지 장기 공급계약으로 배정돼 있습니다\"<\/mark><cite>데이브 모슬리 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 앞으로 2년 넘게 팔 물량이 이미 주인이 정해졌다는 뜻 — 공급 과잉 우려에 대한 회사의 답입니다.<\/p>\n    <blockquote>\"계획보다 더 만드는 물량까지 전부 주인이 정해지고 있습니다\"<cite>데이브 모슬리 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 공급보다 크다는 말. 재무책임자는 \"수요와 공급 격차가 오히려 커지고 있다\"고 덧붙였습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>공급 과잉 우려<\/mark><small>최근 한 달 주가 약 −25%<\/small><\/span><\/li>\n      <li><span>발표 전 기대 선반영<small>발표 당일 정규장 약 +4.7%<\/small><\/span><\/li>\n      <li><span>경쟁사 증설 질문엔 답 피함<small>\"경쟁사 계획은 추측하지 않겠다\"<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>가이던스 대폭 상회<\/mark><small>매출 48억$(컨센 45.3억$) · EPS 9.20$(컨센 8.58$)<\/small><\/span><\/li>\n      <li><span>사상 최대 수익성<small>조정 매출총이익률 57.8% · 영업이익률 50.7%<\/small><\/span><\/li>\n      <li><span>사상 최대 잉여현금흐름<small>14.79억$ · 배당 +3% · 자사주 4억$<\/small><\/span><\/li>\n      <li><span><mark>2028년까지 공급 계약 배정<\/mark><small>일부 클라우드 계약은 2030년까지 · 엑사바이트 성장 목표 연 25%<\/small><\/span><\/li>\n    <\/ul><\ 컨센서스를 크게 웃돌았습니다<\/b>.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 데이터센터 연결 부품이 들어간 <b>디지털 데이터 네트워크 매출이 +34.2%(유기 +34.4%)<\/b>로 회사 전체(+12%)의 세 배 속도입니다. 수주 61억$(+29%)도 매출보다 훨씬 많아 앞으로 물량이 쌓이고 있습니다. 광학·전력 필터 쪽 인수에 16억$을 약정해 AI 연결 쪽으로 무게를 옮기는 중입니다. 자동차(+7%)는 비AI라 판정에 넣지 않았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>이번 분기 숫자보다 <mark>다음 분기 EPS 가이던스 3.30$ — 컨센 2.99$보다 약 10% 높게<\/mark> 낸 게 핵심입니다. 수주가 <mark>61억$, 전년 대비 +29%<\/mark>로 3분기 연속 매출을 크게 앞서, 내년(회계 2027) 두 자릿수 매출 성장 전망에 숫자 근거가 붙었습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"2026년의 강한 흐름이 2027 회계연도에도 이어질 것으로 봅니다\"<\/mark><cite>테렌스 커틴 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년도 매출이 두 자릿수로 늘고, 유기적 성장도 올해(+12%)와 비슷할 거라는 뜻입니다.<\/p>\n    <blockquote>\"데이터·전력 흐름이 빨라지면서 고객 수요가 늘고 있습니다\"<cite>테렌스 커틴 · 최고경영자 · 보도자료(기사 인용)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 데이터센터와 전력망 투자가 커넥터 수요를 끌어올린다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>1분기 EPS 가이던스 3.30$<\/mark><small>예상 2.99$ · +21% YoY · 매출 53.5억$ vs 예상 51.2억$<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 수주 61억$ +29%<small>전분기 대비 +6% · 연간 수주 222억$ +27%<\/small><\/span><\/li>\n      <li><span>디지털 데이터 네트워크 +34.2%<small>산업 부문 +19.8% 중 가장 빠름<\/small><\/span><\/li>\n      <li><span>마진 개선<small>조정 영업이익률 22.1% (전년 21.1%)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>매출 서프라이즈는 작음<small>53.1억$ vs 예상 52.7억$ (+0.8%)<\/small><\/span><\/li>\n      <li><span>AI 매출 금액 미공개<small>보도자료에 달러 금액 없음 · 어닝콜 확인<\/small><\/span><\/li>\n      <li><span>센서 −2.0%<small>운송 부문 안 · 자동차 +7.0%로 완만<\/small><\/span><\/li>\n      <li><span>관세 환급 조정<small>4분기 −0.87억$(고객 반환 예정분)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/di rth-quarter-302921354.html\">회사 실적 보도자료(PR뉴스와이어, 공식)<\/a> · <a href=\"https://www.stocktitan.net/news/TEL/te-connectivity-delivers-12-sales-increase-and-over-20-eps-growth-in-1uqtjoswgppv.html\">스톡타이탄 · 세부 부문표<\/a> · <a href=\"https://www.investing.com/news/earnings/te-connectivity-beats-estimates-guides-above-consensus-93CH-4978220\">인베스팅닷컴 · 컨센서스·프리마켓<\/a> · <a href=\"https://www.gurufocus.com/news/9146930/te-connectivity-plc-reports-q4-2026-earnings-eps-at-310-and-revenue-of-53-billion-exceeding-estimates\">구루포커스<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T11:17:20Z"}, {"id": "ter-26q3", "date": "2026-10-27", "ts": "2026-10-27T16:30", "name": "테라다인 TER", "run": "10.27(화) 뉴욕 장 마감 후 · 한국시간 10.28(수) 05:00", "html": "<article id=\"ter-26q3\" data-date=\"2026-10-27\" data-ts=\"2026-10-27T16:30\" data-layer=\"장비\" data-name=\"테라다인 TER\" data-sum=\"AI 관점 호재(메모리·통합시스템 테스트 사상 최대) · 매출✅ EPS✅ · 4분기 가이던스 제자리 · 시간외 약 −6%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 대기(한국시간 21:30)<\/div>\n  <h3>테라다인(TER)<\/h3>\n  <p class=\"what\">완성된 칩이 제대로 작동하는지 검사하는 반도체 테스트 장비 회사입니다. AI 칩·고대역폭메모리(HBM)·네트워크 칩이 많이 만들어질수록 검사 장비도 더 팔려서, AI 칩 생산량을 뒤에서 확인하는 자리입니다. 밸류체인 장비 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 13.06억$(예상 12.7억$)·조정 EPS 2.29$(예상 2.04~2.09$) <b>모두 상회<\/b>, 회사 가이던스(12~13억$·1.85~2.15$) 상단 위입니다. 다만 4분기 가이던스는 매출 12.5~13.5억$·EPS 1.95~2.25$로 <b>이번 분기와 비슷한 수준<\/b>입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출 <b>전년 +70%<\/b>, 메모리·통합시스템 테스트 매출이 <b>사상 최대<\/b>입니다. 최고경영자는 \"수요가 메모리·하드디스크 테스트부터 고속 연결 칩, 로봇까지 AI 밸류체인 전반으로 넓어졌다\"고 했습니다. 다만 매출은 전분기(13.29억$)보다 소폭 줄었고 다음 분기도 제자리라, 성장 속도가 숨 고르기에 들어간 신호인지 어닝콜에서 확인합니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>숫자는 상회인데 시간외 약 <mark>−6%<\/mark>입니다. 발표 당일 정규장에서 +4.8% 올라 기대가 높았는데, <mark>4분기 가이던스 중간값(매출 13억$·EPS 2.10$)이 이번 분기와 거의 같아  → 약 200억$ (재무책임자, 보도 인용)<\/small><\/span><\/li>\n      <li><span>순이익 −43%<small>7.87억$ · 연구개발비 +69%<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span>자동차 마진 개선<small>규제 크레딧 제외 18.1% vs 예상 약 16.7%<\/small><\/span><\/li>\n      <li><span>자율주행 유료 구독 +67%<small>174만 명<\/small><\/span><\/li>\n      <li><span>현금 454억$ · 잉여현금 15.3억$<\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"\", \"items\": [{\"k\": \"매출\", \"a\": 280.5, \"e\": 280.6, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 0.48, \"e\": 0.45, \"u\": \"$\"}, {\"k\": \"인도량\", \"a\": 48.65, \"e\": 46.2, \"u\": \"만 대\"}, {\"k\": \"에너지저장 설치\", \"a\": 13.7, \"e\": 15.9, \"u\": \"GWh\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"실적 발표 다음 날 −3.08%\", \"items\": [{\"d\": \"10/21\", \"v\": 386.49}, {\"d\": \"10/22\", \"v\": 374.58}], \"mark\": \"10/21\", \"markLabel\": \"실적 발표(장후)\"}'><\/div>\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">280.5억$ (280.6억$) 부합 · 보합<\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">0.48$ (0.45$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 EPS / 순이익<\/span><span class=\"v\">0.22$ / 7.87억$ (−43%)<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">19.6% · 자동차(크레딧 제외) 18.1%<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">2.6%<\/span><\/div>\n  <\/section>\n  <section><h4>핵심 지표<\/h4>\n    <div class=\"row\"><span>인도량<\/span><span class=\"v\">486,532대 (−2.1%, 예상 약 46.2만)<\/span><\/div>\n    <div class=\"row\"><span><mark>에너지저장 설치<\/mark><\/span><span class=\"v no\">13.7GWh (예상 약 15.9GWh)<\/span><\/div>\n    <div class=\"row\"><span>에너지 매출 / 마진<\/span><span class=\"v\">28.8억$ (−16%) / 33%<\/span><\/div>\n    <div class=\"row\"><span>자율주행 유료 구독<\/span><span class=\"v\">174만 (+67%)<\/span><\/div>\n    <div class=\"row\"><span>로보택시<\/span><span>오스틴 사이버캡 운행 중 · 무감독 누적 약 200만 마일<\/span><\/div>\n    <div class=\"row\"><span>옵티머스<\/span><span>프리몬트 대량 생산 라인 가동 시작<\/span><\/div>\n  <\/section>\n  <section><h4>현금 · 투자<\/h4>\n    <div class=\"row\"><span>잉여현금흐름 / 설비투자<\/span><span class=\"v\">15.3억$ / 47.3억$<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">454억$<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2026 설비투자<\/span><span class=\"v\"><mark>약 200억$ (이전 250억$ 이상)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>연구개발비<\/span><span class=\"v\">27.6억$ (+69%)<\/span><\/div>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v\">보합~−3% (매체별 엇갈림)<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/22 종가)<\/span><span class=\"v no\">374.58$ (−3.08%)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·차트는 제목 옆 티커를 누르면 야후 파이낸스에서 볼 수 있습니다.<\/p>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p>에너지저장 부진과 설비투자 축소가 부담으로 남았습니다.<\/p><p>다음 확인: 4분기 인도량과 에너지저장 설치 회복 여부.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">빅테크 중 처음으로 투자를 줄였습니다<\/p><p>테슬라는 올해 설비투자를 250억$ 이상에서 약 200억$로 낮췄습니다. 빅테크 가운데 투자를 줄였다고 밝힌 첫 사례입니다.<\/p><p>테슬라는 밸류체인 주문 규모에서 비중이 크지 않지만, 시장은 \"다른 빅테크도 줄이나\"를 보게 됩니다. 메타가 투자를 늘린 것과 정반대 신호라 이번 주 나머지 빅테크의 방향이 더 중요해졌습니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/29~30 마이크로소프트·알파벳·아마존 설비투자 — 늘리는 쪽이 다수인지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://ir.tesla.com/\">회사 IR(공식)<\/a> · <a href=\"https://electrek.co/2026/10/21/tesla-tsla-q3-2026-financial-results/\">일렉트렉<\/a> · <a href=\"https://teslanorth.com/2026/10/21/tesla-q3-2026-earnings/\">테슬라노스<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/tsla-stock-trades-flat-after-hours-following-drop-in-q3-revenue-earnings-and-heavy-ai-spending/cZxMWU7RBvC\">스톡트윗츠 · 시간외<\/a> · <a href=\"https://cappnotes.substack.com/p/closing-look-thursday-october-22\">10/22 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "tsm-26q3", "date": "2026-10-15", "ts": "2026-10-15", "name": "TSMC TSM", "run": "10.15(목) 대만 장 마감 후 · 한국시간 10.15(목) 15:00", "html": "<article id=\"tsm-26q3\" data-date=\"2026-10-15\" data-layer=\"파운드리·실리콘포토닉스\" data-name=\"TSMC TSM\" data-sum=\"매출✅ EPS✅ 가이던스✅ · 당일 −1.8%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 반영<\/div>\n  <h3>TSMC(TSM)<\/h3>\n  <p class=\"what\">엔비디아·애플·AMD·브로드컴 같은 회사가 설계한 칩을 대신 만들어 주는 세계 1위 반도체 위탁생산(파운드리) 회사입니다. AI 가속기를 쌓아 올리는 첨단 패키징(CoWoS)까지 맡고 있어, AI 칩 대부분이 이 회사 공장을 거칩니다. 밸류체인 파운드리 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는? · AI 인프라 수요가 잘 빠지고 있나<\/p><p><span class=\"g\">좋음<\/span>매출·순이익·EPS 모두 예상 상회, 6분기 연속 사상 최대. 핵심인 <b>고성능컴퓨팅(HPC, AI 가속기·서버 칩) 매출이 한 분기 만에 22% 늘어 전체의 68%<\/b>가 됐습니다. 4분기 가이던스도 전년 대비 +58%(중간값)로, AI 수요는 꺾인 신호가 없습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 걸린 포인트<\/p><p>사상 최대 실적에 연간 성장률 전망까지 44%로 올렸는데 당일 −1.8%, 다음 날 −2.3%. ① <mark>총마진이 67.7%→66.4%로 내려왔고 4분기도 66%(중간값)로 더 낮게 제시<\/mark>, ② 해외 공장 마진 희석이 올해 약 2%포인트에서 <mark>앞으로 3~4%포인트로 커진다<\/mark>고 했으며, ③ 실적 전부터 물가 지표·AI 자금조달 우려로 반도체주가 급락하던 구간(10/5→10/14 −11.5%)이었습니다. 수요가 아니라 '마진'과 '시장 분위기'가 발목을 잡았습니다.<\/p><\/div>\n\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"우리는 여전히 수요가 공급보다 많다고 보고, 그 격차를 줄이려 아주 열심히 일하고 있다\"<\/mark><cite>C.C. 웨이 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 칩 주문이 공장이 만들 수 있는 양보다 많다는 뜻. 병목은 수요가 아니라 생산 능력입니다.<\/p>\n    <blockquote>\"둔화 신호는 전혀 보지 못했다. (AI 가속기 매출 성장률이) 50%대 후반이든 상관없다, 아마 더 높을 것\"<cite>C.C. 웨이 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 2024~2029년 AI 가속기 매출 연평균 50% 중후반 성장이라는 기존 전망도 '보수적'일 수 있다는 얘기입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <
