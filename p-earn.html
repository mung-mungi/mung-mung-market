\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기<\/span><span class=\"v\"><mark>핵심 사업 전년·전분기 동반 성장<\/mark><\/span><\/div>\n    <div class=\"row\"><span>양산<\/span><span class=\"v\">8.5kW 전원·배터리 백업 양산 중 · 110kW·42인치 전원 선반 4분기 양산<\/span><\/div>\n    <div class=\"row\"><span>800V 직류 전원 랙<\/span><span class=\"v\">이번 분기 샘플 출하 · 차세대 전력 관리 시스템 최종 검증<\/span><\/div>\n    <div class=\"row\"><span>액체냉각<\/span><span class=\"v\">액체냉각 회사 투자·통합 · 2.6MW 냉각수 분배 장치 공개 · 정밀가공 자회사 분할 승인<\/span><\/div>\n    <p class=\"na\">대만 회사라 숫자 가이던스는 없습니다. 4분기 마진 전망과 설비투자 숫자는 보도에서 확인하지 못했습니다.<\/p>\n  <\/section>\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 16:20<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>AI 비중<\/b> 추썬빈(邱森彬) 총경리: <mark>\"올해 AI 관련 매출 비중이 30%를 넘었다\"<\/mark><\/p>\n    <p class=\"q\"><b>수요<\/b> 추썬빈 총경리: \"AI 연산·데이터센터 인프라 수요가 계속 늘어 1~9월 클라우드 관련 매출이 80% 늘었다\" → 수요 둔화 신호 없음.<\/p>\n    <p class=\"q\"><b>4분기<\/b> 추썬빈 총경리(요지): 제품 일정은 계획대로이고 4분기 핵심 사업은 전년·전분기 모두 성장, 내년도 낙관.<\/p>\n    <p class=\"na\">질의응답 전문은 아직 나오지 않았습니다. 마진·800V 양산 시점 질의 내용은 확인되는 대로 보강합니다.<\/p>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>10/29 종가<\/span><span class=\"v\">252.0<\/span><\/div>\n    <div class=\"row\"><span>10/30 종가 (실적 발표 전)<\/span><span class=\"v no\">240.5 (−4.6%) · 가권지수 −1,156포인트<\/span><\/div>\n    <div class=\"row\"><span>실적 반응<\/span><span class=\"v na\">11/2(월) 첫 거래일 확인 필요<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">11/02 업데이트 예정<\/span><\/h4><p>11/2 첫 거래일 종가와 증권사 목표가 변경, 델타(10/29, −4.5%)와 비교해 시장이 마진을 문제 삼는지 정리합니다.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 랙 전원은 2번 주자까지 사상 최대 — 수요는 넓게 퍼지고 있습니다<\/p><p>델타에 이어 라이트온도 AI 전원 매출이 크게 늘어, 랙 전원 수요가 한 회사가 아니라 업계 전체 이야기임을 보여 줍니다. 델타는 마진·재고가 문제였고 라이트온도 마진이 2분기보다 내려와, 원가·부품 부담은 공통 과제입니다.<\/p><p>신호는 AI 매출 비중과 4분기 신제품 양산, 소음은 시장 급락일의 하루 주가입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 11/2 주가 반응, 10월 월매출(11월 초), 800V 전원 랙 양산 일정.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://news.nextapple.com/finance/20261030/0C0AE7D44DDD3FBA5743CDCCD2DE286D\">壹蘋新聞網 · 3분기 실적<\/a> · <a href=\"https://udn.com/news/story/7252/9847164\">聯合報 · 1~9월 실적·총경리 발언<\/a> · <a href=\"https://tw.stock.yahoo.com/news/%E5%85%89%E5%AF%B6%E7%A7%91q3-eps%E4%BC%B0%E5%84%AA%E6%96%BCq2-%E6%98%8E%E6%97%A5%E6%B3%95%E8%AA%AA%E8%81%9A%E7%84%A6%E5%9B%9B%E5%A4%A7%E9%87%8D%E9%BB%9E-030500906.html\">MoneyDJ · 설명회 프리뷰<\/a> · <a href=\"https://poorstock.com/earningcall/2301\">poorstock · 2분기 설명회 요약<\/a> · <a href=\"https://finance.yahoo.com/quote/2301.TW/\">야후파이낸스 · 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-30T16:28+09:00"}, {"id": "lrcx", "date": "2026-10-21", "ts": "2026-10-21", "name": "램리서치 LRCX", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"lrcx\" data-date=\"2026-10-21\" data-layer=\"장비\" data-name=\"램리서치 LRCX\" data-sum=\"매출✅ EPS✅ 가이던스✅ · 다음 날 −11.8%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · FY27 1분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>램리서치(LRCX)<\/h3>\n  <p class=\"what\">반도체 웨이퍼에 회로를 새기는 식각·증착 장비 세계 1위권 회사입니다. 고대역폭메모리(HBM)·최첨단 파운드리·첨단 패키징 공정에 장비가 들어갑니다. 밸류체인 장비 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출·EPS·다음 분기 가이던스 <b>모두 예상 상회<\/b>. 사상 최대 매출 82.2억$, 영업이익률 처음 40%대, 배당 27% 인상까지 — 숫자만 보면 좋은 실적입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>사상 최대 매출·첫 영업이익률 40%를 찍고 다음 분기 가이던스도 예상보다 높았는데 다음 날 −11.8%. ① 매출이 예상을 겨우 0.9억$ 넘었고 ② <mark>부품 공급이 막혀 12월 분기 출하 일부가 3월로 밀렸으며<\/mark> ③ <mark>12월 중국 매출이 '의미 있게' 줄어든다<\/mark>고 했습니다. 수요는 더 강해졌는데 다 못 파는 상황이 실망으로 읽혔습니다.<\/p><\/div>\n\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"단기 공급망 제약이 없었다면 이번 가이던스는 조금 더 높았을 것\"<\/mark><cite>더그 베팅어 · 최고재무책임자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 수요가 모자란 게 아니라 <b>부품이 모자라 다 못 판 것<\/b>. 수요는 오히려 더 강하다는 뜻입니다.<\/p>\n    <blockquote>\"2027년 업계 장비 투자는 2,000억$를 넘을 것\"<cite>팀 아처 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 2026년 약 1,550억$보다 한 해 만에 30%가량 큰 판. 내년 수요 그림은 더 커졌습니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>공급 제약으로 12월 출하 이월<\/mark><small>\"제약이 없었다면 가이던스가 더 높았을 것\" — 애널리스트 추정 3~4억$<\/small><\/span><\/li>\n      <li><span><mark>12월 중국 매출 '의미 있게' 감소<\/mark><small>9월 분기 중국 비중 35%(전분기 26%)가 꺾이는 구간<\/small><\/span><\/li>\n      <li><span>예상을 넘은 폭이 작음<small>매출 +1.0% · EPS +1.4% · 가이던스 +0.7% — 기대가 높았던 만큼 '겨우 넘김'<\/small><\/span><\/li>\n      <li><span>세율 상승(약 16.5%)<small>같은 이익이어도 주당순이익이 덜 남음<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>2027년 업계 장비 투자 2,000억$ 이상<\/mark><small>2026년 약 1,550억$보다 한 해 만에 30%가량 큼<\/small><\/span><\/li>\n      <li><span>영업이익률 처음 40%대<small>40.2% · 다음 분기 40.5% 가이던스, 총마진 50% 중반까지 확대 여지<\/small><\/span><\/li>\n      <li><span>잉여현금 사상 최대·배당 27% 인상<small>잉여현금흐름 32.4억$ · 자사주 10.3억$<\/small><\/span><\/li>\n      <li><span>밀린 매출은 사라지지 않음<small>수요가 아닌 공급 문제 → 3월 분기로 이월<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"막대가 짧을수록 ’겨우 넘김’입니다. 전부 넘었지만 폭이 1% 안팎입니다.\", \"items\": [{\"k\": \"매출\", \"a\": 82.19, \"e\": 81.35, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 2.2, \"e\": 2.17, \"u\": \"$\"}, {\"k\": \"다음 분기 매출 가이던스\", \"a\": 86.0, \"e\": 85.4, \"u\": \"억$\"}, {\"k\": \"다음 분기 EPS 가이던스\", \"a\": 2.33, \"e\": 2.32, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"점선 막대 = 회사가 제시한 12월 분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 53.24}, {\"q\": \"25.4Q\", \"v\": 53.45}, {\"q\": \"26.1Q\", \"v\": 58.42}, {\"q\": \"26.2Q\", \"v\": 67.22}, {\"q\": \"26.3Q\", \"v\": 82.19, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 86.0, \"g\": 1}]}'><\/div>\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">82.19억$ (81.3~81.4억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">+54% / +22%<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">2.20$ (2.15~2.18$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계기준 주당순이익<\/span><span class=\"v\">2.19$ (전년 1.24$)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">52.4% · 사상 최대 (전분기 52.0%)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익<\/span><span class=\"v\">33.01억$ · 이익률 40.2%<\/span><\/div>\n    <div class=\"row\"><span>　영업이익률<\/span><span class=\"v\">처음으로 40%대 (전분기 38.4%)<\/span><\/div>\n    <div class=\"row\"><span>회계기준 순이익<\/span><span class=\"v\">27.53억$ (전년 15.69억$)<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별 · 지역별<\/h4>\n    <div class=\"row\"><span>장비(시스템) 매출<\/span><span class=\"v\">57.33억$ (전분기 42.50억)<\/span><\/div>\n    <div class=\"row\"><span>고객지원·기타 매출<\/span><span class=\"v\">24.87억$ (전분기 24.72억)<\/span><\/div>\n    <div class=\"row\"><span>장비 매출 고객별<\/span><span class=\"v\">메모리 46% · 파운드리 46% · 로직 8%<\/span><\/div>\n    <div class=\"row\"><span>중국<\/span><span class=\"v\">35% (전분기 26%)<\/span><\/div>\n    <div class=\"row\"><span>한국 / 대만 / 일본<\/span><span class=\"v\">20% / 18% / 9%<\/span><\/div>\n    <div class=\"row\"><span>미국 / 동남아 / 유럽<\/span><span class=\"v\">8% / 6% / 4%<\/span><\/div>\n  <\/section>\n\n  <div class=\"vizrow\">\n    <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"지역별 매출 비중 (%)\", \"cap\": \"중국 35%가 12월 분기에 크게 줄어들 예정 — 형광 표시\", \"items\": [{\"k\": \"중국\", \"v\": 35, \"hl\": 1}, {\"k\": \"한국\", \"v\": 20}, {\"k\": \"대만\", \"v\": 18}, {\"k\": \"일본\", \"v\": 9}, {\"k\": \"미국\", \"v\": 8}, {\"k\": \"동남아\", \"v\": 6}, {\"k\": \"유럽\", \"v\": 4}]}'><\/div>\n    <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"장비 매출 고객별 (%)\", \"cap\": \"올해 장비 매출 증가분의 약 80%가 D램·파운드리에서 나왔습니다\", \"items\": [{\"k\": \"메모리\", \"v\": 46, \"hl\": 1}, {\"k\": \"파운드리\", \"v\": 46}, {\"k\": \"로직·기타\", \"v\": 8}]}'><\/div>\n  <\/div>\n\n  <section><h4>핵심 지표 · 업황 숫자 (어닝콜)<\/h4>\n    <div class=\"row\"><span>2026년 업계 장비 투자<\/span><span class=\"v\">약 1,550억$<\/span><\/div>\n    <div class=\"row\"><span>2027년 업계 장비 투자<\/span><span class=\"v\"><mark>2,000억$ 이상 (첫 전망)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>　2027 순위<\/span><span>D램 → 파운드리·로직 → 낸드<\/span><\/div>\n    <div class=\"row\"><span>고객지원 매출 성장<\/span><span class=\"v\">2026 +30%↑ · 2027 +15%↑<\/span><\/div>\n    <div class=\"row\"><span>첨단 패키징 성장<\/span><span class=\"v\">2026 +70%↑ 목표 유지<\/span><\/div>\n    <div class=\"row\"><span>이연수익(받아 둔 선수금)<\/span><span class=\"v\">26.6억$ (전분기 24.3억)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">34.98억$ (전분기 14.57억)<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v\">32.40억$ · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v\">10.25억$ (남은 한도 약 30억$)<\/span><\/div>\n    <div class=\"row\"><span>배당<\/span><span class=\"v\">주당 0.33$ · 0.26$에서 27% 인상<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">74.37억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">약 46억$ (회전율 개선 3.4회)<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · FY27 2분기(10~12월)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">86억$ ±4억 (85.4억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">2.33$ ±0.15 (2.32$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>총마진 / 영업이익률<\/span><span class=\"v\">52.5% ±1 / 40.5% ±1<\/span><\/div>\n    <div class=\"row\"><span>세율<\/span><span class=\"v\">약 16.5% (높아짐)<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 공급 제약<\/span><span><mark>12월 출하 일부 → 3월 분기로 이월<\/mark><\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 중국<\/span><span><mark>12월 '의미 있게' 감소 예고<\/mark><\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 · 어닝콜 발언<span class=\"call\">어닝콜 반영 · 콜 한국시간 10.22 06:00<\/span><\/h4>\n    <p class=\"q\"><b>더그 베팅어(최고재무책임자)<\/b> <mark>\"단기 공급망 제약이 없었다면 이번 가이던스는 조금 더 높았을 것\"<\/mark> → 수요가 아니라 부품이 모자라 못 판 매출입니다. 애널리스트의 3~4억$ 추정엔 숫자를 확인해 주지 않았습니다.<\/p>\n    <p class=\"q\"><b>더그 베팅어<\/b> <mark>\"12월에는 중국이 의미 있게 줄어든다, 중국 현지 고객 때문\"<\/mark> → 다국적 고객의 중국 공장 수요는 견조할 것이라고 덧붙였습니다.<\/p>\n    <p class=\"q\"><b>팀 아처(최고경영자)<\/b> \"2027년 업계 장비 투자는 2,000억$를 넘을 것\" → D램이 가장 크게 늘고, 2027년 새 대형 공장 10곳이 가동된다고 했습니다.<\/p>\n    <p class=\"q\"><b>팀 아처<\/b> 클린룸 공간과 일부 부품 공급 제약이 2027년까지 업계의 공급을 제한할 것 → 공급사와 함께 생산 능력을 늘리는 중입니다.<\/p>\n    <p class=\"q\"><b>더그 베팅어<\/b> 신제품·현지 생산·가격 덕에 \"총마진을 50% 중반까지 넓힐 기회\" → 수익성은 더 오를 여지가 있습니다.<\/p>\n    <p class=\"na\">발언은 영어 원문을 우리말로 옮긴 요지입니다. 원문은 아래 어닝콜 녹취 링크에 있습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/21 종가)<\/span><span class=\"v\">260.81$ (−1.0%)<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v no\">약 −7~8% (242$ 부근)<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/22 종가)<\/span><span class=\"v no\">230.15$ (−11.8%)<\/span><\/div>\n    <div class=\"row\"><span>10/23 종가<\/span><span class=\"v\">230.10$ (보합)<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"na\">확인 못 함<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"주가 흐름 (종가, 달러)\", \"cap\": \"실적 발표 다음 날 하루에 −11.8%\", \"items\": [{\"d\": \"10/15\", \"v\": 277.46}, {\"d\": \"10/16\", \"v\": 263.94}, {\"d\": \"10/19\", \"v\": 272.2}, {\"d\": \"10/20\", \"v\": 263.45}, {\"d\": \"10/21\", \"v\": 260.81}, {\"d\": \"10/22\", \"v\": 230.15}, {\"d\": \"10/23\", \"v\": 230.1}], \"mark\": \"10/21\", \"markLabel\": \"실적 발표(장후)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>결국 시장이 문제 삼은 건 두 가지였습니다.<\/b> ① <mark>12월 분기 중국 매출이 '의미 있게' 준다는 말<\/mark>, ② <mark>부품 공급 제약으로 출하 일부가 3월로 밀린 것<\/mark>. 사상 최대 실적·가이던스 상회는 이미 기대에 들어 있었고, 하루 −11.8% 뒤 10/23에도 230.10$로 되돌림이 없었습니다.<\/p><p>다음 확인: 이번 주 KLA·어플라이드머티리얼즈 실적에서 '중국 감소'와 '공급 제약'이 반복되면 장비 층 전체 이슈, 램리서치만의 얘기면 회사 이슈로 봅니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>이번 실적의 핵심은 숫자가 아니라 <mark>'공급 병목'<\/mark>입니다. 2027년 장비 투자 전망은 2,000억$ 이상으로 오히려 커졌는데, 장비를 다 못 만들어 매출이 다음 분기로 밀리고 있습니다. 밀린 매출은 사라지는 게 아니라 이월되는 몫이고, 중국 현지 고객 감소분은 실제로 빠지는 몫입니다. 이번 주 KLA·어플라이드 실적에서 '공급 제약'과 '중국 감소' 발언이 반복되는지가 장비 층 전체의 방향을 정합니다.<\/p>\n  <\/section>\n  <p class=\"xref\">X 참고: 이번 정리에선 @wallstengine·@allday_stocks 글이 검색에 잡히지 않아 쓰지 않았습니다. 숫자는 모두 회사 공식 자료 기준입니다.<\/p>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000707549/000070754926000052/lrcx_exhibitx991xq1x2027.htm\">회사 IR(공식) · 실적 보도자료(SEC 8-K)<\/a> · <a href=\"https://investor.lamresearch.com/\">램리서치 투자자 정보<\/a> · <a href=\"https://www.fool.com/earnings/call-transcripts/2026/10/21/lam-research-lrcx-q1-2027-earnings-call-transcript/\">어닝콜 녹취(모틀리풀)<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/lrcx-stock-record-profits-supply-snags-sales-hold-china-slowdown/cZxvH4rRBw4\">스톡트윗츠 · 컨센서스·시간외<\/a> · <a href=\"https://www.tradingkey.com/analysis/stocks/us-stocks/262232001-lam-research-stock-forecast-q1-earnings-december-guide-242-support-october-22-2026-tradingkey\">트레이딩키 · 가이던스 컨센<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "mediatek-26q3", "date": "2026-10-30", "ts": "2026-10-30T16:00", "name": "미디어텍 2454", "run": "10.30(금) 대만 실적 설명회 · 한국시간 10.30(금) 15:00", "html": "<article id=\"mediatek-26q3\" data-date=\"2026-10-30\" data-krun=\"2026-10-30\" data-ts=\"2026-10-30T16:00\" data-layer=\"커스텀칩\" data-name=\"미디어텍 2454\" data-sum=\"AI 관점 호재(4분기 데이터센터 25억$·첫 AI 칩 9월 출하) · 매출 가이던스 상단 +5% 상회 · 4분기 매출 +25~32% 가이던스 · EPS 17.5 · 발표 전 종가 −3.2% · 어닝콜 반영\">\n  <div class=\"tag\"><b>실적결과<\/b> 대만 · 2026년 3분기(7~9월) · 어닝콜 반영<\/div>\n  <h3>미디어텍(2454)<\/h3>\n  <p class=\"what\">대만 반도체 설계 회사입니다. 스마트폰 칩이 주력이고, 구글 TPU 설계 협력으로 데이터센터용 맞춤형 AI 칩(ASIC) 매출을 키우는 중입니다. 밸류체인 커스텀칩 층.<\/p>\n  <div class=\"hl chainpos\"><p class=\"k\">🔗 사슬 위치 · 구글 ▶ 맞춤형 AI 칩(ASIC) 설계<\/p><p>▪ <b>브로드컴<\/b>: 구글 TPU 주력 설계 파트너(대장)<\/p><p>▪ <b>미디어텍<\/b>: 구글 TPU 일부(추론용)를 맡으며 새로 들어온 2번 공급자<\/p><p>▪ <b>마벨<\/b>: 같은 맞춤형 칩 판, 고객은 아마존·마이크로소프트 쪽<\/p><p class=\"m\">→ 미디어텍 데이터센터 매출이 늘면 → 구글 TPU 물량이 늘고 있다는 신호입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>1,680.6억 대만달러<\/b>(전분기 +10.4%, 전년 +18.3%)로 회사 가이던스 상단(1,598억)을 <b>약 5%<\/b> 넘었습니다. 매출총이익률 46.3%는 가이던스(46%±1.5%p) 안, 주당순이익은 <b>17.5대만달러<\/b>(2분기 15.28)입니다. 다만 영업현금흐름이 <b>42.6억 순유출<\/b>로 돌아서고 재고가 전분기보다 56% 늘었습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>설명회에서 회사가 <b>4분기 데이터센터 매출 예상을 25억$로 올렸고<\/b>, 첫 AI 가속기 맞춤형 칩(ASIC)은 <b>9월부터 출하<\/b>가 순조롭다고 밝혔습니다. 2027년 데이터센터 매출은 <b>160억$ 목표 범위 상단<\/b>(AI 가속기 맞춤형 칩 시장의 약 20%)까지 가능하다고 봤습니다. 3분기 숫자는 스마트기기·TV 칩이 만들었지만, 4분기부터 알파벳 등 빅테크 설비투자가 미디어텍 매출로 본격 들어온다는 회사 확인입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 걱정한 포인트<\/p><p>숫자는 <mark>가이던스 상단을 5% 넘는 매출<\/mark>이었지만, 설명회 전 주가는 <mark>TPU 칩 진행·첨단 패키징 수율 걱정<\/mark>으로 장중 −4.6%까지 밀렸습니다(종가 −3.2%). 설명회에서 회사는 <mark>4분기 매출 +25~32%<\/mark>, 데이터센터 25억$로 답했습니다 — 씨티 예상(약 +30%)과 비슷한 범위라, 11/2 주가가 이 답을 어떻게 받는지 봐야 합니다.<\/p><\/div>\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"4분기 데이터센터 매출 예상을 25억$로 올리고, 2027년 160억$ 목표 범위 상단도 가능하다\"<\/mark><cite>차이리싱(蔡力行) · 부회장 겸 최고경영자 · 3분기 실적 설명회(요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 맞춤형 AI 칩이 계획보다 빨리 매출로 들어온다는 뜻입니다. 2027년이 되면 데이터센터가 휴대폰에 맞먹는 사업이 됩니다(자체 해석).<\/p>\n    <blockquote>\"첫 AI 가속기 맞춤형 칩은 9월부터 출하돼 순조롭게 늘고 있고, 두 번째 프로젝트는 2028년 1분기 대량 양산 예정\"<cite>차이리싱(蔡力行) · 부회장 겸 최고경영자 · 설명회(요지)<\/cite><\/blockquote>\n    <p class=\"m\">→ 씨티가 걱정한 패키징 수율 이야기와 달리 회사는 일정대로라고 답했습니다.<\/p>\n    <p class=\"m\">기사들은 발언을 직접 인용 없이 요지로 전했습니다.<\/p>\n  <\/div>\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><mark>TPU 칩 진행·패키징 수율 걱정<\/mark><small>씨티: 차세대(v9) 양산 시점 영향 가능 · 설명회 전 장중 −4.6%<\/small><\/span><\/li>\n      <li><span>영업현금흐름 순유출<small>−42.6억 (2분기 +242.5억)<\/small><\/span><\/li>\n      <li><span>재고 급증<small>1,535.3억 · 전분기 +56% · 재고일수 127일(2분기 102일)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><mark>매출 가이던스 상단 +5%<\/mark><small>1,680.6억 vs 상단 1,598억<\/small><\/span><\/li>\n      <li><span>영업이익 전분기 +18.5%<small>271.0억 · 이익률 16.1%<\/small><\/span><\/li>\n      <li><span><mark>4분기 매출 +25~32% 가이던스<\/mark><small>2,101~2,218억 대만달러 · 전년 +40~48%<\/small><\/span><\/li>\n      <li><span>데이터센터 4분기 25억$<small>2027년 160억$ 목표 상단 가능 · 39억$ 전환사채에 엔비디아·알파벳 참여<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"회사 가이던스 대비 (상단 기준)\", \"cap\": \"공식 컨센서스는 확인하지 못해 회사 가이던스 상단과 비교했습니다\", \"items\": [{\"k\": \"매출\", \"a\": 1680.6, \"e\": 1598, \"u\": \"억 대만달러\"}, {\"k\": \"매출총이익률\", \"a\": 46.3, \"e\": 46.0, \"u\": \"%(가이던스 중간값)\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억 대만달러)\", \"cap\": \"25.3Q는 전년 대비 +18.3%로 거꾸로 계산한 값입니다\", \"items\": [{\"q\": \"25.3Q\", \"v\": 1421}, {\"q\": \"26.2Q\", \"v\": 1522}, {\"q\": \"26.3Q\", \"v\": 1681, \"hi\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"발표 앞뒤 주가 (대만달러)\", \"cap\": \"실적은 10/30 장 마감 뒤 발표 — 첫 반응은 11/2\", \"items\": [{\"d\": \"10/23\", \"v\": 4010}, {\"d\": \"10/27\", \"v\": 3960}, {\"d\": \"10/28\", \"v\": 4235}, {\"d\": \"10/29\", \"v\": 4045}, {\"d\": \"10/30\", \"v\": 3915}], \"mark\": \"10/30\", \"markLabel\": \"실적 발표(장 마감 뒤)\"}'><\/div>\n  <section><h4>핵심 실적 (연결)<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 매출<\/span><span class=\"v\"><mark>1,680.6억 대만달러<\/mark> · 전분기 +10.4% · 전년 +18.3% (가이던스 1,522~1,598억 <span class=\"ok\">✅<\/span>)<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">46.3% (가이던스 46%±1.5%p 안 · 2분기 46.2%)<\/span><\/div>\n    <div class=\"row\"><span>영업이익<\/span><span class=\"v\">271.0억 · 이익률 16.1% · 전분기 +18.5% · 전년 +22.2%<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">282.0억 · 전분기 +14.6% · 전년 +10.8%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 주당순이익<\/span><span class=\"v\">17.5대만달러 (2분기 15.28)<\/span><\/div>\n    <div class=\"row\"><span>영업비용 비율<\/span><span class=\"v\">30.2% (연구개발 25.1%)<\/span><\/div>\n    <p class=\"na\">같은 기사 뒷부분에 영업이익 279.2억·이익률 16.6%, 순이익 289.0억(조정 EPS 17.92)도 나와 공식 자료로 확인이 필요합니다. 미국달러 매출·부문별 비중은 확인하지 못했습니다.<\/p>\n  <\/section>\n  <section><h4>현금 · 재고<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 영업현금흐름<\/span><span class=\"v no\"><mark>−42.6억 순유출<\/mark> (2분기 +242.5억 · 전년 +391.8억)<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v no\">1,535.3억 · 전분기 +56% · 전년 +170% · 127일<\/span><\/div>\n    <div class=\"row\"><span>현금·유동 금융자산<\/span><span class=\"v\">2,783.2억 (2분기 1,984.0억)<\/span><\/div>\n  <\/section>\n  <section><h4>AI 맞춤형 칩 · 설명회 전 증권사 전망<\/h4>\n    <div class=\"row\"><span>외국계 증권사<\/span><span class=\"v\">TPU(v8) 일정대로 · 올해 매출 20억$ 이상 · 4분기 매출 전분기 약 +30% 예상 · 목표가 6,800 유지<\/span><\/div>\n    <div class=\"row\"><span>씨티<\/span><span class=\"v\">첨단 패키징 수율로 v9 양산 시점 영향 가능 · 2028년 AI 칩 매출 400억$ 유지<\/span><\/div>\n    <div class=\"row\"><span>고속 연결 기술<\/span><span class=\"v\">224G 양산 · 336G·448G 개발 중<\/span><\/div>\n  <\/section>\n  <section><h4>가이던스 · 4분기<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 매출<\/span><span class=\"v ok\"><mark>2,101~2,218억 대만달러 · 전분기 +25~32% · 전년 +40~48%<\/mark><\/span><\/div>\n    <div class=\"row\"><span>매출총이익률<\/span><span class=\"v\">45%±1.5%p (3분기 46.3%)<\/span><\/div>\n    <div class=\"row\"><span>영업비용 비율<\/span><span class=\"v\">26%±2%p<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 데이터센터 매출<\/span><span class=\"v ok\">25억$로 상향<\/span><\/div>\n    <div class=\"row\"><span>2026년 연간<\/span><span class=\"v\">미국달러 매출 성장이 기존 '한 자릿수 후반' 목표를 넘을 것<\/span><\/div>\n    <div class=\"row\"><span>2027년 데이터센터<\/span><span class=\"v\">160억$ 목표 범위 상단 가능 (AI 가속기 맞춤형 칩 시장 약 20%)<\/span><\/div>\n    <div class=\"row\"><span>두 번째 맞춤형 칩<\/span><span class=\"v\">2028년 1분기 대량 양산 예정<\/span><\/div>\n    <div class=\"row\"><span>3분기 부문<\/span><span class=\"v\">스마트 엣지 58%(전년 +63%) · 휴대폰 37%(−17%) · 전원 칩 5%<\/span><\/div>\n    <p class=\"na\">씨티 등 외국계는 4분기 매출 약 +30%를 예상했습니다(설명회 전). 환율 가정은 확인하지 못했습니다. 한 기사 부제는 내년 AI 가속기 매출을 150억$로 적어 본문(160억$)과 다릅니다.<\/p>\n  <\/section>\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">어닝콜 반영 · 한국시간 17:00<\/span><\/h4>\n    <p class=\"q\"><b class=\"ckd\">✔<\/b> <b>데이터센터<\/b> 차이리싱(蔡力行) 부회장 겸 최고경영자(요지): <mark>4분기 데이터센터 매출 25억$, 2027년 160억$ 목표 상단 가능<\/mark><\/p>\n    <p class=\"q\"><b>첫 맞춤형 칩<\/b> 9월 출하 시작, 물량 확대 순조. 두 번째 프로젝트는 고객 차세대 AI 인프라용, 2028년 1분기 대량 양산.<\/p>\n    <p class=\"q\"><b>기술<\/b> 448G 고속 연결, 3.5D 첨단 패키징, 광-전기 일체형(CPO) 개발 계속 · 엔비디아 NVLink Fusion 협력.<\/p>\n    <p class=\"q\"><b>재무<\/b> 3분기에 39억$ 해외 전환사채 발행 완료(엔비디아·알파벳 참여).<\/p>\n    <p class=\"na\">재고 급증·영업현금흐름 순유출에 대한 설명은 보도에서 확인하지 못했습니다(맞춤형 칩 양산 준비로 추정할 뿐 — 자체 해석).<\/p>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>10/29 종가<\/span><span class=\"v\">4,045<\/span><\/div>\n    <div class=\"row\"><span>10/30 종가 (실적 발표 전)<\/span><span class=\"v no\">3,915 (−3.2%) · 장중 3,860(−4.6%)<\/span><\/div>\n    <div class=\"row\"><span>실적 반응<\/span><span class=\"v na\">11/2(월) 첫 거래일 확인 필요<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">개별 옵션 없음<\/span><\/div>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">11/02 업데이트 예정<\/span><\/h4><p>설명회의 4분기 가이던스, 11/2 주가, 알파벳 TPU 발언과 맞춰 보고 정리합니다.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">빅테크 맞춤형 칩 돈이 4분기부터 미디어텍 매출로 들어옵니다<\/p><p>3분기 숫자는 휴대폰·TV 칩이 만들었지만, 4분기 데이터센터 25억$와 매출 +25~32% 가이던스로 알파벳 등 빅테크 설비투자 중 맞춤형 칩 몫이 실제 매출로 바뀌는 단계에 들어섰습니다. 재고·현금 유출이 그 양산 준비라면 4분기에 매출로 풀려야 합니다.<\/p><p>신호는 데이터센터 매출 목표와 출하 시작, 소음은 설명회 전 하루 주가입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 11/2 주가, 4분기 재고 감소 여부, 브로드컴(12월) 맞춤형 칩 발언.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://news.nextapple.com/finance/20261030/307635496E52514E6CD6A235AFE647FF\">壹蘋新聞網 · 설명회 4분기 가이던스<\/a> · <a href=\"https://money.udn.com/money/story/5710/9847265\">經濟日報 · 1~9월 실적<\/a> · <a href=\"https://news.nextapple.com/finance/20261030/E8E9BDD6143DDDF664C7BB646B429994\">壹蘋新聞網 · 3분기 재무<\/a> · <a href=\"https://news.nextapple.com/finance/20261030/9168195299829E4457AB40CC7D311C41\">壹蘋新聞網 · 설명회 전 주가·증권사 전망<\/a> · <a href=\"https://www.moneyweekly.com.tw/ArticleData/Info/Article/258979\">理財周刊 · 설명회 프리뷰<\/a> · <a href=\"https://asiaai.fyi/mediatek-q3-revenue-ai-asic/\">AsiaAI · 9월 매출<\/a> · <a href=\"https://finance.yahoo.com/quote/2454.TW/\">야후파이낸스 · 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-30T17:02+09:00"}, {"id": "meta-26q3", "date": "2026-10-21", "ts": "2026-10-21", "name": "메타 META", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"meta-26q3\" data-date=\"2026-10-21\" data-layer=\"빅테크\" data-name=\"메타 META\" data-sum=\"매출✅ EPS✅(일회성 제외) · 다음 날 −6.98%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · ★미래전망 킥<\/div>\n  <h3>메타(META)<\/h3>\n  <p class=\"what\">페이스북·인스타그램·왓츠앱을 운영하는 광고 회사이자 AI 데이터센터에 가장 많이 돈을 쓰는 빅테크 중 하나입니다. 설비투자 숫자가 밸류체인 전체 주문을 정합니다. 밸류체인 빅테크 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var "><span>리얼리티랩스 손실<\/span><span class=\"v\">2026 180~190억$ · 2027 약 150억$<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 2027<\/span><span class=\"v\"><mark>\"공격적으로 계속 투자\" (숫자 없음)<\/mark><\/span><\/div>\n    <div class=\"row\"><span>기타<\/span><span>2027년 1월부터 무의결권 C주 1:1 배정 (사실상 2대1 분할)<\/span><\/div>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v ok\">+3~5%<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/22 종가)<\/span><span class=\"v no\">648.85$ (−6.98%)<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·차트는 제목 옆 티커를 누르면 야후 파이낸스에서 볼 수 있습니다.<\/p>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>결국 시장이 문제 삼은 건<\/b> <mark>비용 전망 상향과 숫자 없는 2027 투자 계획<\/mark>이었습니다. 시간외 상승이 다음 날 −7%로 뒤집혔습니다.<\/p><p>다음 확인: 10/29 마이크로소프트·알파벳, 10/30 아마존의 설비투자 계획 — 빅테크가 함께 늘리면 밸류체인에는 호재입니다.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">돈 쓰는 쪽은 아프지만, 밸류체인에는 내년 주문 신호입니다<\/p><p>메타 주가는 7% 빠졌지만 이유를 뜯어보면 \"돈을 너무 많이 쓴다\"는 것이었습니다. 올해 설비투자 하단을 1,350억$로 올리고 2027년에도 공격적으로 계속 쓰겠다고 했습니다.<\/p><p>밸류체인 회사들 입장에서는 그 지출이 곧 GPU·메모리·서버·전력 주문입니다. 투자자 피로와 밸류체인 매출은 반대 방향으로 움직일 수 있다는 걸 보여 준 실적입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 이번 주 마이크로소프트·알파벳·아마존도 내년 투자를 늘리면, 메타가 혼자가 아니라는 확인이 됩니다.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Third-Quarter-2026-Results/default.aspx\">회사 IR(공식)<\/a> · <a href=\"https://ppc.land/meta-takes-9-89bn-teen-settlement-charge-as-ad-revenue-gains-26/\">PPC랜드<\/a> · <a href=\"https://www.newsquawk.com/headlines/meta-platforms-inc-meta-q3-2026-usd-eps-383-exp-667-revenue-646bln-exp-6331bln\">뉴스스쿽 · 컨센<\/a> · <a href=\"https://stocktwits.com/news-articles/markets/equity/meta-stock-jumps-3-after-hours-after-q3-revenue-beats-expectations-with-a-narrowed-ai-capex-outlook-and-new-non-voting-class-c-stock/cZxMhJJRBv6\">스톡트윗츠 · 시간외<\/a> · <a href=\"https://cappnotes.substack.com/p/closing-look-thursday-october-22\">10/22 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "mpwr-26q3", "date": "2026-10-29", "ts": "2026-10-29T16:01", "name": "모놀리식파워 MPWR", "run": "10.29(목) 뉴욕 장 마감 후 · 한국시간 10.30(금) 05:00", "html": "<article id=\"mpwr-26q3\" data-date=\"2026-10-29\" data-ts=\"2026-10-29T16:01\" data-layer=\"전력반도체\" data-name=\"모놀리식파워 MPWR\" data-sum=\"AI 관점 호재(엔터프라이즈 데이터 5.07억$·전분기 +33%) · 매출✅ EPS✅ 가이던스✅(13.15~13.85억$ vs 12.3억$) · 시간외 −2.0%(뉴욕 16:20)\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 대기(한국시간 10.30 06:00)<\/div>\n  <h3>모놀리식파워(MPWR)<\/h3>\n  <p class=\"what\">칩에 전기를 알맞게 나눠 주는 전원관리 반도체를 만드는 회사입니다. AI 서버에서는 GPU·가속기 바로 옆에서 전압을 낮춰 공급하는 전원 모듈을 팝니다. 밸류체인 전력반도체 층 · 물량확인용.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 12.02억$(+63%, 전분기 +23%)로 예상 11.6억$을, 조정 EPS 8.19$로 예상 7.75~7.79$을 <b>모두 상회<\/b>했습니다. 4분기 매출 가이던스 13.15~13.85억$(중간 13.5억$)도 예상 12.3억$을 <b>크게 넘었습니다<\/b>.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 서버 전원이 들어가는 엔터프라이즈 데이터 매출이 <b>5.07억$·전분기 +33%<\/b>로 전체 매출의 약 42%입니다. 전체 성장(전분기 +23%)보다 빨라, AI 가속기 출하 물량이 계속 늘고 있다는 물량 확인입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>숫자는 모두 넘었지만 시간외는 <mark>한때 +1.4% → 뉴욕 16:20 기준 −2.0%<\/mark>로 거래가 얇은 가운데 소폭 약세입니다. 자체 해석: 같은 시간 인텔 −20%·아마존 하락으로 반도체 전반 분위기가 식은 영향이 큰 것으로 보입니다. 회사는 EPS 가이던스는 내지 않았습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>4분기 매출 13.15~13.85억$<\/mark> — 예상 12.3억$보다 약 10% 높게<cite>모놀리식파워 · 보도자료 가이던스<\/cite><\/blockquote>\n    <p class=\"m\">→ 회사가 내다보는 다음 분기 주문이 시장 예상보다 훨씬 많다는 뜻입니다. 경영진 발언은 어닝콜(웨비나) 뒤 보강합니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> 4분기 가이던스 크게 상회<small>중간 13.5억$ (예상 12.3억$)<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> AI 서버 전원 급증<small>엔터프라이즈 데이터 5.07억$ 전분기 +33%<\/small><\/span><\/li>\n      <li><span>EPS 상회<small>조정 8.19$ (7.75~7.79$)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span>반도체 분위기 악화<small>같은 시간 인텔 시간외 −20%대 (자체 해석)<\/small><\/span><\/li>\n      <li><span>EPS 가이던스 없음<small>총마진 55.5~56.1%만 제시<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"스톡스토리·트레이딩뷰 컨센서스\", \"items\": [{\"k\": \"매출\", \"a\": 12.02, \"e\": 11.6, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 8.19, \"e\": 7.77, \"u\": \"$\"}, {\"k\": \"4분기 매출 가이던스\", \"a\": 13.5, \"e\": 12.3, \"u\": \"억$\"}]}'><\/div>\n  <div class=\"vizrow\">\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 (억$)\", \"cap\": \"26 Q2·25 Q3는 발표 증가율로 역산 · 점선은 4분기 가이던스 중간값\", \"items\": [{\"q\": \"25 Q3\", \"v\": 7.37}, {\"q\": \"26 Q2\", \"v\": 9.81}, {\"q\": \"26 Q3\", \"v\": 12.02, \"hi\": 1}, {\"q\": \"26 Q4\", \"v\": 13.5, \"g\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"매출 비중 (%)\", \"cap\": \"AI 쪽 엔터프라이즈 데이터 형광\", \"items\": [{\"k\": \"엔터프라이즈 데이터\", \"v\": 42, \"hl\": 1}, {\"k\": \"나머지(차량·통신·산업·PC 등)\", \"v\": 58}]}'><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"발표 앞뒤 주가 ($)\", \"cap\": \"시간외는 뉴욕 16:20 기준\", \"items\": [{\"d\": \"10.29 종가\", \"v\": 1198.81}, {\"d\": \"시간외\", \"v\": 1175.01}], \"mark\": \"10.29 종가\", \"markLabel\": \"발표\"}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">12.02억$ (11.6억$) <span class=\"ok\">✅<\/span> +63% · 전분기 +23%<\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">8.19$ (7.75~7.79$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">5.51$<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률 회계 / 조정<\/span><span class=\"v\">55.4% / 55.7% (전년 55.1% / 55.5%)<\/span><\/div>\n    <div class=\"row\"><span>영업이익 회계 / 조정<\/span><span class=\"v\">3.58억$(29.7%) / 4.65억$(38.6%, 전년 35.4%)<\/span><\/div>\n    <div class=\"row\"><span>순이익 회계 / 조정<\/span><span class=\"v\">2.71억$ / 4.03억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>핵심 지표 (물량) · 시장별 매출 <span class=\"call\">보강 · 한국시간 05:30<\/span><\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> <mark>엔터프라이즈 데이터<\/mark><\/span><span class=\"v ok\">5.07억$ · 전분기 +33% · 전년 +165% · 42%<\/span><\/div>\n    <div class=\"row\"><span>통신<\/span><span class=\"v ok\">1.87억$ · 전분기 +43% · 전년 +135% · 16%<\/span><\/div>\n    <div class=\"row\"><span>스토리지·컴퓨팅<\/span><span class=\"v\">1.92억$ · 전분기 −4% · 전년 +3% · 16%<\/span><\/div>\n    <div class=\"row\"><span>자동차<\/span><span class=\"v\">1.81억$ · 전분기 +15% · 전년 +19% · 15%<\/span><\/div>\n    <div class=\"row\"><span>산업<\/span><span class=\"v\">0.71억$ · 전분기 +30% · 전년 +29% · 6%<\/span><\/div>\n    <div class=\"row\"><span>소비자<\/span><span class=\"v\">0.64억$ · 전분기 +13% · 전년 −12% · 5%<\/span><\/div>\n    <p class=\"na\">AI 인프라 쪽으로 볼 수 있는 엔터프라이즈 데이터·통신이 합계 6.94억$로 전체의 약 58%입니다(통신 포함은 자체 분류). 잭스 예상 대비: 엔터프라이즈 데이터 5.07억$(4.57억$)·통신 1.87억$(1.47억$) 상회, 스토리지·컴퓨팅만 1.92억$(2.11억$) 하회.<\/p>\n  <\/section>\n\n  <section><h4>현금 · 주주환원<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">2.90억$ (전분기 2.28억$)<\/span><\/div>\n    <div class=\"row\"><span>현금·단기투자<\/span><span class=\"v\">10.91억$ (전분기 14.14억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v ok\">4.53억$ · 10월 5억$ 추가 승인(총 10억$)<\/span><\/div>\n    <div class=\"row\"><span>분기 배당<\/span><span class=\"v\">주당 2.00$<\/span><\/div>\n    <div class=\"row\"><span>인사<\/span><span class=\"v\">새 최고재무책임자 토니 바로우 선임(동시 공시)<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 매출<\/span><span class=\"v ok\"><mark>13.15~13.85억$<\/mark> (예상 12.3억$) ✅<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 총마진<\/span><span class=\"v\">55.5~56.1%<\/span><\/div>\n    <div class=\"row\"><span>EPS 가이던스<\/span><span class=\"v na\">제시하지 않음<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<span class=\"call\">웨비나 대기 · 한국시간 10.30 06:00<\/span><\/h4>\n    <p class=\"na\">질의응답 웨비나(뉴욕 17:00) 뒤 AI 서버 전원 수요·고객 다변화 발언을 보강합니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>10.29 종가<\/span><span class=\"v\">1,198.81$<\/span><\/div>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v no\">한때 +1.4% → −2.0% (1,175.01$, 뉴욕 16:20)<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/MPWR\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">MPWR ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 가속기 옆 전원칩 물량이 계속 늘고 있습니다<\/p><p>GPU·맞춤형 칩 한 개마다 전원 모듈이 붙기 때문에, 엔터프라이즈 데이터 전분기 +33%와 4분기 가이던스 상회는 AI 칩 출하가 4분기에도 늘어난다는 물량 신호입니다.<\/p><p>신호는 4분기 가이던스, 소음은 시간외 소폭 하락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 웨비나의 고객별 수요 발언, 첫 거래일 종가.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/1280452/000162828026068202/mpwr-20260930xexx991.htm\">회사 IR(공식) · SEC 8-K 보도자료<\/a> · 스톡스토리·트레이딩뷰 · 컨센서스 · 야후 파이낸스 · 시간외 주가<\/p>\n<\/article>\n", "updated": "2026-10-29T20:24:24Z"}, {"id": "msft-26q3", "date": "2026-10-28", "ts": "2026-10-28T16:01", "name": "마이크로소프트 MSFT", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"msft-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T16:01\" data-layer=\"빅테크\" data-name=\"마이크로소프트 MSFT\" data-sum=\"AI 관점 호재(애저 +48%·가이던스 45% 상회) · 매출✅ EPS✅ 애저✅ · 잔여계약가치❌(전분기 수준) · 가이던스✅(애저 49~50% vs 예상 45%·매출 960~971억$) · 수요가 공급 초과 · 어닝콜 반영 · 시간외 +3~4%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2027 회계연도 1분기(2026년 7~9월) · 어닝콜 반영(한국시간 10.29 07:45)<\/div>\n  <h3>마이크로소프트(MSFT)<\/h3>\n  <p class=\"what\">클라우드 애저와 오피스(마이크로소프트 365)·코파일럿을 파는 회사입니다. 오픈AI 같은 AI 기업과 일반 기업에 GPU 서버를 빌려주는 세계 2위 클라우드로, 데이터센터 설비투자를 가장 많이 하는 고객 중 하나입니다. 밸류체인 빅테크 층(수요의 출발점).<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 922.8억$(+19%, 예상 906.2~906.9억$)·조정 EPS 4.89$(+18%, 예상 4.71~4.82$)로 <b>모두 상회<\/b>했습니다. 이번 분기부터 처음 금액으로 공개한 애저 매출도 331.7억$(+48%)로 예상(322~323억$)을 넘었습니다. 다만 상업 잔여계약가치는 6,770억$로 예상(약 7,056억$)에 못 미쳤습니다. 어닝콜에서 낸 다음 분기 가이던스는 <b>매출 960~971억$(예상 956억$)·애저 49~50%(예상 약 45%)<\/b>로 기대를 넘었습니다(CNBC 인용).<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>AI 서버를 빌려주는 애저가 <b>+48%<\/b>로, 7월에 회사가 제시한 약 45%(고정환율)와 직전 분기 43%를 모두 넘어 <b>성장이 더 빨라졌습니다<\/b>. 현금 기준 설비투자(유형자산 취득)는 393.7억$로 1년 전(193.9억$)의 두 배입니다. 걸리는 점은 잔여계약가치가 직전 분기(6,780억$)와 거의 같아 <b>새 주문 증가가 멈춘 듯 보이는 것<\/b>, 그리고 금융리스 포함 설비투자(기사 인용 452억$)가 회사가 말한 '500억$ 이상'에 못 미친 것입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>처음 공개된 애저 매출이 <mark>331.7억$, +48%<\/mark>로 7월 가이던스(약 45%)를 3%p 넘었습니다. 매출·EPS·두 부문 매출까지 전부 예상을 넘으면서 시간외에서 한때 +5.7%(561$)까지 올랐습니다. 반면 잔여계약가치가 <mark>6,770억$로 전분기(6,780억$)와 비슷<\/mark>하고 예상보다 약 290억$ 적다는 점, 설비투자가 가이던스보다 적다는 점은 어닝콜에서 설명이 필요한 부분입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"여전히 수요가 공급보다 많습니다\"<\/mark><cite>에이미 후드 · 최고재무책임자 · 어닝콜(CNBC 인용)<\/cite><\/blockquote>\n    <p class=\"m\">→ 설비를 지어도 모자란다는 뜻입니다. GPU·메모리·서버·전력 층 주문이 이어질 근거입니다.<\/p>\n    <blockquote>\"1분기에 들어올 예정이던 외부 업체 데이터센터 용량 일부가 늦어졌습니다\"<cite>에이미 후드 · 최고재무책임자 · 어닝콜(CNBC 인용)<\/cite><\/blockquote>\n    <p class=\"m\">→ 설비투자가 가이던스(500억$ 이상)보다 적었던 이유가 수요 둔화가 아니라 공급 지연이라는 설명입니다.<\/p>\n    <blockquote><mark>\"매출·영업이익·주당순이익 모두 예상을 넘었습니다\"<\/mark><cite>에이미 후드 · 최고재무책임자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 회사 스스로 '예상 초과'를 못 박았습니다. 다음 분기 숫자는 어닝콜에서 나옵니다.<\/p>\n    <blockquote>\"마이크로소프트 클라우드 매출 639억$로 회계연도를 강하게 시작했습니다\"<cite>에이미 후드 · 최고재무책임자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 클라우드 전체가 +30%로, 직전 분기(+27%)보다 빨라졌다는 뜻입니다.<\/p>\n    <blockquote>\"전체 스택에 걸쳐 더 큰 성능·선택지·통제·비용 효율을 고객에게 제공하고 있습니다\"<cite>사티아 나델라 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 칩부터 AI 에이전트까지 한 줄로 묶어 판다는 전략 재확인입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>애저 +48%<\/mark><small>331.7억$ · 예상 322~323억$ · 7월 가이던스 약 45%<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 매출·EPS 모두 상회<small>922.8억$(예상 906억$대) · 4.89$(예상 4.71~4.82$)<\/small><\/span><\/li>\n      <li><span>두 부문 모두 예상 초과<small>에이전트·인프라 768억$(예상 756억$) · 기기·소비자 155억$(예상 150억$)<\/small><\/span><\/li>\n      <li><span>영업현금흐름 580억$ · +29%<small>전년 450.6억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>잔여계약가치 정체<small>6,770억$ · 전분기 6,780억$ · 예상 약 7,056억$<\/small><\/span><\/li>\n      <li><span>설비투자 가이던스 미달(기사 인용)<small>금융리스 포함 452억$ · 가이던스 500억$ 이상<\/small><\/span><\/li>\n      <li><span>잉여현금흐름 감소<small>186억$(계산) · 전년 257억$<\/small><\/span><\/li>\n      <li><span>총마진 하락<small>67.8% · 전년 69.0%(손익계산서로 계산)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\":\"surprise\",\"title\":\"예상 대비 · 얼마나 넘었나\",\"cap\":\"컨센서스 기준(블룸버그 인용 · 야후 파이낸스·SSB크랙 기사)\",\"items\":[{\"k\":\"매출\",\"a\":922.8,\"e\":906.3,\"u\":\"억$\"},{\"k\":\"조정 EPS\",\"a\":4.89,\"e\":4.73,\"u\":\"$\"},{\"k\":\"애저 매출\",\"a\":331.7,\"e\":322.0,\"u\":\"억$\"},{\"k\":\"잔여계약가치\",\"a\":6770,\"e\":7056,\"u\":\"억$\"}]}'><\/div>\n  <div class=\"vizrow\">\n  <div class=\"viz\" data-viz='{\"type\":\"trend\",\"title\":\"분기 매출 (억$)\",\"cap\":\"회계 분기 기준 · 27 2Q는 가이던스 중간값\",\"items\":[{\"q\":\"26 1Q\",\"v\": 0000789019/000119312526323632/msft-ex99_1.htm\">직전 분기 보도자료(SEC 8-K 첨부 99.1)<\/a> · <a href=\"https://finance.yahoo.com/markets/stocks/article/microsoft-earnings-live-microsoft-to-report-q1-earnings-with-wall-street-looking-for-further-azure-growth-173000086.html\">야후 파이낸스 · 컨센서스(블룸버그)<\/a> · <a href=\"https://jingletree.com/microsoft-stock-jumps-4-as-cloud-growth-drives-earnings-and-revenue-beat-297173.html\">CNBC 기사 재게재 · 어닝콜 가이던스·발언<\/a> · <a href=\"https://finance.yahoo.com/markets/stocks/live/microsoft-earnings-live-microsoft-beats-q1-expectations-on-top-and-bottom-line-on-ai-growth-204510452.html\">야후 파이낸스 라이브 · 어닝콜<\/a> · <a href=\"https://www.zerohedge.com/markets/msft-rises-azure-beat-bookings-shrink-and-backlog-stalls\">제로헤지 · 예약·기대치<\/a> · <a href=\"https://news.ssbcrack.com/microsoft-shares-rise-5-after-stronger-than-expected-fiscal-q1-results-highlighting-ai-infrastructure-growth/\">SSB크랙 · 애저·설비투자 예상<\/a> · <a href=\"https://www.tradingkey.com/analysis/stocks/us-stocks/262235490-microsoft-stock-forecast-q1-earnings-preview-azure-546-resistance-october-23-2026-tradingkey\">트레이딩키 · 7월 가이던스<\/a> · <a href=\"https://www.tikr.com/blog/did-microsoft-really-cut-its-capex-heres-the-accounting-move-behind-the-headline\">TIKR · 리스 회계 변경<\/a> · <a href=\"https://earnings-watcher.com/wiki/msft-earnings-october-2026\">어닝스워처 · 옵션 예상 변동폭<\/a> · <a href=\"https://www.tomshardware.com/tech-industry/big-tech/60-000-microsoft-employees-offered-voluntary-buyouts-as-ai-buildout-costs-bite-program-covers-roughly-27-percent-of-workforce-across-us-canada-india-and-the-uk\">탐스하드웨어 · 희망퇴직<\/a> · <a href=\"https://www.marketalleys.com/post/microsoft-earnings-due-after-the-close-azure-revenue-to-be-shown-in-dollars-2026-10-28\">마켓앨리스 · EPS 예상<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T22:42:21Z"}, {"id": "now-26q3", "date": "2026-10-28", "ts": "2026-10-28T16:05", "name": "서비스나우 NOW", "run": "10.28(수) 뉴욕 장 마감 후 · 한국시간 10.29(목) 05:00", "html": "<article id=\"now-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T16:05\" data-layer=\"엣지·소프트\" data-name=\"서비스나우 NOW\" data-sum=\"AI 관점 호재(AI 계약가치 목표 17억$로 재상향·에이전트 사용 13배) · 매출✅ EPS❌ 가이던스 혼조(4분기 cRPO +18.5%로 둔화) · 어닝콜 반영(cRPO 둔화는 조기 갱신 앞당김 탓) · 시간외 −17.1%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 반영(한국시간 10.29 07:45)<\/div>\n  <h3>서비스나우(NOW)<\/h3>\n  <p class=\"what\">기업의 정보기술·인사·고객 응대·보안 업무를 한 플랫폼에서 자동으로 처리하게 해 주는 구독형 소프트웨어 회사입니다. 요즘은 'AI 에이전트를 관리·통제하는 관제탑'을 내세웁니다. 데이터센터를 짓는 쪽이 아니라 AI를 써서 돈을 버는 쪽, 즉 소프트웨어의 AI 수익화를 보여 주는 자리. 밸류체인 엣지·소프트 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--yel)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">보통<\/span>구독 매출 39.9억$(+21%, 가이던스 39.75~39.8억$·예상 39.8억$)와 1년 내 잔여계약(cRPO) 136.5억$(+20.5%, 가이던스 +19.5%)는 <b>가이던스 위쪽 끝을 넘었습니다<\/b>. 다만 조정 EPS가 1.00$(예상 1.02$)로 <b>소폭 못 미쳤고<\/b>, 4분기 cRPO 성장 가이던스가 <b>+18.5%로 더 느려졌습니다<\/b>. 연간 구독 매출 가이던스는 중간값 1,500만$만 올렸습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>소프트웨어 쪽 AI 수요(AI 수익화) 시각으로 봅니다. 올해 말 AI 연간 계약가치 목표를 <b>올해 두 번째로 올려 17억$<\/b>(연초 10억$ 대비 +70%)로 잡았고, 실제 운영 중인 AI 에이전트 사용량은 <b>올해 누적 전년 대비 13배 넘게<\/b> 늘었습니다. 기업들이 AI를 '시험'에서 '돈 내고 쓰는' 단계로 옮기고 있다는 숫자입니다. 다만 AI가 전체 성장률(cRPO 둔화)을 끌어올리는 데까지는 아직 이르지 않았습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>한 달 새 약 +16% 올라 기대가 높았던 상태였습니다. 숫자는 가이던스를 넘었지만 <mark>4분기 cRPO 성장 가이던스 +18.5%<\/mark>(3분기 +20.5%)로 앞으로 1년 계약이 덜 늘어난다는 신호가 나왔고, 조정 EPS도 예상에 2% 못 미쳤습니다. 인수 차입으로 이자비용이 0.8억$(전년 0.06억$)로 불었고, <mark>구독 총마진이 80%(전년 83%)<\/mark>로 내려간 점도 걸렸습니다. AI 계약가치 상향만으로는 '성장 둔화' 걱정을 덮지 못했습니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"cRPO는 매우 미묘한 회계 지표라 사업의 모든 탄력을 담지는 못합니다\"<\/mark><cite>지나 마스탄투오노 · 사장 겸 최고재무책임자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 4분기 cRPO +18.5% 둔화는 3분기 조기 갱신이 계약을 앞당긴 영향이라는 해명입니다. 시장은 일단 받아들이지 않았습니다.<\/p>\n    <blockquote><mark>\"AI 순신규 계약가치가 기대를 넘어 올해 말 목표를 올해 두 번째로 올립니다. 연초 10억$에서 이제 17억$입니다\"<\/mark><cite>지나 마스탄투오노 · 사장 겸 최고재무책임자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 기업 고객이 AI 기능에 실제로 돈을 더 내고 있다는 뜻입니다.<\/p>\n    <blockquote>\"고객의 에이전트형 AI 실사용(운영 환경) 소비가 올해 누적 전년 대비 13배 넘게 늘었습니다\"<cite>지나 마스탄투오노 · 사장 겸 최고재무책임자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 계약만 한 게 아니라 실제로 AI 에이전트를 돌리는 양이 폭증했다는 뜻입니다.<\/p>\n    <blockquote>\"에이전트형 기업의 선두에 있으면서 자본·컴퓨팅 제약이 없는 회사가 또 어디 있습니까?\"<cite>빌 맥더멋 · 회장 겸 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 자체 데이터센터를 늘리지 않고 클라우드 협력사를 쓰며 설비투자를 줄이고 있다는 자신감입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>주가를 끌어내린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>4분기 cRPO 성장 +18.5%로 둔화<\/mark><small>2분기 +21% → 3분기 +20.5% → 4분기 가이던스 +18.5%<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 조정 EPS 소폭 미달<small>1.00$ vs 예상 1.02$ · 전년 0.95$<\/small><\/span><\/li>\n      <li><span>마진 하락<small>구독 총마진 80%(전년 83%) · 조정 영업이익률 32.5%(전년 33.5%)<\/small><\/span><\/li>\n      <li><span>높아진 기대<small>발표 전 1개월 +15.5% · 옵션 예상 ±9.3%<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>그래도 버티는 이유<\/h4><ul>\n      <li><span>AI 계약가치 목표 17억$로 상향<small>연초 10억$ → 2분기 15억$ 초과 예상 → 17억$<\/small><\/span><\/li>\n      <li><span>대형 계약 급증<small>500만$ 넘는 순신규 계약 19건 · +135% 이상<\/small><\/span><\/li>\n      <li><span>잉여현금흐름률 목표 상향<small>연간 35% → 36%<\/small><\/span><\/li>\n      <li><span>잔여계약 전체(RPO) 297억$<small>+22%(고정환율 +22.5%)<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\":\"surprise\",\"title\":\"예상 대비 · 얼마나 넘었나\",\"cap\":\"컨센서스 기준(잭스·LSEG 인용 24/7 월스트리트) · EPS는 조정 기준\",\"items\":[{\"k\":\"구독 매출\",\"a\":39.88,\"e\":39.8,\"u\":\"억$\"},{\"k\":\"총매출\",\"a\":41.06,\"e\":40.9,\"u\":\"억$\"},{\"k\":\"cRPO\",\"a\":136.5,\"e\":135.6,\"u\":\"억$\"},{\"k\":\"조정 EPS\",\"a\":1.00,\"e\":1.02,\"u\":\"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\":\"trend\",\"title\":\"분기 구독 매출 \/span><span class=\"v\">1~9월 91.7억$ · 영업권 100.1억$(연초 35.8억$)<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v\">3분기 없음 (전년 5.8억$) · 1~9월 22.3억$ · 배당 없음<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span>4분기 구독 매출<\/span><span class=\"v\">42.45~42.55억$ · +22.5~23% (고정환율 +21.5%) · 예상치 확인 필요<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> <mark>4분기 cRPO 성장<\/mark><\/span><span class=\"v no\">+18.5% (고정환율 +18.5%) ⚠ 3분기 +20.5%에서 둔화<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 영업이익률<\/span><span class=\"v\">32% (회계 12%)<\/span><\/div>\n    <div class=\"row\"><span>연간 구독 매출<\/span><span class=\"v\">157.8~157.9억$ (이전 157.6~157.8억$) · +22.5% (고정환율 +21%) · 소폭 상향<\/span><\/div>\n    <div class=\"row\"><span>연간 구독 총마진(조정)<\/span><span class=\"v\">81% · 유지<\/span><\/div>\n    <div class=\"row\"><span>연간 조정 영업이익률<\/span><span class=\"v\">31.5% · 유지<\/span><\/div>\n    <div class=\"row\"><span><mark>연간 잉여현금흐름률<\/mark><\/span><span class=\"v ok\">36% (이전 35%) ✅ 상향<\/span><\/div>\n    <div class=\"row\"><span>희석 주식수<\/span><span class=\"v\">4분기 10.5억 주 · 연간 10.4억 주<\/span><\/div>\n    <p class=\"na\">연간 총매출 예상(컨센)은 162.2억$입니다. 4분기 성장률에 인수 회사 매출이 얼마나 들어 있는지는 어닝콜 확인 필요.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<\/h4>\n    <p class=\"q\"><b>빌 맥더멋(회장 겸 최고경영자) · 보도자료<\/b> \"또 한 번의 실적 상회·가이던스 상향 이상, 슈퍼 인텔리전스 관제탑으로서의 변곡점\"이라며 <mark>\"자본·컴퓨팅 제약이 없다\"<\/mark>고 했습니다. → AI 수요를 받기 위해 GPU를 사들일 필요 없이 클라우드 협력사를 쓰는 구조라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>지나 마스탄투오노(사장 겸 최고재무책임자) · 보도자료<\/b> \"자본 효율적인 모델로 기회를 잡고 있다 — 설비투자를 줄이고 연간 잉여현금흐름률 목표를 100bp 올려 36%로.\" → 3분기 설비투자가 전년 2.4억$에서 0.9억$로 줄었습니다.<\/p>\n    <p class=\"q\"><b>발표 사항(보도자료)<\/b> 오픈AI와 협력 확대(챗GPT용 서비스나우 플러그인·보안 모델·코덱스 연동), 앤트로픽·아마존웹서비스·엔비디아·시스코·오픈AI 등이 참여한 '관제탑 연합' 출범, 엔비디아와 개인 업무 에이전트(Arc) 보안 통제, 휴렛팩커드엔터프라이즈(HPE) 클라우드·AI 사업 고객지원에 채택, 아람코 디지털 계약.<\/p>\n    <h4 style=\"margin-top:10px\">어닝콜 반영 · 한국시간 10.29 07:45<\/h4>\n    <p class=\"q\"><b>지나 마스탄투오노(최고재무책임자) · 어닝콜<\/b> 3분기 조기 갱신이 <mark>3분기 초과분의 약 절반<\/mark>을 차지해 4분기 cRPO를 앞당겨 썼고, 온프레미스 공공 계약 비중 확대가 약 0.25%p, 해지 조항이 붙은 계약 제외가 약 0.5%p 4분기 cRPO를 낮춘다고 설명했습니다. → <mark>\"cRPO는 매우 미묘한 회계 지표\"<\/mark>라며 둔화가 수요 약화가 아니라는 해명입니다.<\/p>\n    <p class=\"q\"><b>지나 마스탄투오노 · 어닝콜<\/b> AI 탄력이 \"2027년 이후 강한 매출 성장으로 분명히 이어질 것\"이라며 미국 연방 순신규 계약가치 성장이 4분기에 더 빨라질 것으로 봤습니다(3분기 100만$ 이상 연방 계약 +30% 이상). 2027년 숫자 가이던스는 없었습니다.<\/p>\n    <p class=\"q\"><b>빌 맥더멋(최고경영자) · 어닝콜<\/b> AI 순신규 계약가치가 <mark>전년 대비 65%<\/mark> 늘었다고 했고, \"우리는 컴퓨팅 제약도 자본 제약도 없다\"고 반복했습니다. 기업 IT 예산은 \"비전략 지출은 없어지고 전략 플랫폼만 잘될 것\"이라고 했습니다.<\/p>\n    <p class=\"q\"><b>아밋 자베리(사장 겸 최고제품·운영책임자) · 어닝콜<\/b> AI 배포가 실제 가동되면 사용량이 \"3~4배로 뛰는 것을 봤다\"고 했습니다.<\/p>\n    <p class=\"na\">발언은 인베스팅닷컴 AI 녹취 기준(일부 발언자 표기 오류 가능)입니다. 3분기 500만$ 이상 순신규 계약 19건(+135% 이상), 500만$ 이상 고객 680곳(+약 23%).<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/28 종가)<\/span><span class=\"v\">150.13$ · 당일 −3.0%<\/span><\/div>\n    <div class=\"row\"><span>최근 흐름<\/span><span class=\"v\">1주 −2.0% · 1개월 +15.5% · 52주 고점 192.97$ 대비 약 −22%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 시간외 (뉴욕 18:19 이전 · 어닝콜 뒤)<\/span><span class=\"v no\">124.45$ · −17.1% (인베스팅닷컴 녹취 기사)<\/span><\/div>\n    <div class=\"row\"><span>시간외 (뉴욕 17:04 · 어닝콜 시작 직후)<\/span><span class=\"v no\">126.70$ · −15.6% (야후 파이낸스 1분 봉, 종가 150.13$)<\/span><\/div>\n    <div class=\"row\"><span>시간외 (뉴욕 16:16)<\/span><span class=\"v no\">약 127.81$ · −14.9%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v\">±9.3% · 시간외 하락폭이 예상 폭을 크게 넘음<\/span><\/div>\n    <div class=\"row\"><span>지난 실적 반응<\/span><span class=\"v\">7/22 −9.9% · 4/22 −15.3% · 1/28 −11.4% (인베스팅닷컴 인용)<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/NOW\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">NOW ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">기업 AI는 '돈 내고 쓰는' 단계로 — 다만 성장률을 끌어올리진 못했습니다<\/p><p>AI 인프라 투자가 결국 회수되려면 서비스나우 같은 소프트웨어 회사가 AI로 매출을 내야 합니다. AI 계약가치 목표 17억$와 에이전트 사용 13배는 그 고리가 돌아가고 있다는 숫자입니다. 이 사용량은 서비스나우가 직접 짓는 데이터센터가 아니라 클라우드 협력사(하이퍼스케일러)의 연산으로 처리되는 몫이 커지고 있어, 구독 총마진 하락(83% → 80%)과 설비투자 축소가 같이 나타났습니다.<\/p><p>신호는 AI 계약가치 상향과 실사용 폭증, 소음보다 큰 걱정은 cRPO 성장 둔화(+18.5%) — 'AI가 기존 좌석 기반 매출을 대체하는 속도'에 대한 시장의 의심입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 회사는 cRPO 둔화를 조기 갱신·회계 요인으로 설명했고 AI 순신규 계약가치는 +65%였습니다. 다음은 4분기 cRPO가 실제로 18.5%를 넘는지, 2027년 가이던스(1월), 같은 층 소프트웨어 회사들의 AI 매출 지표입니다.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/1373715/000137371526000092/erq3fy26.htm\">회사 실적 보도자료(SEC 8-K 첨부 99.1, 공식)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/1373715/000137371526000072/erq2fy26.htm\">2분기 보도자료·3분기 가이던스(SEC, 공식)<\/a> · <a href=\"https://investor.servicenow.com/news/news-details/2026/ServiceNow-to-Announce-Third-Quarter-2026-Financial-Results-on-October-28/default.aspx\">회사 IR · 발표 일정<\/a> · <a href=\"https://247wallst.com/investing/2026/10/28/live-will-servicenow-disappoint-in-q3-earnings-tonight-after-4-intraday-drop/\">24/7 월스트리트 · 실시간·컨센서스<\/a> · <a href=\"https://finance.yahoo.com/markets/stocks/articles/curious-servicenow-now-q3-performance-121507221.html\">잭스(야후) · 항목별 컨센서스<\/a> · <a href=\"https://www.investing.com/news/stock-market-news/servicenow-stock-setup-into-todays-earnings-heres-what-our-ai-model-says-93CH-4979847\">인베스팅닷컴 · 옵션 예상 변동폭<\/a> · <a href=\"https://www.marketbeat.com/earnings/reports/2026-10-28-servicenow-inc-stock/\">마켓비트 · 컨센서스<\/a> · <a href=\"https://siliconangle.com/2026/01/28/servicenows-stock-slides-iffy-subscription-revenue-forecast/\">실리콘앵글 · 25년 4분기 구독 매출<\/a> · 야후 파이낸스 · 주가·시간외<\/p>\n<\/article>", "updated": "2026-10-28T22:43:10Z"}, {"id": "pwr-26q3", "date": "2026-10-29", "ts": "2026-10-29T06:55", "name": "콴타서비스 PWR", "run": "10.29(목) 뉴욕 장전 · 한국시간 10.29(목) 20:00", "html": "<article id=\"pwr-26q3\" data-date=\"2026-10-29\" data-ts=\"2026-10-29T06:55\" data-layer=\"EPC\" data-name=\"콴타서비스 PWR\" data-sum=\"AI 관점 호재(수주잔고 637억$ 사상 최대·연간 가이던스 상향) · 매출✅ EPS✅ 가이던스✅ · 매출 +57% · 프리마켓 +5%대(뉴욕 07:02)\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 대기(한국시간 10.29 22:00)<\/div>\n  <h3>콴타서비스(PWR)<\/h3>\n  <p class=\"what\">송전선·변전소·발전소 연결 같은 전력망 공사와 데이터센터에 전기를 끌어오는 공사를 하는 미국 최대 전기 시공사입니다. 밸류체인 전력망 시공·EPC 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 <b>120.1억$(+57%)<\/b>로 예상 109.3~109.9억$를 약 9~10% 넘었고, 조정 EPS <b>6.06$(+82%)<\/b>는 예상 4.93~5.01$뿐 아니라 위스퍼 5.15$도 넘었습니다. 연간 가이던스도 매출·EPS·현금흐름 전 항목을 올렸습니다. '큰 폭 상회'입니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>데이터센터 매출을 따로 밝히지는 않지만, 전력 부문(데이터센터 전력 연결·송전 포함) 매출이 <b>98.0억$·+59%<\/b>로 전체의 82%이고, 전력 부문 수주잔고가 <b>518.9억$·+59%<\/b>로 늘었습니다. 회사는 수요가 \"유틸리티·발전·산업·<b>테크 고객<\/b> 전반\"에서 나온다고 밝혔습니다. 데이터센터 전력 공사가 수주로 계속 쌓이고 있다는 신호입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p>직전 분기 다음 날 +17%로 눈높이가 올라간 상태였고, 옵션 예상 변동폭은 ±11%로 큽니다. 넘어야 할 기준은 <mark>수주잔고 사상 최대 경신과 연간 가이던스 재상향<\/mark>이었는데, 수주잔고 637억$(2분기 530억$)·연간 매출 가이던스 413~416억$(종전 393~397억$)로 둘 다 충족했습니다. 프리마켓에서는 <mark>+5.1%(639$ 안팎, 뉴욕 07:02 기준)<\/mark>로 옵션 예상 변동폭(±11%)의 절반쯤 반응했고, 어닝콜(한국 22:00)의 데이터센터·대형 송전 수주 발언이 다음 변수입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"또 한 번의 뛰어난 분기, 3분기 실적은 다시 예상을 넘었습니다\"<\/mark><cite>듀크 오스틴 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 회사 스스로 기대를 넘었다고 밝히며 연간 전망 전 항목을 '크게' 올렸습니다.<\/p>\n    <blockquote>2027년 조정 EPS도 \"<mark>강한 두 자릿수 성장<\/mark>\" 기회<cite>콴타서비스 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 공식 가이던스는 아니지만 내년까지 일감이 이어진다는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c ases/quanta-services-reports-third-quarter-2026-results-302922956.html\">회사 보도자료(PR뉴스와이어)<\/a> · <a href=\"https://www.benzinga.com/quote/PWR/earnings-forecasts\">벤징가 · 컨센서스<\/a> · <a href=\"https://www.earningswhispers.com/stocks/PWR\">어닝스위스퍼 · 위스퍼<\/a> · <a href=\"https://stockstotrade.com/news/quanta-services-inc-pwr-news-2026-10-28/\">스톡스투트레이드 · 10/28 주가<\/a> · <a href=\"https://stockstory.org/us/stocks/nyse/pwr/news/earnings/quanta-nysepwr-beats-expectations-in-strong-q3-2026-stock-soars\">스톡스토리(프리마켓 반응)<\/a><\/p>\n<\/article>\n", "updated": "2026-10-29T12:20:00Z"}, {"id": "rmbs-26q3", "date": "2026-10-26", "ts": "2026-10-26T16:01", "name": "램버스 RMBS", "run": "10.26(월) 뉴욕 장 마감 후 · 한국시간 10.27(화) 05:00", "html": "<article id=\"rmbs-26q3\" data-date=\"2026-10-26\" data-ts=\"2026-10-26T16:01\" data-layer=\"인터커넥트\" data-name=\"램버스 RMBS\" data-sum=\"매출✅ EPS✅ 가이던스 상향 · 사상 최대 · 시간외 −0.9%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 반영<\/div>\n  <h3>램버스(RMBS)<\/h3>\n  <p class=\"what\">서버 메모리 모듈 안에 들어가는 버퍼·전원관리 칩과 메모리 기술 특허를 파는 회사입니다. AI 서버 한 대에 메모리가 늘수록 칩 수도 늘어납니다. 밸류체인 인터커넥트 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 2.183억$(예상 2.132억$)·조정 EPS 0.84$(예상 0.79$) <b>모두 상회<\/b>. 매출·이익·제품 매출·영업현금흐름 모두 사상 최대이고, 4분기 가이던스도 더 높습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출 대부분이 데이터센터 서버 메모리용입니다. <b>제품 매출(서버 메모리 칩) 1.143억$·+22% 사상 최대<\/b>, 4분기 제품 매출 가이던스 1.27~1.33억$로 또 사상 최대 예고. 어닝콜에서 \"AI가 모든 사업에 강한 순풍\"이라고 했습니다. 메모리 값이 비싸 서버당 메모리 용량을 줄이는 흐름(비AI성 가격 요인)은 따로 봅니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p><mark>제품 매출 1.143억$ 사상 최대<\/mark>(+22%)와 <mark>4분기 제품 매출 1.27~1.33억$ 가이던스<\/mark> — AI 서버 메모리 증가가 칩 판매로 이어지고 있습니다. 재고가 연초의 약 2배로 늘어난 점은 다음 분기 확인할 부분입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"4분기에는 더 강한 실적을 예상합니다\"<\/mark><c
