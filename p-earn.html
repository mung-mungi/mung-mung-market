ection>\n\n  <section><h4>가이던스 · 2026년 4분기(10~12월)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">523~543억$ (중간값 533억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　예상치<\/span><span class=\"na\">수치 확인 못 함 · '예상 상회' 보도만 확인<\/span><\/div>\n    <div class=\"row\"><span>　중간값 성장률<\/span><span class=\"v\">전년 대비 +58% · 전분기 대비 +14%<\/span><\/div>\n    <div class=\"row\"><span>총마진<\/span><span class=\"v\">65~67% (중간값 66%, 3분기보다 0.4%포인트 낮음)<\/span><\/div>\n    <div class=\"row\"><span>영업이익률<\/span><span class=\"v\">56.5~58.5%<\/span><\/div>\n    <div class=\"row\"><span>환율 가정<\/span><span class=\"v\">1달러 = 31.8 대만달러<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 마진<\/span><span>2나노 초기 비용 + 해외 공장 희석, 원가 절감으로 일부 상쇄<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 · 어닝콜 발언<span class=\"call\">어닝콜 반영 · 콜 한국시간 10.15 15:00<\/span><\/h4>\n    <p class=\"q\"><b>C.C. 웨이(최고경영자)<\/b> \"수요가 여전히 공급보다 많다\" → 생산 능력을 늘리는 게 숙제라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>C.C. 웨이<\/b> \"챗봇에서 AI 비서로 넘어가며 에이전트형 AI(Agentic AI) 확산이 AI 수요를 키우고 있다\" → 에이전트 AI용 중앙처리장치(CPU) 수요도 계속 늘고 있으며, 이는 AI 가속기 전망 수치에는 포함하지 않았다고 했습니다.<\/p>\n    <p class=\"q\"><b>C.C. 웨이<\/b> \"CoWoS는 여전히 고객의 1순위 선택\" → 칩 면적 5배(5x 레티클) 크기 패키징을 실제 양산 중이라고 밝혔습니다. 생산 능력 증가율 숫자는 \"아직 이르다\"며 내놓지 않았습니다.<\/p>\n    <p class=\"q\"><b>웬델 황(최고재무책임자)<\/b> \"2026년 설비투자 600~640억$를 재확인한다, 2026~2028년 설비투자는 지난 3년보다 크게 많을 것\" → \"장비 가격 상승은 실재한다\"고도 했습니다.<\/p>\n    <p class=\"q\"><b>웬델 황<\/b> 해외 공장 마진 희석은 2026년 \"2%에 가깝고\" 앞으로 몇 년 \"3~4%로 커진다\" → 주가에 부담이 된 대목입니다.<\/p>\n    <p class=\"q\"><b>C.C. 웨이<\/b> \"2027년 사업 계획은 신중하게 세우고 있다\" → 부품 가격 상승과 경기 불확실성으로 소비자용·가격 민감 시장이 '도전받고 있다'는 설명. AI 쪽 둔화 얘기는 아닙니다.<\/p>\n    <p class=\"q\"><b>C.C. 웨이<\/b> \"2나노 계열 연간 생산 능력은 2027년 두 배 이상\" · 애리조나 2공장은 장비 반입 중, 2027년 3분기 양산(예정보다 약간 앞당김) · A14 공정은 2028년 양산.<\/p>\n    <p class=\"q\"><b>관세<\/b> <span class=\"na\">어닝콜 녹취에서 관세·반도체 관세(232조) 관련 발언 확인 못 함<\/span><\/p>\n    <p class=\"na\">발언은 영어 원문을 우리말로 옮긴 요지입니다. 원문은 아래 어닝콜 녹취 링크에 있습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/14 종가)<\/span><span class=\"v\">430.00$ (−3.4%)<\/span><\/div>\n    <div class=\"row\"><span>발표 당일 장중 저점<\/span><span class=\"v no\">407.13$ (약 −5.3%)<\/span><\/div>\n    <div class=\"row\"><span>발표 당일 (10/15 종가)<\/span><span class=\"v no\">422.25$ (−1.8%)<\/span><\/div>\n    <div class=\"row\"><span>다음 날 (10/16 종가)<\/span><span class=\"v no\">412.61$ (−2.3%)<\/span><\/div>\n    <div class=\"row\"><span>대만 본주(2330) 10/15 · 10/16<\/span><span class=\"v\">2,440 대만달러 (−2.0%) · 2,420 (−0.8%)<\/span><\/div>\n    <div class=\"row\"><span>10/23 종가<\/span><span class=\"v\">418.51$<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"na\">확인 못 함<\/span><\/div>\n  <\/section>\n  <div class=\"viz\" data-viz='{\"type\": \"line\", \"title\": \"ADR 주가 흐름 (종가, 달러)\", \"cap\": \"실적 전부터 미끄러지던 흐름(10/5 485.80$)이 발표 뒤에도 이어졌습니다\", \"items\": [{\"d\": \"10/9\", \"v\": 453.31}, {\"d\": \"10/12\", \"v\": 444.35}, {\"d\": \"10/13\", \"v\": 445.12}, {\"d\": \"10/14\", \"v\": 430.0}, {\"d\": \"10/15\", \"v\": 422.25}, {\"d\": \"10/16\", \"v\": 412.61}, {\"d\": \"10/19\", \"v\": 420.22}, {\"d\": \"10/20\", \"v\": 425.08}, {\"d\": \"10/21\", \"v\": 431.89}, {\"d\": \"10/22\", \"v\": 412.35}, {\"d\": \"10/23\", \"v\": 418.51}, {\"d\": \"10/26\", \"v\": 424.37}], \"mark\": \"10/15\", \"markLabel\": \"실적 발표(장전)\"}'><\/div>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p><b>발표 다음 날 412.61$로 바닥을 찍은 뒤 사흘 연속 반등해 10/21 431.89$까지 회복했습니다.<\/b> 하지만 10/22 하루 −4.5%(412.35$)로 다시 밀렸는데, 같은 날 램리서치가 공급 제약·중국 감소 가이던스로 −11.8% 급락하며 반도체 장비·파운드리 쪽이 함께 흔들린 날입니다. 이후 10/23 418.51$, 10/26 424.37$로 실적 발표 당일 종가 수준을 되찾았습니다.<\/p><p>다음 확인: 10/27~28 미국 연준 회의(금리)와 이번 주 빅테크 실적의 설비투자 전망. 빅테크가 AI 투자를 유지·확대하면 TSMC 고성능컴퓨팅 수요 그림이 다시 확인되는 셈입니다. 11월 초 10월 월매출도 볼 숫자입니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>AI 인프라 수요는 <mark>'잘 빠지는' 정도가 아니라 공급이 못 따라가는 상태<\/mark>입니다. 고성능컴퓨팅 매출이 한 분기 +22%, 4분기도 +14% 성장 가이던스. 주가를 누른 건 2나노·해외 공장 비용에 따른 마진 하락과 반도체주 전체의 분위기였지, AI 주문이 아닙니다. 스마트폰 비중 축소와 2027년 '신중' 발언은 부품 가격 상승에 따른 소비자 시장 얘기로, AI 층과 분리해서 봐야 합니다.<\/p>\n  <\/section>\n  <p class=\"xref\">X 참고: 이번 정리에선 @wallstengine·@allday_stocks 글을 쓰지 않았습니다. 숫자는 회사 공식 자료 기준이며, 예상치는 팩트셋·LSEG 보도 기준입니다.<\/p>\n  <p class=\"src\">출처: <a href=\"https://pr.tsmc.com/system/files/newspdf/attachment/70d8a93214795fa88f83fb47e0e45e7b0435e52b/3Q26%20%28E%29_with%20gudiance_final_wmn.pdf\">회사 IR(공식) · 실적 보도자료·가이던스<\/a> · <a href=\"https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/f53a64fd40fc0b453f94e077e5aba8cad506f27b/3Q26%20ManagementReport.pdf\">TSMC 경영 보고서(플랫폼·공정·지역)<\/a> · <a href=\"https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-10/eba4fac72873bf546b669bd2b5d973df5c93215d/TSMC%203Q26%20Transcript.pdf\">어닝콜 녹취(TSMC 공식)<\/a> · <a href=\"https://focustaiwan.tw/business/202610150018\">포커스타이완 · 연간 전망·설비투자<\/a> · <a href=\"https://www.kucoin.com/blog/es-why-is-tsmc-stock-down-despite-record-q3-2026-profits-and-strong-ai-chip-demand\">쿠코인 · 팩트셋 컨센서스<\/a> · <a href=\"https://www.hudson-labs.com/research/tsmc-q3-2026-earnings-preview-tsm-revenue-and-margins\">허드슨랩스 · 마진 컨센·과거 분기 매출<\/a> · <a href=\"https://www.simianx.ai/stories/tsmc-q3-profit-jumps-69-why-did-the-stock-fall-anyway\">시미안X · 주가 반응·LSEG 순이익 예상<\/a> · <a href=\"https://www.tradingnews.com/news/tsm-slides-to-413-usd-on-chip-rout-as-q4-guide-points-to-58-percent-growth\">트레이딩뉴스 · 4분기 가이던스 '예상 상회'<\/a> · <a href=\"https://stockanalysis.com/stocks/tsm/history/\">스톡애널리시스 · ADR 종가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T19:30+09:00"}, {"id": "txn-26q3", "date": "2026-10-21", "ts": "2026-10-21", "name": "텍사스인스트루먼트 TXN", "run": "10.21(수) 뉴욕 장 마감 후 · 한국시간 10.22(목) 05:00", "html": "<article id=\"txn-26q3\" data-date=\"2026-10-21\" data-layer=\"전력반도체\" data-name=\"텍사스인스트루먼트 TXN\" data-sum=\"매출✅ EPS✅ 가이던스✅ · 데이터센터 +95%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기<\/div>\n  <h3>텍사스인스트루먼트(TXN)<\/h3>\n  <p class=\"what\">전원·센서·신호 처리용 아날로그 반도체 1위 회사입니다. 데이터센터 서버 전원 칩 비중이 빠르게 커지고 있습니다. 밸류체인 전력반도체 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 60.55억$(+28%, 예상 59.1~59.3억$)·EPS 2.62$(+77%, 예상 2.42~2.43$) <b>모두 상회<\/b>, 4분기 가이던스(매출 중간값 60.5억$, EPS 2.45~2.79$)도 컨센을 크게 넘었습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트 · 그러나 주가는 반도체 급락에 묻힘<\/p><p><mark>데이터센터 매출 약 +95%<\/mark>(매출의 약 13%)와 <mark>산업용 4년 만의 사상 최대<\/mark>. AI 수요가 아날로그 칩까지 번진다는 확인입니다. 다만 다음 날 필라델피아 반도체 지수가 −6.72% 급락해 시간외 상승분이 묻혔습니다.<\/p><\/div>\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"4년 만에 처음으로 산업용에서 새 정점을 만들었습니다\"<\/mark><cite>하비브 일란 · 최고경영자 · 어닝콜(보도 인용)<\/cite><\/blockquote>\n    <p class=\"m\">→ AI만이 아니라 공장·설비 쪽 경기까지 바닥을 지나 올라오고 있다는 뜻입니다.<\/p>\n  <\/div>\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>데이터센터 약 +95%<\/mark><small>매출의 약 13%<\/small><\/span><\/li>\n      <li><span>4분기 가이던스 컨센 상회<small>매출 58~63억$ vs 57.3~57.5억$<\/small><\/span><\/li>\n      <li><span>아날로그 +32%<small>49.1억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>재고 194일치<small>47억$ — 수요가 꺾이면 부담<\/small><\/span><\/li>\n      <li><span>반도체 업종 급락<small>10/22 필라델피아 반도체 −6.72%<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"4분기 가이던스는 중간값 기준\", \"items\": [{\"k\": \"매출\", \"a\": 60.55, \"e\": 59.2, \"u\": \"억$\"}, {\"k\": \"EPS\", \"a\": 2.62, \"e\": 2.42, \"u\": \"$\"}, {\"k\": \"4분기 매출 가이던스\", \"a\": 60.5, \"e\": 57.4, \"u\": \"억$\"}, {\"k\": \"4분기 EPS 가이던스\", \"a\": 2.62, \"e\": 2.27, \"u\": \"$\"}]}'><\/div>\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">60.55억$ (59.1~59.3억$) <span class=\"ok\">✅<\/span> +28%<\/span><\/div>\n    <div class=\"row\"><span>EPS<\/span><span class=\"v\">2.62$ (2.42~2.43$) <span class=\"ok\">✅<\/span> +77%<\/span><\/div>\n    <div class=\"row\"><span>영업이익<\/span><span class=\"v\">28.7억$ · 약 47%<\/span><\/div>\n  <\/section>\n  <section><h4>부문별 · 최종시장<\/h4>\n    <div class=\"row\"><span>아날로그<\/span><span class=\"v\">49.1억$ · +32%<\/span><\/div>\n    <div class=\"row\"><span>임베디드 프로세서<\/span><span class=\"v\">8.58억$ · +21%<\/span><\/div>\n    <div class=\"row\"><span><mark>데이터센터<\/mark><\/span><span class=\"v\">약 +95% · 매출의 약 13%<\/span><\/div>\n    <div class=\"row\"><span>산업용<\/span><span class=\"v\">+40% 이상 · 사상 최대<\/span><\/div>\n    <div class=\"row\"><span>자동차 / 개인 전자<\/span><span class=\"v\">10%대 중반 증가 / 보합<\/span><\/div>\n  <\/section>\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>최근 12개월 잉여현금흐름<\/span><span class=\"v\">84억$ (매출의 40.6%)<\/span><\/div>\n    <div class=\"row\"><span>3분기 설비투자<\/span><span class=\"v\">4.63억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">47억$ · 194일<\/span><\/div>\n  <\/section>\n  <section><h4>가이던스 · 4분기<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">58~63억$ (57.3~57.5억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>EPS<\/span><span class=\"v\">2.45~2.79$ (2.27~2.28$) <span class=\"ok\">✅<\/span><\/span><\/div>\n  <\/section>\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>시간외<\/span><span class=\"v\">+1.2% (매체별 −0.3%도)<\/span><\/div>\n    <div class=\"row\"><span>다음 날<\/span><span class=\"na\">종가 % 확인 중 · 반도체 지수 −6.72%<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가·차트는 제목 옆 티커를 누르면 야후 파이낸스에서 볼 수 있습니다.<\/p>\n  <\/section>\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p>실적·가이던스 모두 상회였지만 다음 날 반도체 업종 급락에 묻혔습니다. 회사 숫자보다 업종 분위기가 주가를 정한 경우입니다.<\/p><p>다음 확인: 10/30 모놀리식파워 — 데이터센터 전원 칩 수요가 같은 방향인지.<\/p><\/section>\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">AI 수요가 아날로그 칩까지 번졌습니다<\/p><p>텍사스인스트루먼트의 데이터센터 매출이 1년 새 거의 두 배가 됐습니다. AI 서버는 GPU 옆 전원 칩뿐 아니라 전력 관리·신호 처리용 아날로그 칩도 훨씬 많이 씁니다.<\/p><p>AI 수요가 엔비디아·메모리 같은 핵심에서 바깥쪽 부품까지 넓게 퍼지고 있다는 신호입니다. 주가는 반도체 업종 급락에 묻혔지만 숫자 자체는 확인입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 10/30 모놀리식파워 — GPU 전원 칩 수요가 같은 방향인지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000097476/000009747626000165/q32026txnex99-eredgar.htm\">회사 보도자료(SEC 8-K)<\/a> · <a href=\"https://247wallst.com/investing/2026/10/22/texas-instruments-just-guided-above-wall-street-as-ai-demand-spills-into-analog/\">247월스트 · 최종시장<\/a> · <a href=\"https://www.gurufocus.com/news/9136353/texas-instruments-txn-shares-slip-despite-strong-quarterly-results-and-raised-price-target\">구루포커스 · 주가<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}, {"id": "uctt-26q3", "date": "2026-10-27", "ts": "2026-10-27T16:05", "name": "울트라클린 UCTT", "run": "10.27(화) 뉴욕 장 마감 후 · 한국시간 10.28(수) 05:00", "html": "<article id=\"uctt-26q3\" data-date=\"2026-10-27\" data-ts=\"2026-10-27T16:05\" data-layer=\"장비 부품\" data-name=\"울트라클린 UCTT\" data-sum=\"AI 관점 호재(사상 최대 매출·가이던스 상향) · 매출✅ EPS✅ 가이던스✅ · 시간외 약 +11%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · 2026년 3분기 · 어닝콜 반영(한국시간 07:05)<\/div>\n  <h3>울트라클린(UCTT)<\/h3>\n  <p class=\"what\">반도체 장비 회사(어플라이드·램리서치 등)에 가스·유체 공급 장치 같은 핵심 부품 모듈을 만들어 납품하고 세정 서비스도 하는 회사입니다. 장비 회사 주문이 부품 단계에서 먼저 보이는 자리입니다. 밸류체인 장비 부품 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 7.59억$(예상 7.27억$)·조정 EPS 1.15$(예상 0.91$)로 <b>회사 가이던스(7.0~7.5억$·0.83~1.03$) 상단 위<\/b>입니다. 4분기 가이던스 8.0~8.6억$·1.11~1.35$도 중간값이 컨센(8.13억$·1.13$)보다 높습니다.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>제품 매출 <b>전년 +53%<\/b>로 사상 최대 매출을 이끌었습니다. 최고경영자는 \"AI가 이끄는 산업 확장의 다음 국면\"을 언급했습니다. AI 관련 매출 비중은 보도자료에 숫자로 없습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 볼 포인트<\/p><p>장비 회사들이 <mark>AI용 반도체 증설 장비를 더 만들고 있다<\/mark>는 신호가 부품 단계에서 확인됐습니다. 다만 1~9월 영업현금흐름이 <mark>−1.17억$<\/mark>로 재고(7.23억$, 연초 3.91억$)가 크게 쌓인 점은 체크 포인트입니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"AI가 이끄는 산업 확장의 다음 국면에서 더 많은 가치를 잡을 수 있게 회사를 준비하고 있습니다\"<\/mark><cite>제임스 샤오 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ AI 반도체 증설이 장비 부품 주문으로 이어지고 있고 더 커질 것으로 본다는 뜻입니다.<\/p>\n    <blockquote><mark>\"2027년 반도체 장비(WFE) 지출은 2,000억$를 넘을 것으로 봅니다\"<\/mark><cite>제임스 샤오 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ 내년 장비 시장이 올해보다 더 커진다는 전망이고, 2028년 2,500억$ 전망에도 \"동의하지 않을 이유가 없다\"고 했습니다.<\/p>\n    <blockquote>\"메모리 회사들이 D램과 차세대 HBM을 위해 클린룸과 팹 생산능력을 늘리고 있습니다\"<cite>제임스 샤오 · 최고경영자 · 어닝콜<\/cite><\/blockquote>\n    <p class=\"m\">→ HBM 증설이 장비 부품 주문의 한 축이라는 뜻입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--down)\"><h4>체크할 부분<\/h4><ul>\n      <li><span><mark>현금흐름 마이너스<\/mark><small>1~9월 영업현금흐름 −1.17억$<\/small><\/span><\/li>\n      <li><span>재고 급증<small>7.23억$ (연초 3.91억$)<\/small><\/span><\/li>\n      <li><span>낮은 마진 구조<small>조정 매출총이익률 17.3%<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올릴 이유<\/h4><ul>\n      <li><span><mark>사상 최대 매출<\/mark><small>7.59억$ · 전년 +49% · 전분기 +18%<\/small><\/span><\/li>\n      <li><span>EPS 큰 폭 상회<small>1.15$ vs 예상 0.91$<\/small><\/span><\/li>\n      <li><span>4분기 가이던스 상회<small>중간값 8.3억$ · EPS 1.23$<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\": \"surprise\", \"title\": \"예상 대비 · 얼마나 넘었나\", \"cap\": \"예상은 벤징가 기준(매체마다 차이 있음)\", \"items\": [{\"k\": \"매출\", \"a\": 7.59, \"e\": 7.27, \"u\": \"억$\"}, {\"k\": \"조정 EPS\", \"a\": 1.15, \"e\": 0.91, \"u\": \"$\"}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"trend\", \"title\": \"분기 매출 추이 (억$)\", \"cap\": \"26년 1분기는 이번 정리에서 빠짐 · 점선 = 4분기 가이던스 중간값\", \"items\": [{\"q\": \"25.3Q\", \"v\": 5.10}, {\"q\": \"26.2Q\", \"v\": 6.45}, {\"q\": \"26.3Q\", \"v\": 7.59, \"hi\": 1}, {\"q\": \"26.4Q 가이던스\", \"v\": 8.3, \"g\": 1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\": \"stack\", \"title\": \"매출 구성 (%)\", \"cap\": \"제품 6.82억$ · 서비스 0.77억$\", \"items\": [{\"k\": \"제품\", \"v\": 90, \"hl\": 1}, {\"k\": \"서비스\", \"v\": 10}]}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">7.59억$ (7.27억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>　전년 / 전분기 대비<\/span><span class=\"v\">+49% / +18%<\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">1.15$ (0.91$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">0.85$ (전년 −0.24$)<\/span><\/div>\n    <div class=\"row\"><span>매출총이익률 회계 / 조정<\/span><span class=\"v\">16.9% / 17.3%<\/span><\/div>\n    <div class=\"row\"><span>영업이익률 회계 / 조정<\/span><span class=\"v\">7.1% / 9.0% (전분기 7.0%)<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">0.39억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별<\/h4>\n    <div class=\"row\"><span>제품<\/span><span class=\"v\">6.82억$ (전년 +53%) · 조정 마진 15.9%<\/span><\/div>\n    <div class=\"row\"><span>서비스<\/span><span class=\"v\">0.77억$ (전년 +19%) · 조정 마진 30.1%<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 재무 (1~9월 누적)<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v no\">−1.17억$ ⚠<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">0.45억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">7.23억$ (연초 3.91억$)<\/span><\/div>\n    <div class=\"row\"><span>현금 / 장기차입금<\/span><span class=\"v\">2.71억$ / 6.35억$<\/span><\/div>\n    <div class=\"row\"><span>자금조달<\/span><span class=\"v\">전환사채 6억$ · 주식 매각 0.34억$<\/span><\/div>\n    <div class=\"row\"><span>자사주<\/span><span class=\"v\">0.40억$ · 배당 없음<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · 4분기<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 매출<\/span><span class=\"v\"><mark>8.0~8.6억$<\/mark> (컨센 8.13억$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>조정 EPS<\/span><span class=\"v\">1.11~1.35$ (컨센 1.13$) <span class=\"ok\">✅<\/span><\/span><\/div>\n    <div class=\"row\"><span>회계 EPS<\/span><span class=\"v\">1.02~1.26$<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜 <span class=\"call\">어닝콜 반영 · 한국시간 07:05<\/span><\/h4>\n    <p class=\"q\"><b>제임스 샤오(최고경영자)<\/b> \"빠르고 민첩하게 대응하며 또 한 번 강한 성장과 탄탄한 운영 성과를 냈습니다.\"<\/p>\n    <p class=\"q\"><b>제임스 샤오(최고경영자) · 어닝콜<\/b> \"AI 수요가 반도체 생태계 전반에 강한 투자를 계속 이끌었습니다.\" → 장비 부품 주문이 AI 증설에서 나온다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>제임스 샤오<\/b> <mark>\"2027년 반도체 장비 지출은 2,000억$를 넘을 것\"<\/mark>, 2028년 2,500억$ 전망에 \"동의하지 않을 이유가 없다\", 고객 발언을 보면 \"2028년도 거의 예약이 찼다.\" → 앞으로 2년 장비 수요를 밝게 본다는 뜻입니다.<\/p>\n    <p class=\"q\"><b>제임스 샤오<\/b> \"메모리 회사들이 D램과 차세대 HBM용 클린룸과 팹 생산능력을 늘리고 있습니다.\" 말레이시아 클린룸 2.6만 제곱피트 증설이 \"예상보다 일찍\" 가동됐다고 했습니다.<\/p>\n    <p class=\"q\"><b>마이크 키오(최고재무책임자)<\/b> \"두 최대 고객이 전체 매출의 61%\" → 고객 쏠림이 크다는 뜻입니다. \"매출 40억$에서 매출총이익률 20% 목표로 가는 길이 보인다\", 1분기에 연 <b>약 40억$ 생산능력<\/b>을 갖출 것이라고 했습니다.<\/p>\n    <p class=\"q\"><b>마이크 키오<\/b> \"서비스 매출은 웨이퍼 투입량에 연동돼 보통 제품보다 늦게 따라옵니다.\"<\/p>\n    <p class=\"na\">매출 구성(어닝콜): 반도체 86%(파운드리·로직 52%, 메모리 34%) · 서비스 10% · 기타 4%. 어닝콜 반영 · 한국시간 07:05<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 당일 정규장<\/span><span class=\"v ok\">+10.2% · 51.48$<\/span><\/div>\n    <div class=\"row\"><span>시간외 (뉴욕 16:43)<\/span><span class=\"v ok\">약 +11.1% · 57.21$<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/UCTT\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">UCTT ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/29 업데이트 예정<\/span><\/h4><p>첫 거래일(10/28) 종가가 나오면 정리합니다.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">장비 주문, 부품 단계에서 먼저 늘고 있습니다<\/p><p>울트라클린 매출 +49%는 어플라이드·램리서치 같은 장비 회사가 AI 반도체 증설용 장비를 더 많이 만들고 있다는 신호입니다. 4분기 가이던스도 더 높여 잡았습니다.<\/p><p>다만 재고가 쌓이며 현금이 빠져나가고 있어, 주문이 계속 매출·현금으로 바뀌는지가 관건입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 2027년 장비 지출 2,000억$+ 전망이 KLA(10/28)·램리서치 발언과 맞는지, 그리고 현금흐름이 플러스로 돌아서는지.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.stocktitan.net/news/UCTT/ultra-clean-reports-third-quarter-2026-financial-zd84pgj8s60d.html\">회사 보도자료(스톡타이탄 원문)<\/a> · <a href=\"https://www.prnewswire.com/news-releases/ultra-clean-reports-third-quarter-2026-financial-results-302921159.html\">PR뉴스와이어<\/a> · <a href=\"https://www.benzinga.com/quote/UCTT/earnings-forecasts\">벤징가 · 컨센서스<\/a><\/p>\n<\/article>\n", "updated": "2026-10-27T22:08:00Z"}, {"id": "vrt-26q3", "date": "2026-10-28", "ts": "2026-10-28T05:55", "name": "버티브 VRT", "run": "10.28(수) 뉴욕 장전 · 한국시간 10.28(수) 20:00", "html": "<article id=\"vrt-26q3\" data-date=\"2026-10-28\" data-ts=\"2026-10-28T05:55\" data-layer=\"전력·냉각\" data-name=\"버티브 VRT\" data-sum=\"AI 관점 호재(수주 +100% 이상·미주 +74.5%) · 매출✅ EPS✅ 가이던스✅(연간 전 항목 상향) · 프리마켓 +11.2%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장전 · 2026년 3분기 · 어닝콜 대기(한국시간 10.29 00:00)<\/div>\n  <h3>버티브(VRT)<\/h3>\n  <p class=\"what\">데이터센터에 들어가는 전력 장비(무정전전원장치·배전)와 냉각 장비(액체냉각·공조)를 만들고 유지보수까지 하는 회사입니다. GPU 서버가 늘수록 전기와 열을 감당할 설비가 함께 늘어나는 자리. 밸류체인 전력·냉각 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출 43.1억$(+61%, 예상 37.5~37.6억$)·조정 EPS 2.21$(+78%, 예상 1.80~1.82$)로 <b>모두 큰 폭 상회<\/b>했습니다. 7월에 낸 3분기 가이던스(매출 36.5~38.5억$·EPS 1.77~1.83$) 위쪽 끝도 크게 넘었고, 연간 가이던스를 <b>모든 항목에서 올렸습니다<\/b>.<\/p><\/div>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">AI 인프라 관점으로는?<\/p><p><span class=\"g\">호재<\/span>매출 대부분이 데이터센터 전력·냉각입니다. 신규 수주가 <b>전년 대비 100% 이상(유기적)<\/b> 늘었고, 하이퍼스케일러가 몰린 미주 매출이 <b>+74.5%(유기 +66.2%)<\/b>입니다. 제품 매출 유기 성장 +63.6%로, 데이터센터 짓는 속도가 더 빨라지고 있다는 확인입니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">시장이 환호한 포인트<\/p><p>한 달 새 약 −18% 빠지고 10월 11거래일 연속 하락까지 겪은 뒤라 기대가 낮아져 있었습니다. 그런데 <mark>수주 +100% 이상, 연간 매출 가이던스 140억$ → 146.5억$(중간값)<\/mark>으로 '데이터센터 투자 둔화' 걱정을 정면으로 뒤집었습니다. 7월엔 매출이 예상에 못 미쳐 하루 −17% 빠졌던 회사라, 이번 매출 서프라이즈(+15%)의 의미가 큽니다.<\/p><\/div>\n\n  <div class=\"pull\"><p class=\"k\">💬 이번 실적의 핵심 한마디<\/p>\n    <blockquote><mark>\"역사상 가장 큰 인프라 구축 한가운데에 있고, 그 속도가 빨라지고 있습니다\"<\/mark><cite>조르다노 알베르타치 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 데이터센터 투자가 꺾이는 게 아니라 가속 중이라는 뜻입니다.<\/p>\n    <blockquote>\"전년 대비 100% 넘는 유기적 수주 성장이 그 증거\"<cite>조르다노 알베르타치 · 최고경영자 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ 앞으로 매출이 될 주문이 두 배 넘게 쌓였다는 뜻입니다.<\/p>\n    <blockquote>\"기술이 바뀔수록 우리에게 더 좋은 산업\"<cite>데이브 코트 · 이사회 의장 · 보도자료<\/cite><\/blockquote>\n    <p class=\"m\">→ GPU 세대가 바뀔 때마다 전력·냉각 설비를 새로 깔아야 한다는 자신감입니다.<\/p>\n  <\/div>\n\n  <div class=\"why2\">\n    <div style=\"--c:var(--up)\"><h4>주가를 끌어올린 이유<\/h4><ul>\n      <li><span><b class=\"ckd\">✔<\/b> <mark>수주 +100% 이상<\/mark><small>유기적 기준 · 선수금 41.2억$(연초 18.1억$)<\/small><\/span><\/li>\n      <li><span><b class=\"ckd\">✔<\/b> 매출 예상 대비 +15%<small>43.1억$ vs 예상 37.5~37.6억$<\/small><\/span><\/li>\n      <li><span>연간 가이던스 전 항목 상향<small>매출 146.5억$·EPS 7.15$(중간값)<\/small><\/span><\/li>\n      <li><span>마진 개선<small>조정 영업이익률 25.2%(+2.9%p)<\/small><\/span><\/li>\n    <\/ul><\/div>\n    <div style=\"--c:var(--down)\"><h4>걸리는 점<\/h4><ul>\n      <li><span>수주잔고·수주/매출 비율 미공개<small>보도자료에 없음 · 어닝콜 확인 필요<\/small><\/span><\/li>\n      <li><span>재고 급증<small>32.9억$(연초 14.6억$)<\/small><\/span><\/li>\n      <li><span>미주 마진 제자리<small>29.4%(+0.1%p)<\/small><\/span><\/li>\n      <li><span>인수 대금<small>UIG 14.5억$ + 성과급 최대 11.5억$<\/small><\/span><\/li>\n    <\/ul><\/div>\n  <\/div>\n\n  <div class=\"viz\" data-viz='{\"type\":\"surprise\",\"title\":\"예상 대비 · 얼마나 넘었나\",\"cap\":\"컨센서스 기준(마켓비트·벤징가·어닝위스퍼스 중간값)\",\"items\":[{\"k\":\"매출\",\"a\":43.13,\"e\":37.55,\"u\":\"억$\"},{\"k\":\"조정 EPS\",\"a\":2.21,\"e\":1.81,\"u\":\"$\"},{\"k\":\"4Q EPS 가이던스(중간)\",\"a\":2.25,\"e\":2.21,\"u\":\"$\"}]}'><\/div>\n  <div class=\"vizrow\">\n  <div class=\"viz\" data-viz='{\"type\":\"trend\",\"title\":\"분기 매출 (억$)\",\"cap\":\"점선은 4분기 가이던스 중간값\",\"items\":[{\"q\":\"25 Q3\",\"v\":26.8},{\"q\":\"25 Q4\",\"v\":28.8},{\"q\":\"26 Q1\",\"v\":26.5},{\"q\":\"26 Q2\",\"v\":32.7},{\"q\":\"26 Q3\",\"v\":43.1,\"hi\":1},{\"q\":\"26 Q4\",\"v\":44.1,\"g\":1}]}'><\/div>\n  <div class=\"viz\" data-viz='{\"type\":\"stack\",\"title\":\"지역별 매출 비중 (%)\",\"cap\":\"하이퍼스케일러가 몰린 미주 형광 · 매출 43.1억$ 대비\",\"items\":[{\"k\":\"미주\",\"v\":69,\"hl\":1},{\"k\":\"아시아태평양\",\"v\":18},{\"k\":\"유럽·중동·아프리카\",\"v\":13}]}'><\/div>\n  <\/div>\n  <div class=\"viz\" data-viz='{\"type\":\"line\",\"title\":\"발표 앞뒤 주가 ($)\",\"cap\":\"10/28은 프리마켓(뉴욕 6:06) 기준\",\"items\":[{\"d\":\"10/13\",\"v\":237.29},{\"d\":\"10/14\",\"v\":222.83},{\"d\":\"10/15\",\"v\":214.75},{\"d\":\"10/16\",\"v\":206.42},{\"d\":\"10/19\",\"v\":206.08},{\"d\":\"10/20\",\"v\":203.56},{\"d\":\"10/21\",\"v\":212.15},{\"d\":\"10/22\",\"v\":195.59},{\"d\":\"10/23\",\"v\":194.32},{\"d\":\"10/26\",\"v\":199.78},{\"d\":\"10/27\",\"v\":208.56},{\"d\":\"10/28\",\"v\":232.0}],\"mark\":\"10/28\",\"markLabel\":\"실적 발표\"}'><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">43.1억$ (37.5~37.6억$) <span class=\"ok\">✅<\/span> +61%<\/span><\/div>\n    <div class=\"row\"><span>　유기적 성장<\/span><span class=\"v\">+55% (가이던스 +34~36%)<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">2.21$ (1.80~1.82$) <span class=\"ok\">✅<\/span> +78%<\/span><\/div>\n    <div class=\"row\"><span>회계 주당순이익<\/span><span class=\"v\">1.95$ · +91%<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익<\/span><span class=\"v\">10.9억$ · +83% · 이익률 25.2% (+2.9%p)<\/span><\/div>\n    <div class=\"row\"><span>회계 영업이익<\/span><span class=\"v\">9.8억$ · +90% · 이익률 22.8%<\/span><\/div>\n    <div class=\"row\"><span>총마진<\/span><span class=\"v\">38.1% (전년 37.8%, 손익계산서로 계산)<\/span><\/div>\n    <div class=\"row\"><span>순이익<\/span><span class=\"v\">7.6억$ · +92%<\/span><\/div>\n  <\/section>\n\n  <section><h4>부문별 · 지역별<\/h4>\n    <div class=\"row\"><span>제품<\/span><span class=\"v\">35.9억$ · +65.8% (유기 +63.6%)<\/span><\/div>\n    <div class=\"row\"><span>서비스·부품<\/span><span class=\"v\">7.2억$ · +41.5% (유기 +18.1%)<\/span><\/div>\n    <div class=\"row\"><span><mark>미주<\/mark><\/span><span class=\"v\">29.9억$ · +74.5% (유기 +66.2%) · 이익률 29.4%<\/span><\/div>\n    <div class=\"row\"><span>아시아태평양<\/span><span class=\"v\">7.8억$ · +49.9% (유기 +48.3%) · 이익률 17.0% (전년 13.2%)<\/span><\/div>\n    <div class=\"row\"><span>유럽·중동·아프리카<\/span><span class=\"v\">5.4억$ · +22.8% (유기 +19.3%) · 이익률 28.0% (+9.2%p)<\/span><\/div>\n  <\/section>\n\n  <section><h4>핵심 지표<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 유기적 수주<\/span><span class=\"v ok\">전년 대비 +100% 이상<\/span><\/div>\n    <div class=\"row\"><span>선수금(이연수익)<\/span><span class=\"v\">41.2억$ (연초 18.1억$)<\/span><\/div>\n    <div class=\"row\"><span>수주잔고 · 수주/매출 비율<\/span><span class=\"v na\">보도자료에 없음 · 어닝콜 확인 필요<\/span><\/div>\n    <p class=\"na\">참고: 지난해 3분기 수주잔고 95억$·수주/매출 약 1.4배, 4분기 150억$·약 3배(기사 인용).<\/p>\n  <\/section>\n\n  <section><h4>현금 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">7.9억$ · +64%<\/span><\/div>\n    <div class=\"row\"><span>조정 잉여현금흐름<\/span><span class=\"v\">6.5억$ · +50% (1~9월 22.3억$)<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">1.4억$ (전년 0.5억$)<\/span><\/div>\n    <div class=\"row\"><span>현금 / 차입금<\/span><span class=\"v\">35.1억$ / 29.3억$ · 순현금 약 7.8억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">32.9억$ (연초 14.6억$)<\/span><\/div>\n    <div class=\"row\"><span>배당<\/span><span class=\"v\">0.24억$ 지급 · 변경 없음 · 자사주 매입 없음<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스<\/h4>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 매출<\/span><span class=\"v ok\">43.1~45.1억$ (예상 43.0억$) ✅ · 유기 +49~51%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 4분기 조정 EPS<\/span><span class=\"v ok\">2.22~2.28$ (예상 2.21$) ✅<\/span><\/div>\n    <div class=\"row\"><span>4분기 조정 영업이익률<\/span><span class=\"v\">25.3~26.3%<\/span><\/div>\n    <div class=\"row\"><span><mark>연간 매출<\/mark><\/span><span class=\"v ok\">144.5~148.5억$ (이전 138~142억$, 예상 140억$) ✅ 상향<\/span><\/div>\n    <div class=\"row\"><span>연간 유기적 성장<\/span><span class=\"v\">+37~39% (이전 +30~32%)<\/span><\/div>\n    <div class=\"row\"><span><mark>연간 조정 EPS<\/mark><\/span><span class=\"v ok\">7.10~7.20$ (이전 6.65~6.75$, 예상 6.73$) ✅ 상향<\/span><\/div>\n    <div class=\"row\"><span>연간 조정 영업이익<\/span><span class=\"v\">34.8~35.6억$ (이전 32.9~33.7억$)<\/span><\/div>\n    <div class=\"row\"><span>연간 조정 잉여현금흐름<\/span><span class=\"v\">26~28억$ (이전 24~26억$)<\/span><\/div>\n    <p class=\"na\">올해 연간 EPS 가이던스는 2월 6.02$ → 4월 6.35$ → 7월 6.70$ → 10월 7.15$(중간값)로 세 번 연속 올랐습니다.<\/p>\n  <\/section>\n\n  <section><h4>경영진 코멘트 · 어닝콜<\/h4>\n    <p class=\"q\"><b>조르다노 알베르타치(최고경영자) · 보도자료<\/b> <mark>\"새 제품 개발 주기를 몇 년에서 몇 달로 줄이고 있습니다\"<\/mark>, 융합형 인프라(전력·냉각을 한 묶음으로)를 예전에 없던 규모로 공장 생산한다고 했습니다. → 공급 속도가 경쟁력이라는 뜻입니다.<\/p>\n    <p class=\"q\"><b>인수 2건(이번 주 별도 공시)<\/b> 10/27 UIG(마이크로그리드·자가발전 전력·배전반) 인수 완료 — 선지급 약 14.5억$ + 성과 연동 최대 11.5억$, 2027년 예상 영업현금이익의 약 13배, 첫해부터 EPS에 도움. 10/26 아일랜드 킹 인바이런멘털(액체냉각 유체 관리·시운전) 인수 완료. → 전력을 전력망 밖에서 직접 대는 사업까지 넓힙니다. UIG가 가이던스에 들어갔는지는 보도자료에 없습니다.<\/p>\n    <p class=\"na\">어닝콜은 뉴욕 11:00(한국시간 10.29 00:00)입니다. 수주잔고·수주/매출 비율·800V 직류 전력·엔비디아 협업·관세 발언은 콜 뒤에 보강합니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전 (10/27 종가)<\/span><span class=\"v\">208.56$<\/span><\/div>\n    <div class=\"row\"><span>최근 흐름<\/span><span class=\"v\">1주 +2.5% · 1개월 −17.7% · 1분기 고점 319$ 대비 약 −35%<\/span><\/div>\n    <div class=\"row\"><span><b class=\"ckd\">✔<\/b> 프리마켓 (뉴욕 6:06)<\/span><span class=\"v ok\">약 232$ · +11.2%<\/span><\/div>\n    <div class=\"row\"><span>옵션 예상 변동폭<\/span><span class=\"v\">±10.1% (10/30 만기 주간옵션) · 지금 프리마켓은 예상 폭을 조금 넘음<\/span><\/div>\n    <div class=\"row\"><span>지난 실적 반응<\/span><span class=\"v\">7/29 −17.3% · 4/22 −2.3%<\/span><\/div>\n    <div class=\"row\"><span>첫 거래일 종가<\/span><span class=\"v na\">확인 필요<\/span><\/div>\n    <p class=\"na\">📈 실시간 주가는 <a href=\"https://finance.yahoo.com/quote/VRT\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-weight:700\">VRT ↗ 야후 파이낸스<\/a>에서 보세요.<\/p>\n  <\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4><p class=\"vh\">데이터센터 '전기·열' 설비 주문이 두 배로 늘었습니다<\/p><p>GPU를 사도 전력과 냉각이 없으면 못 돌립니다. 그 설비를 깔아 주는 버티브의 수주가 두 배를 넘었다는 건, 빅테크가 내년 데이터센터 짓기를 줄이는 게 아니라 늘리고 있다는 확인입니다. 이번 주 SK하이닉스·시게이트·코닝에 이어 전력·냉각 층에서도 같은 신호가 나왔습니다.<\/p><p>신호는 수주 +100%와 연간 가이던스 상향, 소음은 한 달간의 주가 하락입니다.<\/p><p class=\"vn\"><b>다음에 볼 것<\/b> 오늘 밤 어닝콜의 수주잔고 금액, 그리고 이번 주 빅테크 설비투자 계획.<\/p><\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm\">회사 실적 보도자료(SEC 8-K 첨부 99.1, 공식)<\/a> · <a href=\"https://www.sec.gov/Archives/edgar/data/1674101/000162828026067393/exhibit991vrt-q42026102720.htm\">UIG 인수 공시(SEC)<\/a> · <a href=\"https://www.stocktitan.net/news/VRT/vertiv-reports-strong-third-quarter-2026-with-net-sales-growth-of-61-m3nhlt378p4h.html\">스톡타이탄<\/a> · <a href=\"https://www.marketbeat.com/earnings/reports/2026-10-28-vertiv-holdings-co-stock/\">마켓비트 · 컨센서스<\/a> · <a href=\"https://kr.benzinga.com/quote/VRT/earnings-forecasts\">벤징가 · 컨센서스<\/a> · <a href=\"https://www.optionslam.com/earnings/trend/VRT\">옵션슬램 · 옵션 예상 변동폭<\/a> · <a href=\"https://247wallst.com/investing/2026/10/24/make-or-break-for-vrt-on-oct-28-proving-the-ai-factory-thesis-amid-a-brutal-valuation-reset/\">24/7 월스트리트 · 연간 컨센서스<\/a><\/p>\n<\/article>\n", "updated": "2026-10-28T10:10:26Z"}, {"id": "wdc", "date": "2026-10-22", "ts": "2026-10-22", "name": "웨스턴디지털 WDC", "run": "10.22(목) 뉴욕 장 마감 후 · 한국시간 10.23(금) 05:00", "html": "<article id=\"wdc\" data-date=\"2026-10-22\" data-layer=\"칩·메모리\" data-name=\"웨스턴디지털 WDC\" data-sum=\"매출✅ EPS✅ 가이던스✅ · 다음 날 약 −3%\">\n  <div class=\"tag\"><b>실적결과<\/b> 장후 · FY27 1분기(7~9월)<\/div>\n  <h3>웨스턴디지털(WDC)<\/h3>\n  <p class=\"what\">AI 데이터센터에 들어가는 대용량 하드디스크(니어라인 HDD) 전업 회사입니다. 낸드는 2025년 샌디스크로 분사했습니다. 밸류체인 메모리·저장장치 층.<\/p>\n  <div class=\"verdict\" style=\"--c:var(--up)\"><p class=\"k\">실적 자체는?<\/p><p><span class=\"g\">좋음<\/span>매출(43.8억$, 예상 41.4~41.6억$)·EPS(4.64$, 예상 3.97~4.09$)·다음 분기 가이던스(매출 51억$ vs 예상 45.7억$) <b>모두 예상 상회<\/b>. 매출 전년 대비 +55%, 다음 분기 마진 60%대 전망까지 — 실적은 잘 나왔습니다.<\/p><\/div>\n  <div class=\"hl\"><p class=\"k\">그런데 주가는 왜 빠졌나 · 시장이 실망한 포인트<\/p><p>매출·EPS·가이던스를 모두 넘고 다음 분기 마진 60%대를 제시했는데도 금요일 약 −3%. 실적보다 이번 주 AI 설비투자 피로와 반도체지수 급락이 먼저 반영됐습니다.<\/p><\/div>\n\n  <section><h4>핵심 실적<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">43.81억$ (41.4~41.6억$) <span class=\"ok\">✅<\/span> +5~6%<\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">+55% / +17%<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">4.64$ (3.97~4.09$) <span class=\"ok\">✅<\/span> +13~17%<\/span><\/div>\n    <div class=\"row\"><span>　전년 대비 / 전분기 대비<\/span><span class=\"v\">+161% / +30%<\/span><\/div>\n    <div class=\"row\"><span>회계기준 주당순이익<\/span><span class=\"v\">4.63$ (전년 3.07$)<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">58.1% (+1,420bp YoY · +370bp QoQ)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익<\/span><span class=\"v\">21.53억$ (+152% YoY)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업이익률<\/span><span class=\"v\">49.1% (+1,870bp YoY)<\/span><\/div>\n    <div class=\"row\"><span>조정 순이익<\/span><span class=\"v\">17.79억$ (+172% YoY)<\/span><\/div>\n    <div class=\"row\"><span>조정 영업비용<\/span><span class=\"v\">3.91억$ (전분기 3.82억)<\/span><\/div>\n  <\/section>\n\n  <section><h4>현금 · 주주환원 · 재무<\/h4>\n    <div class=\"row\"><span>영업현금흐름<\/span><span class=\"v\">16.04억$ (전년 6.72억)<\/span><\/div>\n    <div class=\"row\"><span>설비투자<\/span><span class=\"v\">2.27억$ (전분기 1.08억)<\/span><\/div>\n    <div class=\"row\"><span>잉여현금흐름<\/span><span class=\"v\">13.77억$ (전년 5.99억)<\/span><\/div>\n    <div class=\"row\"><span>자사주 매입<\/span><span class=\"v\">10.01억$<\/span><\/div>\n    <div class=\"row\"><span>배당<\/span><span class=\"v\">주당 0.175$ · 17% 인상<\/span><\/div>\n    <div class=\"row\"><span>현금<\/span><span class=\"v\">13.14억$<\/span><\/div>\n    <div class=\"row\"><span>재고<\/span><span class=\"v\">17.81억$ (전분기 15.11억)<\/span><\/div>\n    <div class=\"row\"><span>전환사채 정산 현금 유출<\/span><span class=\"v\">5.70억$<\/span><\/div>\n  <\/section>\n\n  <section><h4>가이던스 · FY27 2분기(10~12월)<\/h4>\n    <div class=\"row\"><span>매출<\/span><span class=\"v\">51억$ ±1억 (45.7억$) <span class=\"ok\">✅<\/span> +12%<\/span><\/div>\n    <div class=\"row\"><span>　전년 대비<\/span><span class=\"v\">+66~72%<\/span><\/div>\n    <div class=\"row\"><span>조정 주당순이익<\/span><span class=\"v\">5.80$ ±0.20 (4.82$) <span class=\"ok\">✅<\/span> +20%<\/span><\/div>\n    <div class=\"row\"><span>조정 총마진<\/span><span class=\"v\">60~61%<\/span><\/div>\n    <div class=\"row\"><span>조정 영업비용<\/span><span class=\"v\">4.00~4.10억$<\/span><\/div>\n    <div class=\"row\"><span>세율 / 희석주식수<\/span><span class=\"v\">약 17% / 약 3.8억주<\/span><\/div>\n  <\/section>\n\n  <section><h4>경영진 코멘트 (보도자료)<\/h4>\n    <p>최고경영자 어빙 탄: 회계연도 출발이 기대 이상이었고, 매출 55% 성장을 근거로 배당을 17% 올렸습니다. 고객 관계 심화와 신규 시장 확대를 강조했습니다.<\/p>\n    <p>최고재무책임자 크리스 세네셀: 실적을 끈 건 저장 용량(엑사바이트) 출하 증가와 가격 개선이라고 설명했습니다.<\/p>\n    <p class=\"na\">어닝콜(한국시간 10/23 05:30) 상세 요약은 공개 기사에서 아직 확인하지 못했습니다.<\/p>\n  <\/section>\n\n  <section><h4>주가<\/h4>\n    <div class=\"row\"><span>발표 전<\/span><span>반도체지수 목요일 −6.7% 급락 한복판<\/span><\/div>\n    <div class=\"row\"><span>발표 후<\/span><span class=\"v no\">프리마켓 −2.7~−4.5%<\/span><\/div>\n    <div class=\"row\"><span>금요일(10/23) 종가<\/span><span class=\"v no\">약 −3.0% <span class=\"na\">(트레이딩키 −3.8%)<\/span><\/span><\/div>\n  <\/section>\n\n  <section class=\"after\"><h4>그 뒤 어떻게 됐나 <span class=\"call\">10/27 업데이트<\/span><\/h4><p>금요일 약 −3%로 마감했습니다. 실적·가이던스 모두 상회라 회사 숫자보다는 <mark>반도체지수 급락·AI 설비투자 피로<\/mark> 같은 업종 분위기에 끌려간 하락으로 남았습니다.<\/p><p>다음 확인: 시게이트·샌디스크 실적에서 저장장치 가격 상승이 이어지는지.<\/p><\/section>\n\n  <section class=\"vc\"><h4>🔗 밸류체인 코멘트 — 이번 실적이 우리에게 말해 주는 것<\/h4>\n    <p>보도자료는 용량별·고객별 출하를 따로 밝히지 않았습니다. 다만 총마진이 3개 분기 만에 44%에서 58%로 오르고 다음 분기 60%대를 제시한 건, 물량보다 가격으로 버는 판매자 우위 국면이라는 뜻입니다. 수요·현금 신호는 강하고, 이번 하락은 업종 분위기에 가깝습니다.<\/p>\n  <\/section>\n  <p class=\"src\">출처: <a href=\"https://www.sec.gov/Archives/edgar/data/0000106040/000162828026066882/a4ex991-pressreleaseq127.htm\">회사 보도자료(SEC)<\/a> · <a href=\"https://www.investing.com/news/earnings/western-digital-earnings-beat-by-056-revenue-topped-estimates-4967280\">인베스팅닷컴 · 컨센·가이던스 컨센<\/a> · <a href=\"https://www.shacknews.com/article/151120/western-digital-wdc-q1-2027-earnings-results\">쉑뉴스 · 컨센·위스퍼<\/a> · <a href=\"https://www.tradingkey.com/news/market-movers/262236520-market-movers-wdc-20261023\">트레이딩키 · 10/23 주가<\/a> · <a href=\"https://za.investing.com/news/stock-market-news/premarket-movers-crown-castle-jumps-75-on-spacex-talks-autoliv-slides-4522307\">인베스팅닷컴 프리마켓<\/a><\/p>\n<\/article>", "updated": "2026-10-27T05:58+09:00"}]}</script>
<script>
// 노트는 페이지 데이터베이스(notes 컬렉션)에서 읽어 옵니다 — 새 실적이 저장되면 열려 있는 화면에 바로 나타납니다
(async function(){
const box=document.getElementById('notes'),ld=document.getElementById('loading');
let first=true;
function paint(list){
  const open=first?null:new Set([...document.querySelectorAll('article[data-date]:not(.fold)')].map(a=>a.id));
  document.querySelectorAll('.run').forEach(r=>r.remove());
  {const o=document.getElementById('spl');if(o)o.remove();}
  const groups=new Map();
  list=list.slice().sort((x,y)=>String((y&&(y.ts||y.date))||'').localeCompare(String((x&&(x.ts||x.date))||''))); // 방금 나온 실적이 맨 위
  window.__TS=list.filter(v=>v&&(v.kind==='today'||/^today-/.test(v.id||''))).map(v=>({kst:v.kst||v.date,line:v.line||v.name,updated:v.updated_kst||''}));
  list.forEach(v=>{if(!v||!v.html)return;const k=v.run||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(v)});
  groups.forEach((arr,title)=>{const r=document.createElement('div');r.className='run';const h=document.createElement('h2');{const m=String(title).match(/한국시간\s*([0-9]+\.[0-9]+\([^)]+\))/);h.textContent=m?m[1]+' · '+(/장전/.test(title)?'저녁 장전':/마감 후|장후/.test(title)?'새벽 장후':'아시아'):title;}r.appendChild(h);
    arr.forEach(v=>{const t=document.createElement('template');t.innerHTML=v.html;const km=String(v.run||'').match(/한국시간\s*(\d+)\.(\d+)/);if(km&&v.date){const y=+String(v.date).slice(0,4),mm=+km[1],dd=+km[2],dm=+String(v.date).slice(5,7);const yy=(dm===12&&mm===1)?y+1:y;t.content.querySelectorAll('article').forEach(x=>x.dataset.krun=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0'))}r.appendChild(t.content)});box.appendChild(r)});
  ld.hidden=list.length>0;if(!list.length)ld.textContent='아직 올라온 노트가 없습니다';
  drawViz();linkTickers();initFind(open);first=false;
}
// 1) 페이지에 함께 넣어 둔 저장본으로 먼저 그린다 — 로그인·앱 종류와 상관없이 누구나 보임
let seed=null;try{seed=JSON.parse(document.getElementById('seed').textContent)}catch(e){}
if(seed&&seed.notes&&seed.notes.length)paint(seed.notes);
// 2) 데이터베이스를 쓸 수 있는 화면이면 실시간 노트로 바꿔 그린다(새 실적이 저장되면 바로 반영)
let db=null;try{db=await (window.__fakeDB||claude).use('db')}catch(e){}
if(!db){if(!seed||!seed.notes||!seed.notes.length){ld.hidden=false;ld.textContent='노트를 불러오지 못했습니다.'}return}
db.collection('notes').onSnapshot(snap=>{const list=[];snap.docs.forEach(d=>{const v=d.data();if(v&&v.html)list.push(v)});if(list.length||!seed)paint(list)},
  e=>{if(!seed){ld.hidden=false;ld.textContent='노트를 불러오지 못했습니다('+(e&&e.code||'오류')+')'}});
})();
</script>

<script data-tick>(function(){
  // 멍뭉 터미널: 누르는 곳마다 부드러운 '틱' 소리(소리 파일 없이 브라우저가 직접 만듦), 오른쪽 아래 🔊/🔇로 끄고 켬

  var last = 0;
  function onTap(e){

    if (!el || el.id === 'mm-snd' || el.disabled) return;

    var isNav = el.tagName === 'A' && el.href && !el.target && (function(){ try { var u = new URL(el.href, location.href); return u.origin === location.origin && u.pathname !== location.pathname; } catch (x) { return false; } })();
    var tog = el.hasAttribute('aria-expanded') ? 'aria-expanded' : el.hasAttribute('aria-pressed') && el.closest('[role=group]') == null ? 'aria-pressed' : null;

    else if (el.matches('tr, .pb-row')) { var wasOn = el.classList.contains('on'); setTimeout(function(){ tick(wasOn ? 'close' : 'open'); }, 0); }
    else tick('tap');
    // 다른 페이지로 넘어가는 링크는 소리가 끊기지 않게 0.07초 뒤에 이동
    if (el.tagName === 'A' && el.href && !el.target && !e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) {

    }
  }
  document.addEventListener('click', onTap, true);
  ['touchend', 'pointerdown', 'keydown'].forEach(function(ev){ document.addEventListener(ev, function(){ try { if (!off) ac(); } catch (e) {} }, { capture: true, passive: true }); });
  // 누를 때 살짝 눌리는 느낌(움직임 줄이기 설정이면 생략)
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {

    (document.head || document.documentElement).appendChild(st);
    var pressed = null;
    var rel = function(){ if (pressed) { var p = pressed; pressed = null; p.classList.remove('mm-press'); p.classList.add('mm-rel'); setTimeout(function(){ p.classList.remove('mm-rel'); }, 180); } };
    document.addEventListener('pointerdown', function(e){ var el = e.target && e.target.closest ? e.target.closest(SEL) : null; if (!el || el.id === 'mm-snd') return; rel(); pressed = el; el.classList.add('mm-press'); }, { capture: true, passive: true });

  kids[0].before(d); kids.forEach(function(k){d.appendChild(k)});
};

<script>
/* 가독성: 한 덩어리에 ①②③이 이어 붙은 문단은 번호마다 줄을 바꿔 보여 줍니다(내용은 그대로). */
(function () {
  var NUM = /[①②③④⑤⑥⑦⑧⑨⑩]/, SPLIT = /(?=[①②③④⑤⑥⑦⑧⑨⑩])/;
  var BLOCK = { P:1, DIV:1, LI:1, UL:1, OL:1, TABLE:1, SECTION:1, ARTICLE:1, H1:1, H2:1, H3:1, H4:1, BR:0 };
  var SKIP = 'button,a,select,option,svg,script,style,textarea,input,label,nav';
  function fix(el) {
    var t = el.textContent || '';
    if (el._rdx === t) return;
    var m = t.match(/[①②③④⑤⑥⑦⑧⑨⑩]/g);
    if (!m || m.length < 2 || t.length < 30 || el.closest(SKIP)) { el._rdx = t; return; }
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [], seen = false;
    while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function (n) {
      var s = n.textContent;
      if (n.parentElement && n.parentElement.closest(SKIP)) { if (s.trim()) seen = true; return; }
      var parts = s.split(SPLIT);
      if (!parts.some(function (p, i) { return NUM.test(p.charAt(0)) && (seen || i > 0); })) { if (s.trim()) seen = true; return; }
      var prev = n.previousSibling, f = document.createDocumentFragment();
      parts.forEach(function (p, i) {
        if (NUM.test(p.charAt(0)) && (seen || i > 0)) {
          if (!(i === 0 && prev && prev.nodeName === 'BR')) f.appendChild(document.createElement('br'));
          p = p.replace(/^\s+/, '');
        } else if (i < parts.length - 1) p = p.replace(/\s+$/, '');
        if (p) f.appendChild(document.createTextNode(p));
        if (p.trim()) seen = true;
      });
      n.parentNode.replaceChild(f, n);
    });
    el._rdx = el.textContent;
  }
  function run() {
    var els = document.querySelectorAll('p,li,td,dd,blockquote,div,span.sub');
    for (var i = 0; i < els.length; i++) {
      var el = els[i], kids = el.children, block = false;
      for (var j = 0; j < kids.length; j++) if (BLOCK[kids[j].tagName]) { block = true; break; }
      if (!block) fix(el);
    }
  }
  var tm = null;
