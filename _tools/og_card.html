<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f9f9f7;font-family:"Noto Sans CJK KR",sans-serif;color:#0b0b0b;overflow:hidden;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#9a6200}

.sub{font-size:36px;color:#3d3b37;font-weight:500}
.chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.chips span{font-size:27px;font-weight:700;padding:10px 22px;border-radius:999px;background:#fff;border:2px solid rgba(11,11,11,.1)}
.flow{position:absolute;right:110px;bottom:46px;font-size:24px;color:#6f6d68}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#006300;margin-right:10px;vertical-align:middle}

  <div class="chips"><span>실적 속보</span><span>실적 캘린더</span><span>목표주가</span><span>공매도</span><span>시장 경고등</span></div>
</div>
